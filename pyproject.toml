[tool.pytest.ini_options]
asyncio_mode = "auto"
# ⚠⚠ `tests_llm` здесь **есть**, и это стало можно только с подменой модели
# (`ai.ai_llm_fake`): её ответы задаёт сам тест, наружу не уходит ни один запрос.
#
# ⚠⚠⚠ До неё папки здесь не было, и причина была не в скорости и не в токенах.
# **Модель одна на тесты и на прод** — та же нода отвечает живым людям на сайте
# знакомств, и сюита, идущая сама по себе, отбирала ответы у собеседников.
#
# Живые тесты (`llm_live`) как стоили этих ответов, так и стоят: они исключены
# `addopts` ниже, и запускает их человек по своему решению.
#
# ⚠ Тестовые зависимости — `requirements-dev.txt`. Отдельно от прод-списка: тот
# едет в образ, и pytest в проде не нужен никому.
testpaths = ["tests", "tests_llm"]
python_files = ["test_*.py"]
# ⚠⚠ Живые тесты модели отключены по умолчанию: они ходят на ноду, общую с продом.
# Подменные (`llm`) при этом идут как все — им платить нечем.
addopts = "-m 'not llm_live'"
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "py_modules"]

# Группы тестов по подсистемам. Смысл — прогонять то, что задето правкой, а не всё
# подряд: полная сюита идёт больше трёх минут, и роль конвейера платит это время на
# каждом круге, даже поправив одну строку в чужом углу проекта.
#
# Группа ставится файлу целиком: `pytestmark = pytest.mark.<группа>` под докстрингом.
# Файл принадлежит ровно одной — тест, покрывающий стык двух подсистем, идёт в ту,
# чей контракт он стережёт.
#
# Как выбрать группу под свою правку и как запускать — `.claude/docs/testing.md`.
markers = [
    "pipeline: конвейер задач — состояния, отбор работы, роли, worktree, метрики",
    "team: команда и оболочки — карточки, пулы моделей, сессии, heartbeat",
    "browser: контейнер-браузер — сайты, сценарии, переменные, ошибки",
    "ai: движок LLM — провайдеры, workflow, агенты, инструменты, факты",
    "auth: доступ — вход, права, роли, пользователи, сессии, кабинет",
    "core: общее — настройки, cronjob, журналы событий, планирование",
    "telegram: мини-приложение и чат-компаньон",
    "integration: требует поднятого сервера на BASE_URL и живой БД",
    # ⚠⚠ Живой Chromium (`tests_browser/`). Папки **нет** в `testpaths` по тем же
    # доводам, что у `tests_llm/`: браузер плавает сам по себе, занимает общий пул
    # вкладок и ходит наружу мимо сторожа сети — запрос делает контейнер, а не наш
    # процесс. Запускает человек: `.claude/docs/testing_browser.md`.
    "slow: живой браузер (playwright) — секунды на тест, не десятки миллисекунд",
    # ⚠⚠ Прогон workflow целиком (`tests_llm/`). Папка **в `testpaths`**: ответы
    # модели даёт подмена (`ai.ai_llm_fake`), и прогон стоит секунды, а не минуты
    # и не отнятые у живых людей ответы. Прежде папки здесь не было — запускал
    # человек и по своему решению; подмена это ограничение сняла.
    #
    # ⚠ Утверждения берутся **только из трассы прогона** — маршрут, шаги, промпт
    # после подстановки. Текст ответа модели не проверяется никогда, даже с
    # подменой: `.claude/docs/testing_llm.md`.
    "llm: прогон workflow через подменную модель — секунды, нужен поднятый сервер",
    # ⚠⚠ Живая модель. Эти **не идут сами**: нода одна на тесты и на прод, и
    # прогон отнимает ответы у живых людей. Исключены `addopts` ниже, запускает
    # человек: `LLM_LIVE=1 pytest tests_llm -m llm_live`.
    "llm_live: живой вызов модели — минуты, ответ каждый раз другой",
]