[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "py_modules"]

# Группы тестов по подсистемам. Смысл — прогонять то, что задето правкой, а не всё
# подряд: полная сюита идёт больше трёх минут, и роль конвейера платит это время на
# каждом круге, даже поправив одну строку в чужом углу проекта.
#
# Группа ставится файлу целиком: `pytestmark = pytest.mark.<группа>` под докстрингом.
# Файл принадлежит ровно одной — тест, покрывающий стык двух подсистем, идёт в ту,
# чей контракт он стережёт.
#
# Как выбрать группу под свою правку и как запускать — `.claude/docs/testing.md`.
markers = [
    "pipeline: конвейер задач — состояния, отбор работы, роли, worktree, метрики",
    "team: команда и оболочки — карточки, пулы моделей, сессии, heartbeat",
    "browser: контейнер-браузер — сайты, сценарии, переменные, ошибки",
    "ai: движок LLM — провайдеры, workflow, агенты, инструменты, факты",
    "auth: доступ — вход, права, роли, пользователи, сессии, кабинет",
    "core: общее — настройки, cronjob, журналы событий, планирование",
    "telegram: мини-приложение и чат-компаньон",
    "integration: требует поднятого сервера на BASE_URL и живой БД",
    "slow: живой браузер (playwright) — секунды на тест, не десятки миллисекунд",
    # ⚠ Живые вызовы модели. Лежат в `tests_llm/`, которой НЕТ в `testpaths`:
    # полный прогон их не видит, запуск только руками и по имени пути. Они
    # плавающие — стопроцентного зелёного не дают и перед выкладкой не гоняются.
    "llm: живой вызов LLM — минуты и токены, запуск вручную (tests_llm/)",
]