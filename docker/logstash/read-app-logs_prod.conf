input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/.sincedb-app.log"
  }
}

filter {
  mutate {
    copy => { "message" => "raw_log" }
    remove_field => [ "message" ]
  }

  json {
    source => "raw_log"
    skip_on_invalid_json => true
  }

  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss,SSS" ]
    target => "@timestamp"
  }

  mutate {
    remove_field => [ "raw_log", "timestamp" ]
    rename => { "severity" => "level" }
    add_field => { "source" => "app.log" }
  }
}

output {
  opensearch {
    hosts       => ["http://opensearch:9200"]
    index       => "app-logs-%{+YYYY.MM.dd}"
    # user      => "admin"          # uncomment if you enable security later
    # password  => "your-password"
    # ssl       => true
    # cacert    => "/path/to/ca.pem"
  }

  # Also print to container logs for debugging
  stdout { codec => rubydebug }
}