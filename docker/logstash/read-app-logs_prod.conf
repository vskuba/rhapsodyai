input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/.sincedb-app.log"
  }
}

filter {
  mutate {
    copy => { "message" => "raw_log" }
    remove_field => [ "message" ]
  }

  json {
    source => "raw_log"
    skip_on_invalid_json => true
  }

  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss,SSS" ]
    target => "@timestamp"
  }

  mutate {
    remove_field => [ "raw_log", "timestamp" ]
    rename => { "severity" => "level" }
    add_field => { "source" => "app.log" }
  }
}

output {
  opensearch {
    hosts       => ["http://opensearch:9200"]
    index       => "app-logs-%{+YYYY.MM.dd}"
    # user      => "admin"          # uncomment if you enable security later
    # password  => "your-password"
    # ssl       => true
    # cacert    => "/path/to/ca.pem"
  }

  # ⚠⚠ Второго вывода здесь НЕТ, и это не упущение.
  #
  # Раньше стоял `stdout { codec => rubydebug }` с пометкой «для отладки». Он
  # печатал в журнал контейнера КАЖДОЕ событие целиком, многострочным разбором —
  # то самое, что строкой выше уже уехало в OpenSearch. Замерено на проде
  # 2026-09-29: 18 ГБ одним файлом за 9 суток, **2 ГБ в сутки**, 97 % всех логов
  # контейнеров на машине.
  #
  # Смотреть события надо там, где они хранятся и ищутся, — в OpenSearch
  # Dashboards по индексу `app-logs-*`. Журнал контейнера для этого не
  # инструмент: там нет ни отбора, ни поиска, а есть только рост.
  #
  # ⚠ Отладить сам конвейер (а не события) `rubydebug` всё же помогает: когда
  # непонятно, что делает `filter`. Тогда его включают ВРЕМЕННО и с отбором —
  # `if [level] == "ERROR" { stdout { codec => rubydebug } }`, — и убирают
  # обратно. Безусловный вывод в prod-конфиге не живёт.
}