input {
  file {
    path => "/logs/app.log*"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/.sincedb-app.log"   # ← new writable location
    stat_interval => "1 second"
    discover_interval => 2
  }
}

filter {
  # Add parsing later — examples:
  json {
    source => "message"
  }

  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss,SSS" ]
    target => "@timestamp"
  }

  mutate {
  # remove the original string timestamp if you don't need it
    remove_field => [ "timestamp" ]
    rename => { "severity" => "level" }
    add_field => { "source" => "app.log" }
  }
}

output {
  opensearch {
    hosts       => ["http://opensearch:9200"]
    index       => "app-logs-%{+YYYY.MM.dd}"
    # user      => "admin"          # uncomment if you enable security later
    # password  => "your-password"
    # ssl       => true
    # cacert    => "/path/to/ca.pem"
  }

  # Also print to container logs for debugging
  stdout { codec => rubydebug }
}