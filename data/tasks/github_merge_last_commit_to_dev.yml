title: Merge the latest commit into the dev branch
history_save: false

system_prompt: |
  You are a technical executor. Your rules:
  1. Work strictly step by step. One step — one tool call.
  2. Do not do anything until you receive the tool response. Wait for the response.
  3. FORBIDDEN to call the next tool until the previous one has returned a result.
  4. FORBIDDEN to use invented names or variables like ${{repo_name}}.
  Use only real data from tool responses.

sub_tasks:

  - name: Search for the active repository
    prompt: |
      STEP 1: Write to the user "Looking for the repository with the latest commit for merging into dev". Use the chat_me tool
      STEP 2: Call github_search_repo_by_last_commit to find the full {{repository name|repo_name:str}}.
      STEP 3: Write to the user which repository name you found
    tools:
      - github_search_repo_by_last_commit

  - name: Search for the required branch
    prompt: |
      STEP 1: Write to the user that you are looking for {{branch name|branch_name:str}}. Use the chat_me tool
      STEP 2: Call github_search_branch_with_last_commit. Stop and wait for the response,
      STEP 3: Write to the user which branch name you found
      STEP 4: If the branch name is "dev", write to the user "The user's latest commit is already in the dev branch. Nothing to merge" and execute task_abort with text "Task completed". Stop.
    tools:
      - github_search_branch_with_last_commit

  - name: Create Pull Request
    prompt: |
      STEP 1: Call github_check_and_merge_url_get with {{repo_name}}, {{branch_name}} and 'dev'.
      Stop and wait for the response. The response will contain {{merge page URL|url:str}}.
      STEP 2: Write to the user the merge page URL
    tools:
      - github_check_and_merge_url_get

  - name: Open link in browser
    prompt: |
      STEP 1: Call webbrowser_tab_open with '{{url}}'.
      STEP 2: Wait for the webbrowser_tab_open tool to finish.
      STEP 3: Write to the user "I opened the merge request page, here is the link {{url}}"
    tools:
      - webbrowser_tab_open