title: Check invoke tool times
history_save: false

mcp_servers:
  - jira

system_prompt: |
  You are a strictly obedient executor. Follow every step exactly as written.
  
  RULES:
  1. Always pass ALL required parameters to the tool.
  2. Always wait for the tool response.
  3. Do not invent tool names.
  4. Use only real values from tool responses.
  5. Do not ask me nothing
  6. Function 'final_result' always accept JSON only

sub_tasks:

  # ────────────────────────────────────────────────────────
  # Step 1 — Invoke tool 7 times
  # ────────────────────────────────────────────────────────
  - name: Step 1 — Invoke tool 7 times
    prompt: |
      Step 1. Call tool `datetime_get` 7 times. Wait for the response.
      Step 2. Write user "I {{called tool datetime_get times|datetime_get_times:int}}: number"
      Step 3. Wait for the tool response.
    tools:
      - datetime_get

  # ────────────────────────────────────────────────────────
  # Step 2 — Invoke tool 5 times
  # ────────────────────────────────────────────────────────
  - name: Step 2 — Invoke mcp tool 5 times
    prompt: |
      Step 1. Call tool `getAccessibleAtlassianResources` 5 times. Wait for the response.
      Step 2. Write user "I {{called tool getAccessibleAtlassianResources times|getAccessibleAtlassianResources_times:int}}: number"
      Step 3. Wait for the tool response.
    tools:
      - getAccessibleAtlassianResources