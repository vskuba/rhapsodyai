title: My Active Jira Tasks
history_save: false

mcp_servers:
  - jira

system_prompt: |
  You are a strictly obedient executor. Follow every step exactly as written.
  
  RULES:
  1. Always pass ALL required parameters to the tool.
  2. Always wait for the tool response.
  3. Do not invent tool names.
  4. Use only real values from tool responses.
  5. Do not ask me nothing
  6. Function 'final_result' always accept JSON only

sub_tasks:

  # ────────────────────────────────────────────────────────
  # Step 1 — Get current user accountId
  # ────────────────────────────────────────────────────────
  - name: Step 1 — Get accountId
    prompt: |
      Step 1. Call tool `atlassianUserInfo`. Wait for the response.
      Step 2. From the response find field `accountId` and remember it as {{account_id|accountId:str}}.
      Step 3. Finish work.
    tools:
      - atlassianUserInfo

  # ────────────────────────────────────────────────────────
  # Step 2 — Get organization cloudId
  # ────────────────────────────────────────────────────────
  - name: Step 2 — Get cloudId
    prompt: |
      Step 1. Call tool `getAccessibleAtlassianResources`. Wait for the response.
      Step 2. From the response find field `cloudId` (may be called `id`) and remember it as {{cloudId|cloudId:str}}.
      Step 3. Finish work.
    tools:
      - getAccessibleAtlassianResources

  # ────────────────────────────────────────────────────────
  # Step 3 — Inform user about found data
  # ────────────────────────────────────────────────────────
  - name: Step 3 — Inform user about accountId and cloudId
    prompt: |
      Step 1. Send message to user via `chat_me`:
              "Found your data:
                  • accountId: {{accountId}}
                  • cloudId: {{cloudId}}
              Now looking for your active tasks..."
      Step 6. Finish work with empty response.

  # ────────────────────────────────────────────────────────
  # Step 4 — Execute JQL query
  # ────────────────────────────────────────────────────────
  - name: Step 4 — Execute JQL
    prompt: |
      Step 1. Execute JQL query: 'project = CAS AND assignee = currentUser() AND statusCategory != Done ORDER BY created DESC'
      with follow tool parameters:
        maxResults: float = 5, 
        fields: list = ['item work key']
      Step 2. Wait for response
      Step 3. You have the list of tasks. Now find all task ID (key). It looks like this: 'CAS-xxxx'.
              Remember {{the list of task ID (key) issues|issues_key_list:list}}. 
      Step 4. Check {{quantity list of task ID (key)|issues_key_list_count:int}}.
      Step 5. Send to user message: 'I found issues key list count number tasks.'
      Step 6. Finish work with empty text response.

    tools:
      - searchJiraIssuesUsingJql

  # ────────────────────────────────────────────────────────
  # Step 5 — Format tasks
  # ────────────────────────────────────────────────────────
  - name: Step 5 — Format tasks
    prompt: |
      Step 1. Now use tool `getJiraIssue` to get details for each task with follow tool parameters:
        issueIdOrKey: task ID of issue from {{issues_key_list}}, 
        fields: list = ['summary', 'status']
      Step 2. Wait for response.
      Step 3. When got response for {{issues_key_list_count}} task prepare numbered list follow labels:
        - Task ID: (issueIdOrKey)
        - Task Summary
        - Task Status
        - Link to task: 'https://protonixltd.atlassian.net/browse/' + Task ID
           example: 'https://protonixltd.atlassian.net/browse/CAS-2117'
      Step 4. Move to step 1 while dont perform `getJiraIssue` for each issue. Total {{issues_key_list_count}} times.
      Step 5. Send formatted list to user via `chat_me`.
         Example of formatted list: 
            "I found the following tasks for you:
            1. Task ID: CAS-2117
                Task Summary: Fix login bug
                Task Status: In Progress
                Link to task: https://protonixltd.atlassian.net/browse/CAS-2117
            2. Task ID: CAS-2105
                Task Summary: Update documentation
                Task Status: To Do
                Link to task: https://protonixltd.atlassian.net/browse/CAS-2105"
      Step 6. Finish work with empty text response.
    tools:
      - getJiraIssue