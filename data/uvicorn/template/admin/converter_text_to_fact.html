{% extends "base.html" %}

{% block title %}Экстрактор фактов{% endblock %}

{% block head %}

<style>
    .page-content, .main-wrapper {
        display: flex;
        justify-content: center;
        padding: 20px 0 !important;
    }

    /* Главный контейнер экстрактора */
    .extractor-container {
        display: flex;
        width: 1250px;
        height: 750px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }

    /* Колонки */
    .collection-sidebar {
        width: 260px;
        min-width: 260px;
        background-color: #f8f9fa;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
    }

    .column-io {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #fff;
    }

    /* Секции (блоки по 50% высоты) */
    .sidebar-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0; /* Для корректного скролла внутри flex */
    }

    /* Заголовки */
    .column-header {
        padding: 12px 20px;
        font-weight: 600;
        background: #fff;
        border-bottom: 1px solid #eee;
        color: #555;
        font-size: 14px;
    }

    /* Поля ввода (универсально для всех колонок) */
    .sidebar-section textarea, #mdEditorRaw {
        flex: 1;
        border: none;
        padding: 20px;
        font-size: 15px;
        line-height: 1.5;
        resize: none;
        outline: none;
        font-family: inherit;
        background: transparent;
        box-sizing: border-box;
    }

    /* Футер с кнопками (Блок 3) */
    .column-footer {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #f8f9fa; /* Чуть темнее фон для контраста с белым редактором */
        border-top: 1px solid #ddd;
    }

    .btn-action {
        flex: 1;
        height: 42px; /* Фиксированная высота для симметрии */
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
    }

    /* Синяя кнопка */
    .btn-extract {
        background: #007bff;
        color: white;
    }

    /* Зеленая кнопка */
    .btn-add {
        background: #28a745;
        color: white;
    }

    /* Состояние Disabled (когда в редакторе пусто) */
    .btn-action:disabled {
        background: #e9ecef !important;
        color: #adb5bd !important;
        cursor: not-allowed;
        box-shadow: none;
    }

    .btn-action:hover:not(:disabled) {
        filter: brightness(1.1);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Разделители и стрелка */
    .sidebar-divider {
        height: 1px;
        background-color: #ddd;
        margin: 0;
        border: none;
    }

    .arrow-divider {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        background: #fdfdfd;
        color: #bbb;
        font-size: 24px;
        border-left: 1px solid #eee;
        border-right: 1px solid #eee;
        user-select: none;
    }

    /* Списки и элементы */
    .collection-list {
        flex: 1;
        overflow-y: auto;
    }

    .collection-item, .extractor-item {
        padding: 12px 20px;
        cursor: pointer;
        font-size: 14px;
        color: #333;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.15s ease-in-out;
        border-left: 3px solid transparent;
    }

    .collection-item:hover, .extractor-item:hover {
        background-color: #e9ecef;
    }

    .collection-item.active, .extractor-item.active {
        background-color: #fff;
        color: #007bff;
        font-weight: 600;
        border-left: 3px solid #007bff;
    }

    .collection-item::before {
        content: "🗂️";
    }

    .extractor-item::before {
        content: "⚙️";
    }

    /* Скроллбар */
    .collection-list::-webkit-scrollbar {
        width: 5px;
    }

    .collection-list::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 10px;
    }
</style>

<link rel="stylesheet" href="/static/css/code_mirror_md.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

{% endblock %}

{% block content %}
<div class="extractor-container">
    <!-- 1. Левая колонка (без изменений) -->
    <div class="collection-sidebar">

        <!-- Секция Коллекции -->
        <div class="sidebar-section">
            <div class="column-header">Коллекции</div>
            <div class="collection-list" id="collectionList">
                <!-- Сюда JS загрузит список (например, cashier_service) -->
            </div>
        </div>

        <hr class="sidebar-divider">

        <!-- Секция Экстракторы -->
        <div class="sidebar-section">
            <div class="column-header">Экстракторы</div>
            <div class="collection-list" id="extractorList">
                <!-- Сюда JS загрузит список (например, fact_extractor) -->
            </div>
        </div>
    </div>

    <!-- 2. Центральная колонка: Два текстовых блока -->
    <div class="column-io" style="border-right: 1px solid #eee;">
        <!-- Блок 1: Исходный текст -->
        <div class="sidebar-section">
            <div class="column-header">📥 Исходный текст</div>
            <textarea id="inputText" placeholder="Вставьте текст для анализа..."></textarea>
        </div>

        <hr class="sidebar-divider">

        <!-- Блок 2: System Prompt -->
        <div class="sidebar-section">
            <div class="column-header">⚙️ System prompt</div>
            <textarea id="systemPrompt" placeholder="Введите инструкции для извлечения..."></textarea>
        </div>
    </div>

    <!-- Разделитель-стрелка -->
    <div class="arrow-divider">➜</div>

    <!-- 3. Правая колонка: Результат и кнопки -->
    <div class="column-io">
        <div class="column-header">📝 Извлеченные факты (Markdown)</div>
        <textarea id="mdEditorRaw"></textarea>

        <!-- Блок 3: Нижняя панель с кнопками -->
        <div class="column-footer"
             style="display: flex; gap: 10px; padding: 10px; background: #f8f9fa; border-top: 1px solid #eee;">
            <button class="btn-action btn-extract" id="extractBtn" style="flex: 1; background: #007bff; color: #fff;">
                Извлечь факты ⚡
            </button>
            <button class="btn-action btn-add" id="addToCollectionBtn" disabled
                    style="flex: 1; background: #28a745; color: #fff;">Добавить в коллекцию
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>

<script type="module">
    import {postData, getData, putData} from "/static/js/api.js";
    import {SettingGet} from "/static/js/setting.js";
    import {showNotification} from '/static/js/notification.js';

    const collectionListContainer = document.getElementById('collectionList');
    const inputTextarea = document.getElementById('inputText');
    const systemPromptTextarea = document.getElementById('systemPrompt');
    const extractBtn = document.getElementById('extractBtn');
    const addToCollectionBtn = document.getElementById('addToCollectionBtn');

    let mdEditor = null; // Будет инициализировано через initFactManager
    let selectedCollection = null;
    let selectedExtractorId = null;

    /**
     * Инициализация менеджера фактов
     * @param {Object} editorInstance - экземпляр CodeMirror
     */
    async function initFactManager(editorInstance) {
        mdEditor = editorInstance;
        await loadCollections();
        await loadAgentExtractors();

        // Привязываем события, если кнопки существуют
        if (extractBtn) extractBtn.onclick = extractFacts;
        if (addToCollectionBtn) addToCollectionBtn.onclick = saveToCollection;
    }

    /**
     * Загрузка коллекций в левую колонку
     */
    async function loadCollections() {
        if (!collectionListContainer) return;

        try {
            const data = await getData('/fact/collection/list');
            collectionListContainer.innerHTML = ''; // Очистка

            data.result.forEach(name => {
                const div = document.createElement('div');
                div.className = 'collection-item';
                div.textContent = name.name;
                div.onclick = () => {
                    document.querySelectorAll('.collection-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    selectedCollection = name;
                    if (addToCollectionBtn) addToCollectionBtn.disabled = false;
                };
                collectionListContainer.appendChild(div);
            });
        } catch (e) {
            console.error("Ошибка загрузки коллекций:", e);
            showNotification("Не удалось загрузить список коллекций", "error");
        }
    }

    async function loadAgentExtractors() {
        const extractorListContainer = document.getElementById('extractorList');
        if (!extractorListContainer) return;

        try {
            const specialization = 'fact_extractor';
            let specializationFactExtractorId = null;

            // 1. Получаем ID специализации
            const specialization_list = await getData('/agent/specialization/list');
            const spec = specialization_list.result.find(i => i.name === specialization);

            if (spec) {
                specializationFactExtractorId = spec.id;
            } else {
                showNotification(`Специализация "${specialization}" не найдена`, 'error');
                return;
            }

            // 2. Получаем список агентов этой специализации
            // const data = await postData('/agent/list', {
            //     find_by: {
            //         specialization_id: specializationFactExtractorId
            //     }
            // });

            // Очищаем контейнер перед наполнением
            extractorListContainer.innerHTML = '';

            if (data.result.length === 0) {
                extractorListContainer.innerHTML = '<div style="padding: 15px; font-size: 13px; color: #999;">Экстракторы не найдены</div>';
                return;
            }

            data.result.forEach((agent, index) => {
                const div = document.createElement('div');
                div.className = 'extractor-item';
                div.textContent = agent.name;

                // Сохраняем ID агента в атрибут или замыкание
                div.dataset.agentId = agent.id;

                div.onclick = async () => {
                    // Убираем активный класс у всех и добавляем текущему
                    document.querySelectorAll('.extractor-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');

                    // Запоминаем выбранный ID для дальнейшей работы
                    selectedExtractorId = agent.id;
                    console.log(`Выбран экстрактор ID: ${selectedExtractorId}`);

                    if (selectedCollection) {
                        const data = await getData(`/agent/${agent.id}/prompt_system/${selectedCollection.name}`);
                        systemPromptTextarea.value = data.result || "";
                    }
                };

                extractorListContainer.appendChild(div);

                // Автоматически выбираем первый экстрактор из списка
                if (index === 0) {
                    div.click();
                }
            });

        } catch (e) {
            console.error("Ошибка загрузки экстракторов:", e);
            showNotification("Не удалось загрузить список экстракторов", "error");
        }
    }

    /**
     * Отправка текста на LLM для извлечения фактов
     */
    async function extractFacts() {
        const text = inputTextarea?.value;
        if (!text) return alert("Введите текст для анализа");

        extractBtn.disabled = true;
        const originalText = extractBtn.textContent;
        extractBtn.textContent = "⌛ Обработка...";

        try {
            let agent_id = null

            const agent_list = await getData('/agent/list', {})
            for (const agent of agent_list.result) {
                if (agent.name === 'fact_extractor') {
                    agent_id = agent.id
                }
            }

            // Получаем Companion ID
            const compData = await getData('/companion/converter');
            const companionId = compData.result.id;

            // Эндпоинт должен возвращать { "md_result": "текст фактов..." }
            const res = await postData('/chat/ask', {
                question: text,
                companion_id: companionId,
                agent_id: agent_id,
                llm: await SettingGet('llm_active', 1),
                session_uuid: crypto.randomUUID(),
                metadata: {
                    collection_name: selectedCollection?.name || "",
                }
            });
            if (mdEditor) {
                mdEditor.setValue(res.result || "");
            }
        } catch (e) {
            console.error("Ошибка LLM:", e);
            showNotification("Ошибка при извлечении фактов", "error");
        } finally {
            extractBtn.disabled = false;
            extractBtn.textContent = originalText;
        }
    }

    /**
     * Сохранение результата в выбранную коллекцию
     */
    async function saveToCollection() {
        if (!selectedCollection || !mdEditor) return;

        const content = mdEditor.getValue();
        const originalText = addToCollectionBtn.textContent;

        addToCollectionBtn.disabled = true;
        addToCollectionBtn.textContent = "💾 Сохранение...";

        try {
            // Метод для добавления (append) фактов в существующий файл
            await putData(
                `/fact/collection/${selectedCollection.id}`,
                JSON.parse(content)
            );
            showNotification(`Успешно добавлено в коллекцию: ${selectedCollection.name}`, "success");
            mdEditor.setValue("");
        } catch (e) {
            console.error("Ошибка сохранения:", e);
            showNotification("Не удалось сохранить в коллекцию", "error");
        } finally {
            addToCollectionBtn.disabled = false;
            addToCollectionBtn.textContent = originalText;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Инициализация CodeMirror для Markdown
        const mdEditor = CodeMirror.fromTextArea(document.getElementById('mdEditorRaw'), {
            mode: 'markdown',
            theme: 'dracula',
            lineNumbers: true,
            lineWrapping: true,
            matchBrackets: true
        });

        // 2. Запускаем менеджер фактов и передаем ему объект редактора
        // Эта функция сама загрузит коллекции и привяжет кнопки
        await initFactManager(mdEditor);

        // 3. (Опционально) Добавляем горячие клавиши
        window.addEventListener('keydown', (e) => {
            // Ctrl + Enter для быстрого извлечения
            if (e.ctrlKey && e.key === 'Enter') {
                extractFacts();
            }
            // Ctrl + S для сохранения в коллекцию
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveToCollection();
            }
        });
    });
</script>

{% endblock %}
