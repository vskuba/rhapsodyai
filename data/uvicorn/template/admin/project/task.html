{% extends "base.html" %}

{% block title %}Задачи{% endblock %}

{% block head %}
<style>
    .task-page {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .05);
        overflow: hidden;
    }

    /* ── Toolbar ── */
    .task-toolbar {
        padding: 12px 18px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        background: #fff;
        flex-wrap: wrap;
    }

    .task-toolbar-title {
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -.01em;
        margin-right: 2px;
    }

    .task-count-badge {
        font-size: 11px;
        font-weight: 700;
        color: #4f46e5;
        background: #eef2ff;
        border: 1px solid #e0e7ff;
        border-radius: 999px;
        padding: 2px 9px;
        font-variant-numeric: tabular-nums;
    }

    .task-toolbar-spacer { flex: 1; }

    .task-project-select {
        font-size: 13px;
        font-weight: 500;
        padding: 6px 10px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        color: #1e293b;
        cursor: pointer;
        outline: none;
        max-width: 240px;
        transition: border-color .12s, box-shadow .12s;
    }
    .task-project-select:hover { border-color: #cbd5e1; }
    .task-project-select:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }

    .task-search {
        font-size: 13px;
        padding: 6px 10px 6px 30px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
        width: 200px;
        background: #fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-3.5-3.5'/%3E%3C/svg%3E") no-repeat 9px center;
        transition: border-color .12s, box-shadow .12s;
    }
    .task-search:hover { border-color: #cbd5e1; }
    .task-search:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }

    /* Status filter chips */
    .task-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .task-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid #e2e8f0;
        background: #fff;
        color: #64748b;
        cursor: pointer;
        transition: all .12s;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .task-chip:hover { border-color: #cbd5e1; background: #f8fafc; color: #475569; }
    .task-chip.active { background: #1e293b; border-color: #1e293b; color: #fff; }
    .task-chip .chip-n { font-variant-numeric: tabular-nums; opacity: .65; }

    .btn-pane-add {
        font-size: 13px;
        padding: 7px 14px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background .12s, box-shadow .12s;
        box-shadow: 0 1px 2px rgba(79,70,229,.3);
    }
    .btn-pane-add:hover { background: #4338ca; box-shadow: 0 2px 6px rgba(79,70,229,.35); }

    .btn-ai-gen {
        font-size: 12px;
        padding: 6px 12px;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: #fff;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: opacity .15s;
    }
    .btn-ai-gen:hover { opacity: .88; }
    .btn-ai-gen:disabled { opacity: .55; cursor: not-allowed; }

    .ai-gen-spinner {
        width: 12px; height: 12px;
        border: 2px solid rgba(255,255,255,.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .6s linear infinite;
        display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ai-gen-spinner.active { display: inline-block; }

    /* ── Add form ── */
    .task-add-form {
        display: none;
        padding: 16px 18px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        flex-direction: column;
        gap: 10px;
        flex-shrink: 0;
    }
    .task-add-form.open { display: flex; }
    .task-add-form > * { max-width: 1100px; }

    .task-add-form-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
    }

    .task-add-form-row .form-group { flex: 1; }
    .task-add-form-row .form-group.narrow { flex: 0 0 170px; }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .form-group label {
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
        font-size: 13px;
        padding: 7px 10px;
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        outline: none;
        font-family: inherit;
        background: #fff;
        color: #0f172a;
        resize: vertical;
        transition: border-color .12s, box-shadow .12s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .form-group textarea { min-height: 58px; line-height: 1.5; }

    .task-add-actions {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
    }

    .btn-save {
        font-size: 13px;
        padding: 7px 16px;
        border-radius: 7px;
        background: #4f46e5;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background .12s;
    }
    .btn-save:hover { background: #4338ca; }

    .btn-cancel {
        font-size: 13px;
        padding: 7px 12px;
        border-radius: 7px;
        background: #fff;
        color: #64748b;
        border: 1px solid #e2e8f0;
        cursor: pointer;
        font-weight: 500;
        transition: all .12s;
    }
    .btn-cancel:hover { background: #f8fafc; color: #334155; border-color: #cbd5e1; }

    /* ── Table ── */
    .task-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 0;
    }
    .task-scroll::-webkit-scrollbar { width: 10px; }
    .task-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 5px; border: 3px solid #fff; }
    .task-scroll::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

    .task-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        table-layout: fixed;
    }

    .task-table th { position: relative; overflow: visible; border-right: none; }
    .task-table td { border-right: none; }
    .col-resizer {
        position: absolute; right: -5px; top: 0; bottom: 0;
        width: 10px; cursor: col-resize;
        display: flex; align-items: stretch; justify-content: center;
        z-index: 10;
    }
    .col-resizer::after {
        content: ''; display: block;
        width: 2px; background: transparent;
        transition: background .15s;
        border-radius: 2px;
        margin: 7px 0;
    }
    .col-resizer:hover::after, .col-resizer.dragging::after { background: #818cf8; }

    .task-table thead th[draggable] { user-select: none; cursor: grab; }
    .task-table thead th.col-dragging { opacity: .4; }
    .task-table thead th.col-drag-over { box-shadow: inset 2px 0 0 #6366f1; background: #eef2ff !important; }

    .task-table thead th {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #f8fafc;
        padding: 9px 14px;
        text-align: left;
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-bottom: 1px solid #e2e8f0;
        white-space: nowrap;
    }

    /* Фон строки приходит из JS переменной `--row-bg` (см. ROW_BG): тон задаёт
       глубина вложенности, чередование — соседство. Строки бывают высокими
       (описание, список целей), и без зебры таблица читается сплошным полотном. */
    .task-table tbody tr.task-row {
        background: var(--row-bg, #fff);
        border-bottom: 1px solid #ece7dc;
        transition: background 0.1s;
    }
    /* Подсветки по наведению нет намеренно: зебра уже разделяет строки, а второй
       слой реакции на мышь только мельтешил. Раскрытая строка перебивает любой
       оттенок зебры, поэтому взята заметно насыщеннее самой тёмной ступени. */
    .task-table tbody tr.task-row.expanded { background: #dbe2ff; }

    .task-table td {
        padding: 9px 14px;
        vertical-align: top;
    }

    /* Status accent stripe on the leading cell of each row */
    .task-row > td:first-child { box-shadow: inset 3px 0 0 var(--row-accent, transparent); }

    .td-id     { color: #94a3b8; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .td-title  { font-weight: 600; color: #0f172a; line-height: 1.4; }

    /* ── Дерево задач (task.parent_id) ──
       Вложенность живёт внутри колонки «Название», а не отдельной колонкой:
       порядок и ширины колонок сохранены в localStorage по их количеству,
       и девятая колонка обнулила бы всем сохранённую раскладку. */
    .tree-title { display: flex; align-items: flex-start; gap: 2px; min-width: 0; }
    .tree-name  { min-width: 0; overflow-wrap: anywhere; }

    /* Строка бывает высокой (длинное описание, список целей), поэтому линии
       рисуются с запасом и обрезаются самой ячейкой — иначе вертикали висели бы
       короткими штрихами и дерево рассыпалось. */
    /* Место под «＋» держим всегда, а не только на hover: иначе строка при
       наведении перевёрстывалась бы и таблица дёргалась. */
    .task-table td.td-title { overflow: hidden; position: relative; padding-right: 22px; }
    .tree-rail, .tree-elbow { position: relative; width: 16px; flex: none; align-self: stretch; }
    .tree-rail::before {
        content: ''; position: absolute; left: 7px; top: -400px; bottom: -400px;
        border-left: 1px solid #cdc4b2;
    }
    .tree-rail-blank::before { display: none; }
    /* Локоть: вертикаль сверху до середины первой строки названия + горизонталь
       к тексту. У последнего в ветке вертикаль обрывается, у остальных идёт дальше. */
    .tree-elbow::before {
        content: ''; position: absolute; left: 7px; top: -400px; height: 409px;
        border-left: 1px solid #cdc4b2;
    }
    .tree-elbow:not(.tree-elbow-last)::before { bottom: -400px; height: auto; }
    .tree-elbow::after {
        content: ''; position: absolute; left: 7px; top: 8px; width: 8px;
        border-top: 1px solid #cdc4b2;
    }

    .tree-caret {
        flex: none;
        width: 16px; height: 18px;
        padding: 0;
        border: 0; background: none; cursor: pointer;
        color: #94a3b8; font-size: 10px; line-height: 18px;
        transition: transform .12s, color .12s;
    }
    .tree-caret:hover { color: #4f46e5; }
    .tree-caret.collapsed { transform: rotate(-90deg); color: #6366f1; }
    .tree-caret-gap { flex: none; width: 16px; }

    /* Сквозная нумерация ветки: 2, затем 2.1, 2.1.1. Это позиция в текущей
       сортировке, а не идентификатор — постоянная ссылка на задачу это «#id»
       в первой колонке. */
    .tree-num {
        flex: none;
        margin-right: 6px;
        color: #a1866a;
        font-size: 11px; font-weight: 700;
        line-height: 18px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    /* Пилюля и «＋» лежат внутри .tree-name, а не рядом с ним: как flex-соседи
       они улетали к правому краю колонки, отрываясь от названия. */
    .tree-kids {
        display: inline-block;
        margin-left: 6px;
        vertical-align: 1px;
        padding: 1px 6px;
        border-radius: 999px;
        /* Индиго на песочном фоне ступеней (ROW_BG) — контрастный акцент;
           бежевая пилюля на бежевой строке терялась бы. */
        background: #dfe6ff; color: #4338ca;
        font-size: 10px; font-weight: 700;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .tree-kids-done { background: #dcfce7; color: #15803d; }

    .task-table tbody tr.tree-child > td:first-child { box-shadow: inset 3px 0 0 var(--row-accent, transparent); }
    .tree-child .td-id    { opacity: .75; }
    .tree-child .tree-name { font-weight: 500; }
    /* Предок, показанный только как контекст для найденной подзадачи. */
    .tree-ghost > td { opacity: .5; }
    .tree-ghost:hover > td { opacity: 1; }

    /* ── Баннер «подзадача к …» в форме добавления ── */
    .add-parent-banner {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 12px; padding: 7px 10px;
        background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 7px;
        font-size: 12px;
    }
    .ap-label { color: #6366f1; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .05em; }
    .ap-task  { font-weight: 600; color: #312e81; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ap-clear {
        margin-left: auto; border: 0; background: none; cursor: pointer;
        color: #6366f1; font-size: 13px; line-height: 1; padding: 2px 4px;
    }
    .ap-clear:hover { color: #ef4444; }
    .td-desc   { color: #64748b; }
    .td-date   { white-space: nowrap; color: #94a3b8; font-size: 12px; font-variant-numeric: tabular-nums; }
    /* Buttons wrap onto a new line instead of overflowing a narrow column */
    .td-act    { text-align: right; white-space: normal; }
    .td-act > button { white-space: nowrap; margin: 0 0 4px 4px; }

    /* ── Status badge ── */
    .task-status-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px 3px 7px;
        border-radius: 6px;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .task-status-badge::before {
        content: '';
        width: 6px; height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
    }
    .status-pending   { background: #f1f5f9; color: #475569; }
    .status-queued    { background: #fef3c7; color: #a16207; }
    .status-active    { background: #dcfce7; color: #15803d; }
    .status-done      { background: #e0f2fe; color: #0369a1; }
    .status-blocked   { background: #fee2e2; color: #b91c1c; }
    .status-cancelled { background: #f1f5f9; color: #64748b; }
    .status-active::before { animation: status-pulse 1.6s ease-in-out infinite; }
    @keyframes status-pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    /* ── Row action buttons ── */
    .btn-status-action {
        font-size: 11px;
        padding: 4px 9px;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #e2e8f0;
        cursor: pointer;
        font-weight: 600;
        color: #475569;
        transition: all .12s;
    }
    .btn-status-action:hover { border-color: #cbd5e1; background: #f8fafc; }
    .btn-status-action.start:hover  { color: #15803d; border-color: #86efac; background: #f0fdf4; }
    .btn-status-action.queue:hover  { color: #a16207; border-color: #fcd34d; background: #fffbeb; }
    .btn-status-action.stop:hover   { color: #b45309; border-color: #fdba74; background: #fff7ed; }
    .btn-status-action.finish:hover { color: #0369a1; border-color: #7dd3fc; background: #f0f9ff; }

    .btn-row-del {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        background: #fff;
        color: #94a3b8;
        border: 1px solid #e2e8f0;
        cursor: pointer;
        font-weight: 600;
        line-height: 1.1;
        transition: all .12s;
    }
    .btn-row-del:hover { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }

    /* «Добавить подзадачу» живёт в колонке названия, а не среди действий:
       четвёртая кнопка не влезала в узкую колонку и переносила её на две строки,
       раздувая высоту каждой строки таблицы. */
    .btn-row-sub {
        position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
        width: 18px; height: 18px;
        padding: 0;
        border: 1px solid #e2e8f0; border-radius: 5px;
        background: #fff; color: #94a3b8;
        font-size: 12px; font-weight: 700; line-height: 18px;
        cursor: pointer;
        opacity: 0; transition: opacity .12s, color .12s, background .12s;
    }
    .task-row:hover .btn-row-sub { opacity: 1; }
    .btn-row-sub:hover { background: #eef2ff; color: #4f46e5; }
    .btn-row-sub:focus-visible { opacity: 1; outline: 2px solid #c7d2fe; }

    /* ── Inline goals (list column) ── */
    .inline-goals { display: flex; flex-direction: column; gap: 2px; }
    .inline-goals-progress {
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-variant-numeric: tabular-nums;
    }
    .inline-goals-bar {
        flex: 1;
        max-width: 70px;
        height: 4px;
        background: #f1f5f9;
        border-radius: 2px;
        overflow: hidden;
    }
    .inline-goals-bar > i {
        display: block;
        height: 100%;
        background: #22c55e;
        border-radius: 2px;
        transition: width .2s;
    }
    .inline-goal-item {
        display: flex; align-items: flex-start; gap: 6px;
        font-size: 12px; color: #334155; line-height: 1.45;
        border-radius: 5px; padding: 1px 3px;
    }
    .inline-goal-item:hover { background: #f1f5f9; }
    .inline-goal-item input[type=checkbox] {
        accent-color: #22c55e; flex-shrink: 0; cursor: pointer; margin-top: 2px;
    }
    .inline-goal-done { text-decoration: line-through; color: #94a3b8 !important; }
    .inline-goal-text { flex: 1; cursor: default; word-break: break-word; }
    .inline-goal-input {
        flex: 1; font-size: 12px; border: 1px solid #818cf8;
        border-radius: 4px; padding: 1px 5px; outline: none; font-family: inherit;
    }
    .ig-goals-wrapper { display: flex; flex-direction: column; gap: 2px; }
    .ig-goals-wrapper > .subtask-status-tag { align-self: flex-start; margin-bottom: 1px; }
    .ig-btn {
        background: none; border: none; cursor: pointer; padding: 1px 3px;
        font-size: 11px; color: #cbd5e1; line-height: 1.4; flex-shrink: 0; border-radius: 4px;
        opacity: 0; transition: opacity .12s, color .12s, background .12s;
    }
    .inline-goal-item:hover .ig-btn { opacity: 1; }
    .ig-btn:hover { color: #4f46e5; background: #e0e7ff; }
    .ig-btn.del:hover { color: #dc2626; background: #fee2e2; }
    .ig-goals-empty { font-size: 11px; color: #cbd5e1; font-style: italic; }

    /* ── Subtask progress (for parent tasks — merged status+goals column) ── */
    .subtask-summary { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .subtask-progress-row {
        display: flex; align-items: center; gap: 6px; font-size: 11px;
        font-weight: 600; color: #64748b; white-space: nowrap;
    }
    .subtask-progress-bar {
        flex: 1; max-width: 80px; height: 4px;
        background: #f1f5f9; border-radius: 2px; overflow: hidden;
    }
    .subtask-progress-bar > i {
        display: block; height: 100%; background: #22c55e; border-radius: 2px; transition: width .2s;
    }
    .subtask-status-row {
        display: flex; flex-wrap: wrap; gap: 3px; align-items: center;
    }
    .subtask-status-tag {
        font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
        white-space: nowrap;
    }
    .stt-done      { background: #dcfce7; color: #15803d; }
    .stt-active    { background: #dcfce7; color: #166534; }
    .stt-queued    { background: #fef3c7; color: #a16207; }
    .stt-pending   { background: #f1f5f9; color: #475569; }
    .stt-blocked   { background: #fee2e2; color: #b91c1c; }
    .stt-cancelled { background: #f1f5f9; color: #94a3b8; }
    .stt-more      { background: #f1f5f9; color: #64748b; }
