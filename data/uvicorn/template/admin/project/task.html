{% block scripts %}
<script>
let _taskProjectId = null;
let _tasks = [];
let _projectsMap = {};
let _statusFilter = '';

const STATUS_LABELS = {
    active:    'В работе',
    queued:    'В очереди',
    pending:   'Ожидает',
    blocked:   'Заблокировано',
    cancelled: 'Отменено',
    done:      'Готово',
};
const STATUS_ORDER = { active: 0, queued: 1, pending: 2, blocked: 3, cancelled: 4, done: 5 };

async function taskFetch(url, opts = {}) {
    const r = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
    });
    if (!r.ok) {
        // Причина отказа лежит в detail (например, «нельзя перенести задачу
        // внутрь её собственной подзадачи») — без неё пользователь видит
        // бесполезное «HTTP 400» и не понимает, что именно не так.
        let detail = '';
        try { detail = (await r.json())?.detail || ''; } catch(e) {}
        throw new Error(detail || `HTTP ${r.status}`);
    }
    return r.json();
}

// Выбранный проект помнится между перезагрузками: страница задач — рабочее место
// внутри одного проекта, а не список всего сразу, и каждый раз возвращаться
// к «Без проекта» после F5 бессмысленно.
const PROJECT_KEY = 'task_project_id';

async function loadProjects() {
    const sel = document.getElementById('taskProjectSelect');
    try {
        const data = await taskFetch('/planning/project/list');
        const projects = data.projects || data.result || [];
        _projectsMap = {};
        projects.forEach(p => { _projectsMap[p.id] = p.title; });
        if (!projects.length) {
            sel.innerHTML = '<option value="">Нет проектов</option>';
            return;
        }
        // «Без проекта» вместо «Все проекты»: колонки с названием проекта больше
        // нет, и вперемешку задачи разных проектов стали неразличимы.
        sel.innerHTML = '<option value="0">Без проекта</option>' + projects.map(p =>
            `<option value="${p.id}">${esc(p.title)}</option>`
        ).join('');
        // Проект из прошлой сессии мог быть удалён — сверяем со списком опций
        // и в этом случае молча откатываемся на «Без проекта».
        const saved = localStorage.getItem(PROJECT_KEY);
        sel.value = [...sel.options].some(o => o.value === saved) ? saved : '0';
        selectProjectById(+sel.value, sel.options[sel.selectedIndex].text);
    } catch(e) {
        sel.innerHTML = '<option value="">Ошибка загрузки</option>';
    }
}

function selectProjectById(id, title) {
    _taskProjectId = id || 0;
    localStorage.setItem(PROJECT_KEY, String(_taskProjectId));
    document.getElementById('newTaskStatus').innerHTML = statusOptions('pending');
    loadTasks();
}

async function loadTasks() {
    document.getElementById('taskTableWrap').innerHTML = '<div class="task-placeholder">Загрузка...</div>';
    try {
        const data = await taskFetch(`/tasks/${_taskProjectId}`);
        _tasks = data.tasks || [];
        renderTable();
    } catch(e) {
        document.getElementById('taskTableWrap').innerHTML =
            '<div class="task-placeholder" style="color:#ef4444"><span class="task-placeholder-icon">⚠️</span>Ошибка загрузки</div>';
    }
}

// ── Дерево задач ───────────────────────────────────────────────────────────────
// task.parent_id — человеческая декомпозиция «эпик → подзадачи» любой глубины.
// Не путать с подзадачами конвейера (project_task_subtask) в блоке «Конвейер агентов»:
// те принадлежат плану менеджера и живут внутри одной задачи.
const TREE_KEY = 'taskTreeCollapsed';
let _collapsed = new Set();
let _newTaskParentId = null;

function treeCollapsedLoad() {
    try { _collapsed = new Set(JSON.parse(localStorage.getItem(TREE_KEY)) || []); }
    catch(e) { _collapsed = new Set(); }
}

function toggleCollapse(id) {
    if (_collapsed.has(id)) _collapsed.delete(id); else _collapsed.add(id);
    localStorage.setItem(TREE_KEY, JSON.stringify([..._collapsed]));
    renderTable();
}

// Подошла ли задача под поиск и фильтр статуса.
function taskMatches(t) {
    if (_statusFilter && t.status !== _statusFilter) return false;
    const q = (document.getElementById('taskSearch')?.value || '').trim().toLowerCase();
    if (!q) return true;
    return [t.title, t.description, t.report]
        .some(v => String(v || '').toLowerCase().includes(q));
}

function taskCompare(a, b) {
    const oa = STATUS_ORDER[a.status] ?? 99;
    const ob = STATUS_ORDER[b.status] ?? 99;
    if (oa !== ob) return oa - ob;
    return new Date(b.created_at) - new Date(a.created_at);
}

// Все потомки задачи. Нужны и для удаления (БД каскадит), и чтобы не дать
// перенести задачу внутрь собственной ветки.
function treeDescendants(id) {
    const out = new Set();
    const stack = [id];
    while (stack.length) {
        const cur = stack.pop();
        _tasks.forEach(x => {
            if (x.parent_id === cur && !out.has(x.id)) { out.add(x.id); stack.push(x.id); }
        });
    }
    return out;
}

// Порядок отрисовки: родитель, сразу за ним его ветка, и так вниз.
// Возвращает [{t, num, depth, hasKids, kidsTotal, kidsDone, ghost, isLast, rails}].
function treeRows() {
    const ids      = new Set(_tasks.map(t => t.id));
    const byParent = new Map();
    const parentOf = new Map();

    _tasks.forEach(t => {
        // Родитель мог не попасть в выборку (другой проект) — тогда показываем
        // ветку как корневую, иначе задача исчезла бы из таблицы совсем.
        const p = (t.parent_id && ids.has(t.parent_id)) ? t.parent_id : null;
        parentOf.set(t.id, p);
        if (!byParent.has(p)) byParent.set(p, []);
        byParent.get(p).push(t);
    });

    // Подошедшие задачи тянут за собой предков: иначе ветка повисла бы без
    // родителя и было бы непонятно, к чему она относится.
    const hit  = new Set(_tasks.filter(taskMatches).map(t => t.id));
    const show = new Set();
    hit.forEach(id => {
        let cur = id;
        while (cur != null && !show.has(cur)) { show.add(cur); cur = parentOf.get(cur); }
    });

    const filtering = !!_statusFilter || !!(document.getElementById('taskSearch')?.value || '').trim();
    const out = [];

    // Сводка подзадач: для каждой родительской задачи — собираем детей с полными полями.
    const kidsFull = new Map();
    _tasks.forEach(t => {
        if (!t.parent_id) return;
        const p = t.parent_id;
        if (!kidsFull.has(p)) kidsFull.set(p, []);
        kidsFull.get(p).push(t);
    });

    const walk = (parentId, depth, rails, prefix) => {
        // Нумеруем по полному списку соседей, а показываем отфильтрованный: иначе
        // под фильтром «2.5» превратилась бы в «2.1» и назвать задачу номером
        // в разговоре было бы нельзя — он зависел бы от того, что набрано в поиске.
        const siblings = (byParent.get(parentId) || []).slice().sort(taskCompare);
        const numOf    = new Map(siblings.map((x, idx) => [x.id, idx + 1]));
        const list     = siblings.filter(t => show.has(t.id));
        list.forEach((t, i) => {
            const kidsAll = byParent.get(t.id) || [];
            const isLast  = i === list.length - 1;
            const num     = prefix + numOf.get(t.id);
            const kidsObj = kidsFull.has(t.id) ? kidsFull.get(t.id) : [];
            out.push({
                t, num, depth, rails, isLast,
                hasKids:   kidsAll.length > 0,
                // Пока идёт фильтр, сворачивать нечего: ветка и так показана не
                // целиком, а каретка обещала бы действие, которого не будет.
                expandable: !filtering && kidsAll.length > 0,
                kidsTotal: kidsAll.length,
                kidsDone:  kidsAll.filter(k => k.status === 'done').length,
                kidsFull:  kidsObj,
                ghost:     !hit.has(t.id),
            });
            // При активном фильтре свёрнутость игнорируем — иначе найденное
            // спряталось бы внутри свёрнутого родителя и поиск бы врал.
            const collapsed = !filtering && _collapsed.has(t.id);
            if (!collapsed && kidsAll.some(k => show.has(k.id))) walk(t.id, depth + 1, rails.concat(isLast), num + '.');
        });
    };
    walk(null, 0, [], '');

    return out;
}

function renderChips() {
    const counts = {};
    _tasks.forEach(t => { counts[t.status] = (counts[t.status] || 0) + 1; });
    const chips = [`<button class="task-chip${_statusFilter ? '' : ' active'}" onclick="setStatusFilter('')">Все <span class="chip-n">${_tasks.length}</span></button>`];
    Object.keys(STATUS_ORDER)
        .filter(s => counts[s])
        .forEach(s => chips.push(
            `<button class="task-chip${_statusFilter === s ? ' active' : ''}" onclick="setStatusFilter('${s}')">${STATUS_LABELS[s]} <span class="chip-n">${counts[s]}</span></button>`));
    document.getElementById('taskChips').innerHTML = chips.join('');
}

function setStatusFilter(status) {
    _statusFilter = _statusFilter === status ? '' : status;
    renderTable();
}

function renderTable() {
    const wrap = document.getElementById('taskTableWrap');
    renderChips();

    const rows = treeRows();
    // В счётчике только реально подошедшие: предки-контейнеры показаны как
    // контекст и раздували бы число найденного.
    document.getElementById('taskCountBadge').textContent = rows.filter(r => !r.ghost).length;

    if (!_tasks.length) {
        wrap.innerHTML = '<div class="task-placeholder"><span class="task-placeholder-icon">✅</span>Нет задач — нажмите «+ Добавить»</div>';
        return;
    }
    if (!rows.length) {
        wrap.innerHTML = '<div class="task-placeholder"><span class="task-placeholder-icon">🔍</span>Ничего не найдено</div>';
        return;
    }

    // Есть ли родительские задачи среди отфильтрованных (не ghost).
    const hasParent = rows.some(r => r.hasKids && !r.ghost);
    wrap.innerHTML = `
        <table class="task-table">
            <thead>
                <tr>
                    <th data-col="id">ID</th>
                    ${hasParent ? '' : '<th data-col="status">Статус</th>'}
                    <th data-col="title">Название</th>
                    <th data-col="desc">Описание</th>
                    <th data-col="goals">${hasParent ? 'Прогресс' : 'Цели'}</th>
                    <th data-col="date">Создана</th>
                    <th data-col="act" style="text-align:right">Действия</th>
                </tr>
            </thead>
            <tbody id="taskTbody">
                ${rows.map((r, i) => renderRow(r, i, hasParent)).join('')}
            </tbody>
        </table>`;
    colOrderApply(colOrderLoad());
    colResizersInit();
    colDragInit();
}

function rowStatusBtn(t) {
    const s = t.status;
    const hasActive = _tasks.some(x => x.id !== t.id && x.status === 'active');
    if (s === 'pending' || s === 'blocked') {
        const startBtn = hasActive
            ? `<button class="btn-status-action queue" onclick="event.stopPropagation();quickStatus(${t.id},'queued')" title="В очередь">🕐 В очередь</button>`
            : `<button class="btn-status-action start" onclick="event.stopPropagation();quickStatus(${t.id},'active')" title="Запустить">▶ Запустить</button>`;
        return startBtn;
    }
    if (s === 'queued') {
        const startBtn = hasActive
            ? ''
            : `<button class="btn-status-action start" onclick="event.stopPropagation();quickStatus(${t.id},'active')" title="Запустить">▶ Запустить</button>`;
        return startBtn +
            ` <button class="btn-status-action stop" onclick="event.stopPropagation();quickStatus(${t.id},'pending')" title="Снять с очереди">✕ Очередь</button>`;
    }
    if (s === 'active')
        return `<button class="btn-status-action stop" onclick="event.stopPropagation();quickStatus(${t.id},'pending')" title="Остановить">⏸ Стоп</button>` +
               ` <button class="btn-status-action finish" onclick="event.stopPropagation();quickStatus(${t.id},'done')" title="Завершить">✓</button>`;
    if (s === 'done')
        return `<button class="btn-status-action start" onclick="event.stopPropagation();quickStatus(${t.id},'pending')" title="Вернуть">↩ Вернуть</button>`;
    return '';
}

function renderInlineGoals(t, statusOverride, hasKids) {
    const status = statusOverride || t.status;
    const label = STATUS_LABELS[status] || status;
    const tagCls = (
        status === 'active' ? 'stt-active' :
        status === 'queued' ? 'stt-queued' :
        status === 'pending' ? 'stt-pending' :
        status === 'blocked' ? 'stt-blocked' :
        status === 'cancelled' ? 'stt-cancelled' :
        status === 'done' ? 'stt-done' : 'stt-more'
    );
    const isLeaf = !hasKids; // root task without children
    const goals = parseGoals(t.goals);
    if (!goals.length) return `<div class="ig-goals-wrapper"><span class="subtask-status-tag ${tagCls}" title="${label}">${label}</span><span class="ig-goals-empty">—</span></div>`;
    let html = `<div class="ig-goals-wrapper"><span class="subtask-status-tag ${tagCls}" title="${label}">${label}</span>`;
    if (!isLeaf) {
        // root task with children — show goals progress bar
        const done = goals.filter(g => g.done).length;
        const pct = Math.round(done * 100 / goals.length);
        html += `
            <div class="inline-goals-progress">
                <span>${done}/${goals.length}</span>
                <span class="inline-goals-bar"><i style="width:${pct}%"></i></span>
            </div>`;
    }
    const items = goals.map((g, i) => `
        <div class="inline-goal-item" id="ig-${t.id}-${i}">
            <input type="checkbox" ${g.done ? 'checked' : ''} onclick="event.stopPropagation();inlineToggleGoal(${t.id},${i})">
            <span class="inline-goal-text${g.done ? ' inline-goal-done' : ''}" id="igt-${t.id}-${i}">${esc(g.text)}</span>
            <button class="ig-btn" onclick="event.stopPropagation();inlineEditGoal(${t.id},${i})" title="Редактировать">✏</button>
            <button class="ig-btn del" onclick="event.stopPropagation();inlineDeleteGoal(${t.id},${i})" title="Удалить">✕</button>
        </div>`).join('');
    return html + items + '</div>';
}

// Сводка подзадач для родительской задачи: прогресс-бар + счётчик по статусам.
function renderSubtaskSummary(row) {
    const kids = row.kidsFull || [];
    if (!kids.length) {
        return '<span class="ig-goals-empty">Нет подзадач</span>';
    }
    const done = kids.filter(s => s.status === 'done').length;
    const pct = Math.round(done * 100 / kids.length);

    // Прогресс-бар.
    let html = `
        <div class="subtask-progress-row">
            <span>${done}/${row.kidsTotal}</span>
            <span class="subtask-progress-bar"><i style="width:${pct}%"></i></span>
        </div>`;

    // Счётчик по статусам.
    const counts = {};
    kids.forEach(s => { counts[s.status] = (counts[s.status] || 0) + 1; });
    const clsMap = { active: 'stt-active', queued: 'stt-queued', pending: 'stt-pending', blocked: 'stt-blocked', cancelled: 'stt-cancelled', done: 'stt-done' };
    const statusTags = Object.entries(counts)
        .sort((a, b) => (STATUS_ORDER[b[0]] ?? 99) - (STATUS_ORDER[a[0]] ?? 99))
        .map(([status, count]) => {
            const tagCls = clsMap[status] || 'stt-more';
            return `<span class="subtask-status-tag ${tagCls}" title="${STATUS_LABELS[status] || status}">${STATUS_LABELS[status] || status}: ${count}</span>`;
        }).join('');

    html += `<div class="subtask-status-row">${statusTags}</div>`;
    return html;
}

// Отступ ветки: направляющие предков плюс «локоть» самой строки. У предка,
// который ещё не последний среди своих, линия продолжается вниз — иначе ветка
// выглядит оборванной.
// Отступ строки: слоты 0..depth-2 — вертикальные линии предков, слот depth-1 —
// уголок к родителю. В слоте j идёт линия предка глубины j+1 (его собственный
// уголок стоит в слоте j), поэтому срез начинается с единицы, а не с нуля:
// rails[0] описывает корневого предка, чья линия ниже уже не рисуется.
function treeIndent(row) {
    if (!row.depth) return '';
    const rails = row.rails.slice(1, row.depth)
        .map(wasLast => `<span class="tree-rail${wasLast ? ' tree-rail-blank' : ''}"></span>`).join('');
    return `${rails}<span class="tree-elbow${row.isLast ? ' tree-elbow-last' : ''}"></span>`;
}

// Каретка сворачивания. У бездетных на её месте распорка, иначе названия
// «прыгали» бы по горизонтали от строки к строке.
function treeCaret(row) {
    if (!row.expandable) return '<span class="tree-caret-gap"></span>';
    const isCollapsed = _collapsed.has(row.t.id);
    return `<button class="tree-caret${isCollapsed ? ' collapsed' : ''}"
                    onclick="event.stopPropagation();toggleCollapse(${row.t.id})"
                    title="${isCollapsed ? 'Развернуть' : 'Свернуть'} подзадачи">▾</button>`;
}

// Фон строки: столбец — глубина вложенности, строка — чётность в списке.
// Подзадачи уходят в тёплый песочный, поэтому ветка видна как блок даже когда
// линии дерева обрезаны, а чередование внутри ступени не даёт слиться двум
// соседям подряд. Тон намеренно тёплый: синий спорил бы с индиговой подсветкой
// раскрытой строки и с цветными бейджами статусов.
const ROW_BG = [
    ['#ffffff', '#fbf9f5'],   // корневые задачи
    ['#f7f3ea', '#f2ede1'],   // подзадачи
    ['#ece5d6', '#e7dfcd'],   // третий уровень и глубже
];

function rowBg(row, index) {
    return ROW_BG[Math.min(row.depth, ROW_BG.length - 1)][index % 2];
}

function renderRow(row, index, hasParent) {
    const t = row.t;
    const badge = `<span class="task-status-badge status-${t.status}">${STATUS_LABELS[t.status] || t.status}</span>`;
    const dateStr = t.created_at ? t.created_at.substring(0, 10) : '';
    const kidsPill = row.hasKids
        ? `<span class="tree-kids${row.kidsDone === row.kidsTotal ? ' tree-kids-done' : ''}"
                 title="Выполнено подзадач">${row.kidsDone}/${row.kidsTotal}</span>`
        : '';
    const cls = ['task-row'];
    if (row.depth) cls.push('tree-child');
    if (row.ghost) cls.push('tree-ghost');
    return `
        <tr class="${cls.join(' ')}" id="tr-${t.id}" style="--row-accent:${STATUS_ACCENT[t.status] || 'transparent'};--row-bg:${rowBg(row, index)}" onclick="toggleEdit(${t.id})" title="Нажмите, чтобы редактировать">
            <td class="td-id" data-col="id">#${t.id}</td>
            ${hasParent ? '' : `<td class="td-status" data-col="status">${badge}${renderPipeChip(t, row)}</td>`}
            <td class="td-title" data-col="title">
                <div class="tree-title">${treeIndent(row)}${treeCaret(row)}<span class="tree-num">${row.num}</span><span class="tree-name">${esc(t.title)}${kidsPill}<button class="btn-row-sub" onclick="event.stopPropagation();subtaskAdd(${t.id})" title="Добавить подзадачу">＋</button></span></div>
            </td>
            <td class="td-desc" data-col="desc"><div class="task-desc-preview">${esc(t.description)}</div></td>
            <td class="td-goals" data-col="goals" onclick="event.stopPropagation()">${row.hasKids ? renderSubtaskSummary(row) : renderInlineGoals(t, undefined, false)}</td>
            <td class="td-date" data-col="date">${dateStr}</td>
            <td class="td-act" data-col="act">
                ${rowStatusBtn(t)}
                <button class="btn-row-del" onclick="event.stopPropagation();deleteTask(${t.id})" title="Удалить">✕</button>
            </td>
        </tr>
        <tr class="task-edit-row" id="ter-${t.id}">
            <td class="task-edit-cell" colspan="7">
                <div class="task-edit-grid">
                    <div class="form-group">
                        <label>Название</label>
                        <input id="tt-${t.id}" value="${esc(t.title)}">
                    </div>
                    <div class="form-group">
                        <label>Статус</label>
                        <select id="ts-${t.id}">${statusOptions(t.status)}</select>
                    </div>
                    <div class="form-group span2">
                        <label>Родительская задача <span class="plan-hint">— перенос по дереву</span></label>
                        <select id="tp-${t.id}">${parentOptions(t)}</select>
                    </div>
                    <div class="form-group span2">
                        <label>Описание</label>
                        <div class="edit-desc-wrap">
                            <button class="edit-mic-btn task-mic-btn" id="editMicBtn-${t.id}" onclick="event.stopPropagation();_voice.editToggle(${t.id})" title="Голосовой ввод">🎤</button>
                            <textarea id="td-${t.id}">${esc(t.description)}</textarea>
                        </div>
                    </div>
                    <div class="form-group span2" style="${row.hasKids ? 'display:none' : ''}">
                        <div class="task-plan-header">
                            <label>План <span class="plan-hint">— его пишет менеджер по описанию задачи</span></label>
                            <div class="task-rev-chips" id="revs-${t.id}"></div>
                        </div>
                        <textarea id="tplan-${t.id}" class="task-plan-input" placeholder="Плана пока нет — менеджер составит его на ближайшем тике конвейера">${esc(parsePlanText(t.pipeline_plan))}</textarea>
                        <div class="task-rev-preview" id="revprev-${t.id}" style="display:none"></div>
                    </div>
                    <div class="task-goals-section" style="${row.hasKids ? 'display:none' : ''}">
                        <div class="task-goals-header">
                            <span>Цели</span>
                            <button class="btn-add-goal" onclick="addGoal(${t.id})">+ Добавить цель</button>
                        </div>
                        <div class="task-goals-list" id="goals-${t.id}"></div>
                    </div>
                    <div class="task-pipeline-section">
                        <div class="task-pipeline-header">
                            <span>Конвейер агентов</span>
                            <span id="pipe-actions-${t.id}" style="display:flex;gap:6px"></span>
                        </div>
                        <div class="task-pipeline-body" id="pipe-body-${t.id}">
                            <span class="task-pipeline-muted">Загрузка...</span>
                        </div>
                    </div>
                    <div class="form-group span2">
                        <label>Отчёт о выполненных работах</label>
                        <textarea id="trep-${t.id}" style="min-height:80px">${esc(t.report)}</textarea>
                    </div>
                </div>
                <div class="task-edit-actions">
                    <button class="btn-del" onclick="deleteTask(${t.id})">Удалить</button>
                    <button class="btn-cancel" onclick="toggleEdit(${t.id})">Отмена</button>
                    <button class="btn-save" onclick="saveTask(${t.id})">Сохранить</button>
                </div>
            </td>
        </tr>`;
}

const STATUS_ACCENT = {
    active:    '#22c55e',
    queued:    '#f59e0b',
    pending:   '#cbd5e1',
    blocked:   '#ef4444',
    cancelled: '#e2e8f0',
    done:      '#38bdf8',
};

function statusOptions(selected) {
    return Object.entries(STATUS_LABELS).map(([v, l]) =>
        `<option value="${v}"${v === selected ? ' selected' : ''}>${l}</option>`
    ).join('');
}

// Кого можно назначить родителем. Себя и свою же ветку исключаем — сервер такой
// перенос всё равно отвергнет, но показывать заведомо нерабочий вариант незачем.
// Кандидаты в родители. Плоский список из полусотни строк выбирать неудобно,
// поэтому идём в том же порядке, что и таблица, с отступом по глубине.
// Сама задача и её ветка исключены — иначе получился бы цикл, и сервер всё
// равно ответил бы отказом.
function parentOptions(t) {
    const banned = treeDescendants(t.id);
    banned.add(t.id);
    const opts = [`<option value=""${t.parent_id ? '' : ' selected'}>— корневая задача —</option>`];
    const walk = (parentId, depth) => {
        _tasks
            .filter(x => (x.parent_id || null) === parentId && x.project_id === t.project_id)
            .sort(taskCompare)
            .forEach(x => {
                if (banned.has(x.id)) return;  // ветку целиком, вместе с потомками
                opts.push(`<option value="${x.id}"${x.id === t.parent_id ? ' selected' : ''}>`
                    + `${'  '.repeat(depth)}${depth ? '└ ' : ''}#${x.id} ${esc(x.title)}</option>`);
                walk(x.id, depth + 1);
            });
    };
    walk(null, 0);
    return opts.join('');
}

function toggleEdit(id) {
    const row = document.getElementById(`ter-${id}`);
    const tr  = document.getElementById(`tr-${id}`);
    const isOpen = row.classList.contains('open');
    document.querySelectorAll('.task-edit-row.open').forEach(r => r.classList.remove('open'));
    document.querySelectorAll('.task-table tbody tr.expanded').forEach(r => r.classList.remove('expanded'));
    if (!isOpen) {
        row.classList.add('open');
        tr.classList.add('expanded');
        const task = _tasks.find(t => t.id === id);
        if (task) { _goalsCache[id] = parseGoals(task.goals); renderGoals(id); }
        // Строка перерисовывается с нуля, а вместе с ней и поля плана — просмотр
        // ревизии из прошлого раскрытия сбрасываем, иначе он останется только в стейте.
        _revPreview[id] = null;
        _revPlanStash[id] = null;
        pipelineLoad(id);
        revisionsLoad(id);
    }
}

function toggleAddForm() {
    const form = document.getElementById('taskAddForm');
    form.classList.toggle('open');
    if (form.classList.contains('open')) {
        document.getElementById('newTaskTitle').focus();
    } else {
        _aiPendingGoals = null;
        _newTaskParentId = null;
        addParentBannerRender();
        const prev = document.getElementById('aiGoalsPreview');
        if (prev) prev.remove();
    }
}

// «＋» в строке открывает ту же форму добавления, только с привязкой к родителю:
// так подзадача получает и голосовой ввод, и ИИ-помощника, без второй формы.
function subtaskAdd(parentId) {
    _newTaskParentId = parentId;
    document.getElementById('taskAddForm').classList.add('open');
    addParentBannerRender();
    document.getElementById('newTaskTitle').focus();
}

function subtaskAddCancel() {
    _newTaskParentId = null;
    addParentBannerRender();
}

function addParentBannerRender() {
    const el = document.getElementById('addParentBanner');
    if (!el) return;
    const parent = _tasks.find(t => t.id === _newTaskParentId);
    if (!parent) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'flex';
    el.innerHTML = `
        <span class="ap-label">Подзадача к</span>
        <span class="ap-task" title="${esc(parent.title)}">#${parent.id} ${esc(parent.title)}</span>
        <button class="ap-clear" onclick="subtaskAddCancel()" title="Создать как обычную задачу">✕</button>`;
}

async function createTask() {
    if (!_taskProjectId) { alert('Выберите проект'); return; }
    const title = document.getElementById('newTaskTitle').value.trim();
    if (!title) { alert('Введите название'); return; }
    try {
        const data = await taskFetch(`/tasks/${_taskProjectId}`, {
            method: 'POST',
            body: JSON.stringify({
                title,
                description: document.getElementById('newTaskDesc').value,
                status: document.getElementById('newTaskStatus').value,
                parent_id: _newTaskParentId,
            }),
        });
        // Родитель мог быть свёрнут — иначе новая подзадача «не появилась бы».
        if (_newTaskParentId) _collapsed.delete(_newTaskParentId);
        _newTaskParentId = null;
        addParentBannerRender();
        // Apply AI-generated goals if any
        if (_aiPendingGoals?.length) {
            await taskFetch(`/task/${data.task.id}`, {
                method: 'PUT',
                body: JSON.stringify({ goals: JSON.stringify(_aiPendingGoals) }),
            });
            data.task.goals = JSON.stringify(_aiPendingGoals);
            _aiPendingGoals = null;
        }
        _tasks.push(data.task);
        document.getElementById('newTaskTitle').value = '';
        document.getElementById('newTaskDesc').value = '';
        document.getElementById('newTaskStatus').value = 'pending';
        const prev = document.getElementById('aiGoalsPreview');
        if (prev) prev.remove();
        document.getElementById('taskAddForm').classList.remove('open');
        renderTable();
    } catch(e) { alert('Ошибка создания'); }
}

async function saveTask(id) {
    try {
        const data = await taskFetch(`/task/${id}`, {
            method: 'PUT',
            body: JSON.stringify({
                title:       document.getElementById(`tt-${id}`).value,
                description: document.getElementById(`td-${id}`).value,
                plan_text:   document.getElementById(`tplan-${id}`).value,
                goals:       JSON.stringify(_goalsCache[id] || []),
                status:      document.getElementById(`ts-${id}`).value,
                report:      document.getElementById(`trep-${id}`).value,
                parent_id:   document.getElementById(`tp-${id}`).value || null,
            }),
        });
        const idx = _tasks.findIndex(t => t.id === id);
        if (idx !== -1) _tasks[idx] = data.task;
        const wasOpen = document.getElementById(`ter-${id}`)?.classList.contains('open');
        renderTable();
        // Правка плана могла добавить ревизию — строку открываем заново, чтобы новый
        // чипс появился сразу, а не после ручного раскрытия.
        if (wasOpen) toggleEdit(id);
    } catch(e) { alert(e.message || 'Ошибка сохранения'); }
}

async function quickStatus(id, status) {
    try {
        const data = await taskFetch(`/task/${id}`, {
            method: 'PUT',
            body: JSON.stringify({ status }),
        });
        const idx = _tasks.findIndex(t => t.id === id);
        if (idx !== -1) _tasks[idx] = data.task;
        renderTable();
    } catch(e) { alert('Ошибка смены статуса'); }
}

async function deleteTask(id) {
    // В БД у parent_id стоит ON DELETE CASCADE — вся ветка уйдёт вместе с
    // родителем. Молча такое делать нельзя, поэтому считаем потомков заранее.
    const kids = treeDescendants(id);
    const msg = kids.size
        ? `Удалить задачу вместе с подзадачами? Будет удалено ещё ${kids.size} шт. Это необратимо.`
        : 'Удалить задачу?';
    if (!confirm(msg)) return;
    try {
        await taskFetch(`/task/${id}`, { method: 'DELETE' });
        _tasks = _tasks.filter(t => t.id !== id && !kids.has(t.id));
        renderTable();
    } catch(e) { alert('Ошибка удаления'); }
}

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── План ──
// В task.pipeline_plan лежит JSON {plan_text, subtasks}; форме нужен только текст.
function parsePlanText(raw) {
    if (!raw) return '';
    try {
        const v = JSON.parse(raw);
        return v && typeof v === 'object' ? String(v.plan_text || '') : '';
    } catch(e) { return ''; }
}

// ── Goals ──
const _goalsCache = {};

function parseGoals(str) {
    if (!str) return [];
    try {
        const v = JSON.parse(str);
        if (Array.isArray(v)) return v.map(g => typeof g === 'string' ? {text: g, done: false} : g);
        if (v && Array.isArray(v.goals)) return v.goals.map(g => typeof g === 'string' ? {text: g, done: false} : g);
    } catch(e) {}
    return [];
}

// `goals` передаётся только при просмотре ревизии: рисуем чужой список, не трогая
// `_goalsCache` — иначе заглянуть в историю значило бы потерять несохранённые правки целей.
function renderGoals(taskId, goals = null, readonly = false) {
    const el = document.getElementById(`goals-${taskId}`);
    if (!el) return;
    const list = goals !== null ? goals : (_goalsCache[taskId] || []);
    if (!list.length) {
        el.innerHTML = readonly
            ? '<div class="task-goals-empty">В этой ревизии целей не было</div>'
            : '<div class="task-goals-empty">Нет целей — нажмите «+ Добавить цель»</div>';
        return;
    }
    if (readonly) {
        el.innerHTML = list.map(g => `
            <div class="task-goal-item">
                <input type="checkbox" ${g.done ? 'checked' : ''} disabled>
                <span class="task-goal-text${g.done ? ' done' : ''}">${esc(g.text)}</span>
            </div>`).join('');
        return;
    }
    el.innerHTML = list.map((g, i) => `
        <div class="task-goal-item" id="gi-${taskId}-${i}">
            <input type="checkbox" ${g.done ? 'checked' : ''} onchange="toggleGoalDone(${taskId},${i})">
            <span class="task-goal-text${g.done ? ' done' : ''}" id="gt-${taskId}-${i}" onclick="startEditGoal(${taskId},${i})">${esc(g.text)}</span>
            <button class="btn-goal-icon del" onclick="deleteGoal(${taskId},${i})" title="Удалить">✕</button>
        </div>`).join('');
}

function startEditGoal(taskId, idx) {
    const item = document.getElementById(`gi-${taskId}-${idx}`);
    if (!item) return;
    if (item.querySelector('.task-goal-input')) return; // already editing
    const g = (_goalsCache[taskId] || [])[idx];
    if (!g) return;
    const span = item.querySelector(`#gt-${taskId}-${idx}`);
    span.outerHTML = `<input class="task-goal-input" id="gi-input-${taskId}-${idx}" value="${esc(g.text)}"
        onkeydown="if(event.key==='Enter'){this.blur();}if(event.key==='Escape')renderGoals(${taskId})"
        onblur="saveGoalText(${taskId},${idx})">`;
    document.getElementById(`gi-input-${taskId}-${idx}`)?.focus();
}

function saveGoalText(taskId, idx) {
    const inp = document.getElementById(`gi-input-${taskId}-${idx}`);
    if (!inp) return;
    const text = inp.value.trim();
    if (!text) return;
    if (_goalsCache[taskId]) _goalsCache[taskId][idx].text = text;
    renderGoals(taskId);
    saveGoals(taskId);
}

function toggleGoalDone(taskId, idx) {
    const goals = _goalsCache[taskId];
    if (!goals || !goals[idx]) return;
    goals[idx].done = !goals[idx].done;
    renderGoals(taskId);
    saveGoals(taskId);
}

function deleteGoal(taskId, idx) {
    if (!_goalsCache[taskId]) return;
    _goalsCache[taskId].splice(idx, 1);
    renderGoals(taskId);
    saveGoals(taskId);
}

function addGoal(taskId) {
    if (!_goalsCache[taskId]) _goalsCache[taskId] = [];
    _goalsCache[taskId].push({ text: '', done: false });
    renderGoals(taskId);
    const lastIdx = _goalsCache[taskId].length - 1;
    startEditGoal(taskId, lastIdx);
}

async function saveGoals(taskId) {
    try {
        const data = await taskFetch(`/task/${taskId}`, {
            method: 'PUT',
            body: JSON.stringify({ goals: JSON.stringify(_goalsCache[taskId] || []) }),
        });
        const idx = _tasks.findIndex(t => t.id === taskId);
        if (idx !== -1) _tasks[idx].goals = data.task.goals;
    } catch(e) { console.error('saveGoals', e); }
}

// ── Inline goals (edited straight from the table row) ──
function inlineToggleGoal(taskId, idx) {
    const task = _tasks.find(t => t.id === taskId);
    if (!task) return;
    const goals = parseGoals(task.goals);
    if (!goals[idx]) return;
    goals[idx].done = !goals[idx].done;
    _goalsCache[taskId] = goals;
    saveGoals(taskId);
    task.goals = JSON.stringify(goals);
    _refreshInlineGoals(taskId);
}

function inlineDeleteGoal(taskId, idx) {
    const task = _tasks.find(t => t.id === taskId);
    if (!task) return;
    const goals = parseGoals(task.goals);
    goals.splice(idx, 1);
    _goalsCache[taskId] = goals;
    saveGoals(taskId);
    task.goals = JSON.stringify(goals);
    _refreshInlineGoals(taskId);
}

function inlineEditGoal(taskId, idx) {
    const span = document.getElementById(`igt-${taskId}-${idx}`);
    if (!span) return;
    const task = _tasks.find(t => t.id === taskId);
    const g = parseGoals(task?.goals)[idx];
    if (!g) return;
    span.outerHTML = `<input class="inline-goal-input" id="igi-${taskId}-${idx}" value="${esc(g.text)}"
        onclick="event.stopPropagation()"
        onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')_refreshInlineGoals(${taskId})"
        onblur="inlineSaveGoalText(${taskId},${idx})">`;
    document.getElementById(`igi-${taskId}-${idx}`)?.focus();
}

function inlineSaveGoalText(taskId, idx) {
    const inp = document.getElementById(`igi-${taskId}-${idx}`);
    if (!inp) return;
    const text = inp.value.trim();
    const task = _tasks.find(t => t.id === taskId);
    if (!text || !task) { _refreshInlineGoals(taskId); return; }
    const goals = parseGoals(task.goals);
    if (!goals[idx]) return;
    goals[idx].text = text;
    _goalsCache[taskId] = goals;
    saveGoals(taskId);
    task.goals = JSON.stringify(goals);
    _refreshInlineGoals(taskId);
}

function _refreshInlineGoals(taskId) {
    const task = _tasks.find(t => t.id === taskId);
    const cell = document.querySelector(`#tr-${taskId} [data-col="goals"]`);
    if (task && cell) cell.innerHTML = renderInlineGoals(task);
}

// ── Ревизии плана ──
// План перезаписывается на месте, поэтому каждая его запись — менеджером или человеком —
// оставляет строку в истории. Самая свежая ревизия и есть текущий план: отдельного чипса
// под неё не рисуем, иначе верхняя версия показалась бы дважды.
const _revisionsCache = {};   // taskId -> {revisions, total}
const _revPreview     = {};   // taskId -> номер просматриваемой ревизии либо null
const _revPlanStash   = {};   // taskId -> текст плана, вытесненный просмотром

async function revisionsLoad(taskId, limit) {
    const el = document.getElementById(`revs-${taskId}`);
    if (!el) return;
    try {
        _revisionsCache[taskId] = await taskFetch(`/task/${taskId}/plan/revisions${limit ? `?limit=${limit}` : ''}`);
    } catch(e) {
        el.innerHTML = '';
        return;
    }
    _revisionsRender(taskId);
}

function revisionShow(taskId, n) {
    const rev = (_revisionsCache[taskId]?.revisions || []).find(r => r.n === n);
    if (!rev) return;
    const planEl = document.getElementById(`tplan-${taskId}`);
    // Живой текст прячем при входе в просмотр, а не при выходе: иначе несохранённая
    // правка плана исчезла бы вместе с первым же кликом по чипсу.
    if (_revPreview[taskId] == null && planEl) _revPlanStash[taskId] = planEl.value;
    _revPreview[taskId] = n;
    _revPreviewSet(taskId, rev);
    _revisionsRender(taskId);
}

function revisionCurrent(taskId) {
    if (_revPreview[taskId] == null) return;
    _revPreview[taskId] = null;
    _revPreviewSet(taskId, null);
    _revisionsRender(taskId);
}

async function revisionRestore(taskId, n) {
    if (!confirm(`Восстановить план из ревизии ${n}? Текущая версия останется в истории.`)) return;
    try {
        await taskFetch(`/task/${taskId}/plan/revision/${n}/restore`, { method: 'POST' });
    } catch(e) {
        alert(e.message || 'Не удалось восстановить ревизию');
        return;
    }
    _revPreview[taskId] = null;
    _revPlanStash[taskId] = null;
    // `loadTasks` пересобирает таблицу и закрывает строку — открываем заново, чтобы
    // человек увидел восстановленный план там же, где нажал кнопку.
    await loadTasks();
    toggleEdit(taskId);
}

function _revisionsRender(taskId) {
    const el = document.getElementById(`revs-${taskId}`);
    if (!el) return;
    const data = _revisionsCache[taskId] || { revisions: [], total: 0 };
    const revs = data.revisions || [];
    if (!revs.length) { el.innerHTML = ''; return; }

    const cur = _revPreview[taskId] ?? null;
    let html = `<button class="task-chip task-rev-chip${cur === null ? ' active' : ''}"`
             + ` title="${esc(_revisionTitle(revs[0]))}" onclick="revisionCurrent(${taskId})">Текущая</button>`;
    html += revs.slice(1).map(r =>
        `<button class="task-chip task-rev-chip${cur === r.n ? ' active' : ''}"`
        + ` title="${esc(_revisionTitle(r))}" onclick="revisionShow(${taskId},${r.n})">`
        + `Ревизия ${r.n} · ${esc(_revisionTime(r))}</button>`).join('');

    const rest = (data.total || 0) - revs.length;
    if (rest > 0) {
        html += `<button class="task-chip task-rev-chip" onclick="revisionsLoad(${taskId},500)"`
              + ` title="Показать историю целиком">…ещё ${rest}</button>`;
    }
    el.innerHTML = html;
}

// `rev === null` — возврат к живым данным: план из стеша, цели из `_goalsCache`, где
// несохранённые правки человека всё это время и лежали.
function _revPreviewSet(taskId, rev) {
    const planEl = document.getElementById(`tplan-${taskId}`);
    const badge  = document.getElementById(`revprev-${taskId}`);
    const addBtn = document.querySelector(`#ter-${taskId} .btn-add-goal`);
    const saveBtn = document.querySelector(`#ter-${taskId} .btn-save`);

    if (planEl) {
        planEl.value = rev ? rev.plan_text : (_revPlanStash[taskId] ?? planEl.value);
        planEl.readOnly = !!rev;
    }
    renderGoals(taskId, rev ? rev.goals : null, !!rev);

    if (badge) {
        badge.style.display = rev ? 'flex' : 'none';
        badge.innerHTML = rev
            ? `<span>Просмотр ревизии ${rev.n} — ${esc(_revisionAuthor(rev))}, ${esc(window.fmtTz(rev.created_at))}.`
              + ` Поля только для чтения.</span>`
              + `<button class="btn-pipe primary" onclick="revisionRestore(${taskId},${rev.n})">Восстановить</button>`
            : '';
    }
    if (addBtn)  addBtn.disabled  = !!rev;
    if (saveBtn) saveBtn.disabled = !!rev;
}

function _revisionAuthor(rev) {
    return rev.author_kind === 'manager' ? 'менеджер' : (rev.author_name || 'пользователь');
}

function _revisionTitle(rev) {
    return `Ревизия ${rev.n} · ${_revisionAuthor(rev)} · ${window.fmtTz(rev.created_at)}`;
}

// В чипсе только время, если ревизия сегодняшняя: полная дата в узкой строке заголовка
// съедает место, а точное значение всё равно есть в подсказке.
function _revisionTime(rev) {
    const s = window.fmtTz(rev.created_at);
    const today = window.fmtTz(new Date().toISOString());
    return s.slice(0, 10) === today.slice(0, 10) ? s.slice(11) : s.slice(5, 10).replace('-', '.');
}

// ── Конвейер агентов ──
// Отдельная ось от `status`: та — ручной kanban, эта — стадия автоматики.
const PIPELINE_LABELS = {
    new:              'Ожидает плана',
    planning:         'Планирование',
    pending_approval: 'На утверждении',
    review:           'На пересмотре',
    approved:         'Утверждён',
    split:            'Выполняется',
    done:             'Завершён',
    failed:           'Сбой',
};

const SUBTASK_LABELS = {
    planned:    'Запланирована',
    developing: 'Разработка',
    qa_pending: 'На проверке',
    failed_qa:  'Не прошла QA',
    done:       'Готово',
    blocked:    'Заблокирована',
};

function renderPipeChip(t, row) {
    if (!t.pipeline_state) {
        // План пишется только листьям: задача с подзадачами уже разложена ими, второй
        // раз её декомпозировать нечем. Без этой пометки ячейка у родителя пустая, и
        // намеренный пропуск выглядит как несработавший конвейер.
        if (!row || !row.hasKids) return '';
        return `<div><span class="pipe-chip pipe-decomposed" title="План составляется только для задач без подзадач — эта уже разложена на ${row.kidsTotal} ${_taskPluralSub(row.kidsTotal)}">Разложена</span></div>`;
    }
    const label = PIPELINE_LABELS[t.pipeline_state] || t.pipeline_state;
    return `<div><span class="pipe-chip pipe-${t.pipeline_state}">${label}</span></div>`;
}

async function pipelineLoad(taskId) {
    const body    = document.getElementById(`pipe-body-${taskId}`);
    const actions = document.getElementById(`pipe-actions-${taskId}`);
    if (!body) return;
    try {
        const data = await taskFetch(`/task/${taskId}/pipeline`);
        _pipelineRender(taskId, data, body, actions);
    } catch(e) {
        body.innerHTML = '<span class="task-pipeline-muted">Не удалось загрузить состояние конвейера</span>';
    }
}

async function pipelineAction(taskId, action) {
    const body = document.getElementById(`pipe-body-${taskId}`);
    const wasOpen = document.getElementById(`ter-${taskId}`)?.classList.contains('open');
    if (body) body.innerHTML = '<span class="task-pipeline-muted">Применяю...</span>';
    try {
        await taskFetch(`/task/${taskId}/pipeline/${action}`, { method: 'POST' });
    } catch(e) {
        // Отказ приходит с внятной причиной («план занят конвейером», «выполняются
        // подзадачи») — показываем её, а не общее «что-то пошло не так».
        alert(e.message || 'Не удалось выполнить действие — возможно, состояние уже изменилось');
    }
    // Состояние задачи изменилось на сервере: перечитываем список, чтобы чип в строке не врал.
    await loadTasks();
    // `renderTable` пересобирает таблицу и закрывает раскрытую строку — открываем её
    // заново, иначе панель конвейера исчезает прямо из-под курсора.
    if (wasOpen) toggleEdit(taskId);
}

async function planReview(taskId) {
    if (!confirm('Отправить план менеджеру на пересмотр?\n\n'
               + 'Менеджер сверит его с целями задачи и перепишет расхождения. Подзадачи '
               + 'текущего плана будут удалены, сам план останется в истории ревизий.')) return;
    await pipelineAction(taskId, 'review');
}

function _pipelineRender(taskId, data, body, actions) {
    const state = data.pipeline_state;
    // Родителя конвейер не берёт (см. task_claim_task_unplanned): его план — это его
    // же подзадачи. Кнопку «В конвейер» тут прятать обязательно, а не просто пояснять:
    // она проставила бы `new`, воркер задачу не подобрал бы, и она зависла бы в этом
    // состоянии навсегда.
    const kids = _tasks.filter(x => x.parent_id === taskId).length;

    // План мог появиться уже после отрисовки строки — подставим, пока поле не трогали.
    const planEl = document.getElementById(`tplan-${taskId}`);
    if (planEl && !planEl.value.trim() && data.plan_text) planEl.value = data.plan_text;

    if (actions) {
        let html;
        if (!state) {
            html = kids
                ? ''
                : `<button class="btn-pipe primary" onclick="pipelineAction(${taskId},'start')">▶ В конвейер</button>`;
        } else if (state === 'pending_approval') {
            html =
                `<button class="btn-pipe ok" onclick="pipelineAction(${taskId},'approve')">✓ Утвердить</button>` +
                `<button class="btn-pipe no" onclick="pipelineAction(${taskId},'reject')">✕ Отклонить</button>`;
        } else {
            html = `<span class="pipe-chip pipe-${state}">${PIPELINE_LABELS[state] || state}</span>`;
        }
        actions.innerHTML = html + _planReviewButton(taskId, state, data);
    }

    if (!state) {
        body.innerHTML = kids
            ? `<span class="task-pipeline-muted">Задача разложена на ${kids} ${_taskPluralSub(kids)} — план ей не пишется. Планы и агентов получают только задачи нижнего уровня; откройте подзадачу.</span>`
            : '<span class="task-pipeline-muted">Задача вне конвейера — агенты её не трогают.</span>';
        return;
    }

    // Текст плана не дублируем — он редактируется в поле «План» выше.
    let html = '';

    // Цели тут не повторяем: агент пишет их в те же самые цели задачи, которые блоком
    // выше уже показаны с чекбоксами. Дубль был полным — только удлинял раскрытую
    // строку и оставлял вопрос, какой из двух списков главный.
    const subtasks = data.subtasks || [];
    if (subtasks.length) {
        html += '<div class="pipe-section">Подзадачи</div>' + subtasks.map((s, i) => {
            const attempts = s.attempt_count ? `<span class="pipe-attempts">попыток: ${s.attempt_count}</span>` : '';
            const err = s.last_error ? `<div class="pipe-error">${esc(s.last_error)}</div>` : '';
            return `<div class="pipe-subtask">
                        <span class="pipe-subtask-pos">${i + 1}.</span>
                        <span class="pipe-subtask-title">${esc(s.title)}${err}</span>
                        ${attempts}
                        <span class="pipe-sub-state pipe-sub-${s.state}">${SUBTASK_LABELS[s.state] || s.state}</span>
                    </div>`;
        }).join('');
    } else if (state === 'pending_approval') {
        html += '<span class="task-pipeline-muted">План ждёт утверждения — подзадачи появятся после «Утвердить».</span>';
    } else if (!data.plan_text) {
        html += '<span class="task-pipeline-muted">Оркестратор ещё не дошёл до этой задачи.</span>';
    }

    if (data.error) html += `<div class="pipe-error">${esc(data.error)}</div>`;
    body.innerHTML = html;
}

// Почему кнопка заблокирована — по состояниям, в которых сервер откажет.
const PLAN_REVIEW_BLOCKED = {
    new:      'Задача ждёт первого планирования — пересматривать пока нечего',
    planning: 'Менеджер уже работает над планом',
    review:   'План уже отправлен на пересмотр — менеджер его ещё не взял',
    approved: 'План разложен на подзадачи и выполняется — пересмотр заблокирован',
    split:    'План разложен на подзадачи и выполняется — пересмотр заблокирован',
};

function _planReviewButton(taskId, state, data) {
    // Плана нет — первый пишется кнопкой «В конвейер», пересматривать нечего.
    if (!data.plan_text) return '';
    const blocked = PLAN_REVIEW_BLOCKED[state];
    if (!blocked) {
        return `<button class="btn-pipe" onclick="planReview(${taskId})"`
             + ` title="Отправить план менеджеру на пересмотр по текущим целям">↻ Обновить план</button>`;
    }
    // Подсказка висит на обёртке, а не на кнопке: у disabled-кнопки браузер `title`
    // не показывает, и объяснение блокировки было бы недоступно именно там, где нужно.
    return `<span class="pipe-btn-wrap" title="${esc(blocked)}">`
         + `<button class="btn-pipe" disabled>↻ Обновить план</button></span>`;
}

function _taskPluralSub(n) {
    // «1 подзадачу, 2 подзадачи, 5 подзадач» — писать «подзадач(и)» в интерфейсе,
    // который в остальном говорит по-человечески, не хочется.
    const d = n % 10, dd = n % 100;
    if (d === 1 && dd !== 11) return 'подзадачу';
    if (d >= 2 && d <= 4 && (dd < 12 || dd > 14)) return 'подзадачи';
    return 'подзадач';
}

// ── AI Task Generator ──
async function aiGenerateTask() {
    const desc = document.getElementById('newTaskDesc').value.trim();
    const title = document.getElementById('newTaskTitle').value.trim();
    const input = desc || title;
    if (!input) {
        alert('Введите название или описание задачи, чтобы ИИ мог её структурировать');
        document.getElementById('newTaskDesc').focus();
        return;
    }

    const btn = document.getElementById('btnAiGen');
    const icon = document.getElementById('aiGenIcon');
    const spinner = document.getElementById('aiGenSpinner');
    btn.disabled = true;
    icon.style.display = 'none';
    spinner.classList.add('active');

    try {
        const data = await taskFetch('/task/ai-generate', {
            method: 'POST',
            body: JSON.stringify({ description: input }),
        });
        if (data.title) document.getElementById('newTaskTitle').value = data.title;
        if (data.description) document.getElementById('newTaskDesc').value = data.description;
        if (data.goals?.length) {
            // store goals for the new task form (will be applied on createTask)
            _aiPendingGoals = data.goals;
            _showPendingGoalsPreview(data.goals);
        }
    } catch(e) {
        alert('ИИ не смог сгенерировать задачу. Попробуйте ещё раз.');
    } finally {
        btn.disabled = false;
        icon.style.display = '';
        spinner.classList.remove('active');
    }
}

let _aiPendingGoals = null;

function _showPendingGoalsPreview(goals) {
    let preview = document.getElementById('aiGoalsPreview');
    if (!preview) {
        preview = document.createElement('div');
        preview.id = 'aiGoalsPreview';
        preview.style.cssText = 'font-size:12px;color:#334155;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin-top:2px';
        const desc = document.getElementById('newTaskDesc');
        desc.parentNode.insertAdjacentElement('afterend', preview);
    }
    preview.innerHTML = '<div style="font-weight:700;color:#64748b;margin-bottom:5px;font-size:10px;text-transform:uppercase;letter-spacing:.05em">Цели (будут добавлены)</div>' +
        goals.map(g => `<div style="display:flex;align-items:center;gap:6px;margin:3px 0">
            <span style="color:#4f46e5">◦</span><span>${esc(g.text)}</span></div>`).join('');
}

// ── Voice recorder ──
const _voice = (() => {
    let _mr = null, _chunks = [], _stream = null, _cancelled = false, _startedAt = 0;
    const MIN_MS = 1000;

    async function _start() {
        if (!_stream) _stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        _mr = new MediaRecorder(_stream);
        _chunks = [];
        _mr.ondataavailable = e => _chunks.push(e.data);
        _mr.onstop = _onStop;
        _mr.start();
        _startedAt = performance.now();
        document.getElementById('taskMicBtn')?.classList.add('recording');
    }

    function _stop() {
        if (_mr?.state === 'recording') _mr.stop();
        document.getElementById('taskMicBtn')?.classList.remove('recording');
    }

    async function _onStop() {
        const blob = new Blob(_chunks, { type: 'audio/wav' });
        _chunks = [];
        if (!blob.size || _cancelled || performance.now() - _startedAt < MIN_MS) return;
        const prog = document.getElementById('taskVoiceProgress');
        if (prog) prog.style.display = 'inline';
        try {
            const fd = new FormData();
            fd.append('file', blob, 'voice.wav');
            const r = await fetch('/chat/voice', { method: 'POST', body: fd });
            const data = await r.json();
            if (data.result) {
                const el = document.getElementById('newTaskDesc');
                if (el) el.value = (el.value ? el.value + '\n' : '') + data.result;
            }
        } catch(e) { console.error('voice', e); }
        finally { if (prog) prog.style.display = 'none'; }
    }

    let _editTargetId = null;

    async function _onStopEdit() {
        const blob = new Blob(_chunks, { type: 'audio/wav' });
        _chunks = [];
        if (!blob.size || _cancelled || performance.now() - _startedAt < MIN_MS) return;
        const btn = document.getElementById('editMicBtn-' + _editTargetId);
        if (btn) btn.textContent = '⏳';
        try {
            const fd = new FormData();
            fd.append('file', blob, 'voice.wav');
            const r = await fetch('/chat/voice', { method: 'POST', body: fd });
            const data = await r.json();
            if (data.result) {
                const el = document.getElementById('td-' + _editTargetId);
                if (el) el.value = (el.value ? el.value + '\n' : '') + data.result;
            }
        } catch(e) { console.error('voice', e); }
        finally {
            const btn2 = document.getElementById('editMicBtn-' + _editTargetId);
            if (btn2) { btn2.textContent = '🎤'; btn2.classList.remove('recording'); }
        }
    }

    return {
        toggle() {
            if (!navigator.mediaDevices?.getUserMedia) { alert('Микрофон недоступен'); return; }
            if (_mr?.state === 'recording') { _cancelled = false; _stop(); }
            else { _cancelled = false; _start(); }
        },
        editToggle(taskId) {
            if (!navigator.mediaDevices?.getUserMedia) { alert('Микрофон недоступен'); return; }
            const btn = document.getElementById('editMicBtn-' + taskId);
            if (_mr?.state === 'recording') {
                _cancelled = false; _stop();
                if (btn) btn.classList.remove('recording');
                return;
            }
            _editTargetId = taskId;
            _cancelled = false;
            // override onstop for edit target
            if (!_stream) navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
                _stream = s;
                _mr = new MediaRecorder(_stream);
                _chunks = [];
                _mr.ondataavailable = e => _chunks.push(e.data);
                _mr.onstop = _onStopEdit;
                _mr.start();
                _startedAt = performance.now();
                if (btn) btn.classList.add('recording');
            });
            else {
                _mr = new MediaRecorder(_stream);
                _chunks = [];
                _mr.ondataavailable = e => _chunks.push(e.data);
                _mr.onstop = _onStopEdit;
                _mr.start();
                _startedAt = performance.now();
                if (btn) btn.classList.add('recording');
            }
        }
    };
})();

function taskVoiceToggle() { _voice.toggle(); }

// ── Column order (drag-and-drop) ──
const COL_ORDER_KEY = 'task_col_order_v1';
let _dragCol = null;
let _isResizing = false;

function colOrderSave() {
    const ths = Array.from(document.querySelectorAll('.task-table thead th'));
    localStorage.setItem(COL_ORDER_KEY, JSON.stringify(ths.map(th => th.dataset.col)));
}
function colOrderLoad() {
    try { return JSON.parse(localStorage.getItem(COL_ORDER_KEY)); } catch { return null; }
}
function colOrderApply(order) {
    if (!order || !order.length) return;
    const table = document.querySelector('.task-table');
    if (!table) return;
    const reorderRow = row => {
        const cells = Array.from(row.children);
        const map = {};
        cells.forEach(c => { if (c.dataset.col) map[c.dataset.col] = c; });
        order.forEach(col => { if (map[col]) row.appendChild(map[col]); });
    };
    reorderRow(table.querySelector('thead tr'));
    table.querySelectorAll('tbody tr').forEach(row => {
        if (row.querySelector('[data-col]')) reorderRow(row);
    });
}

function colDragInit() {
    const table = document.querySelector('.task-table');
    if (!table) return;
    const ths = Array.from(table.querySelectorAll('thead th'));

    ths.forEach(th => {
        th.setAttribute('draggable', 'true');

        const rsz = th.querySelector('.col-resizer');
        if (rsz) {
            rsz.addEventListener('mousedown', () => {
                _isResizing = true;
                const up = () => { _isResizing = false; document.removeEventListener('mouseup', up); };
                document.addEventListener('mouseup', up);
            }, { capture: true });
        }

        th.addEventListener('dragstart', e => {
            if (_isResizing) { e.preventDefault(); return; }
            _dragCol = th.dataset.col;
            th.classList.add('col-dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', _dragCol);
        });

        th.addEventListener('dragend', () => {
            th.classList.remove('col-dragging');
            ths.forEach(t => t.classList.remove('col-drag-over'));
            _dragCol = null;
        });

        th.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });

        th.addEventListener('dragenter', e => {
            e.preventDefault();
            if (th.dataset.col === _dragCol) return;
            ths.forEach(t => t.classList.remove('col-drag-over'));
            th.classList.add('col-drag-over');
        });

        th.addEventListener('dragleave', e => {
            if (!th.contains(e.relatedTarget)) th.classList.remove('col-drag-over');
        });

        th.addEventListener('drop', e => {
            e.preventDefault();
            th.classList.remove('col-drag-over');
            if (!_dragCol || _dragCol === th.dataset.col) return;

            const thead = table.querySelector('thead tr');
            const thsArr = Array.from(thead.querySelectorAll('th'));
            const dragTh = thsArr.find(t => t.dataset.col === _dragCol);
            if (!dragTh) return;
            const dragIdx = thsArr.indexOf(dragTh);
            const targetIdx = thsArr.indexOf(th);

            const insertAfter = dragIdx < targetIdx;
            if (insertAfter) thead.insertBefore(dragTh, th.nextSibling);
            else             thead.insertBefore(dragTh, th);

            table.querySelectorAll('tbody tr').forEach(row => {
                const dragTd   = row.querySelector(`[data-col="${_dragCol}"]`);
                const targetTd = row.querySelector(`[data-col="${th.dataset.col}"]`);
                if (!dragTd || !targetTd) return;
                if (insertAfter) row.insertBefore(dragTd, targetTd.nextSibling);
                else             row.insertBefore(dragTd, targetTd);
            });

            colOrderSave();
            colPctSave(Array.from(table.querySelectorAll('thead th')));
            // re-attach resizers in new order
            table.querySelectorAll('.col-resizer').forEach(r => r.remove());
            colResizersInit();
            colDragInit();
        });
    });
}

// ── Resizable columns (% based) ──
const COL_KEY = 'task_col_pct_v3';
const COL_DEFAULTS_PCT = [4, 9, 24, 24, 21, 7, 11]; // % sum=100, 7 колонок

function colPctLoad(count) {
    try {
        const saved = JSON.parse(localStorage.getItem(COL_KEY));
        if (saved && saved.length === count) {
            const total = saved.reduce((s, v) => s + v, 0);
            if (total > 0) return saved.map(v => v * 100 / total);
        }
    } catch {}
    const def = COL_DEFAULTS_PCT.slice(0, count);
    const t = def.reduce((s, v) => s + v, 0);
    return def.map(v => v * 100 / t);
}
function colPctSave(ths) {
    const total = ths.reduce((s, th) => s + th.offsetWidth, 0);
    if (!total) return;
    localStorage.setItem(COL_KEY, JSON.stringify(ths.map(th => +(th.offsetWidth * 100 / total).toFixed(3))));
}

function colResizersInit() {
    const table = document.querySelector('.task-table');
    if (!table) return;
    const ths = Array.from(table.querySelectorAll('thead th'));
    const pcts = colPctLoad(ths.length);

    // Apply as %, last col gets remainder to guarantee 100%
    let used = 0;
    ths.forEach((th, i) => {
        const p = (i === ths.length - 1) ? +(100 - used).toFixed(3) : +pcts[i].toFixed(3);
        th.style.width = p + '%';
        used += p;
    });

    ths.forEach((th, i) => {
        if (i === ths.length - 1) return;
        const rsz = document.createElement('div');
        rsz.className = 'col-resizer';
        th.appendChild(rsz);

        let startX, startPx, nextPx, nextTh, tableW;
        rsz.addEventListener('mousedown', e => {
            e.preventDefault();
            tableW  = table.offsetWidth;
            startX  = e.clientX;
            startPx = th.offsetWidth;
            nextTh  = ths[i + 1];
            nextPx  = nextTh ? nextTh.offsetWidth : 0;
            rsz.classList.add('dragging');

            const onMove = e => {
                const dx = e.clientX - startX;
                const nw = Math.max(48, startPx + dx);
                const nn = Math.max(48, nextPx  - dx);
                th.style.width     = +(nw * 100 / tableW).toFixed(3) + '%';
                if (nextTh) nextTh.style.width = +(nn * 100 / tableW).toFixed(3) + '%';
            };
            const onUp = () => {
                rsz.classList.remove('dragging');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                colPctSave(ths);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });
    });
}

treeCollapsedLoad();
// Смещение часового пояса тянем до первой отрисовки: без loadTz() глобальный fmtTz
// молча показывает UTC, и времена ревизий разъезжаются с остальной админкой.
(window.loadTz ? window.loadTz() : Promise.resolve()).then(loadProjects);
