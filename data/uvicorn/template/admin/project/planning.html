{% extends "base.html" %}

{% block title %}Планирование{% endblock %}

{% block head %}
<style>
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    /* ─── Sidebar ─────────────────────────────────────── */
    .agents-sidebar {
        width: 290px;
        min-width: 220px;
        max-width: 340px;
        border-right: 1px solid #eee;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
    }

    .sidebar-header {
        padding: 10px 12px;
        background: #fff;
        border-bottom: 1px solid #eee;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .sidebar-header h3 {
        margin: 0;
        font-size: 14px;
        color: #2c3e50;
        font-weight: 700;
        flex: 1;
    }

    .sidebar-actions {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    .auto-refresh-select {
        font-size: 11px;
        padding: 3px 6px;
        border-radius: 5px;
        border: 1px solid #e2e8f0;
        color: #475569;
        background: #f8fafc;
        cursor: pointer;
        width: 80px;
    }

    .btn-icon-sm {
        font-size: 13px;
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #475569;
        white-space: nowrap;
    }

    .btn-icon-sm:hover {
        background: #f1f5f9;
    }

    .btn-icon-sm.primary {
        background: #3b82f6;
        color: #fff;
        border-color: #3b82f6;
    }

    .btn-icon-sm.primary:hover {
        background: #2563eb;
    }

    .btn-icon-sm.accent {
        background: #8b5cf6;
        color: #fff;
        border-color: #8b5cf6;
    }

    .btn-icon-sm.accent:hover {
        background: #7c3aed;
    }

    /* ─── View tabs ───────────────────────────────────── */
    .view-tabs {
        display: flex;
        border-bottom: 1px solid #eee;
        flex-shrink: 0;
        padding: 0 12px;
        gap: 0;
        background: #fafafa;
    }

    .view-tab {
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        transition: color 0.15s;
    }

    .view-tab:hover {
        color: #2c3e50;
    }

    .view-tab.active {
        color: #3b82f6;
        border-bottom-color: #3b82f6;
    }

    .project-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
    }

    .project-item {
        padding: 9px 12px;
        margin: 2px 6px;
        cursor: pointer;
        font-size: 13px;
        color: #2c3e50;
        border-radius: 7px;
        border-left: 3px solid transparent;
        display: flex;
        flex-direction: column;
        gap: 3px;
        transition: background 0.1s;
    }

    .project-item:hover {
        background: #f1f4f6;
    }

    .project-item.active {
        background: #eef6fc;
        border-left-color: #3498db;
    }

    .project-item-title {
        font-weight: 600;
        font-size: 13px;
        line-height: 1.3;
        word-break: break-word;
    }

    .project-item-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
    }

    .project-item-date {
        font-size: 11px;
        color: #94a3b8;
    }

    .project-item-top {
        display: flex;
        align-items: flex-start;
        gap: 4px;
    }

    .project-drag-handle {
        flex-shrink: 0;
        color: #c8d0d8;
        cursor: grab;
        font-size: 13px;
        line-height: 1.3;
        padding: 0 2px;
        user-select: none;
        transition: color 0.15s;
    }

    .project-drag-handle:hover { color: #7f8c9a; }
    .project-item:hover .project-drag-handle { color: #aab0b8; }

    .project-item.dnd-dragging {
        opacity: 0.45;
    }

    .project-item.dnd-over-top {
        border-top: 2px solid #3498db;
    }

    .project-item.dnd-over-bottom {
        border-bottom: 2px solid #3498db;
    }

    /* ─── Badges ──────────────────────────────────────── */
    .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        white-space: nowrap;
    }

    .badge-pending {
        background: #f1f5f9;
        color: #64748b;
    }

    .badge-processing {
        background: #dbeafe;
        color: #1d4ed8;
    }

    .badge-complete {
        background: #dcfce7;
        color: #15803d;
    }

    .badge-error {
        background: #fee2e2;
        color: #dc2626;
    }

    .badge-running {
        background: #fef3c7;
        color: #b45309;
    }

    .badge-failed {
        background: #fee2e2;
        color: #dc2626;
    }

    .badge-waiting {
        background: #e0f2fe;
        color: #0369a1;
        animation: pulse 2s infinite;
    }

    .score-verdict {
        display: inline-block;
        font-size: 10px;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }

    .verdict-go {
        background: #dcfce7;
        color: #15803d;
    }

    .verdict-maybe {
        background: #fef3c7;
        color: #b45309;
    }

    .verdict-no {
        background: #fee2e2;
        color: #dc2626;
    }

    /* ─── Main section ────────────────────────────────── */
    .editor-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
    }

    .editor-topbar {
        padding: 10px 18px;
        border-bottom: 1px solid #eee;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .editor-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
    }

    .placeholder-panel {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        font-size: 14px;
    }

    .title-input {
        flex: 1;
        font-size: 16px;
        font-weight: 700;
        color: #2c3e50;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 3px 8px;
        background: transparent;
        outline: none;
        min-width: 0;
    }

    .title-input:hover {
        border-color: #e2e8f0;
        background: #f8fafc;
    }

    .title-input:focus {
        border-color: #3b82f6;
        background: #fff;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .btn-retry {
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 6px;
        background: #fef3c7;
        color: #b45309;
        border: 1px solid #fde68a;
        cursor: pointer;
        font-weight: 600;
    }

    .btn-retry:hover {
        background: #fde68a;
    }

    .btn-delete {
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 6px;
        background: #fee2e2;
        color: #dc2626;
        border: 1px solid #fecaca;
        cursor: pointer;
        font-weight: 600;
    }

    .btn-delete:hover {
        background: #fecaca;
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin-bottom: 14px;
    }

    .info-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 14px;
    }

    .info-card label {
        font-size: 10px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
    }

    .info-card .info-value {
        font-size: 13px;
        color: #1e293b;
        margin-top: 3px;
        font-weight: 500;
    }

    .section-title {
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin-bottom: 8px;
        margin-top: 18px;
    }

    .idea-block {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13px;
        color: #0e6862;
        line-height: 1.6;
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        outline: none;
        font-family: inherit;
        min-height: 80px;
        max-height: 200px;
    }

    .idea-block:hover {
        border-color: #cbd5e1;
    }

    .idea-block:focus {
        border-color: #3b82f6;
        background: #fff;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    /* ─── Score block ─────────────────────────────────── */
    .score-block {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 14px 16px;
        margin-top: 16px;
    }

    .score-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }

    .score-verdict-lg {
        font-size: 13px;
        font-weight: 800;
        padding: 4px 14px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
    }

    .score-meters {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .score-meter {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 90px;
        flex: 1;
    }

    .score-meter-label {
        font-size: 10px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
    }

    .score-meter-bar {
        height: 5px;
        background: #e2e8f0;
        border-radius: 3px;
        overflow: hidden;
    }

    .score-meter-fill {
        height: 100%;
        border-radius: 3px;
    }

    .fill-high {
        background: #22c55e;
    }

    .fill-mid {
        background: #f59e0b;
    }

    .fill-low {
        background: #ef4444;
    }

    .score-meter-val {
        font-size: 12px;
        font-weight: 700;
        color: #1e293b;
    }

    .score-meta {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: #64748b;
        margin-top: 8px;
        flex-wrap: wrap;
    }

    .score-meta b {
        color: #1e293b;
    }

    .score-summary {
        font-size: 13px;
        color: #374151;
        line-height: 1.6;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #e2e8f0;
    }

    /* ─── Phases table ────────────────────────────────── */
    .phases-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }

    .phases-table th {
        text-align: left;
        padding: 7px 10px;
        background: #f8fafc;
        border-bottom: 2px solid #e2e8f0;
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    .phases-table td {
        padding: 8px 10px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
    }

    .phases-table tr:last-child td {
        border-bottom: none;
    }

    .phases-table tr:hover td {
        background: #f8fafc;
    }

    .phase-name {
        font-weight: 600;
        color: #2c3e50;
        vertical-align: top;
    }
    .phase-section-tags {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 5px;
    }
    .phase-section-tag {
        font-size: 10px;
        font-weight: 500;
        color: #64748b;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 3px;
        padding: 1px 5px;
        white-space: nowrap;
        display: inline-block;
        align-self: flex-start;
    }

    .phase-time {
        font-size: 11px;
        color: #94a3b8;
    }

    .phase-error-row td {
        padding: 0 10px 8px 10px !important;
        border-bottom: 1px solid #f1f5f9;
    }
    .phase-error-box {
        background: #fff5f5;
        border: 1px solid #fecaca;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 11px;
        color: #dc2626;
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 120px;
        overflow-y: auto;
    }

    .btn-view {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 5px;
        background: #3b82f6;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
        margin: 0 4px;
    }

    .btn-view:hover {
        background: #2563eb;
    }

    .btn-retry-phase {
        font-size: 11px;
        padding: 3px 7px;
        border-radius: 5px;
        background: #f8fafc;
        color: #64748b;
        border: 1px solid #e2e8f0;
        cursor: pointer;
        font-weight: 600;
        margin-left: 4px;
    }
    .btn-retry-phase:hover {
        background: #fef3c7;
        color: #d97706;
        border-color: #fcd34d;
    }

    /* ─── Documents ───────────────────────────────────── */
    .doc-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .doc-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 14px;
        gap: 12px;
    }

    .doc-card-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }

    .doc-card-title {
        font-size: 13px;
        font-weight: 600;
        color: #1e293b;
    }

    .doc-card-meta {
        font-size: 11px;
        color: #94a3b8;
    }

    .btn-download {
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 5px;
        background: #10b981;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .btn-download:hover {
        background: #059669;
    }

    .empty-hint {
        color: #94a3b8;
        font-size: 13px;
        padding: 16px 0;
    }

    /* ─── Compare table ───────────────────────────────── */
    .compare-wrap {
        padding: 16px 20px;
        overflow-y: auto;
        flex: 1;
    }

    .compare-filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
        align-items: center;
    }

    .compare-filters span {
        font-size: 12px;
        color: #64748b;
        font-weight: 600;
    }

    .filter-btn {
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #64748b;
        cursor: pointer;
        font-weight: 600;
    }

    .filter-btn:hover, .filter-btn.active {
        background: #3b82f6;
        color: #fff;
        border-color: #3b82f6;
    }

    .filter-btn.f-go.active {
        background: #15803d;
        border-color: #15803d;
    }

    .filter-btn.f-maybe.active {
        background: #b45309;
        border-color: #b45309;
    }

    .filter-btn.f-no.active {
        background: #dc2626;
        border-color: #dc2626;
    }

    .compare-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }

    .compare-table th {
        text-align: left;
        padding: 8px 12px;
        background: #f8fafc;
        border-bottom: 2px solid #e2e8f0;
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
    }

    .compare-table th:hover {
        color: #2c3e50;
    }

    .compare-table th.sorted {
        color: #3b82f6;
    }

    .compare-table th .sort-arrow {
        margin-left: 4px;
        opacity: 0.5;
    }

    .compare-table th.sorted .sort-arrow {
        opacity: 1;
    }

    .compare-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
    }

    .compare-table tr:hover td {
        background: #f8fafc;
        cursor: pointer;
    }

    .compare-table tr.no-score td {
        opacity: 0.5;
    }

    .cmp-title {
        font-weight: 600;
        color: #1e293b;
        max-width: 220px;
    }

    .cmp-score {
        font-weight: 700;
        font-size: 14px;
    }

    .mini-bar {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .mini-bar-track {
        width: 60px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        overflow: hidden;
        flex-shrink: 0;
    }

    .mini-bar-fill {
        height: 100%;
        border-radius: 2px;
    }

    .mini-bar-val {
        font-size: 12px;
        font-weight: 600;
        color: #1e293b;
        width: 22px;
    }

    .cmp-meta {
        font-size: 11px;
        color: #64748b;
    }

    /* ─── Modals ──────────────────────────────────────── */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: var(--z-modal);
        align-items: center;
        justify-content: center;
    }

    .modal-overlay.visible {
        display: flex;
    }

    .modal-box {
        background: #fff;
        border-radius: 12px;
        width: 90vw;
        max-width: 860px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
        padding: 14px 18px;
        border-bottom: 1px solid #eee;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .modal-header h3 {
        margin: 0;
        font-size: 15px;
        color: #1e293b;
        font-weight: 700;
    }

    .modal-close {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #64748b;
        line-height: 1;
        padding: 0 4px;
    }

    .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
    }

    .modal-body pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.7;
        color: #1e293b;
        font-family: inherit;
        margin: 0;
    }

    .phase-result-body { font-size: 13px; color: #1e293b; line-height: 1.7; }
    .phase-result-body h1 { font-size: 18px; font-weight: 800; margin: 0 0 12px; color: #0f172a; }
    .phase-result-body h2 { font-size: 15px; font-weight: 700; margin: 18px 0 8px; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    .phase-result-body h3 { font-size: 13px; font-weight: 700; margin: 14px 0 6px; color: #334155; }
    .phase-result-body p  { margin: 0 0 10px; }
    .phase-result-body ul, .phase-result-body ol { margin: 0 0 10px; padding-left: 22px; }
    .phase-result-body li { margin-bottom: 4px; }
    .phase-result-body strong { font-weight: 700; color: #0f172a; }
    .phase-result-body em { font-style: italic; }
    .phase-result-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }
    .phase-result-body code { background: #f1f5f9; border-radius: 4px; padding: 1px 5px; font-family: monospace; font-size: 12px; }
    .phase-result-body pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; overflow-x: auto; margin: 10px 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
    .phase-result-body blockquote { border-left: 3px solid #3b82f6; margin: 10px 0; padding: 4px 12px; color: #475569; font-style: italic; background: #f8fafc; }
    .phase-result-body table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12px; }
    .phase-result-body th { background: #f8fafc; padding: 6px 10px; border: 1px solid #e2e8f0; font-weight: 700; text-align: left; }
    .phase-result-body td { padding: 6px 10px; border: 1px solid #e2e8f0; }

    /* ─── New project form ────────────────────────────── */
    .form-group {
        margin-bottom: 14px;
    }

    .form-group label {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        display: block;
        margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        color: #1e293b;
        outline: none;
        resize: vertical;
    }

    .form-group input:focus, .form-group textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .btn-primary {
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
    }

    .btn-primary:hover {
        background: #2563eb;
    }

    .btn-primary:disabled {
        background: #93c5fd;
        cursor: not-allowed;
    }

    /* ─── Ideas tab ──────────────────────────────────── */
    .ideas-tab-body {
        display: flex;
        gap: 28px;
        align-items: flex-start;
        height: 100%;
        overflow: auto;
    }

    .ideas-tab-left {
        flex: 0 0 320px;
        max-width: 320px;
    }

    .ideas-tab-right {
        flex: 1;
        min-width: 0;
    }

    .idea-history-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 20px 0 10px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
    }

    .idea-history-batch {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        margin-bottom: 10px;
        overflow: hidden;
    }

    .idea-history-batch-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        font-size: 12px;
        color: #64748b;
    }

    .idea-history-batch-niche {
        font-weight: 600;
        color: #1e293b;
        margin-right: 6px;
    }

    .idea-history-items {
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .idea-history-item {
        font-size: 12px;
        color: #334155;
        padding: 2px 0;
    }

    .idea-history-item::before {
        content: '• ';
        color: #94a3b8;
    }

    .btn-delete-sm {
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 14px;
        padding: 0 4px;
        line-height: 1;
    }
    .btn-delete-sm:hover { color: #dc2626; }

    /* ─── Ideas generator ─────────────────────────────── */
    .ideas-loading {
        text-align: center;
        padding: 30px;
        color: #64748b;
        font-size: 13px;
    }

    .ideas-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 14px 0;
    }

    .idea-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px 14px;
        cursor: pointer;
        transition: border-color 0.15s;
    }

    .idea-item:hover {
        border-color: #94a3b8;
    }

    .idea-item.selected {
        border-color: #3b82f6;
        background: #eff6ff;
    }

    .idea-item input[type=checkbox] {
        margin-top: 2px;
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .idea-item-body {
        flex: 1;
    }

    .idea-item-title {
        font-weight: 700;
        font-size: 13px;
        color: #1e293b;
        margin-bottom: 3px;
    }

    .idea-item-desc {
        font-size: 12px;
        color: #475569;
        line-height: 1.5;
    }

    .ideas-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    .ideas-sel-count {
        font-size: 12px;
        color: #64748b;
        flex: 1;
    }

    /* ─── Pulse ───────────────────────────────────────── */
    @keyframes pulse {
        0%, 100% {
            opacity: 1
        }
        50% {
            opacity: .5
        }
    }

    .badge-processing, .badge-running {
        animation: pulse 2s infinite;
    }

    .phase-current-pulsing {
        animation: pulse 1.6s infinite;
        color: #d97706;
        font-weight: 600;
    }

    /* Phase collapse toggle */
    tr[data-phase-key]:has(+ tr[data-phase-parent]) td.phase-name { cursor: pointer; }
    tr[data-phase-key]:has(+ tr[data-phase-parent]):hover td { background: #f0f4ff !important; }
</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- ─── Sidebar ──────────────────────────────────── -->
    <div class="agents-sidebar">
        <div class="sidebar-header">
            <h3>Планирование</h3>
            <div class="sidebar-actions">
                <button class="btn-icon-sm primary" onclick="openNewModal()" title="Новый проект">+ Новый</button>
            </div>
        </div>
        <div class="view-tabs">
            <div class="view-tab active" id="tabProjects" onclick="switchTab('projects')">Проекты</div>
            <div class="view-tab" id="tabCompare" onclick="switchTab('compare')">Сравнение</div>
            <div class="view-tab" id="tabIdeas" onclick="switchTab('ideas')">✨ Идеи</div>
        </div>
        <div class="project-list" id="projectList">
            <div class="empty-hint" style="padding:20px;text-align:center">Загрузка...</div>
        </div>
    </div>

    <!-- ─── Main panel ───────────────────────────────── -->
    <div class="editor-section" id="mainPanel">
        <div class="placeholder-panel">Выберите проект</div>
    </div>

    <!-- ─── Ideas tab panel ──────────────────────────── -->
    <div class="editor-section" id="ideasPanel" style="display:none">
        <div class="editor-topbar">
            <span style="font-weight:600;font-size:15px">✨ Генератор идей</span>
        </div>
        <div class="editor-body ideas-tab-body">
            <div class="ideas-tab-left">
                <div class="form-group">
                    <label>Ниша / тема *</label>
                    <input id="ideasNiche" type="text"
                           placeholder="HR-инструменты для стартапов, EdTech для взрослых, B2B SaaS...">
                </div>
                <div class="form-group">
                    <label>Дополнительный контекст <span style="color:#94a3b8;font-weight:400">(необязательно)</span></label>
                    <textarea id="ideasContext" rows="5"
                              placeholder="Бюджет, регион, технологии, ограничения..."></textarea>
                </div>
                <button class="btn-primary" id="btnGenerate" onclick="generateIdeas()">Генерировать идеи</button>
            </div>
            <div class="ideas-tab-right">
                <div id="ideasStep2" style="display:none">
                    <div id="ideasContent"></div>
                    <div class="ideas-actions" id="ideasActions" style="display:none">
                        <span class="ideas-sel-count" id="selCount"></span>
                        <button class="btn-icon-sm" onclick="selectAllIdeas()">Выбрать все</button>
                        <button class="btn-icon-sm" onclick="clearAllIdeas()">Снять все</button>
                        <button class="btn-primary" id="btnLaunch" onclick="launchIdeas()">🚀 Запустить выбранные</button>
                    </div>
                </div>
                <div id="ideasHistorySection"></div>
            </div>
        </div>
    </div>

</div>

<!-- ─── Phase result modal ───────────────────────────── -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitle">Результат фазы</h3>
            <button class="modal-close" onclick="closeModal('resultModal')">×</button>
        </div>
        <div class="modal-body">
            <div id="modalContent" class="phase-result-body"></div>
        </div>
    </div>
</div>

<!-- ─── New project modal ────────────────────────────── -->
<div class="modal-overlay" id="newModal">
    <div class="modal-box" style="max-width:540px">
        <div class="modal-header">
            <h3>Новый проект</h3>
            <button class="modal-close" onclick="closeModal('newModal')">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Название <span style="color:#94a3b8;font-weight:400">(необязательно)</span></label>
                <input id="newTitle" type="text" placeholder="Оставьте пустым — возьмётся из идеи">
            </div>
            <div class="form-group">
                <label>Идея продукта *</label>
                <textarea id="newIdea" rows="6"
                          placeholder="Опишите идею: что за продукт, для кого, какую проблему решает..."></textarea>
            </div>
            <button class="btn-primary" id="btnCreate" onclick="createProject()">Создать и запустить анализ</button>
        </div>
    </div>
</div>


<script>window.PLANNING_TZ_OFFSET = {{ tz_offset }};</script>
<script src="/static/js/project/utils.js?v=1"></script>
<script src="/static/js/project/markdown.js?v=2"></script>
<script src="/static/js/project/panel.js?v=25"></script>
<script src="/static/js/project/compare.js?v=1"></script>
<script src="/static/js/project/ideas.js?v=3"></script>
<script src="/static/js/project/projects.js?v=3"></script>
<script src="/static/js/project/actions.js?v=2"></script>
<script src="/static/js/project/main.js?v=4"></script>
{% endblock %}
