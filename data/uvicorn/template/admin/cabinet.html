{% extends "base.html" %}

{% block title %}Личный кабинет{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/user_access_token.css">
<style>
    .cabinet-container {
        max-width: 1200px;
        margin: 40px auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid #e0e0e0;
        overflow: hidden;
    }

    .cabinet-header {
        padding: 20px 30px;
        background: #fafafa;
        border-bottom: 1px solid #eee;
    }

    .cabinet-header h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .cabinet-body {
        padding: 30px;
    }

    #cabinet-form {
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .cabinet-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 30px;
        width: 100%;
        align-items: start;
    }

    .form-fields {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 15px;
        width: 100%;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-width: 180px; /* Ensures inputs look robust on smaller screens */
    }

    .form-group label {
        font-size: 11px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap; /* Keeps labels on a single line */
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .form-group-language select{
        width: 103px;
    }

    .form-control {
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
        height: 44px; /* Standardize height for select and input */
    }

    .form-control:focus {
        border-color: #3498db;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        outline: none;
    }

    .form-control:disabled {
        background: #f5f5f5;
        color: #7f8c8d;
        cursor: not-allowed;
    }

    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        width: 100%;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.2s;
        display: inline-block;
        white-space: nowrap;
    }

    .btn-save:hover {
        background: #2980b9;
    }

    .btn-save:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
    }
</style>
{% endblock %}

{% block content %}
<div class="cabinet-container">
    <div class="cabinet-header">
        <h2>👤 Личный кабинет</h2>
    </div>
    <div class="cabinet-body">
        <form id="cabinet-form">
            <div class="cabinet-grid">
                <!-- Первая колонка: поля профиля + токены доступа -->
                <div class="cabinet-col-left">
                    <div class="form-fields">
                        <div class="form-group">
                            <label for="username">Имя пользователя (Логин)</label>
                            <input type="text" id="username" class="form-control" disabled>
                        </div>

                        <div class="form-group">
                            <label for="role">Роль в системе</label>
                            <input type="text" id="role" class="form-control" disabled>
                        </div>

                        <div class="form-group">
                            <label for="email">Электронная почта (Email)</label>
                            <input type="email" id="email" class="form-control" required placeholder="example@domain.com">
                        </div>

                        <div class="form-group form-group-language">
                            <label for="language">Язык общения</label>
                            <select id="language" class="form-control">
                                <option value="">Загрузка...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Секция смены пароля -->
                    <div style="margin-top: 40px; width: 100%;">
                        <div style="border-bottom: 2px solid #f4f4f9; padding-bottom: 10px; margin-bottom: 15px;">
                            <h3 style="margin: 0; color: #2c3e50; font-size: 14px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">🔒 Смена пароля</h3>
                        </div>
                        <div class="form-fields">
                            <div class="form-group">
                                <label for="password_current">Текущий пароль</label>
                                <input type="password" id="password_current" class="form-control" autocomplete="current-password">
                            </div>
                            <div class="form-group">
                                <label for="password_new">Новый пароль (мин. 8 символов)</label>
                                <input type="password" id="password_new" class="form-control" autocomplete="new-password">
                            </div>
                            <div class="form-group">
                                <label for="password_repeat">Повторите новый пароль</label>
                                <input type="password" id="password_repeat" class="form-control" autocomplete="new-password">
                            </div>
                            <div class="form-group" style="justify-content: flex-end;">
                                <label>&nbsp;</label>
                                <button type="button" class="btn-save" id="btn-password" style="background: #e67e22;">Сменить пароль</button>
                            </div>
                        </div>
                    </div>

                    <!-- Секция токенов доступа (доступна только для текущего пользователя) -->
                    <div id="tokensSection" style="margin-top: 40px; display: none; width: 100%;">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f4f4f9; padding-bottom: 10px; margin-bottom: 15px;">
                            <h3 style="margin: 0; color: #2c3e50; font-size: 14px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">🔑 Токены доступа</h3>
                            <button type="button" class="btn-save" id="generateTokenBtn" style="padding: 6px 15px; font-size: 12px; height: auto;">Сгенерировать новый ключ</button>
                        </div>
                        <table class="tokens-table" style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                            <thead>
                                <tr style="background-color: #fcfcfc; border-bottom: 1px solid #eee;">
                                    <th style="text-align: left; padding: 10px; font-size: 11px; color: #7f8c8d; text-transform: uppercase; font-weight: bold;">Токен</th>
                                    <th style="text-align: right; padding: 10px; font-size: 11px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; width: 100px;">Действие</th>
                                </tr>
                            </thead>
                            <tbody id="tokensList">
                                <!-- JS will render tokens here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Вторая колонка: список LLM -->
                <div class="cabinet-col-right">
                    <div class="form-group">
                        <label>Модели LLM</label>
                        <div style="background: #f9f9f9; border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: 6px; min-height: 44px; box-sizing: border-box;">
                            <ul id="llm_list" style="margin: 0; padding-left: 15px; display: flex; flex-direction: column; gap: 6px; color: #4a5568; font-size: 14px;">
                                <li style="color: #a0aec0; list-style-type: none; margin-left: -15px;">Загрузка моделей...</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="editor-footer">
                <button type="submit" class="btn-save" id="btn-submit">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, putData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';
    import {loadUserTokens, initTokenGeneration} from '/static/js/user_access_token.js';

    const form = document.getElementById('cabinet-form');
    const usernameInput = document.getElementById('username');
    const roleInput = document.getElementById('role');
    const emailInput = document.getElementById('email');
    const languageSelect = document.getElementById('language');
    const llmList = document.getElementById('llm_list');
    const btnSubmit = document.getElementById('btn-submit');

    let currentUserId = null;
    let allLlmModels = {};

    // Initialize page
    async function initCabinet() {
        try {
            // 1. Fetch LLM models and map them
            const llmResponse = await getData('/llm/user/list');
            if (llmResponse && llmResponse.result) {
                llmResponse.result.forEach(model => {
                    allLlmModels[model.id] = model.name;
                });
            }

            // Язык общения: список — объединение языков нод пользователя,
            // выбранный язык перекрывает язык ноды по умолчанию в чате
            try {
                const langResponse = await getData('/auth/me/languages');
                const {languages = [], current = null} = langResponse.result || {};
                languageSelect.innerHTML = '';
                languages.forEach(lang => {
                    const opt = new Option(lang.toUpperCase(), lang);
                    languageSelect.add(opt);
                });
                languageSelect.value = current || languages[0] || '';
            } catch (err) {
                console.error('Не удалось загрузить языки:', err);
            }

            // 2. Fetch current user data
            const meResponse = await getData('/auth/me');
            if (meResponse && meResponse.user) {
                const user = meResponse.user;
                currentUserId = user.id;
                usernameInput.value = user.username || '';
                roleInput.value = user.role || '';
                emailInput.value = user.email || '';
                
                // Render associated LLMs as a plain text list column
                if (llmList) {
                    llmList.innerHTML = '';
                    const userLlmIds = user.llm_ids || [];
                    if (userLlmIds.length === 0 && user.llm_id) {
                        userLlmIds.push(user.llm_id);
                    }

                    if (userLlmIds.length > 0) {
                        userLlmIds.forEach(id => {
                            const modelName = allLlmModels[id] || `Модель ID ${id}`;
                            const li = document.createElement('li');
                            li.textContent = modelName;
                            llmList.appendChild(li);
                        });
                    } else {
                        const li = document.createElement('li');
                        li.textContent = 'Нет привязанных моделей LLM';
                        li.style.color = '#7f8c8d';
                        li.style.listStyleType = 'none';
                        li.style.marginLeft = '-15px';
                        llmList.appendChild(li);
                    }
                }

                // Show tokens section and load tokens for the current user
                const tokensSection = document.getElementById('tokensSection');
                if (tokensSection) tokensSection.style.display = 'block';
                await loadUserTokens(currentUserId);

                // Setup token generation button
                const generateTokenBtn = document.getElementById('generateTokenBtn');
                initTokenGeneration(generateTokenBtn, () => currentUserId);
            }
        } catch (err) {
            showNotification('Ошибка загрузки данных: ' + err.message, 'error');
        }
    }

    // Handle form submit
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btnSubmit.disabled = true;
        
        const payload = {
            email: emailInput.value.trim(),
            language: languageSelect.value || ''
        };

        try {
            const response = await putData('/auth/me', payload);
            if (response && response.user) {
                showNotification('Профиль успешно обновлен!', 'success');
                // Optional: trigger reload of current user info in menu
                const menuBtn = document.querySelector('.user-menu-btn');
                if (menuBtn) {
                    menuBtn.textContent = `👤 ${response.user.username} (${response.user.role})`;
                }
            }
        } catch (err) {
            showNotification('Ошибка при сохранении: ' + err.message, 'error');
        } finally {
            btnSubmit.disabled = false;
        }
    });

    // Смена пароля: требует действующий пароль, новый — минимум 8 символов
    const btnPassword = document.getElementById('btn-password');
    btnPassword.addEventListener('click', async () => {
        const current = document.getElementById('password_current').value;
        const fresh = document.getElementById('password_new').value;
        const repeat = document.getElementById('password_repeat').value;

        if (!current || !fresh) {
            showNotification('Заполните текущий и новый пароль', 'warning');
            return;
        }
        if (fresh.length < 8) {
            showNotification('Новый пароль должен быть не короче 8 символов', 'warning');
            return;
        }
        if (fresh !== repeat) {
            showNotification('Новые пароли не совпадают', 'warning');
            return;
        }

        btnPassword.disabled = true;
        try {
            await putData('/auth/me/password', {password_current: current, password_new: fresh});
            showNotification('Пароль успешно изменен', 'success');
            ['password_current', 'password_new', 'password_repeat'].forEach(id => {
                document.getElementById(id).value = '';
            });
        } catch (err) {
            showNotification('Ошибка: ' + err.message, 'error');
        } finally {
            btnPassword.disabled = false;
        }
    });

    initCabinet();
</script>
{% endblock %}
