{% extends "base.html" %}

{% block title %}Seed SQL{% endblock %}

{% block head %}
<style>
    .seed-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    .seed-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid #e0e0e0;
        flex-shrink: 0;
    }

    .seed-header h2 {
        margin: 0;
        font-size: 1.05rem;
        color: #2c3e50;
        font-weight: 600;
    }

    .seed-header-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .seed-body {
        display: flex;
        flex: 1;
        min-height: 0;
    }

    /* ── Left sidebar: table selection ── */
    .seed-sidebar {
        width: 260px;
        min-width: 220px;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        background: #fafafa;
        flex-shrink: 0;
    }

    .sidebar-top {
        padding: 10px 14px 8px;
        border-bottom: 1px solid #eee;
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .sidebar-top span {
        font-size: 12px;
        color: #555;
        font-weight: 600;
        flex: 1;
    }

    .sidebar-top a {
        font-size: 11px;
        color: #3498db;
        cursor: pointer;
        text-decoration: none;
    }

    .sidebar-top a:hover { text-decoration: underline; }

    .table-groups {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0 10px;
    }

    .table-group-header {
        padding: 8px 14px 3px;
        font-size: 10px;
        font-weight: 700;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .table-item {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 1px 14px 1px 18px;
        cursor: pointer;
        user-select: none;
    }

    .table-item:hover { background: #f0f4f8; }

    .table-item input[type=checkbox] { accent-color: #3498db; cursor: pointer; }

    .table-item label {
        cursor: pointer;
        font-family: monospace;
        font-size: 12px;
        color: #333;
    }

    /* ── Resizer ── */
    .seed-resizer {
        width: 2px;
        background: #e0e0e0;
        cursor: col-resize;
        flex-shrink: 0;
        position: relative;
        transition: background 0.15s;
    }
    .seed-resizer:hover,
    .seed-resizer.dragging { background: #3498db; }
    .seed-resizer::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 1px;
        height: 32px;
        background: rgba(0,0,0,0.15);
        border-radius: 1px;
    }

    /* ── Right: file list ── */
    .seed-files {
        flex: 1;
        overflow: auto;
        padding: 16px 20px;
        min-width: 0;
    }

    .seed-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        overflow: hidden;
    }

    .seed-table th {
        background: #f5f7f9;
        padding: 8px 14px;
        text-align: left;
        font-weight: 600;
        color: #555;
        border-bottom: 1px solid #e0e0e0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .seed-table td {
        padding: 9px 14px;
        border-bottom: 1px solid #f0f0f0;
        vertical-align: middle;
        color: #333;
    }

    .seed-table tr:last-child td { border-bottom: none; }
    .seed-table tr:hover td { background: #f9fbff; }

    .col-name { font-family: monospace; font-size: 12px; }
    .col-size { color: #666; }
    .col-date { color: #666; white-space: nowrap; }
    .col-actions { white-space: nowrap; }

    .seed-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 60px 20px;
        color: #bbb;
        font-size: 13px;
    }

    .seed-empty svg { width: 40px; height: 40px; opacity: 0.35; }

    /* ── Buttons ── */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
    }

    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: #3498db; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2980b9; }
    .btn-outline { background: #fff; color: #555; border: 1px solid #ccc; }
    .btn-outline:hover:not(:disabled) { background: #f5f5f5; }
    .btn-success { background: #fff; color: #27ae60; border: 1px solid #b2dfcc; }
    .btn-success:hover:not(:disabled) { background: #f0fff4; border-color: #27ae60; }
    .btn-danger { background: #fff; color: #e74c3c; border: 1px solid #f5c6c6; }
    .btn-danger:hover:not(:disabled) { background: #fff5f5; border-color: #e74c3c; }

    .btn-large { padding: 8px 18px; font-size: 13px; }

    .status-msg {
        font-size: 12px;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 4px;
        display: none;
    }
    .status-msg.ok  { color: #27ae60; background: #f0fff4; border: 1px solid #b2dfcc; display: inline-block; }
    .status-msg.err { color: #e74c3c; background: #fff5f5; border: 1px solid #f5c6c6; display: inline-block; }

    .spinner {
        display: inline-block;
        width: 13px; height: 13px;
        border: 2px solid rgba(255,255,255,0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block content %}
<div class="seed-layout">

    <div class="seed-header">
        <h2>Seed SQL</h2>
        <div class="seed-header-actions">
            <span id="statusMsg" class="status-msg"></span>
            <button class="btn btn-primary btn-large" id="btnGenerate" onclick="generateSeed()">
                Сгенерировать Seed SQL
            </button>
        </div>
    </div>

    <div class="seed-body">

        <!-- Left: table selection -->
        <div class="seed-sidebar">
            <div class="sidebar-top">
                <span>Таблицы</span>
            </div>
            <div class="table-groups" id="tableGroups"></div>
        </div>

        <!-- Resizer -->
        <div class="seed-resizer" id="seedResizer"></div>

        <!-- Right: file list -->
        <div class="seed-files" id="seedFiles">
            <div class="seed-empty">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <div>Загрузка...</div>
            </div>
        </div>

    </div>
</div>

<script src="/static/js/sidebar_resizer.js"></script>
<script>
async function init() {
    await loadTz();
    const [tablesResp, filesResp] = await Promise.all([
        fetch('/seed/tables').then(r => r.json()),
        fetch('/seed/files').then(r => r.json()),
    ]);

    const groups = tablesResp.result || [];
    const defaults = new Set(tablesResp.defaults || []);
    renderGroups(groups, defaults);
    renderFiles(filesResp.result || []);
}

function renderGroups(groups, defaults) {
    const container = document.getElementById('tableGroups');
    container.innerHTML = '';
    for (const group of groups) {
        const header = document.createElement('div');
        header.className = 'table-group-header';
        header.textContent = group.label;
        container.appendChild(header);
        for (const tbl of group.tables) {
            const id = `tbl_${tbl}`;
            const item = document.createElement('div');
            item.className = 'table-item';
            item.innerHTML = `<input type="checkbox" id="${id}" value="${tbl}" ${defaults.has(tbl) ? 'checked' : ''}>
                              <label for="${id}">${tbl}</label>`;
            container.appendChild(item);
        }
    }
    container.addEventListener('change', saveConfig);
}

let _saveConfigTimer = null;
function saveConfig() {
    clearTimeout(_saveConfigTimer);
    _saveConfigTimer = setTimeout(() => {
        fetch('/seed/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({tables: getSelected()}),
        });
    }, 400);
}

function renderFiles(files) {
    const wrap = document.getElementById('seedFiles');
    if (!files.length) {
        wrap.innerHTML = `<div class="seed-empty">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <div>Нет файлов. Нажмите «Сгенерировать Seed SQL»</div>
        </div>`;
        return;
    }

    const canDelete = files.length > 1;
    const rows = files.map(f => `
        <tr>
            <td class="col-name">${f.name}</td>
            <td class="col-size">${formatSize(f.size)}</td>
            <td class="col-date">${fmtTz(f.modified)}</td>
            <td class="col-actions">
                <button class="btn btn-outline" onclick="downloadSeed('${f.name}')">Скачать</button>
                <button class="btn btn-success" onclick="applySeed('${f.name}')">Применить</button>
                ${canDelete ? `<button class="btn btn-danger" onclick="deleteSeed('${f.name}')">Удалить</button>` : ''}
            </td>
        </tr>`).join('');

    wrap.innerHTML = `<table class="seed-table">
        <thead><tr>
            <th>Название</th><th>Размер</th><th>Дата</th><th>Действия</th>
        </tr></thead>
        <tbody>${rows}</tbody>
    </table>`;
}

function formatSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1048576).toFixed(2)} MB`;
}

function selectAll(checked) {
    document.querySelectorAll('#tableGroups input[type=checkbox]').forEach(cb => cb.checked = checked);
    saveConfig();
}

function getSelected() {
    return Array.from(document.querySelectorAll('#tableGroups input[type=checkbox]:checked')).map(cb => cb.value);
}

async function generateSeed() {
    const tables = getSelected();
    if (!tables.length) { showStatus('Выберите хотя бы одну таблицу', false); return; }

    const btn = document.getElementById('btnGenerate');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Генерация...';
    hideStatus();

    try {
        const resp = await fetch('/seed/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({tables}),
        }).then(r => r.json());

        if (resp.error) {
            showStatus('Ошибка: ' + resp.error, false);
        } else {
            showStatus(`Создан: ${resp.result.name} (${formatSize(resp.result.size)})`, true);
            const filesResp = await fetch('/seed/files').then(r => r.json());
            renderFiles(filesResp.result || []);
        }
    } catch (e) {
        showStatus('Ошибка: ' + e.message, false);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Сгенерировать Seed SQL';
    }
}

async function applySeed(name) {
    if (!confirm(`Применить seed к текущей базе данных?\n\n${name}\n\nINSERT IGNORE — существующие записи не перезапишутся.`)) return;
    try {
        const resp = await fetch(`/seed/apply/${name}`, {method: 'POST'}).then(r => r.json());
        if (resp.error) showStatus('Ошибка: ' + resp.error, false);
        else showStatus(resp.result, true);
    } catch (e) {
        showStatus('Ошибка: ' + e.message, false);
    }
}

function downloadSeed(name) {
    window.location.href = `/seed/download/${name}`;
}

async function deleteSeed(name) {
    if (!confirm(`Удалить файл:\n${name}`)) return;
    try {
        const resp = await fetch(`/seed/${name}`, {method: 'DELETE'}).then(r => r.json());
        if (resp.error) showStatus('Ошибка: ' + resp.error, false);
        else {
            const filesResp = await fetch('/seed/files').then(r => r.json());
            renderFiles(filesResp.result || []);
        }
    } catch (e) {
        showStatus('Ошибка: ' + e.message, false);
    }
}

function showStatus(msg, ok) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg ' + (ok ? 'ok' : 'err');
}

function hideStatus() {
    document.getElementById('statusMsg').className = 'status-msg';
}

initSidebarResizer('seedResizer', 'seed_sidebar_width', document.querySelector('.seed-sidebar'));
init();
</script>
{% endblock %}
