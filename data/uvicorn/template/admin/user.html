{% extends "base.html" %}

{% block title %}Пользователи{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/user_access_token.css">
<style>
    /* 1. Базовая компоновка (Идентично Агентам) */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    /* 2. Сайдбар Нод */
    .users-sidebar {
        width: 260px;
        background: #fafafa;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    .user-list {
        flex: 1;
        overflow-y: auto;
    }

    /* Элементы списка нод */
    .user-item {
        padding: 10px 15px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 14px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .user-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .user-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
    }

    /* Метка позиции в списке (опционально) */
    .user-pos-badge {
        font-size: 11px;
        color: #bdc3c7;
        background: #fff;
        padding: 2px 6px;
        border-radius: 10px;
        border: 1px solid #eee;
    }

    /* 3. Основная секция формы */
    .editor-section {
        flex: 1;
        padding: 20px 40px;
        overflow-y: auto;
    }

    .form-header {
        margin-bottom: 10px;
        border-bottom: 2px solid #f4f4f9;
        padding-bottom: 15px;
    }

    .form-header h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 20px;
    }

    /* 4. Двухколоночный макет (Сохраняем структуру для единообразия) */
    .form-layout-grid {
        display: flex;
        gap: 30px;
        align-items: stretch;
    }

    .settings-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .prompt-column {
        flex: 0.5;
    }

    /* Правую колонку оставляем для симметрии или доп. инфо */
    .info-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        background: #fcfcfc;
        border-radius: 8px;
        padding: 20px;
        border: 1px dashed #e0e0e0;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    .nodes-checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        background: #fafafa;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 12px;
    }

    .node-checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #2c3e50;
        cursor: pointer;
        padding: 6px 12px;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .node-checkbox-label:hover {
        border-color: #3498db;
        background: #fcfdfe;
    }

    .node-checkbox-label input[type="checkbox"] {
        cursor: pointer;
        width: 16px;
        height: 16px;
        margin: 0;
    }

    .form-group-name {
        min-width: 250px;
    }

    .form-group-info {
        font-size: 13px;
        color: #353831;
    }

    /* 5. Элементы управления */
    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    #user_nodes_select {
        min-height: 198px;
    }

    /* 6. Кнопки и Футер */
    .editor-footer {
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
        margin-top: 15px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-save:hover {
        background: #2980b9;
    }

    .btn-create {
        background: #27ae60;
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-delete {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 11px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
        margin-right: auto; /* Прижмет кнопку к левому краю футера */
    }

    .btn-delete:hover {
        background: #e74c3c;
        color: white;
    }

    /* Глазик показа пароля внутри поля */
    .password-wrap {
        position: relative;
    }

    .password-wrap .form-control {
        padding-right: 38px; /* текст не заезжает под иконку */
    }

    .password-eye {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 4px;
        color: #7f8c8d;
        opacity: 0.6;
        transition: opacity 0.15s;
    }

    .password-eye:hover {
        opacity: 1;
    }

</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список Нод (Левая колонка) -->
    <div class="users-sidebar">
        <div class="sidebar-header">
            <button class="btn-create" id="createNewUser">+ Создать пользователя</button>
        </div>
        <div class="agent-list" id="userList">
            <!-- Сюда JS будет рендерить список нод -->
        </div>
    </div>

    <!-- Форма Ноды (Правая колонка) -->
    <div class="editor-section">
        <div class="form-header">
            <h2 id="formTitle">Выберите пользователя</h2>
        </div>

        <form id="userForm">
            <input type="hidden" id="userId">

            <div class="form-layout-grid">
                <!-- Колонка 1: Основные настройки -->
                <div class="settings-column">
                    <div style="display: flex; gap: 15px; width: 100%;">
                        <div class="form-group" style="flex: 1;">
                            <label>Username</label>
                            <input type="text" id="username" class="form-control" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Email</label>
                            <input type="text" id="email" class="form-control" value="0">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Новый пароль</label>
                            <div class="password-wrap">
                                <input type="password" id="password" class="form-control"
                                       autocomplete="new-password"
                                       title="Пусто — без изменений (8 символов минимум)">
                                <button type="button" class="password-eye" id="passwordEye"
                                        title="Показать/скрыть пароль" tabindex="-1">👁</button>
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 15px; width: 100%;">
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label>Доступные ноды</label>
                            <select id="user_nodes_select" class="form-control" multiple size="10"
                                    style="height: 180px;">
                                <!-- Options will be rendered here by JS -->
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label>Роль</label>
                            <select id="role" class="form-control">
                                <!-- Options will be rendered here by JS from /role/list -->
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="editor-footer">
                <!-- Кнопка удаления -->
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none;">
                    Удалить пользователя
                </button>
                <button type="submit" class="btn-save" id="saveBtn">Сохранить пользователя</button>
            </div>

            <!-- Секция токенов доступа (доступна только при редактировании существующего пользователя) -->
            <div id="tokensSection" style="grid-column: span 2; margin-top: 30px; display: none;">
                <div style="display: flex; align-items: center; border-bottom: 2px solid #f4f4f9; padding-bottom: 10px; margin-bottom: 15px;">
                    <h3 style="margin: 0; color: #2c3e50; font-size: 14px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">
                        🔑 Токены доступа</h3>
                    <button type="button" class="btn-save" id="generateTokenBtn"
                            style="padding: 6px 15px; font-size: 12px; height: auto;margin-left: 20px">Сгенерировать новый ключ
                    </button>
                </div>
                <table class="tokens-table" style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                    <thead>
                    <tr style="background-color: #fcfcfc; border-bottom: 1px solid #eee;">
                        <th style="text-align: left; padding: 10px; font-size: 11px; color: #7f8c8d; text-transform: uppercase; font-weight: bold;">
                            Токен
                        </th>
                        <th style="text-align: right; padding: 10px; font-size: 11px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; width: 100px;">
                            Действие
                        </th>
                    </tr>
                    </thead>
                    <tbody id="tokensList">
                    <!-- JS will render tokens here -->
                    </tbody>
                </table>
            </div>
        </form>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, putData, postData, deleteData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';
    import {loadUserTokens, initTokenGeneration} from '/static/js/user_access_token.js';

    const userListContainer = document.getElementById('userList');
    const saveBtn = document.getElementById('saveBtn');
    const userForm = document.getElementById('userForm');
    const createNewUserBtn = document.getElementById('createNewUser');
    const deleteBtn = document.getElementById('deleteBtn');

    let allNodes = [];

    function renderNodeSelect(nodes) {
        const select = document.getElementById('user_nodes_select');
        if (!select) return;

        select.innerHTML = '';
        nodes.forEach(node => {
            const opt = document.createElement('option');
            opt.value = node.id;
            opt.textContent = node.name;
            select.appendChild(opt);
        });
    }

    function renderRoleSelect(roles) {
        const select = document.getElementById('role');
        if (!select) return;

        select.innerHTML = '';
        roles.forEach(role => {
            const opt = document.createElement('option');
            opt.value = role.id;
            opt.textContent = role.name;
            select.appendChild(opt);
        });
    }

    /**
     * Инициализация менеджера: загрузка списка нод
     */
    async function initUsersManager(selectedUserId = null) {
        if (!userListContainer) return;

        try {
            const [usersRes, nodesRes, rolesRes] = await Promise.all([
                getData('/user/list'),
                getData('/node/list'),
                getData('/role/list')
            ]);

            const users = usersRes.result;
            allNodes = nodesRes.result.sort((a, b) => (a.position || 0) - (b.position || 0));

            renderRoleSelect(rolesRes.result);
            renderUserList(users, selectedUserId);
            renderNodeSelect(allNodes);
        } catch (e) {
            console.error("Ошибка инициализации пользователей:", e);
        }
    }

    /**
     * Отрисовка списка в левой колонке
     */
    function renderUserList(users, selectedUserId = null) {
        userListContainer.innerHTML = '';

        if (users.length === 0) {
            userListContainer.innerHTML = '<div style="padding:20px; color:#999; font-size:13px;">Нет созданных пользователей</div>';
            return;
        }

        users.forEach(user => {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.setAttribute('data-id', user.id);

            div.innerHTML = `
                <span>${user.username}</span>
            `;

            div.onclick = () => selectUserForEdit(user.id, div);
            userListContainer.appendChild(div);
        });

        let targetUser = null;
        let targetElement = null;

        if (selectedUserId) {
            targetUser = users.find(u => u.id === parseInt(selectedUserId));
            if (targetUser) {
                targetElement = userListContainer.querySelector(`.user-item[data-id="${targetUser.id}"]`);
            }
        }

        if (!targetUser) {
            targetUser = users[0];
            targetElement = userListContainer.querySelector('.user-item');
        }

        if (targetUser && targetElement) {
            selectUserForEdit(targetUser.id, targetElement);
        }
    }

    /**
     * Загрузка данных конкретной ноды в форму
     */
    async function selectUserForEdit(userId, element) {
        // Подсветка активного элемента
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        try {
            const data = await getData(`/user/${userId}`);
            const user = data.result;

            if (!user) return;

            // Заполнение полей формы
            document.getElementById('userId').value = user.id;
            document.getElementById('username').value = user.username;
            document.getElementById('email').value = user.email;
            document.getElementById('password').value = ''; // пароль не «прилипает» между пользователями
            document.getElementById('role').value = user.role_id ?? '';

            // Update selected options in the select element
            const userNodeIds = user.node_ids || [];
            const select = document.getElementById('user_nodes_select');
            if (select) {
                Array.from(select.options).forEach(opt => {
                    opt.selected = userNodeIds.includes(parseInt(opt.value));
                });
            }

            document.getElementById('formTitle').textContent = `Редактирование пользователя: ${user.username}`;
            if (saveBtn) saveBtn.disabled = false;

            if (deleteBtn) deleteBtn.style.display = 'block';

            // Show and load tokens section
            const tokensSection = document.getElementById('tokensSection');
            if (tokensSection) tokensSection.style.display = 'block';
            await loadUserTokens(user.id);

        } catch (e) {
            console.error("Ошибка при получении данных пользователя:", e);
            showNotification('Не удалось загрузить данные пользователя', 'error');
        }
    }

    function resetFormForCreate() {
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        userForm.reset();
        document.getElementById('userId').value = '';
        document.getElementById('formTitle').textContent = 'Создание нового пользователя';
        document.getElementById('username').value = '';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        const roleSelect = document.getElementById('role');
        if (roleSelect && roleSelect.options.length > 0) roleSelect.selectedIndex = 0;

        // Clear all selections in select elements
        const select = document.getElementById('user_nodes_select');
        if (select) {
            Array.from(select.options).forEach(opt => {
                opt.selected = false;
            });
        }

        if (saveBtn) saveBtn.disabled = false;
        if (deleteBtn) deleteBtn.style.display = 'none';

        // Hide tokens section
        const tokensSection = document.getElementById('tokensSection');
        if (tokensSection) tokensSection.style.display = 'none';
        const tokensList = document.getElementById('tokensList');
        if (tokensList) tokensList.innerHTML = '';
    }

    /**
     * Сохранение (Создание или Обновление)
     */
    async function saveUserConfig(e) {
        if (e) e.preventDefault();

        // Collect selected node IDs
        const selectedNodeIds = [];
        const select = document.getElementById('user_nodes_select');
        if (select) {
            Array.from(select.selectedOptions).forEach(opt => {
                selectedNodeIds.push(parseInt(opt.value));
            });
        }

        const id = document.getElementById('userId').value;
        const roleValue = document.getElementById('role').value;
        const payload = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            role_id: roleValue ? parseInt(roleValue, 10) : null,
            node_ids: selectedNodeIds
        };

        // Пароль: только если админ заполнил поле (пустое — без изменений)
        const passwordValue = document.getElementById('password').value;
        if (passwordValue) {
            if (passwordValue.length < 8) {
                showNotification('Пароль должен быть не короче 8 символов', 'warning');
                return;
            }
            payload.password = passwordValue;
        }

        if (saveBtn) saveBtn.disabled = true;

        try {
            let targetId = id;
            if (id) {
                await putData(`/user/${id}`, payload);
                showNotification(`Пользователь "${payload.username}" обновлен`, 'success');
            } else {
                const res = await postData('/user', payload);
                showNotification(`Пользователь "${payload.username}" создан`, 'success');
                if (res && res.result && res.result.id) {
                    targetId = res.result.id;
                }
            }

            // Перезагружаем список, передавая ID редактируемого или только что созданного пользователя
            await initUsersManager(targetId);

            // Если создавали новую — форма очистится, если редактировали — данные останутся
            if (!id) resetFormForCreate();

        } catch (e) {
            console.error("Ошибка сохранения пользователя:", e);
            showNotification(`Ошибка: ${e.message}`, 'error');
        } finally {
            if (saveBtn) saveBtn.disabled = false;
        }
    }

    async function deleteUser() {
        const id = document.getElementById('userId').value;
        const username = document.getElementById('username').value;

        if (!id) return;

        if (confirm(`Вы уверены, что хотите удалить пользователя "${username}"?`)) {
            try {
                await deleteData(`/user/${id}`);
                showNotification(`Пользователь "${username}" удален`, 'success');

                resetFormForCreate();
                await initUsersManager();
            } catch (e) {
                console.error("Ошибка удаления:", e);
                showNotification(`Ошибка при удалении: ${e.message}`, 'error');
            }
        }
    }

    // Слушатели событий
    document.addEventListener('DOMContentLoaded', () => {
        // Инициализация списка
        initUsersManager();

        // Обработка отправки формы
        if (userForm) {
            userForm.addEventListener('submit', saveUserConfig);
        }

        // Кнопка "Создать пользователя"
        if (createNewUserBtn) {
            createNewUserBtn.addEventListener('click', resetFormForCreate);
        }

        // Глазик: показать/скрыть значение пароля
        const passwordEye = document.getElementById('passwordEye');
        if (passwordEye) {
            passwordEye.addEventListener('click', () => {
                const passwordInput = document.getElementById('password');
                const show = passwordInput.type === 'password';
                passwordInput.type = show ? 'text' : 'password';
                passwordEye.textContent = show ? '🙈' : '👁';
            });
        }

        if (deleteBtn) {
            deleteBtn.addEventListener('click', deleteUser);
        }

        // Кнопка "Сгенерировать токен"
        const generateTokenBtn = document.getElementById('generateTokenBtn');
        initTokenGeneration(generateTokenBtn, () => document.getElementById('userId').value);
    });
</script>
{% endblock %}
