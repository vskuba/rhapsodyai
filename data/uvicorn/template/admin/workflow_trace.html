{% extends "base.html" %}

{% block title %}Trace workflow{% endblock %}

{% block head %}
<style>
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
        flex-direction: column;
    }

    .trace-body {
        display: flex;
        flex: 1;
        min-height: 0;
    }

    /* Правая колонка: деталь запуска */
    .detail-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    /* Левая колонка: фильтры + список запусков */
    .runs-sidebar {
        width: 340px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: #fafafa;
    }

    /* Разделитель колонок: тянется мышью, ширина живет в localStorage
       (общий помощник /static/js/sidebar_resizer.js, как на agent и tool) */
    .trace-resizer {
        width: 4px;
        background: #e0e0e0;
        cursor: col-resize;
        flex-shrink: 0;
        transition: background 0.15s;
    }

    .trace-resizer:hover,
    .trace-resizer.dragging {
        background: #3498db;
    }

    .trace-filters {
        padding: 10px 12px 8px;
        border-bottom: 1px solid #e0e0e0;
    }

    .sidebar-label {
        margin-bottom: 10px;
        font-weight: bold;
        color: #4a5568;
    }

    /* ── Поиск по шагам открытого прогона ─────────────────────────────────── */
    /* ⚠ Своя строка без заголовка-колонки: у трёх фильтров слева подпись
       («НОДА», «WORKFLOW»), а здесь её место занимает значок — поле и так
       называет себя подсказкой, а узкий сайдбар дорог. */
    .step-search {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
    }

    .step-search-icon {
        flex: 0 0 auto;
        font-size: 12px;
        opacity: .65;
    }

    .trace-filters .step-search .form-control {
        flex: 1;
        min-width: 0;
        margin-bottom: 0;
    }

    .step-search-count {
        flex: 0 0 auto;
        font-size: 11px;
        color: #718096;
        white-space: nowrap;
    }

    /* Ноль совпадений — тем же красным, что «ошибка» вкладки: пустой список
       шагов сам по себе не отличить от прогона, в котором их нет */
    .step-search-count.is-none {
        color: #c93054;
        font-weight: 600;
    }

    .step-search-clear {
        flex: 0 0 auto;
        border: none;
        background: none;
        cursor: pointer;
        color: #94a3b8;
        font-size: 13px;
        line-height: 1;
        padding: 0 2px;
        visibility: hidden;
    }

    .step-search-clear:hover { color: #334155; }
    .step-search.is-on .step-search-clear { visibility: visible; }

    /* Листание совпадений внутри открытого прогона. ⚠ Было на Enter — Enter
       ушёл поиску по всем прогонам: в поле поиска он значит «искать». */
    .step-search-jump {
        flex: 0 0 auto;
        border: none;
        background: none;
        cursor: pointer;
        color: #94a3b8;
        font-size: 13px;
        line-height: 1;
        padding: 0 2px;
        visibility: hidden;
    }

    .step-search-jump:hover { color: #334155; }
    .step-search.is-on .step-search-jump { visibility: visible; }

    /* ── Полоса «ищем по всем прогонам» ───────────────────────────────────── */
    /* ⚠⚠ Видна, только когда поиск включён, и всегда, когда включён: список под
       ней показывает подмножество, и отличить его от обычной ленты больше
       нечем. */
    .search-all-banner {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        padding: 5px 8px;
        background: #eef6ff;
        border: 1px solid #bcd9f5;
        border-radius: 5px;
        font-size: 11px;
        color: #1d4e76;
    }

    .search-all-text { flex: 1; min-width: 0; }

    /* Окно поиска по шагам — тише основной подписи, но на виду: это оговорка
       к найденному, а не отдельная новость */
    .search-all-window {
        flex: 0 0 auto;
        color: #5b86ab;
        font-size: 10px;
        white-space: nowrap;
    }

    .search-all-off {
        flex: 0 0 auto;
        border: none;
        background: none;
        cursor: pointer;
        color: #4a7fae;
        font-size: 12px;
        line-height: 1;
        padding: 0 2px;
    }

    .search-all-off:hover { color: #0f3a5c; }

    /* Заголовок и поле — в одну строку: три фильтра занимают три строки */
    .filter-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
    }

    .filter-row:last-child {
        margin-bottom: 0;
    }

    /* 72px — по самому длинному заголовку (WORKFLOW ~70px): при меньшей ширине
       min-content раздвигает именно его строку, и поля перестают стоять в колонку */
    .filter-label {
        flex: 0 0 72px;
        font-size: 11px;
        font-weight: bold;
        color: #718096;
        text-transform: uppercase;
    }

    .trace-filters .form-control {
        flex: 1;
        min-width: 0;
        box-sizing: border-box;
        margin-bottom: 0;
        padding: 3px 6px;
        font-size: 12px;
    }

    .runs-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
    }

    .run-card {
        background: #fff;
        border: 1px solid #e8ecef;
        border-left: 3px solid transparent;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.15s;
    }

    .run-card:hover {
        border-color: #3498db;
    }

    .run-card.active {
        border-left-color: #3498db;
        background: #eef6fc;
    }

    .run-card .run-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 3px;
    }

    .run-title {
        display: inline-block;
        font-weight: 600;
        color: #2b6cb0;
        background: #ebf4fd;
        border: 1px solid #cfe3f7;
        border-radius: 6px;
        padding: 2px 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    .run-summary .run-title {
        margin-left: 10px;
    }

    a.run-title {
        text-decoration: none;
        cursor: pointer;
    }

    a.run-title:hover {
        text-decoration: underline;
        border-color: #2b6cb0;
    }

    .run-summary .run-name {
        margin: 0 10px;
        color: #d63434;
    }

    .run-summary .run-agent {
        color: #7f8c8d;
        font-size: 12px;
        margin-right: 10px;
        white-space: nowrap;
    }

    .run-summary .run-agent a {
        color: #2b6cb0;
        font-weight: 600;
        text-decoration: none;
    }

    .run-summary .run-agent a:hover {
        text-decoration: underline;
    }

    .run-summary .status-badge {
        margin-right: 10px;
    }

    .run-card .run-meta {
        color: #7f8c8d;
        font-size: 11px;
    }

    .run-card .run-prompt {
        color: #4a5568;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 3px;
    }

    .status-badge {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 9px;
        font-weight: 600;
    }

    .status-success {
        background: #eafaf1;
        color: #1e8449;
    }

    .status-error {
        background: #fdecea;
        color: #c0392b;
    }

    .status-running {
        background: #fef9e7;
        color: #b7950b;
    }

    .status-retry {
        background: #fef9e7;
        color: #b7950b;
    }

    .status-stopped {
        background: #eaecee;
        color: #566573;
    }

    .runs-pager {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid #e0e0e0;
        font-size: 12px;
        color: #7f8c8d;
    }

    .runs-pager button {
        background: #fff;
        border: 1px solid #d6dbe0;
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
    }

    .runs-pager button:disabled {
        opacity: 0.4;
        cursor: default;
    }

    /* Деталь запуска */
    .run-detail {
        flex: 1;
        overflow-y: auto;
        padding: 16px 24px;
    }

    .run-summary {
        background: #fafbfc;
        border: 1px solid #e8ecef;
        border-radius: 8px;
        padding: 3px 4px;
        margin-bottom: 14px;
        font-size: 13px;
    }

    /* Шапка прогона — единственный ряд, который идёт строкой: номер, workflow,
       агент, статус, время.
       ⚠⚠ Отбор `> .row:first-child`, а не `.row:first-child`: второй ловит
       первый ряд ЛЮБОГО контейнера. Поймано кадром, когда сводку разделили на
       две колонки, — «Запрос» и «Request contract» оказались первыми в своих
       колонках, и подпись встала сбоку от значения вместо того, чтобы стоять
       над ним. */
    .run-summary > .row:first-child {
        display: flex;
        flex-direction: row;
        align-items: center;
        flex-wrap: nowrap;
    }

    .run-summary .row {
        margin-bottom: 6px;
    }

    .run-summary .label {
        color: #7f8c8d;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: bold;
    }

    /* ── Две колонки сводки: слева вход/выход workflow, справа контракт вызова ──
       ⚠ Колонки равные: справа лежит JSON, а он шире текста реплики — отдай
       левой больше, и контракт пришлось бы читать по складам.
       ⚠ Ниже 1100px колонки встают друг под друга: при двух колонках на узком
       экране `pre` с JSON уезжает в горизонтальный скролл. */
    .contract-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        align-items: start;
    }

    @media (max-width: 1100px) {
        .contract-cols { grid-template-columns: 1fr; }
    }

    .contract-col { min-width: 0; }

    /* Пусто — это ответ, а не прочерк: почему пусто, сказано словами */
    .contract-empty {
        margin: 4px 0 0;
        color: #a0aab4;
        font-size: 11px;
        font-style: italic;
        line-height: 1.4;
    }

    .run-summary pre {
        margin: 4px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #fff;
        border: 1px solid #edf2f7;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 12px;
    }

    .run-summary .run-meta-time {
        color: #e12020;
        font-size: 13px;
        padding: 0 15px;
    }

    /* Таймлайн шагов */
    .step-row {
        border: 1px solid #e8ecef;
        border-radius: 6px;
        margin-bottom: 6px;
        background: #fff;
    }

    .step-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
    }

    .step-head:hover {
        background: #f8fafc;
    }

    .step-head .step-index {
        color: #94a3b8;
        font-size: 11px;
        min-width: 22px;
    }

    .step-head .step-icon {
        min-width: 22px;
        text-align: center;
    }

    .step-head .step-name {
        flex: 1;
        font-weight: 600;
        color: #2c3e50;
    }

    .step-head .step-duration {
        color: #7f8c8d;
        font-size: 11px;
    }

    .step-head .step-duration.step-duration-slow {
        background: #ffecec;
        color: #c93054;
        font-weight: 700;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 10px;
    }

    .step-head .step-tokens {
        color: #6c757d;
        font-size: 11px;
        font-family: monospace;
        background: #f0f4f8;
        border-radius: 3px;
        padding: 1px 5px;
    }

    .step-head .step-transition-mark {
        color: #8e44ad;
        font-size: 11px;
    }

    /* ── Состояния шага под поиском ───────────────────────────────────────── */
    /* ⚠ Несовпавшее прячется, а не бледнеет: прогон бывает на 167 шагов, и
       среди них полтора десятка бледных не найти глазами. Номер шага (#N)
       остаётся прежним, поэтому порядок не теряется. */
    .step-row.step-hidden,
    .child-run.step-hidden { display: none; }

    .step-row.step-match { border-color: #f0c674; }
    .step-row.step-match > .step-head { background: #fffbea; }

    /* Куда прыгнул Enter — видно рамкой: подсветка совпадений внутри одинакова
       у всех, и без этого «следующее» неотличимо от «того же самого» */
    .step-row.step-match-current { border-color: #e8912d; box-shadow: 0 0 0 2px #fde8c8; }

    mark.search-hit {
        background: #ffe066;
        color: inherit;
        padding: 0 1px;
        border-radius: 2px;
    }

    .step-details {
        display: none;
        border-top: 1px solid #edf2f7;
        padding: 10px 12px;
        font-size: 12px;
    }

    .step-row.open .step-details {
        display: block;
    }

    .step-details .section {
        margin-bottom: 10px;
    }

    /* Ряд из двух блоков: вход слева, сопутствующие данные справа */
    .step-details .section-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
    }

    .step-details .section-row .section {
        margin-bottom: 0;
        min-width: 0;
    }

    /* Визуальная расшифровка перехода: шаг → шаг с условием под стрелкой */
    .transition-visual {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        border: 1px solid #edf2f7;
        border-radius: 4px;
        padding: 12px 10px;
        font-size: 12px;
    }

    /* Карточка шага в стиле редактора workflow (agent_workflow.html: .step-item-block) */
    .transition-step {
        flex: 0 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px 12px;
        transition: background 0.2s, border-color 0.2s;
    }

    .transition-step:hover {
        border-color: #3498db;
        background: #fcfdfe;
    }

    .transition-step .step-number-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        background-color: #3498db;
        color: white;
        border-radius: 50%;
        font-size: 12px;
        font-weight: bold;
        margin-right: 10px;
        flex-shrink: 0;
    }

    .transition-step .step-type-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        margin-right: 6px;
        flex-shrink: 0;
    }

    .transition-step .step-title-text {
        font-weight: 500;
        color: #2c3e50;
        font-size: 13px;
        word-break: break-word;
    }

    .transition-arrow-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 70px;
        gap: 1px;
    }

    .transition-phase {
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        color: #94a3b8;
        letter-spacing: 0.5px;
    }

    .transition-arrow {
        color: #8e44ad;
        font-size: 17px;
        line-height: 1;
    }

    .transition-condition {
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 10.5px;
        color: #8e44ad;
        background: #f5ecfb;
        border: 1px solid #e8d8f3;
        border-radius: 8px;
        padding: 1px 8px;
        margin-top: 2px;
        text-align: center;
        word-break: break-word;
    }

    /* Metadata по ключам: зебра-фон для каждого ключа */
    .meta-kv-list {
        background: #f8fafc;
        border: 1px solid #edf2f7;
        border-radius: 4px;
        max-height: 320px;
        overflow: auto;
    }

    .step-details .meta-kv-list pre.meta-kv {
        background: transparent;
        border: none;
        border-radius: 0;
        max-height: none;
        overflow: visible;
    }

    .meta-kv-list pre.meta-kv:nth-child(even) {
        background: #eceef2;
    }

    .meta-kv-list pre.meta-kv + pre.meta-kv {
        border-top: 1px solid #e3e9f0;
    }

    /* Список переменных шага: имя + значение */
    .vars-list {
        list-style: none;
        margin: 0;
        padding: 0;
        background: #f8fafc;
        border: 1px solid #edf2f7;
        border-radius: 4px;
        max-height: 320px;
        overflow: auto;
    }

    .vars-list li {
        padding: 6px 10px;
        border-bottom: 1px solid #edf2f7;
        font-size: 11.5px;
    }

    .vars-list li:last-child {
        border-bottom: none;
    }

    .var-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
    }

    .var-name {
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-weight: 600;
        font-size: 11px;
        color: #8e44ad;
        background: #f5ecfb;
        border: 1px solid #e8d8f3;
        border-radius: 4px;
        padding: 1px 6px;
        white-space: nowrap;
    }

    .var-sep {
        color: #94a3b8;
        font-weight: 600;
    }

    /* Откуда у переменной значение: снапшот старта либо конкретный шаг */
    .var-source {
        font-size: 10px;
        font-weight: 600;
        color: #92400e;
        background: #fef3c7;
        border: 1px solid #fde68a;
        border-radius: 8px;
        padding: 1px 7px;
        white-space: nowrap;
    }

    .var-source-start {
        color: #475569;
        background: #eef2f7;
        border-color: #dbe3ec;
    }

    /* Переменная объявлена, но в прогоне значения не получила — показано умолчание */
    .var-source-default {
        color: #9a3412;
        background: #fff1e7;
        border-color: #fed7aa;
    }

    /* К какой группе относится переменная («Входящие», «Workflow»…): в пилюле
       только значок группы, вся подпись живёт подсказкой. Акценты — те же, что
       полоса `.variable-item-*` на панели редактора: один цвет читается в двух
       местах, а не два разных. */
    .var-group {
        font-size: 10px;
        font-weight: 600;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 1px 4px;
        white-space: nowrap;
    }

    .var-group-input {
        color: #0e7490;
        background: #d9f7fb;
        border-color: #26c6da;
    }

    .var-group-common {
        color: #166534;
        background: #e3f9e5;
        border-color: #9bd9aa;
    }

    .var-group-node {
        color: #854d0e;
        background: #fff8dd;
        border-color: #ffd73b;
    }

    .var-group-tool {
        color: #9d174d;
        background: #fde8f5;
        border-color: #f488d5;
    }

    .var-group-workflow {
        color: #1e40af;
        background: #e8f1fd;
        border-color: #2974df;
    }

    /* Пунктир, как полоса динамических в редакторе: их никто не заводил, они
       появляются в прогоне сами */
    .var-group-dynamic {
        color: #5b21b6;
        background: #ece6f8;
        border-color: #9575cd;
        border-style: dashed;
    }

    .var-group-unknown {
        color: #475569;
        background: #eef2f7;
        border-color: #dbe3ec;
        border-style: dashed;
    }

    /* ⚠ «Undefined переменные»: имя читают шаги, но не кладёт никто. Сплошная
       красная рамка — дырка, а не «нет группы» (пунктир `unknown`); в прогоне на
       таком имени пусто. Тот же красный, что в редакторе. */
    .var-group-undefined {
        color: #b4231d;
        background: #fef2f2;
        border-color: #dc2626;
    }

    .var-desc {
        margin-top: 3px;
        font-size: 10.5px;
        color: #94a3b8;
    }

    .var-type {
        font-size: 10px;
        font-weight: 600;
        color: #64748b;
        background: #eef2f7;
        border-radius: 8px;
        padding: 1px 7px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .var-value-inline {
        color: #2c3e50;
        white-space: pre-wrap;
        word-break: break-word;
        min-width: 0;

    .var-value-empty {

    .vars-list pre.var-value-complex {

    /* Вложенный запуск sub-workflow */

        font-weight: 600;
        color: #2563eb;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 1px 7px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

    /* Блок статистики LLM */
    .llm-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
    }

    .llm-stat-item {
        font-size: 11px;
        font-weight: 600;
        color: #1d4ed8;
        background: #dbeafe;

    .token-stat-item {
        font-size: 11px;
        font-weight: 600;
        color: #065f46;
        background: #d1fae5;
        border: 1px solid #a7f3d0;
        border-radius: 8px;
        padding: 2px 9px;
        white-space: nowrap;

    /* Переменные: два аккордеона рядом — значения прогона и реестр workflow */
    .vars-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 10px;
        align-items: start;

    .vars-col {

        border: 1px solid #bfdbfe;

    .vars-toggle {

    .vars-body {

    }

    .child-run .vars-row {
        margin-bottom: 6px;
    }

    .child-run .vars-row .label {
        color: #7f8c8d;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: bold;
    }

    .child-run .vars-row > pre {
        margin: 4px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #fff;
        border: 1px solid #edf2f7;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 12px;

    .btn-delete-run {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        margin-left: auto;
    }

    .btn-replay-run {
        background: transparent;
        color: #2b6cb0;
        border: 1px solid #2b6cb0;
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 12px;

        margin-left: 8px;

    .btn-replay-run:disabled {

        cursor: default;
    }

    /* Стоп выполняющегося запуска: заметная красная заливка */
    .btn-stop-run {
        background: #e74c3c;
        color: #fff;
        border: 1px solid #e74c3c;
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        margin-left: 8px;
    }

    .btn-stop-run:hover {
        background: #c0392b;
        border-color: #c0392b;
    }

    .btn-stop-run:disabled {
        opacity: 0.5;
        cursor: default;
    }

    .empty-note {
        color: #999;
        text-align: center;
        padding: 40px 0;
        font-size: 13px;
    }

    /* Вкладки статусов */
    .status-tabs {
        display: flex;
        border-bottom: 1px solid #e0e0e0;
        background: #fafafa;
    }

    .status-tab {
        flex: 1;
        padding: 8px 4px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        color: #7f8c8d;
        border-bottom: 2px solid transparent;
        transition: all 0.15s;
        user-select: none;
    }

    .status-tab:hover {
        color: #2c3e50;
        background: #f0f0f0;
    }

    .status-tab.active {
        color: #2c3e50;
        border-bottom-color: #3498db;
        background: #fff;
    }

    .status-tab.tab-running.active {
        border-bottom-color: #b7950b;
        color: #b7950b;
    }

    .status-tab.tab-success.active {
        border-bottom-color: #1e8449;
        color: #1e8449;
    }

    .status-tab.tab-error.active {
        border-bottom-color: #c0392b;
        color: #c0392b;
    }

    .status-tab.tab-stopped.active {
        border-bottom-color: #7f8c8d;
        color: #7f8c8d;
    }

    /* Стоп-кнопка (красный квадрат) на карточке в списке */
    .btn-stop-card {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        background: #e74c3c;
        color: #fff;

        border-radius: 3px;

        flex-shrink: 0;

    }

    .btn-stop-card:hover {
        background: #c0392b;
    }

    .btn-stop-card:disabled {
        opacity: 0.5;
        cursor: default;
    }

    @keyframes running-pulse {

        }
