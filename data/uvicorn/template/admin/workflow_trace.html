{% extends "base.html" %}

{% block title %}Trace workflow{% endblock %}

{% block head %}
<style>
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
        flex-direction: column;
    }

    .trace-body {
        display: flex;
        flex: 1;
        min-height: 0;
    }

    /* Правая колонка: деталь запуска */
    .detail-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    /* Левая колонка: фильтры + список запусков */
    .runs-sidebar {
        width: 340px;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        background: #fafafa;
    }

    .trace-filters {
        padding: 15px 15px 10px;
        border-bottom: 1px solid #e0e0e0;
    }

    .sidebar-label {
        margin-bottom: 10px;
        font-weight: bold;
        color: #4a5568;
    }

    .filter-label {
        display: block;
        font-size: 11px;
        font-weight: bold;
        color: #718096;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .trace-filters .form-control {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
    }

    .runs-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
    }

    .run-card {
        background: #fff;
        border: 1px solid #e8ecef;
        border-left: 3px solid transparent;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.15s;
    }

    .run-card:hover {
        border-color: #3498db;
    }

    .run-card.active {
        border-left-color: #3498db;
        background: #eef6fc;
    }

    .run-card .run-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 3px;
    }

    .run-title {
        display: inline-block;
        font-weight: 600;
        color: #2b6cb0;
        background: #ebf4fd;
        border: 1px solid #cfe3f7;
        border-radius: 6px;
        padding: 2px 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    .run-card .run-meta {
        color: #7f8c8d;
        font-size: 11px;
    }

    .run-card .run-prompt {
        color: #4a5568;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 3px;
    }

    .status-badge {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 9px;
        font-weight: 600;
    }

    .status-success {
        background: #eafaf1;
        color: #1e8449;
    }

    .status-error {
        background: #fdecea;
        color: #c0392b;
    }

    .status-running {
        background: #fef9e7;
        color: #b7950b;
    }

    .status-retry {
        background: #fef9e7;
        color: #b7950b;
    }

    .runs-pager {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid #e0e0e0;
        font-size: 12px;
        color: #7f8c8d;
    }

    .runs-pager button {
        background: #fff;
        border: 1px solid #d6dbe0;
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
    }

    .runs-pager button:disabled {
        opacity: 0.4;
        cursor: default;
    }

    /* Деталь запуска */
    .run-detail {
        flex: 1;
        overflow-y: auto;
        padding: 16px 24px;
    }

    .run-summary {
        background: #fafbfc;
        border: 1px solid #e8ecef;
        border-radius: 8px;
        padding: 3px 4px;
        margin-bottom: 14px;
        font-size: 13px;
    }

    .row:first-child {
        display: flex;
        flex-direction: row;
        align-items: center;
        flex-wrap: nowrap;
    }

    .run-summary .row {
        margin-bottom: 6px;
    }

    .run-summary .label {
        color: #7f8c8d;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: bold;
    }

    .run-summary pre {
        margin: 4px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #fff;
        border: 1px solid #edf2f7;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 12px;
    }

    .run-summary .run-meta-time {
        color: #e12020;
        font-size: 13px;
        padding: 0 15px;
    }

    /* Таймлайн шагов */
    .step-row {
        border: 1px solid #e8ecef;
        border-radius: 6px;
        margin-bottom: 6px;
        background: #fff;
    }

    .step-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
    }

    .step-head:hover {
        background: #f8fafc;
    }

    .step-head .step-index {
        color: #94a3b8;
        font-size: 11px;
        min-width: 22px;
    }

    .step-head .step-icon {
        min-width: 22px;
        text-align: center;
    }

    .step-head .step-name {
        flex: 1;
        font-weight: 600;
        color: #2c3e50;
    }

    .step-head .step-duration {
        color: #7f8c8d;
        font-size: 11px;
    }

    .step-head .step-transition-mark {
        color: #8e44ad;
        font-size: 11px;
    }

    .step-details {
        display: none;
        border-top: 1px solid #edf2f7;
        padding: 10px 12px;
        font-size: 12px;
    }

    .step-row.open .step-details {
        display: block;
    }

    .step-details .section {
        margin-bottom: 10px;
    }

    .step-details .section-title {
        font-size: 11px;
        text-transform: uppercase;
        color: #7f8c8d;
        font-weight: bold;
        margin-bottom: 4px;
    }

    .step-details pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #f8fafc;
        border: 1px solid #edf2f7;
        border-radius: 4px;
        padding: 8px;
        font-size: 11.5px;
        max-height: 320px;
        overflow: auto;
    }

    /* Вложенный запуск sub-workflow */
    .child-run {
        margin: 8px 0 4px 26px;
        border-left: 3px solid #f39c12;
        padding-left: 10px;
    }

    .child-run .child-title {
        font-size: 12px;
        font-weight: 600;
        color: #9c640c;
        margin-bottom: 6px;
    }

    .btn-delete-run {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        margin-left: auto;
    }

    .btn-replay-run {
        background: transparent;
        color: #2b6cb0;
        border: 1px solid #2b6cb0;
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        margin-left: 8px;
    }

    .btn-replay-run:disabled {
        opacity: 0.5;
        cursor: default;
    }

    .empty-note {
        color: #999;
        text-align: center;
        padding: 40px 0;
        font-size: 13px;
    }
</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <div class="trace-body">
        <div class="runs-sidebar">
            <!-- Фильтры: изменение любого сразу перезагружает список -->
            <div class="trace-filters">
                <div class="sidebar-label">Фильтры</div>

                <label for="filterWorkflow" class="filter-label">Workflow</label>
                <select id="filterWorkflow" class="form-control">
                    <option value="">Все workflow</option>
                </select>

                <label for="filterAgent" class="filter-label">Агент</label>
                <select id="filterAgent" class="form-control">
                    <option value="">Все агенты</option>
                </select>

                <label for="filterStatus" class="filter-label">Статус</label>
                <select id="filterStatus" class="form-control">
                    <option value="">Любой статус</option>
                    <option value="success">success</option>
                    <option value="error">error</option>
                    <option value="running">running</option>
                </select>
            </div>

            <div class="runs-list" id="runsList">
                <div class="empty-note">Загрузка...</div>
            </div>
            <div class="runs-pager">
                <button type="button" id="pagePrev">‹</button>
                <span id="pageInfo">—</span>
                <button type="button" id="pageNext">›</button>
            </div>
        </div>

        <div class="detail-column">
            <div class="run-detail" id="runDetail">
                <div class="empty-note">Выберите запуск слева</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, postData, deleteData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';

    const runsList = document.getElementById('runsList');
    const runDetail = document.getElementById('runDetail');

    const state = {page: 1, totalPages: 1, activeRunUuid: null, stepTypeIcons: {}};

    function fmtDuration(ms) {
        if (ms === null || ms === undefined) return '';
        return ms >= 1000 ? (ms / 1000).toFixed(1) + ' с' : ms + ' мс';
    }

    function fmtDate(value) {
        if (!value) return '';
        return String(value).replace('T', ' ').slice(0, 19);
    }

    // Безопасный текстовый элемент
    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
    }

    function prettyJson(raw) {
        if (raw === null || raw === undefined || raw === '') return null;
        try {
            return JSON.stringify(typeof raw === 'string' ? JSON.parse(raw) : raw, null, 2);
        } catch {
            return String(raw);
        }
    }

    async function init() {
        // Справочники для фильтров и иконок типов шагов
        try {
            const [workflowsRes, agentsRes, typesRes] = await Promise.all([
                getData('/workflow/list'),
                getData('/agent/list'),
                getData('/workflow_step/list'),
            ]);

            const wfSel = document.getElementById('filterWorkflow');
            (workflowsRes.result || []).forEach(w => {
                const opt = el('option', null, w.title || w.name);
                opt.value = w.id;
                wfSel.appendChild(opt);
            });

            const agSel = document.getElementById('filterAgent');
            (agentsRes.result || []).forEach(a => {
                const opt = el('option', null, a.title || a.name);
                opt.value = a.id;
                agSel.appendChild(opt);
            });

            (typesRes.result || []).forEach(t => {
                state.stepTypeIcons[t.name] = t.icon;
            });
        } catch (e) {
            console.error('Ошибка загрузки справочников:', e);
        }

        await loadRuns();
    }

    async function loadRuns() {
        const params = new URLSearchParams({page: state.page, limit: 30});
        const wf = document.getElementById('filterWorkflow').value;
        const ag = document.getElementById('filterAgent').value;
        const st = document.getElementById('filterStatus').value;
        if (wf) params.set('workflow_id', wf);
        if (ag) params.set('agent_id', ag);
        if (st) params.set('status', st);

        try {
            const data = await getData(`/workflow_trace/run/list?${params}`);
            state.totalPages = data.pagination.total_pages;
            document.getElementById('pageInfo').textContent =
                `${data.pagination.current_page} / ${data.pagination.total_pages} (${data.pagination.total_records})`;
            document.getElementById('pagePrev').disabled = state.page <= 1;
            document.getElementById('pageNext').disabled = state.page >= state.totalPages;
            renderRuns(data.result || []);
        } catch (e) {
            console.error('Ошибка загрузки запусков:', e);
            runsList.innerHTML = '';
            runsList.appendChild(el('div', 'empty-note', 'Ошибка загрузки'));
        }
    }

    function renderRuns(runs) {
        runsList.innerHTML = '';

        if (runs.length === 0) {
            runsList.appendChild(el('div', 'empty-note', 'Запусков нет'));
            return;
        }

        let firstCard = null;

        runs.forEach(run => {
            const card = el('div', 'run-card');
            if (run.run_uuid === state.activeRunUuid) card.classList.add('active');

            const head = el('div', 'run-head');
            head.appendChild(el('span', 'run-title', run.workflow_title || `workflow ${run.workflow_id}`));
            head.appendChild(el('span', `status-badge status-${run.status}`, run.status));
            card.appendChild(head);

            const meta = el('div', 'run-meta',
                `${fmtDate(run.started_at)} · ${run.agent_title || ''} · ${fmtDuration(run.duration_ms)}` +
                ` · шагов: ${run.steps_qty}` + (run.children_qty > 0 ? ` · subflow: ${run.children_qty}` : ''));
            card.appendChild(meta);
            card.appendChild(el('div', 'run-prompt', run.prompt_user || ''));

            card.onclick = () => {
                document.querySelectorAll('.run-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                state.activeRunUuid = run.run_uuid;
                loadRunDetail(run.run_uuid);
            };
            runsList.appendChild(card);

            if (!firstCard) firstCard = card;
        });

        // При открытии страницы автоматически показываем последний (верхний) запуск
        if (!state.activeRunUuid && firstCard) firstCard.click();
    }

    async function loadRunDetail(runUuid) {
        runDetail.innerHTML = '';
        runDetail.appendChild(el('div', 'empty-note', 'Загрузка...'));
        try {
            const data = await getData(`/workflow_trace/run/${runUuid}`);
            renderRunDetail(data.result);
        } catch (e) {
            console.error('Ошибка загрузки запуска:', e);
            runDetail.innerHTML = '';
            runDetail.appendChild(el('div', 'empty-note', 'Ошибка загрузки запуска'));
        }
    }

    function renderRunDetail(run) {
        runDetail.innerHTML = '';

        // Сводка запуска
        const summary = el('div', 'run-summary');
        const headRow = el('div', 'row');
        headRow.appendChild(el('span', 'run-title', `${run.workflow_title || run.workflow_name || ''} `));
        headRow.appendChild(el('span', `status-badge status-${run.status}`, run.status));
        headRow.appendChild(el('span', 'run-meta', `  ${fmtDate(run.started_at)}`));
        headRow.appendChild(el('span', 'run-meta-time', `  ${fmtDuration(run.duration_ms)}`));

        // Replay: повторный прогон workflow с сохраненным снапшотом переменных.
        // Шаги берутся из текущего определения workflow, история пишется в новую сессию.
        const replayBtn = el('button', 'btn-replay-run', '▶️ Повторить');
        replayBtn.onclick = async () => {
            if (!confirm('Повторить запуск с теми же входными переменными? Workflow выполнится по-настоящему.')) return;
            replayBtn.disabled = true;
            replayBtn.textContent = 'Выполняется…';
            try {
                await postData(`/workflow_trace/run/${run.run_uuid}/replay`, {});
                showNotification('Запуск повторен', 'success');
                // Сбрасываем выбор: loadRuns автоматически откроет свежий (replay) запуск
                state.activeRunUuid = null;
                state.page = 1;
                await loadRuns();
            } catch (e) {
                showNotification(`Ошибка replay: ${e.message}`, 'error');
                replayBtn.disabled = false;
                replayBtn.textContent = '▶️ Повторить';
            }
        };

        const delBtn = el('button', 'btn-delete-run', 'Удалить лог');
        delBtn.style.float = 'right';
        delBtn.onclick = async () => {
            if (!confirm('Удалить этот запуск из журнала?')) return;
            try {
                await deleteData(`/workflow_trace/run/${run.run_uuid}`);
                showNotification('Запуск удален', 'success');
                runDetail.innerHTML = '';
                runDetail.appendChild(el('div', 'empty-note', 'Выберите запуск слева'));
                state.activeRunUuid = null;
                await loadRuns();
            } catch (e) {
                showNotification(`Ошибка удаления: ${e.message}`, 'error');
            }
        };
        headRow.appendChild(delBtn);
        headRow.appendChild(replayBtn);
        summary.appendChild(headRow);

        const promptRow = el('div', 'row');
        promptRow.appendChild(el('div', 'label', 'Запрос'));
        const promptPre = el('pre', null, run.prompt_user || '—');
        promptRow.appendChild(promptPre);
        summary.appendChild(promptRow);

        const resultRow = el('div', 'row');
        resultRow.appendChild(el('div', 'label', run.status === 'error' ? 'Ошибка' : 'Результат'));
        resultRow.appendChild(el('pre', null, (run.status === 'error' ? run.error : run.result) || '—'));
        summary.appendChild(resultRow);

        runDetail.appendChild(summary);

        // Таймлайн шагов (с рекурсией для sub-workflow)
        runDetail.appendChild(renderRunTimeline(run));
    }

    function renderRunTimeline(run) {
        const container = document.createElement('div');

        // Дочерние запуски привязываются к породившему их шагу
        const childrenByStep = {};
        (run.children || []).forEach(child => {
            const key = String(child.parent_step_id);
            (childrenByStep[key] ||= []).push(child);
        });

        (run.steps || []).forEach(step => {
            const row = el('div', 'step-row');
            const head = el('div', 'step-head');

            head.appendChild(el('span', 'step-index', `Шаг #${step.exec_index}`));
            head.appendChild(el('span', 'step-icon', state.stepTypeIcons[step.step_type] || '·'));
            head.appendChild(el('span', 'step-name', step.step_title || step.step_type));
            if (step.transition) head.appendChild(el('span', 'step-transition-mark', '🔀'));
            head.appendChild(el('span', `status-badge status-${step.status}`, step.status));
            head.appendChild(el('span', 'step-duration', fmtDuration(step.duration_ms)));

            head.onclick = () => row.classList.toggle('open');
            row.appendChild(head);

            // Детали шага: вход / выход / output / переход / ошибка
            const details = el('div', 'step-details');
            const sections = [
                ['Переход', prettyJson(step.transition)],
                ['Вход (metadata после рендера)', prettyJson(step.metadata_rendered)],
                ['Выход (измененные переменные)', prettyJson(step.variables_changed)],
                ['Raw output', step.output],
                ['Ошибка', step.error],
            ];
            sections.forEach(([title, value]) => {
                if (value === null || value === undefined || value === '' || value === '{}') return;
                const section = el('div', 'section');
                section.appendChild(el('div', 'section-title', title));
                section.appendChild(el('pre', null, value));
                details.appendChild(section);
            });
            row.appendChild(details);

            container.appendChild(row);

            // Вложенные запуски sub-workflow под шагом workflow_invoke
            (childrenByStep[String(step.step_id)] || []).forEach(child => {
                const block = el('div', 'child-run');
                const title = el('div', 'child-title');
                title.textContent = `🔁 ${child.workflow_title || child.workflow_name || 'sub-workflow'} `;
                const badge = el('span', `status-badge status-${child.status}`, child.status);
                title.appendChild(badge);
                title.appendChild(el('span', 'run-meta', ` ${fmtDuration(child.duration_ms)}`));
                block.appendChild(title);
                block.appendChild(renderRunTimeline(child));
                container.appendChild(block);
            });
        });

        return container;
    }

    // Слушатели: изменение фильтра сразу перезагружает список
    document.getElementById('filterWorkflow').onchange = () => {
        state.page = 1;
        loadRuns();
    };
    document.getElementById('filterAgent').onchange = () => {
        state.page = 1;
        loadRuns();
    };
    document.getElementById('filterStatus').onchange = () => {
        state.page = 1;
        loadRuns();
    };
    document.getElementById('pagePrev').onclick = () => {
        if (state.page > 1) {
            state.page--;
            loadRuns();
        }
    };
    document.getElementById('pageNext').onclick = () => {
        if (state.page < state.totalPages) {
            state.page++;
            loadRuns();
        }
    };

    init();
</script>
{% endblock %}
