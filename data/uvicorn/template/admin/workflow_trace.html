        }
    }

    .step-running-current {
        border-color: #b7950b;
        background: linear-gradient(90deg, #fffdf0, #fef9e7, #fffdf0);
        background-size: 200% 100%;
        animation: running-pulse 1.4s ease-in-out infinite;
    }
</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <div class="trace-body">
        <div class="runs-sidebar">
            <!-- Вкладки статусов -->
            <div class="status-tabs">
                <div class="status-tab tab-running" data-status="running">▶ Running</div>
                <div class="status-tab tab-success" data-status="success">✓ Success</div>
                <div class="status-tab tab-error" data-status="error">✕ Error</div>
                <div class="status-tab tab-stopped" data-status="stopped">■ Stopped</div>
            </div>

            <!-- Фильтры: изменение любого сразу перезагружает список -->
            <div class="trace-filters">
                <!-- ⚠⚠ Поиск ищет в ОТКРЫТОМ прогоне, а не по списку слева: три
                     селекта под ним отбирают прогоны, это поле — шаги внутри
                     одного. Разница названа прямо в подсказке поля: иначе человек
                     наберёт текст, список не шелохнётся, и поле сочтут сломанным. -->
                <div class="step-search">
                    <span class="step-search-icon">🔍</span>
                    <input type="text" id="stepSearch" class="form-control" autocomplete="off"
                           placeholder="Поиск: набор — в прогоне, Enter — по всем"
                           title="Набор фильтрует шаги открытого справа прогона. Enter ищет по ВСЕМ прогонам — в их запросах, ответах, контрактах и шагах, с учётом отбора слева. Esc — очистить">
                    <span class="step-search-count" id="stepSearchCount"></span>
                    <button type="button" class="step-search-jump" id="stepSearchJump"
                            title="К следующему совпадению в открытом прогоне">↓</button>
                    <button type="button" class="step-search-clear" id="stepSearchClear"
                            title="Очистить (Esc)">✕</button>
                </div>

                <!-- Полоса поиска по всем прогонам: видна, только когда он включён -->
                <div class="search-all-banner" id="searchAllBanner" style="display:none;"></div>

                <div class="filter-row">
                    <label for="filterNode" class="filter-label">Нода</label>
                    <select id="filterNode" class="form-control">
                        <option value="">Все ноды</option>
                    </select>
                </div>

                <div class="filter-row">
                    <label for="filterWorkflow" class="filter-label">Workflow</label>
                    <select id="filterWorkflow" class="form-control">
                        <option value="">Все workflow</option>
                    </select>
                </div>

                <div class="filter-row">
                    <label for="filterAgent" class="filter-label">Агент</label>
                    <select id="filterAgent" class="form-control">
                        <option value="">Все агенты</option>
                    </select>
                </div>

                <!-- ⚠ Модель НЕ сужается нодой, в отличие от workflow и агента:
                     она записана у шага прогона, а не у агента, и одна и та же
                     модель законно встречается в прогонах разных нод. -->
                <div class="filter-row">
                    <label for="filterLlm" class="filter-label">LLM</label>
                    <select id="filterLlm" class="form-control">
                        <option value="">Все LLM</option>
                    </select>
                </div>
            </div>

            <div class="runs-list" id="runsList">
                <div class="empty-note">Загрузка...</div>
            </div>
            <div class="runs-pager">
                <button type="button" id="pagePrev">‹</button>
                <span id="pageInfo">—</span>
                <button type="button" id="pageNext">›</button>
            </div>
        </div>

        <div class="trace-resizer" id="traceResizer"></div>

        <div class="detail-column">
            <div class="run-detail" id="runDetail">
                <div class="empty-note">Выберите запуск слева</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/sidebar_resizer.js"></script>
<script type="module">
    import {getData, postData, deleteData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';
    // Правило «к какой группе относится переменная» живёт отдельным чистым модулем:
    // список трассы и панель редактора размечают группы одним кодом.
    // ⚠ Именно `variable-group.js`, а не `variables.js`: второй — панель редактора,
    // и тянет за собой её обвязку вплоть до обработчика на форме шага
    import {variableGroupIndex, VAR_GROUP_UNKNOWN} from '/static/js/workflow/variable-group.js';

    const runsList = document.getElementById('runsList');
    const runDetail = document.getElementById('runDetail');

    // Справочники нужны разбору переменных прогона: имя tool-переменной строится
    // из имени инструмента и его выходных ключей, имя под-запуска — из имени workflow
    // ⚠ `searchAll` — поиск по ВСЕМ прогонам (Enter в поле поиска). Пусто —
    // список живёт обычной жизнью. В `localStorage` не пишется: отбор, молча
    // переживший перезагрузку, показывал бы ленту, которая выглядит полной.
    const state = {page: 1, totalPages: 1, activeRunUuid: null, stepTypeIcons: {}, activeTab: 'running',
                  workflows: [], agents: [], tools: [], searchAll: ''};

    // Смещение часового пояса из настроек (минуты), применяется в fmtDate
    let _tzOffsetMinutes = 0;

    function fmtDuration(ms) {
        if (ms === null || ms === undefined) return '';
        if (ms <= 100) return ms + ' ms';
        const sec = ms / 1000;
        if (sec <= 100) return sec.toFixed(1) + ' s';
        const min = Math.floor(sec / 60);
        const remSec = Math.round(sec % 60);
        if (min <= 100) return min + 'm ' + remSec + 's';
        const hr = Math.floor(min / 60);
        const remMin = min % 60;
        return hr + 'h ' + remMin + 'm';
    }

    function fmtDate(value) {
        if (!value) return '';
        // DB datetime is UTC naive — force UTC parsing by appending Z, then apply offset
        const raw = String(value).replace(' ', 'T');
        const d = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
        if (isNaN(d.getTime())) return String(value).replace('T', ' ').slice(0, 19);
        const local = new Date(d.getTime() + _tzOffsetMinutes * 60000);
        return local.toISOString().replace('T', ' ').slice(0, 19);
    }

    // Возвращает { date: 'YYYY-MM-DD', hm: 'HH:MM' }
    function fmtDateParts(value) {
        const full = fmtDate(value);           // 'YYYY-MM-DD HH:MM:SS'
        if (!full) return {date: '', hm: ''};
        const [date, time] = full.split(' ');
        return {date, hm: (time || '').slice(0, 5)};
    }

    function fmtTimeAgo(value) {
        if (!value) return '';
        const raw = String(value).replace(' ', 'T');
        const d = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
        if (isNaN(d.getTime())) return '';
        const diffMs = Date.now() - d.getTime();
        const diffSec = Math.round(diffMs / 1000);
        if (diffSec < 60) return `${diffSec} сек назад`;
        const diffMin = Math.round(diffSec / 60);
        if (diffMin < 60) return `${diffMin} мин назад`;
        const diffHr = Math.floor(diffMin / 60);
        const remMin = diffMin % 60;
        if (diffHr < 24) return remMin ? `${diffHr} ч ${remMin} мин назад` : `${diffHr} ч назад`;
        const diffDays = Math.floor(diffHr / 24);
        return `${diffDays} дн назад`;
    }

    // Безопасный текстовый элемент
    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
    }

    // Агент прогона: подпись и имя ссылкой на его карточку (`/admin/agent?agent_id=`
    // — страница агентов умеет открываться сразу на нужном, листая карусель нод).
    // Прогон без агента (его завёл не агент, а, скажем, конвейер задач) блока не
    // получает: пустая подпись «Агент:» в шапке ничего не сообщает.
    function agentBlock(run) {
        if (!run.agent_id) return null;
        const box = el('span', 'run-agent', 'Агент: ');
        // Имя может не доехать, если запись агента удалена (FK гасит `agent_id`
        // не всегда — связь остаётся в прогоне). Тогда показываем номер: ссылка
        // рабочая, и сам факт «агент был» из шапки не исчезает.
        const link = el('a', null, run.agent_title || run.agent_name || `#${run.agent_id}`);
        link.href = `/admin/agent?agent_id=${run.agent_id}`;
        link.title = run.agent_name ? `Открыть агента: ${run.agent_name}` : 'Открыть агента';
        box.appendChild(link);
        return box;
    }

    // Название workflow как ссылка на редактор; без workflow_id (удален) — обычный span
    function workflowLink(text, workflowId, className) {
        if (!workflowId) return el('span', className, text);
        const link = el('a', className, text);
        link.href = `/admin/workflow?workflow_id=${workflowId}`;
        link.title = 'Открыть workflow в редакторе';
        return link;
    }

    /**
     * Строка контракта вызова: подпись и тело запроса/ответа как есть.
     *
     * ⚠⚠ Пусто — говорим ПОЧЕМУ, а не рисуем прочерк. Контракт пишет ручка, и
     * пустым он бывает по двум законным причинам: прогон начат не через
     * `/chat/ask` (мини-приложение, блог, повтор со страницы) либо снят раньше,
     * чем запись появилась. Прочерк в этом месте читался бы как «зовущий
     * прислал пустоту» — то есть как поломка там, где её нет.
     */
    function renderContractRow(title, raw) {
        const row = el('div', 'row');
        row.appendChild(el('div', 'label', title));

        const body = prettyJson(raw);
        if (body) {
            // `search-in` — контракт ищется наравне с шагами (см. сводку выше)
            row.appendChild(el('pre', 'search-in', body));
        } else {
            row.appendChild(el('div', 'contract-empty',
                'не записан — прогон начат не через /chat/ask либо снят до появления записи'));
        }
        return row;
    }

    function prettyJson(raw) {
        if (raw === null || raw === undefined || raw === '') return null;
        try {
            return JSON.stringify(typeof raw === 'string' ? JSON.parse(raw) : raw, null, 2);
        } catch {
            return String(raw);
        }
    }

    function parseJson(raw) {
        if (raw === null || raw === undefined || raw === '') return null;
        if (typeof raw !== 'string') return raw;
        try {
            return JSON.parse(raw);
        } catch {
            // Fallback: экранируем реальные управляющие символы внутри JSON-строки
            try {
                return JSON.parse(
                    raw.replace(/\n/g, '\\n')
                        .replace(/\r/g, '\\r')
                        .replace(/\t/g, '\\t')
                );
            } catch {
                return null;
            }
        }
    }

    // Metadata для pre-блока: строковые значения выводятся как есть (с реальными
    // переносами строк), а не как экранированный JSON ("\n")
    function prettyMetadata(raw) {
        const data = parseJson(raw);
        if (data === null) {
            if (raw === null || raw === undefined || raw === '') return null;
            return String(raw);
        }
        if (typeof data !== 'object' || Array.isArray(data)) return prettyJson(data);

        const parts = Object.entries(data).map(([key, value]) => {
            if (typeof value === 'string') {
                return value.includes('\n') ? `${key}:\n${value}` : `${key}: ${value}`;
            }
            return `${key}: ${JSON.stringify(value, null, 2)}`;
        });
        return parts.length ? parts.join('\n\n') : null;
    }

    // Metadata как список ключей с зебра-фоном: каждый ключ — отдельный pre-ряд
    function renderMetadataBlock(raw) {
        // Truncated JSON from old DB rows: show notice instead of raw dump
        const rawStr = typeof raw === 'string' ? raw : null;
        const data = parseJson(raw);
        if (data === null || typeof data !== 'object' || Array.isArray(data)) {
            if (rawStr && rawStr.includes('...[truncated]')) {
                const note = el('pre', 'meta-kv', '⚠️ Метаданные обрезаны (запись слишком длинная). Запустите воркфлоу снова — новые записи хранятся корректно.');
                return note;
            }
            const text = prettyMetadata(raw);
            return text === null ? null : el('pre', null, text);
        }

        const entries = Object.entries(data);
        if (!entries.length) return null;

        const wrap = el('div', 'meta-kv-list');
        entries.forEach(([key, value]) => {
            // Массив {variable, text} (llm_to_json_variable) — разворачиваем в отдельные строки
            if (Array.isArray(value) && value.length > 0 && value[0] != null && typeof value[0] === 'object' && 'variable' in value[0] && 'text' in value[0]) {
                value.forEach(item => {
                    const varName = item.variable || '';
                    const varText = String(item.text || '');
                    const text = varText.includes('\n') ? `${varName}:\n${varText}` : `${varName}: ${varText}`;
                    wrap.appendChild(el('pre', 'meta-kv', text));
                });
                return;
            }
            let text;
            if (typeof value === 'string') {
                text = value.includes('\n') ? `${key}:\n${value}` : `${key}: ${value}`;
            } else {
                text = `${key}: ${JSON.stringify(value, null, 2)}`;
            }
            wrap.appendChild(el('pre', 'meta-kv', text));
        });
        return wrap;
    }

    // Карточка шага в стиле редактора workflow: номер + иконка типа + название
    function transitionStepCard(stepId, info) {
        const card = el('div', 'transition-step');
        if (info) {
            card.appendChild(el('span', 'step-number-badge', info.execIndex));
            card.appendChild(el('span', 'step-type-icon', info.icon));
            card.appendChild(el('span', 'step-title-text', info.title));
        } else {
            card.appendChild(el('span', 'step-title-text', stepId ? `шаг #${stepId}` : '?'));
        }
        return card;
    }

    // Расшифровка перехода: [шаг-источник] —условие→ [шаг-назначение]
    function renderTransitionVisual(transition, stepInfo) {
        const t = parseJson(transition);
        if (!t || typeof t !== 'object') return null;

        const wrap = el('div', 'transition-visual');
        wrap.appendChild(transitionStepCard(t.from_step_id, stepInfo[String(t.from_step_id)]));

        const mid = el('div', 'transition-arrow-block');
        if (t.phase) mid.appendChild(el('div', 'transition-phase', t.phase));
        mid.appendChild(el('div', 'transition-arrow', '⟶'));
        if (t.condition) mid.appendChild(el('div', 'transition-condition', t.condition));
        wrap.appendChild(mid);

        wrap.appendChild(transitionStepCard(t.to_step_id, stepInfo[String(t.to_step_id)]));
        return wrap;
    }

    // Строка списка переменных: чип группы, имя, бейджи, значение (скаляр — в строку,
    // list/dict — JSON ниже)
    function varListItem(name, value, badges, description, group) {
        const li = document.createElement('li');
        const head = el('div', 'var-head');
        // Чип группы перед именем: из одного имени не видно, откуда переменная.
        // В чипе один значок: подпись с названием группы съедала треть строки,
        // читается же она теперь только подсказкой наведённой мыши.
        // ⚠ В подсказке `label`, а не `title`: тот несёт значок первым словом, и
        // подсказка повторяла бы то, что и так нарисовано в чипе.
        if (group) {
            const chip = el('span', `var-group var-group-${group.key}`, group.icon);
            chip.title = group.label;
            head.appendChild(chip);
        }
        head.appendChild(el('span', 'var-name', `%${name}%`));
        (badges || []).forEach(badge => head.appendChild(el('span', badge.className, badge.text)));
        head.appendChild(el('span', 'var-sep', ':'));

        if (value !== null && typeof value === 'object') {
            const isList = Array.isArray(value);
            const size = isList ? value.length : Object.keys(value).length;
            head.appendChild(el('span', 'var-type', isList ? `list · ${size}` : `dict · ${size}`));
            li.appendChild(head);
            li.appendChild(el('pre', 'var-value-complex', JSON.stringify(value, null, 2)));
        } else {
            const empty = value === null || value === undefined || value === '';
            const valueEl = el('span', 'var-value-inline' + (empty ? ' var-value-empty' : ''),
                empty ? 'пусто' : String(value));
            head.appendChild(valueEl);
            li.appendChild(head);
        }
        if (description) li.appendChild(el('div', 'var-desc', description));
        return li;
    }

    // Бейдж происхождения значения: {label, start} из collectRunVariables
    function varSourceBadge(source) {
        return {className: `var-source${source.start ? ' var-source-start' : ''}`, text: source.label};
    }

    // Порядок имён в списках переменных — по алфавиту.
    //
    // ⚠ Порядок вставки ничего не значил: слева он шёл от снапшота старта к тому, что
    // дописали шаги, справа — как отдала ручка реестра. Искать имя глазами в таком
    // списке приходилось перечитывая его целиком.
    //
    // ⚠⚠ Происхождение значения при этом не теряется — его несёт бейдж рядом с именем
    // («старт» / «шаг #N» / «умолчание»), а не позиция в списке. Иначе сортировать
    // было бы нельзя: она стёрла бы ответ на вопрос «кто это записал».
    //
    // Компаратор тот же, что у переменных на странице workflow
    // (`js/workflow/variables.js`): списки в соседних местах должны листаться одинаково.
    const byVarName = (a, b) => String(a || '').localeCompare(String(b || ''));

    // UL-список переменных: скаляры — в строку, list/dict — бейдж типа + вложенный JSON.
    // sources (необязательный) — откуда значение: {имя: {label, start}} рядом с именем.
    // groups — карта «имя → группа» (variableGroupIndex): чип перед именем
    function renderVariablesList(vars, sources, groups) {
        const ul = el('ul', 'vars-list');
        Object.entries(vars)
            .sort((a, b) => byVarName(a[0], b[0]))
            .forEach(([name, value]) => {
                const source = sources && sources[name];
                ul.appendChild(varListItem(name, value, source ? [varSourceBadge(source)] : [],
                                          null, (groups && groups.get(name)) || VAR_GROUP_UNKNOWN));
            });
        return ul;
    }

    // Входящие переменные workflow: описание из реестра и то, чем они обернулись в прогоне.
    // Значения нет — показываем умолчание из реестра, чтобы видеть, с чем шаг работал бы.
    //
    // ⚠⚠ Чипа группы здесь нет **намеренно**, хотя соседний список его показывает.
    // Этот строится как `реестр.filter(type === 'input')`, а разбивка кладёт
    // `type === 'input'` ровно в группу «Входящие» — то есть чип у всех строк был бы
    // один и тот же и повторял бы заголовок аккордеона. Проверено на 334 прогонах:
    // 330 строк из 330 дали `input`, других не бывает по построению.
    function renderWorkflowVariablesList(declared, values, sources) {
        const ul = el('ul', 'vars-list');
        // ⚠ Сортируем копию: `declared` — это массив из `workflowVariablesCache`, общий
        // на все прогоны одного workflow. `sort` правит массив на месте, и без копии
        // отрисовка перекладывала бы чужой кэш.
        [...declared]
            .sort((a, b) => byVarName(a.name, b.name))
            .forEach(variable => {
                const name = variable.name || '';
                const used = Object.prototype.hasOwnProperty.call(values, name);
                const badge = used
                    ? varSourceBadge(sources[name])
                    : {className: 'var-source var-source-default', text: 'умолчание'};
                ul.appendChild(varListItem(name, used ? values[name] : variable.default,
                                           [badge], variable.description));
            });
        return ul;
    }

    // Значения переменных, участвующих в metadata шага: имя ищется как
    // плейсхолдер %name% либо как строковое значение "name" (маппинги tool_invoke, переходы)
    function stepInputVariables(metadataRendered, snapshot) {
        if (!metadataRendered) return null;
        const text = typeof metadataRendered === 'string' ? metadataRendered : JSON.stringify(metadataRendered);
        const values = {};
        Object.keys(snapshot).forEach(name => {
            if (text.includes(`%${name}%`) || text.includes(`"${name}"`)) values[name] = snapshot[name];
        });
        return Object.keys(values).length ? values : null;
    }

    async function init() {
        // Загружаем часовой пояс из настроек (key = 'timezone', value = '+3' / '-2' / '0')
        try {
            const settingsRes = await getData('/api/setting');
            const tzRow = (settingsRes.result?.settings || []).find(s => s.key === 'timezone' && !s.node_id);
            if (tzRow) {
                const match = String(tzRow.value || '').match(/([+-]?\d+)/);
                if (match) _tzOffsetMinutes = parseInt(match[1], 10) * 60;
            }
        } catch { /* используем UTC если настройки недоступны */
        }

        // Справочники для фильтров, иконок типов шагов и разбора переменных прогона
        try {
            const [workflowsRes, agentsRes, nodesRes, typesRes, toolsRes, llmsRes] = await Promise.all([
                getData('/workflow/list'),
                getData('/agent/list'),
                getData('/node/list'),
                getData('/workflow_step/list'),
                getData('/tool/list'),
                getData('/llm/list'),
            ]);

            state.workflows = workflowsRes.result || [];
            state.agents = agentsRes.result || [];
            state.tools = toolsRes.result || [];

            // Ноды у прогона нет — она у агента, поэтому фильтр по ноде на сервере
            // разворачивается в «агенты этой ноды» (workflow_trace_run_list)
            const nodeSel = document.getElementById('filterNode');
            (nodesRes.result || []).forEach(n => {
                const opt = el('option', null, n.name);
                opt.value = n.id;
                nodeSel.appendChild(opt);
            });

            // ⚠ Список моделей наполняется здесь же, но в `filterOptionsRebuild`
            // не участвует: модель записана у ШАГА прогона, а не у агента, и
            // нодой не сужается — одна модель законно встречается у разных нод.
            const llmSel = document.getElementById('filterLlm');
            (llmsRes.result || []).forEach(one => {
                const opt = el('option', null, one.name);
                opt.value = one.id;
                llmSel.appendChild(opt);
            });

            // Два зависимых селекта наполняет `filterOptionsRebuild` — она же
            // пересобирает их при смене ноды, и списку неоткуда разойтись самому с собой
            (typesRes.result || []).forEach(t => {
                state.stepTypeIcons[t.name] = t.icon;
            });
        } catch (e) {
            console.error('Ошибка загрузки справочников:', e);
        }

        // Восстановление — после наполнения справочников: у пустого select
        // выставлять нечего, и сохранённый выбор потерялся бы молча
        filtersRestore();

        // Определяем начальную вкладку: Running если есть записи, иначе Success.
        // ⚠ Проба идёт с восстановленными фильтрами: без них страница с выбранной
        // нодой открывалась бы на Running из-за чужих прогонов — и показывала пусто
        try {
            const probeParams = filterParams(new URLSearchParams({status: 'running', page: 1, limit: 1}));
            const probe = await getData(`/workflow_trace/run/list?${probeParams}`);
            state.activeTab = (probe.pagination.total_records > 0) ? 'running' : 'success';
        } catch {
            state.activeTab = 'running';
        }
        setActiveTab(state.activeTab);
        await loadRuns();
    }

    function setActiveTab(tab) {
        state.activeTab = tab;
        document.querySelectorAll('.status-tab').forEach(tabEl => {
            tabEl.classList.toggle('active', tabEl.dataset.status === tab);
        });
    }

    // Выбор фильтра переживает перезагрузку страницы: ключ на селект, значение — id
    const FILTER_STORAGE_KEY = {
        filterNode: 'workflow_trace_filter_node',
        filterWorkflow: 'workflow_trace_filter_workflow',
        filterAgent: 'workflow_trace_filter_agent',
        filterLlm: 'workflow_trace_filter_llm',
    };

    // Значения селектов в query — нужны и списку, и пробе начальной вкладки
    function filterParams(params) {
        const nd = document.getElementById('filterNode').value;
        const wf = document.getElementById('filterWorkflow').value;
        const ag = document.getElementById('filterAgent').value;
        const ll = document.getElementById('filterLlm').value;
        if (nd) params.set('node_id', nd);
        if (wf) params.set('workflow_id', wf);
        if (ag) params.set('agent_id', ag);
        if (ll) params.set('llm_id', ll);
        return params;
    }

    function filterSave(selectId) {
        localStorage.setItem(FILTER_STORAGE_KEY[selectId], document.getElementById(selectId).value);
    }

    // Workflow и агенты сужаются до выбранной ноды: `node_id` есть у обеих сущностей,
    // и оба справочника уже в памяти — отбор идёт на клиенте, без второго похода на сервер.
    //
    // ⚠ Сужение обязано совпадать с тем, что умеет ручка списка: она отбирает прогоны по
    // `agent.node_id`, то есть безнодовых агентов при выбранной ноде не вернёт никогда.
    // Оставь их в селекте — и получишь пункт, который всегда даёт пустой список
    function filterOptionsRebuild() {
        const nodeId = document.getElementById('filterNode').value;
        filterOptionsFill('filterWorkflow', state.workflows, 'Все workflow', nodeId);
        filterOptionsFill('filterAgent', state.agents, 'Все агенты', nodeId);
    }

    function filterOptionsFill(selectId, rows, allLabel, nodeId) {
        const select = document.getElementById(selectId);
        const previous = select.value;

        select.innerHTML = '';
        const optionAll = el('option', null, allLabel);
        // ⚠ Пустое значение — явно: у option без атрибута value свойство `.value`
        // отдаёт его текст, и «все» уехало бы в запрос строкой «Все workflow»
        optionAll.value = '';
        select.appendChild(optionAll);

        rows.filter(row => !nodeId || String(row.node_id ?? '') === nodeId)
            .forEach(row => {
                const opt = el('option', null, row.title || row.name);
                opt.value = row.id;
                select.appendChild(opt);
            });

        // Выбранное могло не пережить смену ноды. Тогда — «Все», и запомненное стираем:
        // иначе оно воскресло бы при следующей загрузке, когда нода снова станет своей,
        // и человек получил бы отбор, который сам уже потерял из виду
        if ([...select.options].some(opt => opt.value === previous)) select.value = previous;
        else if (previous) localStorage.removeItem(FILTER_STORAGE_KEY[selectId]);
    }

    // ⚠ Сохранённый id, которого больше нет в списке (workflow удалён, агент
    // переехал на другую ноду), не восстанавливаем и стираем: select с value вне
    // своих options уходит в selectedIndex = -1 и показывает пустую строку — не
    // «Все workflow», а именно пустоту, и человек видит отбор, которого не делал
    function filterRestoreOne(selectId) {
        const saved = localStorage.getItem(FILTER_STORAGE_KEY[selectId]);
        if (!saved) return;
        const select = document.getElementById(selectId);
        if ([...select.options].some(opt => opt.value === saved)) select.value = saved;
        else localStorage.removeItem(FILTER_STORAGE_KEY[selectId]);
    }

    // ⚠⚠ Порядок здесь — не стилистика. Нода идёт первой, потому что задаёт содержимое
    // двух других селектов; пока они не пересобраны, сохранённый workflow в их options
    // не найдётся, и восстановление сочло бы его протухшим и стёрло из хранилища
    function filtersRestore() {
        filterRestoreOne('filterNode');
        filterOptionsRebuild();
        filterRestoreOne('filterWorkflow');
        filterRestoreOne('filterAgent');
        // ⚠ Модель восстанавливается последней и вне пересборки: её список
        // нодой не сужается, поэтому и протухнуть от смены ноды он не может.
        filterRestoreOne('filterLlm');
    }

    async function loadRuns() {
        const params = filterParams(new URLSearchParams({page: state.page, limit: 30}));
        params.set('status', state.activeTab);
        // ⚠ Поиск по всем прогонам — такой же довод отбора, как нода и статус:
        // сервер ищет ВНУТРИ выбранного, и это главное, чем держится его цена.
        if (state.searchAll) {
            params.set('search', state.searchAll);
            params.set('limit', '100');
        }

        try {
            const data = await getData(`/workflow_trace/run/list?${params}`);
            state.totalPages = data.pagination.total_pages;
            document.getElementById('pageInfo').textContent =
                `${data.pagination.current_page} / ${data.pagination.total_pages} (${data.pagination.total_records})`;
            document.getElementById('pagePrev').disabled = state.page <= 1;
            document.getElementById('pageNext').disabled = state.page >= state.totalPages;
            searchAllBanner(data.search);
            renderRuns(data.result || []);
        } catch (e) {
            console.error('Ошибка загрузки запусков:', e);
            runsList.innerHTML = '';
            // ⚠ Отказ поиска показываем словами сервера: он один знает, что
            // именно не вышло — не уложился в срок или не хватило прав.
            runsList.appendChild(el('div', 'empty-note',
                state.searchAll ? (e.message || 'Поиск не удался') : 'Ошибка загрузки'));
            searchAllBanner(state.searchAll ? {query: state.searchAll, failed: true} : null);
        }
    }

    /**
     * Полоса над списком: что сейчас ищется по всем прогонам и чем кончилось.
     *
     * ⚠⚠ Без неё список молча показывал бы подмножество: человек набрал текст,
     * нажал Enter, ушёл пить чай — и вернулся к ленте, которая выглядит обычной,
     * но содержит не все прогоны. Полоса и крестик — единственное, что отличает
     * «прогонов нет» от «нет среди найденных».
     */
    function searchAllBanner(found) {
        const host = document.getElementById('searchAllBanner');
        host.innerHTML = '';
        host.style.display = found ? 'flex' : 'none';
        if (!found) return;

        // ⚠ Коротко: сайдбар узкий (316 px), и полная фраза «Поиск по всем:
        // «photo» — найдено 38 · 18 мс» ломала полосу на две строки — поймано
        // кадром. Запрос человек и так видит в поле прямо над полосой,
        // повторять его здесь незачем.
        const said = found.failed
            ? 'поиск не удался'
            : (found.found
                ? `найдено ${found.found}${found.limited ? '+' : ''} · ${found.ms} мс`
                : `не найдено · ${found.ms} мс`);

        const line = el('span', 'search-all-text', `По всем прогонам: ${said}`);
        host.appendChild(line);

        // ⚠⚠ Окно поиска по шагам обязано быть названо. Поля прогона (запрос,
        // ответ, контракт) ищутся по всей истории, а шаги — только в недавних
        // прогонах: на проде полный проход по ним стоит 7.6 с и упирается в
        // потолок. Не скажи этого, человек считает поиск полным и делает вывод
        // «такого не было» из того, что до этого места не дошли.
        if (found.steps_window) {
            const hint = `Запрос «${found.query}». Шаги искались в последних `
                + `${found.steps_window} прогонах; запрос, ответ и контракт — по всей истории`;
            line.title = hint;
            const window_ = el('span', 'search-all-window', `шаги: ${found.steps_window}`);
            window_.title = hint;
            host.appendChild(window_);
        }
        const off = el('button', 'search-all-off', '✕');
        off.type = 'button';
        off.title = 'Вернуться ко всем прогонам';
        // ⚠ Снимает поиск ЦЕЛИКОМ, вместе с полем и подсветкой в открытом
        // прогоне. Сними он одну полосу — поле осталось бы с текстом и
        // надписью «не найдено» над полной лентой: два состояния на один
        // видимый элемент, и ни одно не объясняет другое.
        off.onclick = () => document.getElementById('stepSearchClear').click();
        host.appendChild(off);
    }

    function renderRuns(runs) {
        runsList.innerHTML = '';

        if (runs.length === 0) {
            runsList.appendChild(el('div', 'empty-note', 'Запусков нет'));
            return;
        }

        let firstCard = null;

        runs.forEach(run => {
            const card = el('div', 'run-card');
            if (run.run_uuid === state.activeRunUuid) card.classList.add('active');

            const head = el('div', 'run-head');
            head.appendChild(el('span', 'run-title', run.workflow_title || `workflow ${run.workflow_id}`));

            const statusBadge = el('span', `status-badge status-${run.status}`, run.status);
            head.appendChild(statusBadge);

            if (run.status === 'running') {
                const stopBtn = document.createElement('button');
                stopBtn.className = 'btn-stop-card';
                stopBtn.title = 'Остановить';
                stopBtn.textContent = '■';
                stopBtn.onclick = async (e) => {
                    e.stopPropagation();
                    stopBtn.disabled = true;
                    try {
                        await postData(`/workflow_trace/run/${run.run_uuid}/stop`, {});
                        showNotification('Остановлен', 'success');
                        state.activeRunUuid = null;
                        state.page = 1;
                        await loadRuns();
                    } catch (err) {
                        showNotification(`Ошибка: ${err.message}`, 'error');
                        stopBtn.disabled = false;
                    }
                };
                head.appendChild(stopBtn);
            }

            card.appendChild(head);

            const meta = el('div', 'run-meta');
            const {date, hm} = fmtDateParts(run.started_at);
            const agentTxt = run.agent_title ? ` · ${run.agent_title}` : '';
            const subflowTxt = run.children_qty > 0 ? ` · subflow: ${run.children_qty}` : '';
            meta.innerHTML = `${date} <b style="color:#1e293b;font-size:13px;">${hm}</b>${agentTxt} · ${fmtDuration(run.duration_ms)} · шагов: ${run.steps_qty}${subflowTxt}`;
            card.appendChild(meta);
            card.appendChild(el('div', 'run-prompt', run.prompt_user || ''));

            card.onclick = () => {
                document.querySelectorAll('.run-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                state.activeRunUuid = run.run_uuid;
                loadRunDetail(run.run_uuid);
            };
            runsList.appendChild(card);

            if (!firstCard) firstCard = card;
        });

        // При открытии страницы автоматически показываем последний (верхний) запуск
        //
        // ⚠⚠ При поиске по всем прогонам открываем первый НАЙДЕННЫЙ, даже если
        // справа уже открыт другой. Поймано кадром: слева «найдено 38», а в поле
        // поиска красное «не найдено» — счётчик относился к прогону от прошлого
        // отбора, в котором искомого вправду нет. Два ответа на один запрос в
        // одном экране, и человек верит худшему.
        const searchOpened = state.searchAll && firstCard
            && !runs.some(run => run.run_uuid === state.activeRunUuid);
        if (searchOpened || (!state.activeRunUuid && firstCard)) firstCard.click();
    }

    async function loadRunDetail(runUuid) {
        runDetail.innerHTML = '';
        runDetail.appendChild(el('div', 'empty-note', 'Загрузка...'));
        try {
            const data = await getData(`/workflow_trace/run/${runUuid}`);
            // Реестр переменных тянем до рендера: сам рендер синхронный и ждать не умеет
            await workflowVariablesPrefetch(data.result);
            renderRunDetail(data.result);
        } catch (e) {
            console.error('Ошибка загрузки запуска:', e);
            runDetail.innerHTML = '';
            runDetail.appendChild(el('div', 'empty-note', 'Ошибка загрузки запуска'));
        }
    }

    function renderRunDetail(run) {
        runDetail.innerHTML = '';

        // Сводка запуска
        const summary = el('div', 'run-summary');
        const headRow = el('div', 'row');
        headRow.appendChild(el('span', 'run-pre-title', `#${run.id} agent_workflow_trace `));
        headRow.appendChild(workflowLink(`${run.workflow_title || run.workflow_name || ''} `, run.workflow_id, 'run-title'));
        headRow.appendChild(el('span', 'run-name', `${run.workflow_name || ''} `));
        const agentBox = agentBlock(run);
        if (agentBox) headRow.appendChild(agentBox);
        headRow.appendChild(el('span', `status-badge status-${run.status}`, run.status));
        const dateSpan = el('span', 'run-meta');
        const {date: rDate, hm: rHm} = fmtDateParts(run.started_at);
        const ago = fmtTimeAgo(run.started_at);
        dateSpan.innerHTML = `&nbsp;&nbsp;${rDate} <b style="color:#1e293b;">${rHm}</b>${ago ? ` <span style="color:#94a3b8;font-weight:normal;">(${ago})</span>` : ''}`;
        headRow.appendChild(dateSpan);
        headRow.appendChild(el('span', 'run-meta-time', `  ${fmtDuration(run.duration_ms)}`))

        // Replay: повторный прогон workflow с сохраненным снапшотом переменных.
        // Шаги берутся из текущего определения workflow, история пишется в новую сессию.
        const replayBtn = el('button', 'btn-replay-run', '▶️ Повторить');
        replayBtn.onclick = async () => {
            if (!confirm('Повторить запуск с теми же входными переменными? Workflow выполнится по-настоящему.')) return;
            replayBtn.disabled = true;
            replayBtn.textContent = 'Выполняется…';
            try {
                await postData(`/workflow_trace/run/${run.run_uuid}/replay`, {});
                showNotification('Запуск повторен', 'success');
                // Сбрасываем выбор: loadRuns автоматически откроет свежий (replay) запуск
                state.activeRunUuid = null;
                state.page = 1;
                await loadRuns();
            } catch (e) {
                showNotification(`Ошибка replay: ${e.message}`, 'error');
                replayBtn.disabled = false;
                replayBtn.textContent = '▶️ Повторить';
            }
        };

        const delBtn = el('button', 'btn-delete-run', 'Удалить лог');
        delBtn.style.float = 'right';
        delBtn.onclick = async () => {
            if (!confirm('Удалить этот запуск из журнала?')) return;
            try {
                await deleteData(`/workflow_trace/run/${run.run_uuid}`);
                showNotification('Запуск удален', 'success');
                runDetail.innerHTML = '';
                runDetail.appendChild(el('div', 'empty-note', 'Выберите запуск слева'));
                state.activeRunUuid = null;
                await loadRuns();
            } catch (e) {
                showNotification(`Ошибка удаления: ${e.message}`, 'error');
            }
        };
        headRow.appendChild(delBtn);
        headRow.appendChild(replayBtn);

        // Стоп: только для выполняющегося запуска — отменяет задачу на сервере
        if (run.status === 'running') {
            const stopBtn = el('button', 'btn-stop-run', '⏹ Стоп');
            stopBtn.onclick = async () => {
                if (!confirm('Остановить выполняющийся workflow?')) return;
                stopBtn.disabled = true;
                stopBtn.textContent = 'Остановка…';
                try {
                    await postData(`/workflow_trace/run/${run.run_uuid}/stop`, {});
                    showNotification('Workflow остановлен', 'success');
                    // Небольшая пауза: обработчик отмены на сервере закрывает журнал асинхронно
                    await new Promise(resolve => setTimeout(resolve, 500));
                    await loadRunDetail(run.run_uuid);
                    await loadRuns();
                } catch (e) {
                    showNotification(`Ошибка остановки: ${e.message}`, 'error');
                    stopBtn.disabled = false;
                    stopBtn.textContent = '⏹ Стоп';
                }
            };
            headRow.appendChild(stopBtn);
        }

        summary.appendChild(headRow);

        // ⚠⚠ Две колонки — два разных вопроса, и путать их нельзя. Слева вход и
        // выход **workflow** (`prompt_user` / `result`): что увидел движок и чем
        // кончил. Справа контракт **вызова**: чем прогон позвали по HTTP и что
        // ушло зовущему. Совпадают они только в простом случае: `question` в
        // контракте тот же, а вот `variables` запроса в снапшот старта
        // подмешаны вперемешку с переменными агента и ноды, и `message_id` с
        // `intentions` из прогона не видны вовсе.
        const bothCols = el('div', 'contract-cols');

        // ⚠⚠ `search-in` у всех четырёх значений сводки — тот же класс, что у
        // значений шага. Поиск по открытому прогону обязан смотреть туда же,
        // куда смотрит поиск по всем прогонам на сервере: он ищет и в полях
        // прогона тоже. Пока сводка была вне поиска, одно и то же поле давало
        // два ответа — «нашёл» в списке слева и «не найдено» в открытом
        // прогоне. Поймано поиском по `session_uuid`: он лежит в контракте и ни
        // в одном шаге.
        const ownCol = el('div', 'contract-col');
        const promptRow = el('div', 'row');
        promptRow.appendChild(el('div', 'label', 'Запрос'));
        const promptPre = el('pre', 'search-in', run.prompt_user || '—');
        promptRow.appendChild(promptPre);
        ownCol.appendChild(promptRow);

        const resultRow = el('div', 'row');
        const isErrorLike = run.status === 'error' || run.status === 'stopped';
        resultRow.appendChild(el('div', 'label', run.status === 'error' ? 'Ошибка' : run.status === 'stopped' ? 'Остановлен' : 'Ответ'));
        resultRow.appendChild(el('pre', 'search-in', (isErrorLike ? run.error : run.result) || '—'));
        ownCol.appendChild(resultRow);

        const contractCol = el('div', 'contract-col');
        contractCol.appendChild(renderContractRow('Request contract', run.request_json));
        contractCol.appendChild(renderContractRow('Response contract', run.response_json));

        bothCols.appendChild(ownCol);
        bothCols.appendChild(contractCol);
        summary.appendChild(bothCols);

        // Переменные запуска: снапшот старта + всё, что дописали шаги
        const varsRow = renderRunVariablesRow(run);
        if (varsRow) summary.appendChild(varsRow);

        // LLM статистика: подсчёт вызовов по моделям из всех шагов (включая sub-workflow рекурсивно)
        const llmCounts = collectLlmStats(run);
        const {input: tokIn, output: tokOut} = collectTokenStats(run);
        if (Object.keys(llmCounts).length > 0 || tokIn > 0 || tokOut > 0) {
            const statsRow = el('div', 'row');
            statsRow.appendChild(el('div', 'label', 'LLM вызовы'));
            const statsBlock = el('div', 'llm-stats');
            Object.entries(llmCounts).forEach(([name, count]) => {
                statsBlock.appendChild(el('span', 'llm-stat-item', `${name} × ${count}`));
            });
            if (tokIn > 0) statsBlock.appendChild(el('span', 'token-stat-item', `↑ ${Number(tokIn).toLocaleString()} in`));
            if (tokOut > 0) statsBlock.appendChild(el('span', 'token-stat-item', `↓ ${Number(tokOut).toLocaleString()} out`));
            if (tokOut > 0 && run.duration_ms > 0) {
                const tps = (tokOut / (run.duration_ms / 1000)).toFixed(1);
                statsBlock.appendChild(el('span', 'token-stat-item', `⚡ ${tps} tok/s`));
            }
            statsRow.appendChild(statsBlock);
            summary.appendChild(statsRow);
        }

        runDetail.appendChild(summary);

        // Таймлайн шагов (с рекурсией для sub-workflow)
        runDetail.appendChild(renderRunTimeline(run));

        // ⚠ Запрос переживает смену прогона: его набирают один раз и щёлкают
        // карточки слева, проверяя, в каком из них текст встретился. Сбрасывать
        // поле на каждом открытии значило бы заставлять набирать заново.
        stepSearchApply();
    }

    // Реестр объявленных переменных по workflow_id: одна и та же ветка встречается
    // в дереве запуска много раз, а список её переменных от прогона не зависит
    const workflowVariablesCache = {};

    // Объявленные переменные workflow: `agent_workflow_variable` (workflow/input/global)
    // плюс привязанные переменные ноды — их отдаёт /workflow/{id}/variables
    async function workflowVariablesLoad(workflowId) {
        if (workflowVariablesCache[workflowId]) return;
        try {
            const res = await getData(`/workflow/${workflowId}/variables`);
            workflowVariablesCache[workflowId] = res.result || [];
        } catch (e) {
            // Журнал живёт и без реестра: workflow мог быть удалён, прав может не хватать
            console.error('Не загружены переменные workflow:', workflowId, e);
            workflowVariablesCache[workflowId] = [];
        }
    }

    // ── Поиск по шагам открытого прогона ────────────────────────────────────
    //
    // ⚠⚠ Ищет внутри ОДНОГО прогона, а не по списку слева. Три селекта рядом
    // отбирают прогоны запросом к базе; это поле работает по тому, что уже
    // лежит в браузере, и поэтому ничего не стоит: `GET /workflow_trace/run/…`
    // привозит дерево целиком — шаги, их вход, выход и ошибки.
    //
    // ⚠⚠ Поиск по ВСЕМ прогонам сюда дописать нельзя «заодно»: это подстрока по
    // LONGTEXT в таблице шагов, то есть полный проход. На этой же паре таблиц
    // проект уже обжигался — `variables_start LIKE '%…%'` стоил 639 мс на проде
    // и лечился генерируемой колонкой (`workflow_trace.md`). Понадобится — это
    // отдельная работа с индексом и замером, а не ещё одна ветка в этой функции.
    //
    // ⚠⚠ Ищем по узлам с классом `search-in` — это ЗНАЧЕНИЯ, а не подписи к ним.
    // Первая версия брала `textContent` всей строки, и это выглядело разумно:
    // тело аккордеона отрисовано всегда, в нём ровно то, что человек увидит
    // раскрыв. Проба на живом прогоне показала цену: слово «рендера» совпало с
    // 5 шагами из 5 — оно стоит в подписи «Вход (metadata после рендера)» у
    // каждого. Так же совпали бы `output`, `переход`, `success` и имя модели.
    // Поиск, который на частые слова отвечает «все», — это не поиск.
    //
    // Класс вешает тот, кто рисует значение (`appendSection`, заголовок шага),
    // поэтому список искомого не ведётся отдельно и не может с показом
    // разойтись: новая секция получает его тем же вызовом.

    const STEP_SEARCH_MIN = 2;          // короче — совпадёт со всем подряд

    // ⚠ У поиска по всем прогонам порог свой и выше: там каждый лишний запрос —
    // полный проход по таблицам трассы, а двух знаков хватит, чтобы совпало всё.
    // Число то же, что у сервера (`TRACE_SEARCH_MIN`): разойдись они, поле
    // отправляло бы запрос, который ручка молча считает пустым.
    const STEP_SEARCH_ALL_MIN = 3;

    // ⚠⚠ Подсветок на ОДИН шаг, и это потолок цены, а не вкуса. Считался он
    // по текстовым узлам, а не по совпадениям, — разница оказалась в два
    // порядка: значение шага это один `<pre>` на 20 000 знаков (столько пишет
    // трасса, `TRACE_VALUE_MAX_LEN`), то есть ОДИН текстовый узел, в котором
    // частое слово встречается сотни раз. На пробе из 170 шагов «нагрузки» дало
    // 715 428 подсветок: страница вставала на 5 секунд, очистка — на 6.4.
    // Пятидесяти хватает, чтобы увидеть, где совпало: дальше человек читает
    // шаг, а не считает жёлтые пятна.
    const STEP_SEARCH_MARK_MAX = 50;

    // ⚠⚠ Сколько совпавших шагов раскрывать самим. Раскрывались все, и на
    // широком запросе это разворачивало 167 шагов по 20 000 знаков разом: 1.8 с
    // работы ради экрана, который всё равно не прочитать. Узкий запрос (пара
    // шагов) раскрыть — помощь, широкий — свалка; у широкого человек сперва
    // смотрит на счётчик и уточняет слово.
    const STEP_SEARCH_OPEN_MAX = 20;

    const stepSearch = {
        query: '',      // приведённый к нижнему регистру запрос; '' — поиск выключен
        hits: [],       // строки шагов с совпадением, в порядке показа
        at: -1,         // на каком совпадении стоит Enter
    };

    /** Текст строки шага для поиска — считается один раз на отрисовку.
     *
     * ⚠ Кэш живёт на самом узле: прогон перерисовывается целиком, узлы при этом
     * новые, и протухнуть кэшу негде. Пересчёт на каждый знак в поле стоил бы
     * обхода всех 167 строк с их двадцатикилобайтными `output`.
     */
    function stepSearchTextOf(row) {
        if (row._searchText === undefined) {
            row._searchText = [...row.querySelectorAll('.search-in')]
                .map(node => node.textContent).join('\n').toLowerCase();
        }
        return row._searchText;
    }

    /** Обернуть совпадения в `<mark>` — в тех же узлах, по которым шёл поиск.
     *
     * ⚠ Запас подсветок общий на весь шаг и тратится по ходу: иначе потолок на
     * каждое значение давал бы вчетверо больше обещанного.
     */
    function stepSearchMark(row, query) {
        let budget = STEP_SEARCH_MARK_MAX;
        for (const node of row.querySelectorAll('.search-in')) {
            if (budget <= 0) break;
            budget = stepSearchMarkIn(node, query, budget);
        }
    }

    /** @returns {number} сколько подсветок осталось в запасе. */
    function stepSearchMarkIn(root, query, budget) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
                if (!node.nodeValue || !node.nodeValue.toLowerCase().includes(query)) {
                    return NodeFilter.FILTER_REJECT;
                }
                return NodeFilter.FILTER_ACCEPT;
            },
        });

        const targets = [];
        while (walker.nextNode()) targets.push(walker.currentNode);

        for (const node of targets) {
            if (budget <= 0) break;
            const text = node.nodeValue;
            const lower = text.toLowerCase();
            const frag = document.createDocumentFragment();
            let from = 0;
            let at = lower.indexOf(query);
            while (at !== -1 && budget > 0) {
                if (at > from) frag.appendChild(document.createTextNode(text.slice(from, at)));
                frag.appendChild(el('mark', 'search-hit', text.slice(at, at + query.length)));
                budget -= 1;
                from = at + query.length;
                at = lower.indexOf(query, from);
            }
            // Хвост узла — одним куском: он мог остаться неразобранным, когда запас кончился
            if (from < text.length) frag.appendChild(document.createTextNode(text.slice(from)));
            node.parentNode.replaceChild(frag, node);
        }

        return budget;
    }

    /** Снять подсветку и склеить разрезанные текстовые узлы обратно. */
    function stepSearchUnmark(root) {
        root.querySelectorAll('mark.search-hit').forEach(hit => {
            const parent = hit.parentNode;
            parent.replaceChild(document.createTextNode(hit.textContent), hit);
            // ⚠ Без `normalize` соседние текстовые узлы остаются разрезанными, и
            // следующий поиск не найдёт слово, попавшее на стык.
            parent.normalize();
        });
    }

    /** Применить текущий запрос к открытому прогону: спрятать, подсветить, посчитать. */
    function stepSearchApply() {
        const count = document.getElementById('stepSearchCount');
        const box = document.querySelector('.step-search');
        const query = stepSearch.query;

        box.classList.toggle('is-on', !!document.getElementById('stepSearch').value);
        stepSearchUnmark(runDetail);

        const rows = [...runDetail.querySelectorAll('.step-row')];
        const blocks = [...runDetail.querySelectorAll('.child-run')];

        if (!query) {
            rows.forEach(row => row.classList.remove(
                'step-hidden', 'step-match', 'step-match-current'));
            blocks.forEach(block => block.classList.remove('step-hidden'));
            stepSearch.hits = [];
            stepSearch.at = -1;
            count.textContent = '';
            count.classList.remove('is-none');
            return;
        }

        const hits = [];
        rows.forEach(row => {
            const found = stepSearchTextOf(row).includes(query);
            row.classList.toggle('step-match', found);
            row.classList.toggle('step-hidden', !found);
            row.classList.remove('step-match-current');
            if (!found) return;
            stepSearchMark(row, query);
            hits.push(row);
        });

        // Совпавшие раскрываем сами — пока их немного: иначе найденное осталось
        // бы за аккордеоном. Широкий запрос оставляем свёрнутым (см. потолок),
        // и закрывать уже раскрытое руками не идём: это выбор человека.
        if (hits.length <= STEP_SEARCH_OPEN_MAX) hits.forEach(row => row.classList.add('open'));

        // Дочерний прогон без единого совпадения прячем целиком: от него осталась
        // бы одна шапка с названием sub-workflow и пустотой под ней
        blocks.forEach(block => {
            block.classList.toggle('step-hidden', !block.querySelector('.step-row.step-match'));
        });

        // Сводка прогона — такая же область поиска, как шаги: на сервере поиск
        // по всем прогонам смотрит и в её поля, и расходиться им нельзя
        const inSummary = stepSearchSummary(query);

        stepSearch.hits = hits;
        stepSearch.at = -1;

        count.classList.toggle('is-none', hits.length === 0 && !inSummary);
        // ⚠ Три разных ответа, и сводить их в один нельзя: «прогон не открыт»
        // (искать негде), «только в сводке» (нашлось, но не в шагах) и «не
        // найдено». Человек, увидевший «не найдено» над подсвеченным запросом,
        // перестаёт верить счётчику.
        if (!rows.length) count.textContent = 'прогон не открыт';
        else if (hits.length) count.textContent =
            `${hits.length} из ${rows.length}${inSummary ? ' + сводка' : ''}`;
        else count.textContent = inSummary ? 'только в сводке' : 'не найдено';
    }

    /**
     * Подсветить совпадения в сводке прогона — запрос, ответ, оба контракта.
     *
     * ⚠ Область та же, что у серверного поиска по всем прогонам
     * (`TRACE_SEARCH_RUN_COLUMNS`), и это не совпадение, а условие: поле одно,
     * и два разных ответа на один вопрос обесценивают оба.
     *
     * @returns {boolean} нашлось ли хоть что-то в сводке.
     */
    function stepSearchSummary(query) {
        let budget = STEP_SEARCH_MARK_MAX;
        let found = false;

        for (const node of runDetail.querySelectorAll('.run-summary .search-in')) {
            if (!node.textContent.toLowerCase().includes(query)) continue;
            found = true;
            if (budget > 0) budget = stepSearchMarkIn(node, query, budget);
        }
        return found;
    }

    /** Прокрутить к следующему совпадению (Enter). */
    function stepSearchJump() {
        if (!stepSearch.hits.length) return;
        stepSearch.hits.forEach(row => row.classList.remove('step-match-current'));

        stepSearch.at = (stepSearch.at + 1) % stepSearch.hits.length;
        const row = stepSearch.hits[stepSearch.at];
        row.classList.add('step-match-current');
        // ⚠ Раскрываем тот, к которому пришли: при широком запросе шаги остаются
        // свёрнутыми, и «перейти к совпадению» без этого показывало бы заголовок
        row.classList.add('open');
        row.scrollIntoView({behavior: 'smooth', block: 'center'});

        document.getElementById('stepSearchCount').textContent =
            `${stepSearch.at + 1} из ${stepSearch.hits.length}`;
    }

    function stepSearchSet(value) {
        const text = String(value || '').trim().toLowerCase();
        // ⚠ Запрос короче двух знаков считаем пустым: «а» совпадает почти с каждым
        // шагом, и поиск превращается в подсветку всей страницы.
        stepSearch.query = text.length >= STEP_SEARCH_MIN ? text : '';
        stepSearchApply();
    }

    // Реестры для всех workflow дерева запуска: у каждого sub-workflow он свой
    async function workflowVariablesPrefetch(run) {
        const ids = new Set();
        const walk = (r) => {
            if (r.workflow_id) ids.add(r.workflow_id);
            (r.children || []).forEach(walk);
        };
        walk(run);
        await Promise.all([...ids].map(workflowVariablesLoad));
    }

    // Разобранные группы по объекту прогона. ⚠ Карту у одной ветки спрашивают дважды —
    // ряд переменных и списки «Вход (metadata)» её шагов, — а стоит она разбора
    // метаданных всех шагов. `WeakMap` убирается сам вместе с данными прогона.
    const _runGroupsCache = new WeakMap();

    // «Имя → группа» для одного прогона: и реестр, и шаги у ветки свои (у
    // sub-workflow изолированный scope). Разбирает то же правило, что панель
    // редактора, — переменная не должна расходиться между двумя страницами.
    // metadata_rendered — что шаг получил в прогоне: имена в llm_to_json_variable,
    // variable_conversion и outputs_map рендер не трогает, они остаются литеральными.
    function runVariableGroups(run) {
        if (_runGroupsCache.has(run)) return _runGroupsCache.get(run);

        const groups = variableGroupIndex(
            workflowVariablesCache[run.workflow_id] || [],
            (run.steps || []).map(s => ({id: s.step_id, metadata: s.metadata_rendered})),
            state.workflows,
            state.tools,
            // ⚠ Имена из снапшота старта: движок положил их в scope молча (входящие,
            // агентские, конверсии) — показывать их «неопределёнными» нельзя, имена
            // легальные и просто не видны списку реестра.
            Object.keys(parseJson(run.variables_start) || {}),
        );
        _runGroupsCache.set(run, groups);

        return groups;
    }

    // Переменные запуска: снапшот на старте, поверх — значения, записанные шагами.
    // Потомки не учитываются: у sub-workflow изолированный scope и свой снапшот старта.
    function collectRunVariables(run) {
        const values = {};
        const sources = {};

        const start = parseJson(run.variables_start);
        if (start && typeof start === 'object' && !Array.isArray(start)) {
            Object.entries(start).forEach(([name, value]) => {
                values[name] = value;
                sources[name] = {label: 'старт', start: true};
            });
        }

        (run.steps || []).forEach(step => {
            const changed = parseJson(step.variables_changed);
            if (!changed || typeof changed !== 'object' || Array.isArray(changed)) return;
            Object.entries(changed).forEach(([name, value]) => {
                values[name] = value;
                sources[name] = {label: `шаг #${step.exec_index}`, start: false};
            });
        });

        return {values, sources};
    }

    // Аккордеон: заголовок-переключатель + тело. Тело строится при первом раскрытии —
    // списков на странице десятки (каждый sub-workflow свой), а открывают единицы.
    function renderVarsAccordion(label, count, buildBody) {
        const column = el('div', 'vars-col');
        const head = el('div', 'label vars-toggle');
        const body = el('div', 'vars-body');
        let open = false;
        let built = false;

        const apply = () => {
            head.textContent = `${open ? '▾' : '▸'} ${label} (${count})`;
            if (open && !built) {
                body.appendChild(buildBody());
                built = true;
            }
            body.style.display = open ? '' : 'none';
        };
        head.onclick = () => {
            open = !open;
            apply();
        };
        apply();

        column.appendChild(head);
        column.appendChild(body);
        return column;
    }

    // Ряд переменных: слева значения прогона, справа объявленные переменные workflow.
    // Возвращает null, если показывать нечего.
    function renderRunVariablesRow(run) {
        const {values, sources} = collectRunVariables(run);
        const names = Object.keys(values);
        const variableGroups = runVariableGroups(run);
        // Только входящие: с чем ветку вызвали. Остальные объявленные (workflow, global,
        // ноды) — внутренняя кухня ветки, и в левом списке они уже есть по факту
        const declared = (workflowVariablesCache[run.workflow_id] || []).filter(v => v.type === 'input');
        const rawStart = typeof run.variables_start === 'string' ? run.variables_start : '';
        // Снапшот не разобрался: обрезан по длине при записи — говорим это, а не молчим
        const truncated = !names.length && rawStart.includes('...[truncated]');

        if (!names.length && !declared.length && !truncated) return null;

        const row = el('div', 'row vars-row');

        if (names.length) {
            row.appendChild(renderVarsAccordion('Переменные', names.length,
                () => renderVariablesList(values, sources, variableGroups)));
        } else if (truncated) {
            const column = el('div', 'vars-col');
            column.appendChild(el('div', 'label', 'Переменные'));
            column.appendChild(el('pre', null, '⚠️ Снапшот переменных обрезан при записи (слишком длинный).'));
            row.appendChild(column);
        }

        if (declared.length) {
            row.appendChild(renderVarsAccordion('Входящие workflow переменные', declared.length,
                () => renderWorkflowVariablesList(declared, values, sources)));
        }

        return row;
    }

    // Рекурсивно собирает статистику вызовов LLM по всем шагам запуска и его потомков
    function collectLlmStats(run) {
        const counts = {};
        const addSteps = (r) => {
            (r.steps || []).forEach(s => {
                if (s.llm_name) counts[s.llm_name] = (counts[s.llm_name] || 0) + 1;
            });
            (r.children || []).forEach(addSteps);
        };
        addSteps(run);
        return counts;
    }

    // Рекурсивно суммирует входящие/исходящие токены по всем шагам
    function collectTokenStats(run) {
        let input = 0, output = 0;
        const addSteps = (r) => {
            (r.steps || []).forEach(s => {
                input += (s.tokens_input || 0);
                output += (s.tokens_output || 0);
            });
            (r.children || []).forEach(addSteps);
        };
        addSteps(run);
        return {input, output};
    }

    function renderRunTimeline(run) {
        const container = document.createElement('div');

        // Дочерние запуски привязываются к породившему их шагу
        const childrenByStep = {};
        (run.children || []).forEach(child => {
            const key = String(child.parent_step_id);
            (childrenByStep[key] ||= []).push(child);
        });

        // Снапшот переменных на входе шага: старт запуска + изменения предыдущих шагов
        let variablesSnapshot = parseJson(run.variables_start) || {};

        // Группа переменной в списках «Вход (metadata)»: та же карта, что и в ряду
        // переменных — имена разбираются по реестру и следам шагов этой ветки
        const variableGroups = runVariableGroups(run);

        // Данные шагов для расшифровки переходов (step_id → номер/иконка/название)
        const stepInfo = {};
        (run.steps || []).forEach(s => {
            if (s.step_id && !stepInfo[String(s.step_id)]) {
                stepInfo[String(s.step_id)] = {
                    execIndex: s.exec_index,
                    icon: state.stepTypeIcons[s.step_type] || '·',
                    title: s.step_title || s.step_type,
                };
            }
        });

        // Топ-3 самых долгих шага (по duration_ms > 0)
        const slowStepIds = new Set(
            [...(run.steps || [])]
                .filter(s => s.duration_ms > 0)
                .sort((a, b) => b.duration_ms - a.duration_ms)
                .slice(0, 3)
                .map(s => s.id)
        );

        (run.steps || []).forEach(step => {
            const row = el('div', 'step-row');
            const head = el('div', 'step-head');

            head.appendChild(el('span', 'step-index', `Шаг #${step.exec_index}${step.step_id ? ` (ID: ${step.step_id})` : ''}`));
            head.appendChild(el('span', 'step-icon', state.stepTypeIcons[step.step_type] || '·'));
            // ⚠ `search-in` — название шага ищется наравне с его данными: чаще
            // всего человек помнит именно его («Тема: вопросы»), а не текст внутри
            head.appendChild(el('span', 'step-name search-in', step.step_title || step.step_type));
            if (step.llm_name) head.appendChild(el('span', 'step-llm-badge', step.llm_name));
            if (step.tokens_input != null || step.tokens_output != null) {
                const tin = step.tokens_input != null ? `↑${step.tokens_input}` : '';
                const tout = step.tokens_output != null ? `↓${step.tokens_output}` : '';
                head.appendChild(el('span', 'step-tokens', [tin, tout].filter(Boolean).join(' ')));
            } else if (step.step_type === 'llm_to_image' && step.output) {
                const m = (step.output || '').match(/^image:(\d+)\s*bytes/);
                if (m) {
                    const kb = parseInt(m[1]) / 1024;
                    const sizeStr = kb >= 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${Math.round(kb)} KB`;
                    head.appendChild(el('span', 'step-tokens', `🖼 ${sizeStr}`));
                }
            }
            if (step.transition) head.appendChild(el('span', 'step-transition-mark', '🔀'));
            head.appendChild(el('span', `status-badge status-${step.status}`, step.status));
            head.appendChild(el('span', `step-duration${slowStepIds.has(step.id) ? ' step-duration-slow' : ''}`, fmtDuration(step.duration_ms)));

            head.onclick = () => row.classList.toggle('open');
            row.appendChild(head);

            // Детали шага: вход / выход / output / переход / ошибка
            const details = el('div', 'step-details');

            const isEmpty = v => v === null || v === undefined || v === '' || v === '{}';

            // value может быть строкой (рендерится в pre) или готовым DOM-узлом
            //
            // ⚠⚠ Значению вешается `search-in` — по этим узлам идёт поиск по шагам.
            // Подпись секции класса не получает намеренно: пока искали по всей
            // строке, слово из подписи («рендера» из «Вход (metadata после
            // рендера)») совпадало со всеми шагами разом.
            function appendSection(parent, title, value) {
                const section = el('div', 'section');
                section.appendChild(el('div', 'section-title', title));
                const body = value instanceof Node
                    ? value : el('pre', null, isEmpty(value) ? '—' : value);
                body.classList.add('search-in');
                section.appendChild(body);
                parent.appendChild(section);
            }

            // Ряд из двух блоков: пропускается целиком, если оба пустые
            function appendSectionRow(leftTitle, leftValue, rightTitle, rightValue) {
                if (isEmpty(leftValue) && isEmpty(rightValue)) return;
                const rowEl = el('div', 'section-row');
                appendSection(rowEl, leftTitle, leftValue);
                appendSection(rowEl, rightTitle, rightValue);
                details.appendChild(rowEl);
            }

            // Переход: слева сырой JSON, справа визуальная расшифровка шаг → шаг
            appendSectionRow(
                'Переход', prettyJson(step.transition),
                'Переход (расшифровка)', renderTransitionVisual(step.transition, stepInfo)
            );

            // Ряд 1: metadata после рендера + значения участвующих в ней переменных
            const inputVariables = stepInputVariables(step.metadata_rendered, variablesSnapshot);
            appendSectionRow(
                'Вход (metadata после рендера)', renderMetadataBlock(step.metadata_rendered),
                'Вход (metadata)', inputVariables ? renderVariablesList(inputVariables, null, variableGroups) : null
            );

            // Ряд 2: измененные шагом переменные + сырой результат
            appendSectionRow(
                'Выход (измененные переменные)', renderMetadataBlock(step.variables_changed),
                'Raw output', step.output
            );

            const errorValue = step.error;
            if (!isEmpty(errorValue)) appendSection(details, 'Ошибка', errorValue);

            row.appendChild(details);

            // Накапливаем изменения переменных для входного снапшота следующих шагов
            const changed = parseJson(step.variables_changed);
            if (changed && typeof changed === 'object') {
                variablesSnapshot = {...variablesSnapshot, ...changed};
            }

            container.appendChild(row);

            // Вложенные запуски sub-workflow под шагом workflow_invoke
            (childrenByStep[String(step.step_id)] || []).forEach(child => {
                const block = el('div', 'child-run');
                const title = el('div', 'child-title');
                title.appendChild(workflowLink(
                    `${child.workflow_title || child.workflow_name || 'sub-workflow'} `,
                    child.workflow_id, 'child-title-link'
                ));
                const badge = el('span', `status-badge status-${child.status}`, child.status);
                title.appendChild(badge);
                title.appendChild(el('span', 'run-meta', ` ${fmtDuration(child.duration_ms)}`));
                block.appendChild(title);
                // Переменные sub-workflow: и scope, и реестр переменных у него свои
                const childVarsRow = renderRunVariablesRow(child);
                if (childVarsRow) block.appendChild(childVarsRow);
                block.appendChild(renderRunTimeline(child));
                container.appendChild(block);
            });
        });

        // Текущий выполняемый шаг (ещё не завершён, нет в DB) — показываем после всех завершённых
        if (run.current_step) {
            const cs = run.current_step;
            const row = el('div', 'step-row step-running-current');
            const head = el('div', 'step-head');
            head.appendChild(el('span', 'step-index', '⏳'));
            head.appendChild(el('span', 'step-icon', state.stepTypeIcons[cs.step_type] || '·'));
            head.appendChild(el('span', 'step-name', cs.step_title || cs.step_type));
            head.appendChild(el('span', 'status-badge status-running', 'running'));
            row.appendChild(head);
            container.appendChild(row);
        }

        return container;
    }

    // Слушатели: изменение фильтра сразу перезагружает список и запоминает выбор
    Object.keys(FILTER_STORAGE_KEY).forEach(selectId => {
        document.getElementById(selectId).onchange = () => {
            filterSave(selectId);
            // Нода правит содержимое двух других селектов — пересобираем их до запроса,
            // иначе в него уехала бы пара «нода + чужой ей workflow», то есть заведомо пусто
            if (selectId === 'filterNode') filterOptionsRebuild();
            state.page = 1;
            loadRuns();
        };
    });
    document.querySelectorAll('.status-tab').forEach(tab => {
        tab.onclick = () => {
            if (tab.dataset.status === state.activeTab) return;
            state.activeRunUuid = null;
            state.page = 1;
            setActiveTab(tab.dataset.status);
            loadRuns();
        };
    });
    document.getElementById('pagePrev').onclick = () => {
        if (state.page > 1) {
            state.page--;
            loadRuns();
        }
    };
    document.getElementById('pageNext').onclick = () => {
        if (state.page < state.totalPages) {
            state.page++;
            loadRuns();
        }
    };

    // Поиск по шагам: набор ждёт паузы, Enter листает совпадения, Esc очищает.
    //
    // ⚠ Задержка нужна не сети (её тут нет), а работе по DOM: каждый пересчёт
    // обходит все строки шагов и переставляет подсветку, а прогоны бывают на
    // полторы сотни шагов с двадцатикилобайтными `output`.
    const stepSearchInput = document.getElementById('stepSearch');
    let stepSearchTimer = null;

    stepSearchInput.oninput = () => {
        clearTimeout(stepSearchTimer);
        stepSearchTimer = setTimeout(() => stepSearchSet(stepSearchInput.value), 200);
    };

    // ⚠⚠ Enter ищет по ВСЕМ прогонам, а не листает совпадения в открытом.
    // В поле поиска Enter значит «искать» — это ожидание человека, и спорить с
    // ним нечем; листание переехало на соседнюю кнопку «↓», где и видно, что
    // оно про открытый прогон.
    stepSearchInput.onkeydown = (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            clearTimeout(stepSearchTimer);
            const typed = String(stepSearchInput.value || '').trim();

            if (typed.length < STEP_SEARCH_ALL_MIN) {
                showNotification(
                    `Для поиска по всем прогонам нужно хотя бы ${STEP_SEARCH_ALL_MIN} знака`,
                    'warning');
                return;
            }

            // Подсветку в открытом прогоне оставляем: найденный прогон откроется
            // с уже помеченными шагами — ради этого обе половины и живут рядом
            if (typed.toLowerCase() !== stepSearch.query) stepSearchSet(typed);

            state.searchAll = typed;
            state.page = 1;
            loadRuns();
        } else if (event.key === 'Escape') {
            stepSearchInput.value = '';
            clearTimeout(stepSearchTimer);
            stepSearchSet('');
            if (state.searchAll) {
                state.searchAll = '';
                state.page = 1;
                loadRuns();
            }
        }
    };

    document.getElementById('stepSearchJump').onclick = () => stepSearchJump();

    document.getElementById('stepSearchClear').onclick = () => {
        stepSearchInput.value = '';
        clearTimeout(stepSearchTimer);
        stepSearchSet('');
        if (state.searchAll) {
            state.searchAll = '';
            state.page = 1;
            loadRuns();
        }
        stepSearchInput.focus();
    };

    initSidebarResizer('traceResizer', 'workflow_trace_sidebar_width',
        document.querySelector('.runs-sidebar'), 240, 900);

    init();
</script>
{% endblock %}
