{% extends "base.html" %}

{% block title %}Переменные Workflow{% endblock %}

{% block head %}
<style>
    /* Базовая компоновка */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    /* Сайдбар */
    .agents-sidebar {
        width: 260px;
        background: #fafafa;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto;
    }

    .group-header {
        padding: 6px 10px 5px;
        font-size: 11px;
        color: #df983d;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .agent-item {
        padding: 6px 10px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 14px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }

    .agent-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .agent-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
    }

    /* Форма */
    .editor-section {
        flex: 1;
        padding: 20px 40px;
        overflow-y: auto;
    }

    .form-header {
        margin-bottom: 15px;
        border-bottom: 2px solid #f4f4f9;
        padding-bottom: 15px;
    }

    #dataForm {
        display: none;
    }

    /* Дефолтный текст (виден, пока переменная не выбрана) */
    .default-text {
        padding: 10px 0;
        font-size: 15px;
        line-height: 1.6;
        color: #2c3e50;
    }

    .form-layout-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 15px;
    }

    /* Несколько полей в одну строку */
    .form-row {
        display: flex;
        gap: 15px;
    }

    .form-row .form-group {
        flex: 1;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    .form-group-checkbox {
        flex-direction: row;
        align-items: center;
    }

    .form-group-checkbox label {
        cursor: pointer;
        margin: 0;
    }

    .form-group-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .agent-item.dragging {
        opacity: 0.4;
    }

    /* Иконка-ручка перетаскивания */
    .agent-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .agent-item .drag-handle {
        color: #c0c8ce;
        cursor: grab;
        font-size: 12px;
        flex-shrink: 0;
        user-select: none;
    }

    .agent-item:hover .drag-handle {
        color: #7f8c8d;
    }

    .agent-item .item-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Список переменных-подсказок под textarea */
    .hint-list {
        font-size: 13px;
        line-height: 1.6;
        color: #7f8c8d;
    }

    .hint-list span {
        color: #1a202c;
    }

    .hint-list:empty {
        display: none;
    }

    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    /* Кнопки и Футер */
    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-create {
        background: #27ae60;
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-delete {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 11px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
        margin-right: auto;
    }

    .btn-delete:hover {
        background: #e74c3c;
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список -->
    <div class="agents-sidebar">
        <div class="sidebar-header">
            <button class="btn-create" id="createNew">+ Создать переменную</button>
        </div>
        <div class="agent-list" id="itemList"></div>
    </div>

    <!-- Форма -->
    <div class="editor-section">
        <div class="form-header">
            <h2 id="formTitle">Выберите переменную</h2>
        </div>

        <!-- Дефолтный текст: показывается, пока не выбрана переменная -->
        <div class="default-text" id="defaultText">
            Выберите переменную слева в меню, чтобы отредактировать ее.
        </div>

        <form id="dataForm">
            <input type="hidden" id="id">

            <div class="form-layout-grid">
                <!-- Левая колонка -->
                <div class="left-col">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Название</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Нода</label>
                            <select id="node_id" class="form-control">
                                <option value="">Выберите ноду...</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <input type="text" id="description" class="form-control">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Роли</label>
                            <select id="role_ids" class="form-control" multiple size="4">
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Тип</label>
                            <select id="type" class="form-control">
                                <option value="public">public — публичная переменная</option>
                                <option value="proxy">proxy — подсказка для других переменных</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Workflow</label>
                            <select id="workflow_ids" class="form-control" multiple size="4">
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Правая колонка -->
                <div class="right-col">
                    <div class="form-group" style="height: 100%;">
                        <label>Значение</label>
                        <textarea id="default" class="form-control" style="flex: 1;"></textarea>
                        <!-- Переменные-подсказки: proxy-переменные той же ноды -->
                        <div class="hint-list" id="hintList"></div>
                    </div>
                </div>
            </div>

            <div class="editor-footer">
                <button type="button" class="btn-delete" id="deleteBtn" style="display:none;">Удалить</button>
                <button type="submit" class="btn-save" id="saveBtn">Сохранить переменную</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, putData, postData, deleteData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';

    const itemList = document.getElementById('itemList');
    const dataForm = document.getElementById('dataForm');
    const deleteBtn = document.getElementById('deleteBtn');
    const defaultText = document.getElementById('defaultText');

    let allWorkflows = [];

    function toggleForm(visible) {
        defaultText.style.display = visible ? 'none' : 'block';
        dataForm.style.display = visible ? 'block' : 'none';
    }

    // Заполняет селект workflow только теми workflow, которые принадлежат выбранной ноде
    function renderWorkflowSelect(selectedNodeId, activeWorkflowIds = []) {
        const workflowSelect = document.getElementById('workflow_ids');
        workflowSelect.innerHTML = '';

        const targetNodeId = selectedNodeId ? parseInt(selectedNodeId) : null;

        allWorkflows
            .filter(wf => {
                const wfNodeId = wf.node_id ? parseInt(wf.node_id) : null;
                return wfNodeId === targetNodeId;
            })
            .forEach(wf => {
                const opt = document.createElement('option');
                opt.value = wf.id;
                opt.textContent = wf.title || wf.name;
                opt.selected = activeWorkflowIds.includes(wf.id);
                workflowSelect.appendChild(opt);
            });
    }

    // Под textarea выводим переменные-подсказки (proxy-переменные той же ноды)
    async function renderHints(variableId) {
        const hintList = document.getElementById('hintList');
        hintList.innerHTML = '';
        if (!variableId) return;
        const res = await getData(`/workflow_variable/public/${variableId}/hints`);
        res.result.forEach(v => {
            const line = document.createElement('div');
            line.innerHTML = `🟠 <span>%${v.name}%</span> - ${v.description || ''}`;
            hintList.appendChild(line);
        });
    }

    async function loadList(activeId = null) {
        const [res, nodesRes, rolesRes, workflowsRes] = await Promise.all([
            getData('/workflow_variable/public/list'),
            getData('/node/list'),
            getData('/role/list'),
            getData('/workflow/list')
        ]);

        const variables = res.result;
        const nodes = nodesRes.result.sort((a, b) => (a.position || 0) - (b.position || 0));
        const roles = rolesRes.result;
        allWorkflows = workflowsRes.result || [];

        // Сохраняем текущие значения селектов формы перед перерисовкой
        const nodeSelect = document.getElementById('node_id');
        const roleSelect = document.getElementById('role_ids');
        const workflowSelect = document.getElementById('workflow_ids');
        const prevNodeValue = nodeSelect.value;
        const prevRoleValues = Array.from(roleSelect.selectedOptions).map(opt => opt.value);
        const prevWorkflowIds = Array.from(workflowSelect.selectedOptions)
            .map(opt => parseInt(opt.value)).filter(v => !isNaN(v));

        nodeSelect.innerHTML = '<option value="">Выберите ноду...</option>';
        nodes.forEach(node => {
            const opt = document.createElement('option');
            opt.value = node.id;
            opt.textContent = node.name;
            nodeSelect.appendChild(opt);
        });
        nodeSelect.value = prevNodeValue;

        // Заполняем Select ролями
        roleSelect.innerHTML = '';
        roles.forEach(role => {
            const opt = document.createElement('option');
            opt.value = role.id;
            opt.textContent = role.name;
            opt.selected = prevRoleValues.includes(String(role.id));
            roleSelect.appendChild(opt);
        });

        // Заполняем Select workflow по текущей ноде
        renderWorkflowSelect(prevNodeValue, prevWorkflowIds);

        itemList.innerHTML = '';
        nodes.forEach(node => {
            const nodeVars = variables
                .filter(v => v.node_id === node.id)
                .sort((a, b) => (a.position || 0) - (b.position || 0));
            if (nodeVars.length === 0) return;

            const header = document.createElement('div');
            header.className = 'group-header';
            header.textContent = node.name;
            itemList.appendChild(header);

            nodeVars.forEach(item => {
                const div = document.createElement('div');
                div.className = 'agent-item';

                const handle = document.createElement('span');
                handle.className = 'drag-handle';
                handle.textContent = '⠿';

                const label = document.createElement('span');
                label.className = 'item-label';
                label.textContent = item.name;

                div.append(handle, label);
                div.draggable = true;
                div.dataset.id = item.id;
                div.dataset.nodeId = node.id;
                if (activeId !== null && item.id === activeId) div.classList.add('active');
                div.onclick = () => selectItem(item, div);
                div.addEventListener('dragstart', onDragStart);
                div.addEventListener('dragover', onDragOver);
                div.addEventListener('dragend', onDragEnd);
                itemList.appendChild(div);
            });
        });
    }

    // Drag-and-drop: перестановка переменных внутри своей ноды, порядок сохраняется в position
    let draggedItem = null;

    function onDragStart(e) {
        draggedItem = e.currentTarget;
        draggedItem.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    }

    function onDragOver(e) {
        const target = e.currentTarget;
        // Двигаем только в пределах своей ноды
        if (!draggedItem || draggedItem === target || draggedItem.dataset.nodeId !== target.dataset.nodeId) return;
        e.preventDefault();
        const rect = target.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        itemList.insertBefore(draggedItem, after ? target.nextSibling : target);
    }

    async function onDragEnd() {
        if (!draggedItem) return;
        const nodeId = draggedItem.dataset.nodeId;
        draggedItem.classList.remove('dragging');
        draggedItem = null;

        // Новый порядок группы по DOM → сохраняем индексы в position
        const items = Array.from(itemList.querySelectorAll(`.agent-item[data-node-id="${nodeId}"]`));
        await Promise.all(items.map((el, index) =>
            putData(`/workflow_variable/public/${el.dataset.id}`, {position: index})
        ));

        // Перестраиваем подсказки открытой переменной с учётом новых позиций
        const openedId = parseInt(document.getElementById('id').value);
        if (openedId) await renderHints(openedId);

        showNotification('Порядок сохранён', 'success');
    }

    function selectItem(item, element) {
        document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        toggleForm(true);

        document.getElementById('id').value = item.id;
        document.getElementById('name').value = item.name;
        document.getElementById('description').value = item.description || '';
        document.getElementById('default').value = item.default || '';
        document.getElementById('node_id').value = item.node_id || '';
        document.getElementById('type').value = item.type || 'public';
        renderHints(item.id);

        // Установка выбранных ролей
        const roleSelect = document.getElementById('role_ids');
        Array.from(roleSelect.options).forEach(opt => {
            opt.selected = item.role_ids.includes(parseInt(opt.value));
        });

        // Workflow ноды выбранной переменной + предустановка привязанных
        renderWorkflowSelect(item.node_id, item.workflow_ids || []);

        document.getElementById('formTitle').textContent = `Редактирование: ${item.name}`;
        deleteBtn.style.display = 'inline-block';
    }

    dataForm.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('id').value;
        const roleSelect = document.getElementById('role_ids');
        const selectedRoles = Array.from(roleSelect.selectedOptions).map(opt => parseInt(opt.value));

        const workflowSelect = document.getElementById('workflow_ids');
        const selectedWorkflows = Array.from(workflowSelect.selectedOptions)
            .map(opt => parseInt(opt.value)).filter(v => !isNaN(v));

        const payload = {
            name: document.getElementById('name').value,
            description: document.getElementById('description').value,
            default: document.getElementById('default').value,
            node_id: document.getElementById('node_id').value ? parseInt(document.getElementById('node_id').value) : null,
            role_ids: selectedRoles,
            workflow_ids: selectedWorkflows,
            type: document.getElementById('type').value
        };

        // Запоминаем фокус, чтобы вернуть его после перерисовки списка
        const focusedElement = document.activeElement;

        let savedId;
        if (id) {
            await putData(`/workflow_variable/public/${id}`, payload);
            savedId = parseInt(id);
            document.getElementById('formTitle').textContent = `Редактирование: ${payload.name}`;
            showNotification('Обновлено', 'success');
        } else {
            const createRes = await postData('/node/workflow_variable', payload);
            savedId = createRes.result.id;
            document.getElementById('id').value = savedId;
            document.getElementById('formTitle').textContent = `Редактирование: ${payload.name}`;
            deleteBtn.style.display = 'inline-block';
            showNotification('Создано', 'success');
        }
        await loadList(savedId);

        if (focusedElement && document.contains(focusedElement)) focusedElement.focus();
    };

    deleteBtn.onclick = async () => {
        const id = document.getElementById('id').value;
        if (!id || !confirm('Вы уверены?')) return;
        await deleteData(`/workflow_variable/public/${id}`);
        showNotification('Удалено', 'success');
        dataForm.reset();
        document.getElementById('id').value = '';
        deleteBtn.style.display = 'none';
        document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
        document.getElementById('formTitle').textContent = 'Выберите переменную';
        toggleForm(false);
        loadList();
    };

    document.getElementById('createNew').onclick = () => {
        dataForm.reset();
        document.getElementById('id').value = '';
        deleteBtn.style.display = 'none';
        document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
        document.getElementById('formTitle').textContent = 'Новая переменная';
        // Сброс ролей
        Array.from(document.getElementById('role_ids').options).forEach(o => o.selected = false);
        document.getElementById('type').value = 'public';
        renderWorkflowSelect(document.getElementById('node_id').value, []);
        document.getElementById('hintList').innerHTML = '';
        toggleForm(true);
    };

    // При смене ноды перезаполняем список workflow, сохраняя ещё актуальные выборы
    document.getElementById('node_id').addEventListener('change', (e) => {
        const workflowSelect = document.getElementById('workflow_ids');
        const selectedWorkflowIds = Array.from(workflowSelect.selectedOptions)
            .map(opt => parseInt(opt.value)).filter(v => !isNaN(v));
        renderWorkflowSelect(e.target.value, selectedWorkflowIds);
    });

    loadList();
</script>
{% endblock %}
