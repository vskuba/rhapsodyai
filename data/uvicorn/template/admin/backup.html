{% extends "base.html" %}

{% block title %}Резервные копии{% endblock %}

{% block head %}
<style>
    .backup-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    .backup-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid #e0e0e0;
        flex-shrink: 0;
    }

    .backup-header h2 {
        margin: 0;
        font-size: 1.05rem;
        color: #2c3e50;
        font-weight: 600;
    }

    .backup-hint {
        font-size: 12px;
        color: #888;
    }

    .backup-header-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .backup-body {
        flex: 1;
        overflow: auto;
        padding: 20px;
    }

    /* ── Table ──────────────────────────────────── */
    .backup-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        overflow: hidden;
    }

    .backup-table th {
        background: #f5f7f9;
        padding: 9px 14px;
        text-align: left;
        font-weight: 600;
        color: #555;
        border-bottom: 1px solid #e0e0e0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .backup-table td {
        padding: 10px 14px;
        border-bottom: 1px solid #f0f0f0;
        vertical-align: middle;
        color: #333;
    }

    .backup-table tr:last-child td { border-bottom: none; }
    .backup-table tr:hover td { background: #f9fbff; }

    .backup-table .col-name { font-family: monospace; font-size: 12px; }
    .backup-table .col-size { color: #666; }
    .backup-table .col-date { color: #666; white-space: nowrap; }
    .backup-table .col-actions { white-space: nowrap; }

    /* ── Buttons ─────────────────────────────────── */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
    }

    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: #3498db; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2980b9; }
    .btn-outline { background: #fff; color: #555; border: 1px solid #ccc; }
    .btn-outline:hover:not(:disabled) { background: #f5f5f5; }
    .btn-danger { background: #fff; color: #e74c3c; border: 1px solid #f5c6c6; }
    .btn-danger:hover:not(:disabled) { background: #fff5f5; border-color: #e74c3c; }
    .btn-restore { background: #fff; color: #27ae60; border: 1px solid #b2dfcc; }
    .btn-restore:hover:not(:disabled) { background: #f0fff4; border-color: #27ae60; }

    .btn-large {
        padding: 8px 18px;
        font-size: 13px;
    }

    /* ── Empty state ─────────────────────────────── */
    .backup-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 60px 20px;
        color: #bbb;
    }

    .backup-empty svg {
        width: 48px;
        height: 48px;
        opacity: 0.35;
    }

    .backup-empty p {
        margin: 0;
        font-size: 13px;
    }

    /* ── Status message ──────────────────────────── */
    .status-msg {
        font-size: 12px;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 4px;
        display: none;
    }
    .status-msg.ok { color: #27ae60; background: #f0fff4; border: 1px solid #b2dfcc; display: inline-block; }
    .status-msg.err { color: #e74c3c; background: #fff5f5; border: 1px solid #f5c6c6; display: inline-block; }

    /* ── Spinner ─────────────────────────────────── */
    .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block content %}
<div class="backup-layout">

    <!-- Header -->
    <div class="backup-header">
        <h2>Резервные копии</h2>
        <span class="backup-hint">mysqldump всей базы данных</span>
        <div class="backup-header-actions">
            <span id="statusMsg" class="status-msg"></span>
            <button class="btn btn-primary btn-large" id="btnCreate" onclick="createBackup()">
                Создать бэкап
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="backup-body">
        <div id="tableWrap"></div>
    </div>

</div>

<script>
// ⚠ Слой отвечает **кодом HTTP** и полем `detail`, а прежние ручки отвечали 200
// с полем `error`. Помощник сводит оба вида к прежней форме `{result}` /
// `{error}`, чтобы остальной код страницы не менялся.
async function ask(url, opts) {
    const r = await fetch(url, opts);
    const body = await r.json().catch(() => ({}));
    if (r.ok) return body;
    const d = body.detail;
    return {error: (typeof d === 'string' && d) ? d : `Ошибка ${r.status}`};
}

async function loadList() {
    await loadTz();
    const resp = await ask('/api/backup/file');
    renderList(resp.result || []);
}

function formatSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1048576).toFixed(2)} MB`;
}

function renderList(items) {
    const wrap = document.getElementById('tableWrap');
    if (!items.length) {
        wrap.innerHTML = `
            <div class="backup-empty">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8l1 13a2 2 0 002 2h8a2 2 0 002-2l1-13M10 12v6m4-6v6"/>
                </svg>
                <p>Бэкапы не найдены</p>
                <p>Нажмите «Создать бэкап» чтобы сохранить первую резервную копию</p>
            </div>`;
        return;
    }

    const canDelete = items.length > 1;
    let rows = items.map(f => `
        <tr>
            <td class="col-name">${f.name}</td>
            <td class="col-size">${formatSize(f.size)}</td>
            <td class="col-date">${fmtTz(f.modified)}</td>
            <td class="col-actions">
                <button class="btn btn-outline" onclick="downloadBackup('${f.name}')">Скачать</button>
                <button class="btn btn-restore" onclick="restoreBackup('${f.name}')">Восстановить</button>
                ${canDelete ? `<button class="btn btn-danger" onclick="deleteBackup('${f.name}')">Удалить</button>` : ''}
            </td>
        </tr>`).join('');

    wrap.innerHTML = `
        <table class="backup-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Размер</th>
                    <th>Дата</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
}

async function createBackup() {
    const btn = document.getElementById('btnCreate');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Создание...';
    hideStatus();

    try {
        const resp = await ask('/api/backup/create', {method: 'POST'});
        if (resp.error) {
            showStatus('Ошибка: ' + resp.error, false);
        } else {
            showStatus(`Создан: ${resp.result.name} (${formatSize(resp.result.size)})`, true);
            await loadList();
        }
    } catch (e) {
        showStatus('Ошибка: ' + e.message, false);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Создать бэкап';
    }
}

function downloadBackup(name) {
    window.location.href = `/api/backup/download/${name}`;
}

async function restoreBackup(name) {
    if (!confirm(`Восстановить базу данных из бэкапа:\n${name}\n\nВнимание: существующие данные могут быть перезаписаны!`)) return;

    hideStatus();
    try {
        const resp = await ask(`/api/backup/restore/${name}`, {method: 'POST'});
        if (resp.error) showStatus('Ошибка: ' + resp.error, false);
        else showStatus(resp.result, true);
    } catch (e) {
        showStatus('Ошибка: ' + e.message, false);
    }
}

async function deleteBackup(name) {
    if (!confirm(`Удалить бэкап:\n${name}`)) return;
    try {
        const resp = await ask(`/api/backup/${name}`, {method: 'DELETE'});
        if (resp.error) showStatus('Ошибка: ' + resp.error, false);
        else await loadList();
    } catch (e) {
        showStatus('Ошибка: ' + e.message, false);
    }
}

function showStatus(msg, ok) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg ' + (ok ? 'ok' : 'err');
}

function hideStatus() {
    document.getElementById('statusMsg').className = 'status-msg';
}

loadList();
</script>
{% endblock %}
