{% extends "base.html" %}

{% block title %}Агенты{% endblock %}

{% block head %}

<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/menu_top.css">

<link rel="stylesheet" href="/static/css/agent.css">
<link rel="stylesheet" href="/static/css/code_mirror_yml.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

{% endblock %}

{% block content %}
<div class="editor-page-container">
    <!-- Левая часть (стили из agent.css) -->
    <div class="agents-sidebar">
        <div class="sidebar-header">Доступные агенты</div>
        <div class="agent-list" id="agentList">
            <!-- Сюда JS будет рендерить .agent-item -->
        </div>
    </div>

    <!-- Правая часть (стили из editor_yml.css) -->
    <div class="editor-section">
        <div class="editor-header">
            <span id="currentAgentName">Выберите файл для редактирования</span>
            <div id="statusLabel"></div>
        </div>

        <textarea id="yamlEditorRaw"></textarea>

        <div class="editor-footer">
            <button class="btn-save" id="saveBtn" disabled>Сохранить YAML</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/yaml/yaml.min.js"></script>

<script type="module">
    import { initAgentsManager, saveAgentConfig } from "/static/js/agent.js";

    const saveBtn = document.getElementById('saveBtn');

    document.addEventListener('DOMContentLoaded', () => {
        // 1. Инициализируем редактор CodeMirror на месте textarea
        const editor = CodeMirror.fromTextArea(document.getElementById('yamlEditorRaw'), {
            mode: 'yaml',             // Подсветка YAML
            theme: 'dracula',          // Темная тема (проверь наличие CSS в блоке head)
            lineNumbers: true,         // Номера строк
            indentUnit: 2,             // Размер отступа
            smartIndent: true,         // Умные отступы
            matchBrackets: true        // Подсветка парных скобок
        });

        // 2. Загружаем список агентов и передаем объект редактора,
        // чтобы при клике на агента текст вставлялся именно в него
        initAgentsManager(editor);

        if (saveBtn) {
            saveBtn.addEventListener('click', () => {
                saveAgentConfig(editor);
            });
        }
    });
</script>

{% endblock %}
