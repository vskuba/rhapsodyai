{% extends "base.html" %}

{% block title %}Агенты{% endblock %}

{% block head %}
<style>
    /* 1. Базовая компоновка (Интеграция с common.css) */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    /* 2. Сайдбар */
    .agents-sidebar {
        width: 260px;
        background: #fafafa;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto;
    }

    /* Группировка и элементы списка */
    .group-header {
        padding: 6px 10px 5px;
        font-size: 11px;
        color: #df983d;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .agent-item {
        padding: 2px 10px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 14px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }

    .agent-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .agent-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
    }

    /* 3. Основная секция формы */
    .editor-section {
        flex: 1;
        padding: 20px 40px;
        overflow-y: auto;
    }

    .form-header {
        margin-bottom: 10px;
        border-bottom: 2px solid #f4f4f9;
        padding-bottom: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
    }

    .form-header h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 20px;
    }

    /* 4. Двухколоночный макет формы */
    .form-layout-grid {
        display: flex;
        gap: 30px;
        align-items: stretch;
        min-height: 450px;
    }

    .settings-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .prompt-column {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .variable-column {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    /* 5. Элементы управления */
    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    .prompt-system-full {
        flex: 1;
        resize: none;
        font-family: 'Consolas', 'Monaco', monospace;
        line-height: 1.5;
        background: #fdfdfd;
        padding: 10px;
    }

    .greeting-full {
        flex: 0.5;
        resize: none;
        font-family: 'Consolas', 'Monaco', monospace;
        line-height: 1.5;
        background: #fdfdfd;
        padding: 10px;
    }

    /* 6. Кнопки и Футер */
    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-save:hover {
        background: #2980b9;
    }

    .btn-save:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
    }

    .btn-create {
        background: #27ae60;
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-delete {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 11px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
        margin-right: auto;
    }

    .btn-delete:hover {
        background: #e74c3c;
        color: white;
    }

    #statusLabel {
        font-size: 13px;
        color: #27ae60;
    }

    .variables-editor-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
        max-height: 200px;
        overflow-y: auto;
    }

    /* Строка с парой Ключ-Значение */
    .variable-row {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .variable-row .form-control {
        padding: 6px 10px;
        font-size: 13px;
        font-family: 'Consolas', 'Monaco', monospace;
    }

    /* Кнопка удаления строки */
    .btn-del-var {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.2s;
    }

    .btn-del-var:hover {
        background: #c0392b;
    }

    /* Кнопка добавления новой переменной */
    .btn-add-var {
        background: #f1f4f6;
        color: #2c3e50;
        border: 1px dashed #cbd5e1;
        padding: 8px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        transition: all 0.2s;
    }

    .btn-add-var:hover {
        background: #e2e8f0;
        color: #3498db;
        border-color: #3498db;
    }

</style>

{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список -->
    <div class="agents-sidebar">
        <div class="sidebar-header">
            <button class="btn-create" id="createNewAgent">+ Создать агента</button>
        </div>
        <div class="agent-list" id="agentList">
            <!-- JS контент -->
        </div>
    </div>

    <!-- Форма -->
    <div class="editor-section">
        <div class="form-header">
            <h2 id="formTitle">Выберите агента</h2>
            <div id="langSwitcherContainer"></div>
        </div>

        <form id="agentForm">
            <input type="hidden" id="agentId">

            <div class="form-layout-grid">
                <!-- Левая колонка: Все настройки -->
                <div class="settings-column">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Название</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Нода</label>
                            <select id="node_id" class="form-control">
                                <option value="">Вне ноды</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Заголовок (В меню)</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Краткое описание</label>
                        <textarea id="description" class="form-control"
                                  placeholder="Краткое описание функций агента"
                                  style="height: 80px; resize: none;"></textarea>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Workflow</label>
                            <select id="workflow_id" class="form-control">
                                <option value="">Нет</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Роли</label>
                            <select id="role_id" class="form-control" multiple size="4">
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Правая колонка: Только System Prompt -->
                <div class="prompt-column">
                    <div class="form-group" style="height: 100%; display: flex; flex-direction: column;">
                        <label>Приветствие</label>
                        <textarea id="greeting" class="form-control greeting-full"></textarea>
                        <label>Системный промпт (System Prompt)</label>
                        <textarea id="prompt_system" class="form-control prompt-system-full"></textarea>
                    </div>
                </div>

                <div class="variable-column">
                    <div class="form-group" id="variablesGroup" style="margin-top: 10px;">
                        <label>Переменные Workflow</label>
                        <div id="variablesContainer" class="variables-editor-container">
                            <!-- Сюда динамически будут добавляться строки с переменными -->
                        </div>
                        <button type="button" class="btn-add-var" id="addVariableBtn">+ Добавить
                            переменную
                        </button>
                    </div>
                </div>

            </div>

            <div class="editor-footer">
                <span id="statusLabel"></span>
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none;">Удалить агента</button>
                <button type="submit" class="btn-save" id="saveBtn">Сохранить агента</button>
            </div>
        </form>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, putData, postData, deleteData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';
    import {langSwitcherCreate, nodeLanguagesGet, userLanguageGet} from '/static/js/lang_switcher.js';

    // Переключатель языков (переводимые поля — «Приветствие» и «System Prompt»);
    // языки берутся из настройки ноды, кнопка перевода действует на сфокусированное поле
    const langSwitcher = langSwitcherCreate(document.getElementById('langSwitcherContainer'));
    langSwitcher.fieldBind(document.getElementById('greeting'));
    langSwitcher.fieldBind(document.getElementById('prompt_system'));

    // Смена ноды в форме — обновляем набор языков (введенные переводы сохраняются в памяти поля)
    document.getElementById('node_id').addEventListener('change', async (e) => {
        langSwitcher.setLanguages(await nodeLanguagesGet(e.target.value));
    });

    const agentListContainer = document.getElementById('agentList');
    const saveBtn = document.getElementById('saveBtn');
    const agentForm = document.getElementById('agentForm');
    const deleteBtn = document.getElementById('deleteBtn');

    /**
     * Инициализация менеджера: загрузка групп и списка агентов
     */
    async function initAgentsManager(currentNodeId = null, selectedWorkflow = null, selectedRoleIds = null) {
        if (!agentListContainer) return;

        try {
            const [agentsRes, nodesRes, workflowRes, roleRes] = await Promise.all([
                getData('/agent/list'),
                getData('/node/list'),
                getData('/workflow/list'),
                getData('/role/list')
            ]);

            // 1. Сортируем группы по полю position (от меньшего к большему)
            const nodes = nodesRes.result.sort((a, b) => (a.position || 0) - (b.position || 0));
            const agents = agentsRes.result;
            const workflows = workflowRes.result;
            const roles = roleRes.result;

            // 2. Заполняем Select групп (в отсортированном порядке)
            const nodeSelect = document.getElementById('node_id');
            nodeSelect.innerHTML = '<option value="">Вне ноды</option>';
            nodes.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                nodeSelect.appendChild(opt);
            });

            const workflowSelect = document.getElementById('workflow_id');
            workflowSelect.innerHTML = '<option value="">Нет</option>';
            // subflow=1 — переиспользуемые под-процессы: агентам напрямую не назначаются,
            // вызываются только шагом workflow_invoke
            workflows.filter(g => !g.subflow).forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.title;
                workflowSelect.appendChild(opt);
            });

            const roleSelect = document.getElementById('role_id');
            roleSelect.innerHTML = '';
            roles.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r.name;
                roleSelect.appendChild(opt);
            });

            if (currentNodeId) {
                nodeSelect.value = currentNodeId;
            }

            if (selectedWorkflow) {
                workflowSelect.value = selectedWorkflow;
            }

            if (selectedRoleIds) {
                setSelectedRoles(selectedRoleIds);
            }

            renderNodeList(agents, nodes);

        } catch (e) {
            console.error("Ошибка инициализации:", e);
        }
    }

    function setSelectedRoles(roleIds) {
        const roleSelect = document.getElementById('role_id');
        const ids = (roleIds || []).map(Number);
        Array.from(roleSelect.options).forEach(opt => {
            opt.selected = ids.includes(Number(opt.value));
        });
    }

    function getSelectedRoles() {
        const roleSelect = document.getElementById('role_id');
        return Array.from(roleSelect.selectedOptions).map(opt => parseInt(opt.value, 10));
    }

    function renderNodeList(agents, nodes) {
        agentListContainer.innerHTML = '';

        // Получаем ID текущего редактируемого агента из скрытого поля формы
        const currentAgentIdEl = document.getElementById('agentId');
        const currentAgentId = currentAgentIdEl ? currentAgentIdEl.value : '';

        // Группируем агентов по ID ноды
        const agentsByNode = agents.reduce((acc, a) => {
            const nid = a.node_id || 'none';
            if (!acc[nid]) acc[nid] = [];
            acc[nid].push(a);
            return acc;
        }, {});

        // Функция для отрисовки блока группы
        const createNodeSection = (nid, gName) => {
            const nodeAgents = agentsByNode[nid];
            if (!nodeAgents) return; // Не рисуем пустые ноды

            const header = document.createElement('div');
            header.className = 'group-header';
            header.textContent = gName;
            agentListContainer.appendChild(header);

            // Сортируем агентов внутри группы по названию
            nodeAgents.sort((a, b) => (a.title || a.name).localeCompare(b.title || b.name));

            nodeAgents.forEach(agent => {
                const div = document.createElement('div');
                div.className = 'agent-item';
                if (currentAgentId && agent.id.toString() === currentAgentId.toString()) {
                    div.classList.add('active');
                }
                div.textContent = agent.title || agent.name;
                div.onclick = () => selectAgentForEdit(agent.id, div);
                agentListContainer.appendChild(div);
            });
        };

        // Сначала рендерим агентов С ГРУППАМИ (в порядке position)
        nodes.forEach(g => createNodeSection(g.id, g.name));

        createNodeSection('none', 'Вне ноды');
    }

    /**
     * Загрузка данных конкретного агента в форму
     */
    async function selectAgentForEdit(agentId, element) {
        // Подсветка активного
        document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        try {
            const data = await getData(`/agent/${agentId}`);
            const agent = data.result; // Данные из ответа (как на вашем скрине)

            if (!agent) return;

            // Безопасное заполнение полей
            const fields = {
                'agentId': agent.id,
                'name': agent.name,
                'node_id': agent.node_id || '',
                'title': agent.title || '',
                'description': agent.description || '',
                'workflow_id': agent.workflow_id || ''
            };

            for (const [id, value] of Object.entries(fields)) {
                const el = document.getElementById(id);
                if (el) {
                    el.value = value;
                } else {
                    console.error(`Элемент с id="${id}" не найден в HTML!`);
                }
            }

            // Приветствие и System Prompt — переводимые поля: языки из настроек ноды агента,
            // активный по умолчанию — язык пользователя из кабинета
            langSwitcher.setLanguages(await nodeLanguagesGet(agent.node_id), await userLanguageGet());
            langSwitcher.fieldLoad(document.getElementById('greeting'), agent.greeting || '');
            langSwitcher.fieldLoad(document.getElementById('prompt_system'), agent.prompt_system || '');

            setSelectedRoles(agent.role_ids || []);

            const varContainer = document.getElementById('variablesContainer');
            if (varContainer) {
                varContainer.innerHTML = ''; // Очищаем контейнер от старых переменных

                if (agent.workflow_variable) {
                    try {
                        // Парсим, если пришла строка, иначе используем как объект
                        const parsedVars = typeof agent.workflow_variable === 'string'
                            ? JSON.parse(agent.workflow_variable)
                            : agent.workflow_variable;

                        // Отрисовываем каждую пару ключ-значение
                        Object.entries(parsedVars).forEach(([key, val]) => {
                            createVariableRow(key, val);
                        });
                    } catch (e) {
                        console.error("Ошибка парсинга workflow_variable:", e);
                        // Если там не валидный JSON, создаем одну строчку с ошибкой в значении
                        createVariableRow('error_raw_data', agent.workflow_variable);
                    }
                }
            }

            document.getElementById('formTitle').textContent = `Редактирование: ${agent.name}`;

            if (saveBtn) saveBtn.disabled = false;
            if (deleteBtn) deleteBtn.style.display = 'block';

        } catch (e) {
            console.error("Ошибка при заполнении формы:", e);
        }
    }

    /**
     * Удаление агента
     */
    async function deleteAgentConfig() {
        const id = document.getElementById('agentId').value;
        const title = document.getElementById('title').value || document.getElementById('name').value;

        if (!id) return;

        if (!confirm(`Вы уверены, что хотите удалить агента "${title}"?`)) return;

        if (deleteBtn) deleteBtn.disabled = true;

        try {
            await deleteData(`/agent/${id}`);
            showNotification(`Агент "${title}" удален`, 'success');

            document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
            if (createBtn) createBtn.click();
            else agentForm.reset();

            await initAgentsManager();
        } catch (e) {
            console.error("Ошибка удаления:", e);
            showNotification(`Ошибка при удалении: ${e.message}`, 'error');
        } finally {
            if (deleteBtn) deleteBtn.disabled = false;
        }
    }

    /**
     * Сохранение (Создание или Обновление)
     */
    async function saveAgentConfig() {
        const id = document.getElementById('agentId').value;
        const currentNodeId = document.getElementById('node_id').value;
        const currentWorkflowId = document.getElementById('workflow_id').value;
        const currentRoleIds = getSelectedRoles();
        const saveBtn = document.getElementById('saveBtn');
        const varRows = document.querySelectorAll('.variable-row');
        const workflowVariableObj = {};

        varRows.forEach(row => {
            const key = row.querySelector('.var-key').value.trim();
            const val = row.querySelector('.var-value').value.trim();
            if (key) {
                workflowVariableObj[key] = val;
            }
        });

        // Собираем данные из полей
        const payload = {
            name: document.getElementById('name').value,
            node_id: document.getElementById('node_id').value || null,
            title: document.getElementById('title').value,
            workflow_id: document.getElementById('workflow_id').value || null,
            role_ids: currentRoleIds,
            prompt_system: langSwitcher.fieldSerialize(document.getElementById('prompt_system')),
            greeting: langSwitcher.fieldSerialize(document.getElementById('greeting')),
            description: document.getElementById('description').value,
            workflow_variable: JSON.stringify(workflowVariableObj)
        };

        // Блокируем кнопку на время запроса
        if (saveBtn) saveBtn.disabled = true;

        try {
            let targetRoleIds = currentRoleIds;
            if (id) {
                await putData(`/agent/${id}`, payload);
                showNotification(`Агент "${payload.title}" обновлен`, 'success');
            } else {
                const res = await postData('/agent', payload);
                showNotification(`Агент "${payload.title}" создан`, 'success');
                if (res && res.result && res.result.role_ids) {
                    targetRoleIds = res.result.role_ids;
                }
            }

            await initAgentsManager(currentNodeId, currentWorkflowId, targetRoleIds);

        } catch (e) {
            console.error("Ошибка сохранения:", e);
            // Выводим уведомление об ошибке
            showNotification(`Ошибка сохранения: ${e.message}`, 'error');
        } finally {
            // Всегда разблокируем кнопку в конце
            if (saveBtn) saveBtn.disabled = false;
        }
    }

    function createVariableRow(key = '', value = '') {
        const container = document.getElementById('variablesContainer');
        if (!container) return;

        const row = document.createElement('div');
        row.className = 'variable-row';

        // Поле для Ключа
        const keyInput = document.createElement('input');
        keyInput.type = 'text';
        keyInput.className = 'form-control var-key';
        keyInput.placeholder = 'Ключ (например, test_id)';
        keyInput.value = key;
        keyInput.required = true; // Ключ обязателен, если строка создана

        // Поле для Значения
        const valInput = document.createElement('input');
        valInput.type = 'text';
        valInput.className = 'form-control var-value';
        valInput.placeholder = 'Значение';
        valInput.value = value;

        // Кнопка удаления
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-del-var';
        delBtn.innerHTML = '&times;'; // Символ крестика
        delBtn.onclick = () => row.remove();

        row.appendChild(keyInput);
        row.appendChild(valInput);
        row.appendChild(delBtn);
        container.appendChild(row);
    }

    // ========================================================
    // ИНИЦИАЛИЗАЦИЯ И ОБРАБОТЧИКИ СОБЫТИЙ (БЕЗ DOMContentLoaded)
    // ========================================================

    // 1. Первичный запуск менеджера при загрузке скрипта
    initAgentsManager();

    // 2. Обработка кнопки "Создать агента"
    const createBtn = document.getElementById('createNewAgent');
    if (createBtn && agentForm) {
        createBtn.addEventListener('click', () => {
            // Очищаем текстовые поля формы вручную (безопасно для динамических селектов)
            agentForm.reset();

            // Явно сбрасываем скрытый ID и селекты на дефолт
            document.getElementById('agentId').value = '';
            document.getElementById('node_id').value = '';
            document.getElementById('workflow_id').value = '';
            setSelectedRoles([]);

            // Обновляем UI
            document.getElementById('formTitle').textContent = 'Новый агент';
            if (saveBtn) saveBtn.disabled = false;
            if (deleteBtn) deleteBtn.style.display = 'none';

            // Снимаем выделение с активного агента в списке
            document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));

            const varContainer = document.getElementById('variablesContainer');
            if (varContainer) varContainer.innerHTML = ''; // Очищаем переменные

            // Очищаем переводы прошлого агента
            langSwitcher.fieldLoad(document.getElementById('greeting'), '');
            langSwitcher.fieldLoad(document.getElementById('prompt_system'), '');
        });
    }

    // 3. Обработка кнопки "Удалить агента"
    if (deleteBtn) {
        deleteBtn.addEventListener('click', deleteAgentConfig);
    }

    const addVarBtn = document.getElementById('addVariableBtn');
    if (addVarBtn) {
        addVarBtn.addEventListener('click', () => {
            createVariableRow('', ''); // Создает пустую строку для ввода
        });
    }

    // 3. Обработка сохранения формы
    if (agentForm) {
        agentForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Предотвращаем перезагрузку страницы
            await saveAgentConfig();
        });
    }
</script>
{% endblock %}
