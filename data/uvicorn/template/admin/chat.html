{% extends "base.html" %}

{% block title %}Чат с агентом{% endblock %}

{% block head %}

<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/menu_top.css">

<link rel="stylesheet" href="/static/css/chat.css">
<link rel="stylesheet" href="/static/css/progress_bar.css">
<link rel="stylesheet" href="/static/css/user.css">
<link rel="stylesheet" href="/static/css/voice.css">
<link rel="stylesheet" href="/static/css/agent.css">

{% endblock %}

{% block content %}
<div class="main-wrapper">
    <!-- Основная зона чата -->
    <div class="chat-container">

        <!-- НОВАЯ ПАНЕЛЬ УПРАВЛЕНИЯ (Блоки 1, 2, 3) -->
        <div class="chat-header">
            <div class="header-block">
                <label>LLM:</label>
                <select id="llmModelSelect">
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="claude-3-5">Claude 3.5</option>
                    <option value="gemini-pro">Gemini Pro</option>
                </select>
            </div>

            <div class="header-block session-current">
                <span class="session-label">Session ID:</span>
                <span id="sessionDisplay">f47ac10b...</span>
            </div>

            <div class="header-block">
                <button id="newSessionBtn" class="action-btn">New Session</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai-msg">Привет! Выберите агента и начнем.</div>
        </div>

        <div id="topProgressBar" class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="chat-input-area">
            <button id="micBtn" class="mic-button">🎤</button>
            <textarea id="userInput" placeholder="Напишите сообщение..."></textarea>
            <button id="sendBtn">Отправить</button>
        </div>
    </div>

    <!-- Правая колонка остается без изменений -->
    <div class="sidebar">
        <div class="sidebar-label">Активный агент</div>
        <select id="agentSelect" size="10">
            <option value="loading">Загрузка...</option>
        </select>
    </div>

    <div class="sidebar">
        <div class="sidebar-label">Пользователи</div>
        <select id="userSelect" size="10">
            <option value="loading">Загрузка...</option>
        </select>
    </div>
</div>
{% endblock %}

{% block scripts %}

<script type="module">
    import {loadUsers} from "/static/js/user.js";
    import {agentSelect, userSelect, loadAgents, getAgentSessionLastEntry} from "/static/js/agent.js";
    import {sendMessage, toggleLoading, newSessionBtn, startNewSession, getChatMessagesCurrentSession} from "/static/js/chat.js";
    import {initVoice} from "/static/js/voice.js";
    import {saveUserSetting, loadAndApplySetting} from "/static/js/setting.js";
    import {loadLLMs} from "/static/js/llm.js";

    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const llmModelSelect = document.getElementById('llmModelSelect');

    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Инициализация агентов
        await Promise.all([
            loadAgents(),
            loadUsers(),
            loadLLMs(),
        ]);

        const loadSettings = async () => {
            const userId = userSelect.value;
            const value = await loadAndApplySetting('llm_active', userId);

            if (value && value !== 'null') {
                llmModelSelect.value = value;
            }

            await getAgentSessionLastEntry();
            await getChatMessagesCurrentSession();
        };

        // Первичный вызов
        await loadSettings();

        // 2. Инициализация голоса (передаем функцию, что делать с текстом)
        initVoice(toggleLoading, (text) => {
            userInput.value = text;
            sendMessage(toggleLoading);
        });

        // 3. Обработчики текста
        sendBtn.addEventListener('click', () => sendMessage(toggleLoading));

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(toggleLoading);
            }
        });

        agentSelect.addEventListener('change', getAgentSessionLastEntry);
        userSelect.addEventListener('change', getAgentSessionLastEntry);

        llmModelSelect.addEventListener('change', async () => {
            const userId = userSelect.value;
            const model = llmModelSelect.value;
            toggleLoading(true);
            await saveUserSetting('llm_active', model, userId);
            toggleLoading(false);
        });

        newSessionBtn.addEventListener('click', startNewSession);
    });
</script>

{% endblock %}
