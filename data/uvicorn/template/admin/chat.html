{% extends "base.html" %}

{% block title %}Чат с агентом{% endblock %}

{% block content %}
<div class="main-wrapper">
    <!-- Основная зона чата -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-msg">Привет! Выберите агента и начнем.</div>
        </div>

        <div id="topProgressBar" class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="chat-input-area">
            <button id="micBtn" class="mic-button">🎤</button>
            <textarea id="userInput"></textarea>
            <button id="sendBtn">Отправить</button>
        </div>
    </div>

    <!-- Правая колонка -->
    <div class="sidebar">
        <div class="sidebar-label">Активный агент</div>
        <select id="agentSelect" size="10">
            <option value="loading">Загрузка...</option>
        </select>
    </div>

    <div class="sidebar">
        <div class="sidebar-label">Пользователи</div>
        <select id="userSelect" size="10">
            <option value="loading">Загрузка...</option>
        </select>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/api.js"></script>
<script type="module" src="/static/js/chat.js"></script>
<script type="module" src="/static/js/user.js"></script>
<script type="module" src="/static/js/voice.js"></script>
<script type="module" src="/static/js/agent.js"></script>
<script type="module" src="/static/js/ui.js"></script>

<script type="module">
    import {loadUsers} from "/static/js/user.js";
    import {loadAgents} from "/static/js/agent.js";
    import {sendMessage} from "/static/js/chat.js";
    import {initVoice} from "/static/js/voice.js";
    import {toggleLoading} from "/static/js/ui.js";

    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    document.addEventListener('DOMContentLoaded', () => {
        // 1. Инициализация агентов
        loadAgents(toggleLoading);
        loadUsers(toggleLoading);

        // 2. Инициализация голоса (передаем функцию, что делать с текстом)
        initVoice(toggleLoading, (text) => {
            userInput.value = text;
            sendMessage(toggleLoading);
        });

        // 3. Обработчики текста
        sendBtn.addEventListener('click', () => sendMessage(toggleLoading));

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(toggleLoading);
            }
        });
    });
</script>

{% endblock %}
