{% extends "base.html" %}

{% block title %}Мониторинг очередей{% endblock %}

{% block head %}

<meta http-equiv="refresh" content="3">
<style>
    body { font-family: sans-serif; background: #f4f4f9; }
    table { width: 100%; max-width: 500px; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #4CAF50; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
</style>

{% endblock %}

{% block content %}
<div class="editor-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>📊 Мониторинг очередей (In-Memory)</h2>
        <p style="margin: 0; color: #666;"><small>🔄 Обновляется автоматически каждые 3 секунды</small></p>
    </div>

    <table style="width: 100%; max-width: 800px;">
        <thead>
            <tr><th>Название очереди</th><th>Задач сейчас</th></tr>
        </thead>
        <tbody>
            {{ rows | safe }}
        </tbody>
    </table>
</div>
{% endblock %}
