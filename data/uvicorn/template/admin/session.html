{% extends "base.html" %}

{% block title %}Сессии{% endblock %}

{% block head %}

<style>
    /* Переопределяем main-wrapper из common.css для полноэкранного режима */
    .session-layout {
        display: flex !important;
        flex-direction: column !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
        background: #f8f9fa;
    }

    /* БЛОК 1: Шапка с фильтрами (Горизонтальная) */
    .session-header-filters {
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 15px 25px;
        background: #ffffff;
        border-bottom: 1px solid #e0e4e8;
        flex-shrink: 0;
    }

    /* Скрываем кнопку обновить согласно запросу */
    .btn-refresh, #refreshSessions {
        display: none !important;
    }

    .filter-item {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .filter-item .sidebar-label {
        margin: 0;
        white-space: nowrap;
        font-size: 11px;
        color: #718096;
    }

    .filter-item select {
        min-width: 220px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #cbd5e0;
        background: #fff;
        font-size: 14px;
        outline: none;
    }

    /* Контейнер для нижней части (Блок 2 + Блок 3) */
    .session-body-container {
        display: flex;
        flex: 1;
        min-height: 0;
        background: #fff;
    }

    /* ============================================================
       БЛОК 2: СПИСОК СЕССИЙ (СЛЕВА)
       ============================================================ */
    .session-sidebar-list {
        width: 300px !important;
        min-width: 300px;
        border-right: 1px solid #e0e4e8;
        background: #fcfcfc;
        display: flex;
        flex-direction: column;
    }

    .session-list {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
    }

    /* Карточка сессии */
    .session-item {
        padding: 12px;
        border: 1px solid #edf2f7;
        border-radius: 8px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #fff;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .session-item:hover {
        border-color: #007bff;
        background-color: #f8fbff;
    }

    .session-item.active {
        background-color: #eef7ff;
        border-color: #007bff;
        box-shadow: inset 4px 0 0 #007bff;
    }

    .session-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .session-short-uuid {
        font-family: 'Monaco', 'Consolas', monospace;
        font-weight: bold;
        font-size: 13px;
        color: #2d3748;
    }

    .session-msg-count {
        font-size: 10px;
        background: #edf2f7;
        padding: 2px 6px;
        border-radius: 10px;
        color: #4a5568;
    }

    .session-item-date {
        font-size: 10px;
        color: #a0aec0;
    }

    /* ============================================================
       БЛОК 3: ИНСПЕКТОР СООБЩЕНИЙ (СПРАВА)
       ============================================================ */
    .session-detail-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #fff;
        min-width: 0;
    }

    .detail-header {
        padding: 12px 25px;
        font-weight: bold;
        color: #007bff;
        font-size: 13px;
        border-bottom: 1px solid #f0f0f0;
    }

    #messagesContainer {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
    }

    /* Оформление сообщений (Чипсы/Баблы) */
    .admin-msg-box {
        padding-bottom: 20px;
        border-bottom: 1px solid #f1f3f5;
    }

    .chips-container {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: center;
    }

    .chip {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 2px 10px;
        border-radius: 12px;
        color: white;
        letter-spacing: 0.5px;
    }

    .chip-date {
        font-size: 14px;
        color: #1a8697;
        margin-left: auto;
    }

    /* Цвета бабблов ролей */
    .role-user {
        background-color: #f0913d;
    }

    .role-assistant {
        background-color: #4a90e2;
    }

    .role-tool {
        background-color: #67c23a;
    }

    .role-system {
        background-color: #909399;
    }

    .role-thinking {
        background-color: #adb5bd;
    }

    .chip-llm {
        background-color: #d7d8f0;
        color: #7f59e9;
        border: 1px solid #e2e8f0;
    }

    /* Баббл типа контента */
    .chip-kind {
        background-color: #d7eff0;
        color: #0d3061;
        border: 1px solid #e2e8f0;
    }

    .chip-token {
        background-color: #e0f0d7;
        color: #1a4c95;
        border: 1px solid #e2e8f0;
    }

    .admin-msg-content {
        font-size: 12px;
        line-height: 1.4;
        color: #1e293b;
        white-space: pre-wrap;
        word-break: break-word;
    }

    /* Скроллбары */
    ::-webkit-scrollbar {
        width: 6px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 10px;
    }
</style>

{% endblock %}

{% block content %}
<div class="main-wrapper session-layout">

    <!-- БЛОК 1: Фильтры (Сверху) -->
    <div class="session-header-filters" id="block-1">
        <div class="filter-item">
            <span class="sidebar-label">Агент</span>
            <select id="agentFilter">
                <option>Загрузка...</option>
            </select>
        </div>
        <div class="filter-item">
            <span class="sidebar-label">Пользователь</span>
            <select id="userFilter">
                <option>Загрузка...</option>
            </select>
        </div>
        <button id="refreshSessions" class="action-btn">Обновить</button>
    </div>

    <div class="session-body-container">
        <!-- БЛОК 2: Список сессий (Слева) -->
        <div class="sidebar session-sidebar-list" id="block-2">
            <div class="sidebar-label">Список сессий</div>
            <div class="session-list" id="sessionList"></div>
        </div>

        <!-- БЛОК 3: Сообщения (Справа) -->
        <div class="session-detail-view" id="block-3">
            <div class="detail-header" id="activeSessionTitle">Выберите сессию из списка</div>
            <div id="messagesContainer">
                <div class="placeholder">Поток сообщений будет отображен здесь</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}

<script type="module">
    import {postData} from '/static/js/api.js';

    const sessionList = document.getElementById('sessionList');
    const messagesContainer = document.getElementById('messagesContainer');
    const agentFilter = document.getElementById('agentFilter');
    const userFilter = document.getElementById('userFilter');

    async function loadSessions() {
        sessionList.innerHTML = 'Загрузка...';
        const data = await postData('/session/list', {
            agent_id: agentFilter.value,
            user_id: userFilter.value ? parseInt(userFilter.value) : null
        });

        sessionList.innerHTML = '';
        data.result.forEach((s, index) => {
            const div = document.createElement('div');
            div.className = 'session-item';

            // Форматирование UUID (первые 6 символов)
            const shortUuid = s.session_uuid.substring(0, 12) + '...';

            div.innerHTML = `
            <div class="session-item-header">
                <span class="session-short-uuid">${shortUuid}</span>
                <span class="session-msg-count">💬 ${s.msg_count}</span>
            </div>
        `;

            div.onclick = () => loadSessionDetails(s.session_uuid, div);
            sessionList.appendChild(div);

            if (index === 0) {
                loadSessionDetails(s.session_uuid, div);
            }
        });
    }

    async function initFilters() {
        try {
            // 1. Загрузка агентов
            const agentData = await (await fetch('/agent/list')).json();
            if (agentData.result && agentData.result.length > 0) {
                agentFilter.innerHTML = ''; // Очищаем заглушку
                agentData.result.forEach(agent => {
                    agentFilter.add(new Option(agent.name, agent.id));
                });
                agentFilter.selectedIndex = 0;
            }

            // 2. Загрузка пользователей
            const userData = await (await fetch('/user/list')).json();
            if (userData.result && userData.result.length > 0) {
                userFilter.innerHTML = ''; // Очищаем заглушку
                userData.result.forEach(user => {
                    userFilter.add(new Option(user.username, user.id));
                });
                userFilter.selectedIndex = 0;
            }

            // СЛУШАТЕЛИ: чтобы при смене в Блоке 1 обновлялся Блок 2
            agentFilter.onchange = loadSessions;
            userFilter.onchange = loadSessions;

            // Сразу загружаем список после инициализации фильтров
            await loadSessions();

        } catch (e) {
            console.error("Ошибка инициализации:", e);
        }
    }

    async function loadSessionDetails(uuid, element) {
        document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');

        document.getElementById('activeSessionTitle').innerText = "Сессия: " + uuid;
        messagesContainer.innerHTML = 'Загрузка...';

        try {
            const data = await postData('/session/messages', {
                session_uuid: uuid
            });

            messagesContainer.innerHTML = '';
            data.result.forEach(m => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'admin-msg-box';

                const roleClass = `role-${m.role}`;
                // Форматируем время создания сообщения (согласно структуре БД)
                const time = m.created_at ? new Date(m.created_at).toLocaleTimeString() : '';

                msgDiv.innerHTML = `
                <div class="chips-container">
                    <span class="chip ${roleClass}">${m.role}</span>
                    <span class="chip chip-kind">${m.kind_type}</span>
                    <span class="chip chip-llm">${m.llm_name}</span>
                    ${m.token ? `<span class="chip chip-token">Токены: ${m.token}</span>` : ''}
                    <span class="chip-date">${time}</span>
                </div>
                <div class="admin-msg-content">${m.content || ''}</div>
            `;
                messagesContainer.appendChild(msgDiv);
            });

            messagesContainer.scrollTop = 0;
        } catch (e) {
            console.error("Ошибка загрузки полной истории:", e);
            messagesContainer.innerHTML = '<div style="color:red">Ошибка загрузки данных</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('refreshSessions').onclick = loadSessions;
        initFilters();
    });
</script>

{% endblock %}
