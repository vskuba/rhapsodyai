{% extends "base.html" %}

{% block title %}Сессии{% endblock %}

{% block head %}

<style>
    .session-layout {
        display: flex !important;
        flex-direction: column !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
        background: #f8f9fa;
    }

    .session-body-container {
        display: flex;
        flex: 1;
        min-height: 0;
        background: #fff;
    }

    /* ЛЕВАЯ КОЛОНКА (Фильтры + Выбор сессии) */
    .session-sidebar {
        width: 300px !important;
        min-width: 300px;
        border-right: 1px solid #e0e4e8;
        background: #fcfcfc;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow-y: auto;
    }

    .filter-label {
        display: block; 
        font-size: 11px; 
        font-weight: bold; 
        color: #718096; 
        text-transform: uppercase; 
        margin-bottom: 5px;
    }

    .form-control {
        width: 100%; 
        box-sizing: border-box; 
        padding: 6px 12px; 
        border-radius: 6px; 
        border: 1px solid #cbd5e0; 
        background: #fff; 
        font-size: 14px; 
        outline: none;
    }

    /* СТИЛИ СЕЛЕКТА СЕССИЙ */
    #sessionSelect {
        width: 100%;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        padding: 5px;
        font-family: monospace;
        font-size: 12px;
    }

    /* ЦЕНТРАЛЬНАЯ/ПРАВАЯ КОЛОНКА (Сообщения) */
    .session-detail-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #fff;
        min-width: 0;
    }

    .detail-header {
        padding: 12px 25px;
        font-weight: bold;
        color: #007bff;
        font-size: 13px;
        border-bottom: 1px solid #f0f0f0;
    }

    #messagesContainer {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
    }

    .admin-msg-box {
        padding-bottom: 20px;
        border-bottom: 1px solid #f1f3f5;
    }

    .chips-container {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: center;
    }

    .chip {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 2px 10px;
        border-radius: 12px;
        color: white;
        letter-spacing: 0.5px;
    }

    .chip-date {
        font-size: 14px;
        color: #1a8697;
        margin-left: auto;
    }

    .role-user { background-color: #f0913d; }
    .role-llm { background-color: #4a90e2; }
    .role-tool, .role-workflow { background-color: #67c23a; }
    .role-system { background-color: #909399; }
    .role-thinking { background-color: #adb5bd; }

    .chip-llm { background-color: #d7d8f0; color: #7f59e9; border: 1px solid #e2e8f0; }
    .chip-request-id { background-color: #f4f4f4; color: #2c61c7; border: 1px solid #e2e8f0; }
    .chip-kind { background-color: #d7eff0; color: #0d3061; border: 1px solid #e2e8f0; }
    .chip-token { background-color: #e0f0d7; color: #1a4c95; border: 1px solid #e2e8f0; }

    .admin-msg-content {
        font-size: 13px;
        line-height: 1.4;
        color: #1e293b;
        white-space: pre-wrap;
        word-break: break-word;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
</style>

{% endblock %}

{% block content %}
<div class="main-wrapper session-layout">
    <div class="session-body-container">
        
        <!-- ЛЕВАЯ КОЛОНКА (Фильтры + Сессии) -->
        <div class="session-sidebar">
            <div class="filter-group">
                <div class="sidebar-label" style="margin-bottom: 10px; font-weight: bold; color: #4a5568;">Фильтры</div>
                
                <label for="agentFilter" class="filter-label">Агент</label>
                <select id="agentFilter" class="form-control" style="margin-bottom: 10px;">
                    <option>Загрузка...</option>
                </select>

                <label for="companionFilter" class="filter-label">Собеседник</label>
                <select id="companionFilter" class="form-control" style="margin-bottom: 10px;">
                    <option>Загрузка...</option>
                </select>

                <label for="kindTypeFilter" class="filter-label">Тип сообщения</label>
                <select id="kindTypeFilter" class="form-control" multiple size="5" style="margin-bottom: 10px; height: 100px;">
                    <option>Загрузка...</option>
                </select>
            </div>

            <div class="session-group">
                <div class="sidebar-label" style="margin-bottom: 10px; font-weight: bold; color: #4a5568;">Сессии</div>
                <select id="sessionSelect" size="4"></select>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА (Сообщения) -->
        <div class="session-detail-view">
            <div class="detail-header" id="activeSessionTitle">Выберите сессию</div>
            <div id="messagesContainer">
                <div class="placeholder" style="padding: 20px; color: #a0aec0;">Поток сообщений будет отображен здесь</div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}

<script type="module">
    import {postData} from '/static/js/api.js';

    const sessionSelect = document.getElementById('sessionSelect');
    const messagesContainer = document.getElementById('messagesContainer');
    const agentFilter = document.getElementById('agentFilter');
    const companionFilter = document.getElementById('companionFilter');
    const kindTypeFilter = document.getElementById('kindTypeFilter');

    let allSessions = [];
    let allAgents = {};
    let allCompanions = {};
    let currentSessionMessages = [];

    function populateFilters(changedBy = null) {
        if (changedBy === 'agent') {
            const selectedAgentId = parseInt(agentFilter.value);
            const associatedCompanions = {};
            
            allSessions.forEach(s => {
                if (s.agent_id === selectedAgentId && s.companion_id) {
                    associatedCompanions[s.companion_id] = (associatedCompanions[s.companion_id] || 0) + 1;
                }
            });

            companionFilter.innerHTML = '';
            Object.keys(associatedCompanions).forEach(compId => {
                const companion = allCompanions[compId];
                if (companion) {
                    const count = associatedCompanions[compId];
                    companionFilter.add(new Option(`${companion.title || companion.name} (${count})`, compId));
                }
            });
            if (companionFilter.options.length > 0) companionFilter.selectedIndex = 0;
        }

        if (changedBy === 'companion') {
            const selectedCompanionId = parseInt(companionFilter.value);
            const associatedAgents = {};

            allSessions.forEach(s => {
                if (s.companion_id === selectedCompanionId && s.agent_id) {
                    associatedAgents[s.agent_id] = (associatedAgents[s.agent_id] || 0) + 1;
                }
            });

            agentFilter.innerHTML = '';
            Object.keys(associatedAgents).forEach(agentId => {
                const agent = allAgents[agentId];
                if (agent) {
                    const count = associatedAgents[agentId];
                    agentFilter.add(new Option(`${agent.title || agent.name} (${count})`, agentId));
                }
            });
            if (agentFilter.options.length > 0) agentFilter.selectedIndex = 0;
        }
    }

    async function loadSessions() {
        sessionSelect.innerHTML = '<option>Загрузка...</option>';
        const data = await postData('/session/list', {
            agent_id: agentFilter.value ? parseInt(agentFilter.value) : null,
            companion_id: companionFilter.value ? parseInt(companionFilter.value) : null
        });

        sessionSelect.innerHTML = '';
        allSessions = data.result || [];
        
        allSessions.forEach((s) => {
            const shortUuid = s.session_uuid.substring(0, 12);
            const option = new Option(`${shortUuid} | 💬 ${s.msg_count}`, s.session_uuid);
            sessionSelect.add(option);
        });

        // По умолчанию выбираем последнюю (верхнюю в списке, если сервер возвращает новые первыми)
        if (sessionSelect.options.length > 0) {
            sessionSelect.selectedIndex = 0;
            loadSessionDetails(sessionSelect.value);
        } else {
            messagesContainer.innerHTML = '<div class="placeholder">Нет сессий</div>';
        }
    }

    async function initFilters() {
        try {
            const agentData = await (await fetch('/agent/list')).json();
            if (agentData.result) {
                agentData.result.forEach(agent => { allAgents[agent.id] = agent; });
            }

            const compData = await (await fetch('/companion/list')).json();
            if (compData.result) {
                compData.result.forEach(comp => { allCompanions[comp.id] = comp; });
            }

            const sessionData = await postData('/session/list', {});
            allSessions = sessionData.result || [];

            agentFilter.innerHTML = '';
            const agentsWithSessions = {};
            allSessions.forEach(s => { if (s.agent_id) agentsWithSessions[s.agent_id] = (agentsWithSessions[s.agent_id] || 0) + 1; });
            Object.keys(agentsWithSessions).forEach(agentId => {
                const agent = allAgents[agentId];
                if (agent) agentFilter.add(new Option(`${agent.title || agent.name} (${agentsWithSessions[agentId]})`, agentId));
            });

            companionFilter.innerHTML = '';
            const companionsWithSessions = {};
            allSessions.forEach(s => { if (s.companion_id) companionsWithSessions[s.companion_id] = (companionsWithSessions[s.companion_id] || 0) + 1; });
            Object.keys(companionsWithSessions).forEach(compId => {
                const companion = allCompanions[compId];
                if (companion) companionFilter.add(new Option(`${companion.title || companion.name} (${companionsWithSessions[compId]})`, compId));
            });

            agentFilter.onchange = async () => {
                sessionStorage.setItem('sessions_filter_agent_id', agentFilter.value);
                populateFilters('agent');
                sessionStorage.setItem('sessions_filter_companion_id', companionFilter.value);
                await loadSessions();
            };

            companionFilter.onchange = async () => {
                sessionStorage.setItem('sessions_filter_companion_id', companionFilter.value);
                await loadSessions();
            };

            const kindRes = await (await fetch('/session/kind_type/list')).json();
            if (kindRes.result) {
                kindTypeFilter.innerHTML = '';
                const savedKinds = JSON.parse(sessionStorage.getItem('sessions_filter_kind_types') || 'null');
                kindRes.result.forEach(kind => {
                    const option = new Option(kind, kind);
                    if (savedKinds) option.selected = savedKinds.includes(kind);
                    else if (kind === 'user-prompt' || kind === 'response-final') option.selected = true;
                    kindTypeFilter.add(option);
                });
            }

            kindTypeFilter.onchange = () => {
                const selectedKinds = Array.from(kindTypeFilter.selectedOptions).map(opt => opt.value);
                sessionStorage.setItem('sessions_filter_kind_types', JSON.stringify(selectedKinds));
                renderMessages(currentSessionMessages);
            };

            sessionSelect.onchange = () => loadSessionDetails(sessionSelect.value);

            // Init values
            const savedAgentId = sessionStorage.getItem('sessions_filter_agent_id');
            const savedCompanionId = sessionStorage.getItem('sessions_filter_companion_id');
            
            if (savedAgentId && Array.from(agentFilter.options).some(o => o.value === savedAgentId)) {
                agentFilter.value = savedAgentId;
                populateFilters('agent');
                if (savedCompanionId && Array.from(companionFilter.options).some(o => o.value === savedCompanionId)) {
                    companionFilter.value = savedCompanionId;
                }
            } else if (agentFilter.options.length > 0) {
                agentFilter.selectedIndex = 0;
                populateFilters('agent');
            }

            await loadSessions();

        } catch (e) { console.error("Ошибка:", e); }
    }

    function renderMessages(messages) {
        messagesContainer.innerHTML = '';
        const selectedKinds = Array.from(kindTypeFilter.selectedOptions).map(opt => opt.value);
        const filtered = messages.filter(m => selectedKinds.includes(m.kind_type));

        if (filtered.length === 0) {
            messagesContainer.innerHTML = '<div class="placeholder" style="padding: 20px;">Нет сообщений</div>';
            return;
        }

        filtered.forEach(m => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'admin-msg-box';
            const time = m.created_at ? new Date(m.created_at).toLocaleTimeString() : '';
            msgDiv.innerHTML = `
                <div class="chips-container">
                    <span class="chip role-${m.role}">${m.role}</span>
                    <span class="chip chip-kind">${m.kind_type}</span>
                    <span class="chip chip-llm">${m.llm_name}</span>
                    ${m.token ? `<span class="chip chip-token">Токены: ${m.token}</span>` : ''}
                    <span class="chip chip-request-id">${m.request_uuid}</span>
                    <span class="chip-date">${time}</span>
                </div>
                <div class="admin-msg-content">${m.content || ''}</div>
            `;
            messagesContainer.appendChild(msgDiv);
        });
    }

    async function loadSessionDetails(uuid) {
        document.getElementById('activeSessionTitle').innerText = "Сессия: " + uuid;
        messagesContainer.innerHTML = 'Загрузка...';
        try {
            const data = await postData('/session/messages', { session_uuid: uuid });
            currentSessionMessages = data.result || [];
            renderMessages(currentSessionMessages);
        } catch (e) {
            messagesContainer.innerHTML = 'Ошибка загрузки';
        }
    }

    document.addEventListener('DOMContentLoaded', initFilters);
</script>

{% endblock %}
