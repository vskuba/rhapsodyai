{% extends "base.html" %}

{% block title %}Сессии{% endblock %}

{% block head %}

<style>
    /* Переопределяем main-wrapper из common.css для полноэкранного режима */
    .session-layout {
        display: flex !important;
        flex-direction: column !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
        background: #f8f9fa;
    }

    /* БЛОК 4: ФИЛЬТРЫ (СПРАВА) */
    .session-right-filters {
        width: 280px;
        min-width: 280px;
        border-left: 1px solid #e0e4e8;
        background: #fcfcfc;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    /* Скрываем кнопку обновить согласно запросу */
    .btn-refresh, #refreshSessions {
        display: none !important;
    }

    /* Контейнер для нижней части (Блок 2 + Блок 3 + Блок 4) */
    .session-body-container {
        display: flex;
        flex: 1;
        min-height: 0;
        background: #fff;
    }

    /* ============================================================
       БЛОК 2: СПИСОК СЕССИЙ (СЛЕВА)
       ============================================================ */
    .session-sidebar-list {
        width: 240px !important;
        min-width: 240px;
        border-right: 1px solid #e0e4e8;
        background: #fcfcfc;
        display: flex;
        flex-direction: column;
    }

    .session-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
    }

    /* Карточка сессии */
    .session-item {
        padding: 8px 10px;
        border: 1px solid #edf2f7;
        border-radius: 6px;
        margin-bottom: 8px;
        cursor: pointer;
        background: #fff;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .session-item:hover {
        border-color: #007bff;
        background-color: #f8fbff;
    }

    .session-item.active {
        background-color: #eef7ff;
        border-color: #007bff;
        box-shadow: inset 3px 0 0 #007bff;
    }

    .session-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .session-short-uuid {
        font-family: 'Monaco', 'Consolas', monospace;
        font-weight: bold;
        font-size: 11px;
        color: #2d3748;
    }

    .session-msg-count {
        font-size: 9px;
        background: #edf2f7;
        padding: 1px 4px;
        border-radius: 8px;
        color: #4a5568;
    }

    .session-item-date {
        font-size: 10px;
        color: #a0aec0;
    }

    /* ============================================================
       БЛОК 3: ИНСПЕКТОР СООБЩЕНИЙ (СПРАВА)
       ============================================================ */
    .session-detail-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #fff;
        min-width: 0;
    }

    .detail-header {
        padding: 12px 25px;
        font-weight: bold;
        color: #007bff;
        font-size: 13px;
        border-bottom: 1px solid #f0f0f0;
    }

    #messagesContainer {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
    }

    /* Оформление сообщений (Чипсы/Баблы) */
    .admin-msg-box {
        padding-bottom: 20px;
        border-bottom: 1px solid #f1f3f5;
    }

    .chips-container {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: center;
    }

    .chip {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 2px 10px;
        border-radius: 12px;
        color: white;
        letter-spacing: 0.5px;
    }

    .chip-date {
        font-size: 14px;
        color: #1a8697;
        margin-left: auto;
    }

    /* Цвета бабблов ролей */
    .role-user {
        background-color: #f0913d;
    }

    .role-llm {
        background-color: #4a90e2;
    }

    .role-tool,
    .role-workflow {
        background-color: #67c23a;
    }

    .role-system {
        background-color: #909399;
    }

    .role-thinking {
        background-color: #adb5bd;
    }

    .chip-llm {
        background-color: #d7d8f0;
        color: #7f59e9;
        border: 1px solid #e2e8f0;
    }

    .chip-request-id {
        background-color: #f4f4f4;
        color: #2c61c7;
        border: 1px solid #e2e8f0;
    }

    /* Баббл типа контента */
    .chip-kind {
        background-color: #d7eff0;
        color: #0d3061;
        border: 1px solid #e2e8f0;
    }

    .chip-token {
        background-color: #e0f0d7;
        color: #1a4c95;
        border: 1px solid #e2e8f0;
    }

    .admin-msg-content {
        font-size: 13px;
        line-height: 1.4;
        color: #1e293b;
        white-space: pre-wrap;
        word-break: break-word;
    }

    /* Скроллбары */
    ::-webkit-scrollbar {
        width: 6px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 10px;
    }
</style>

{% endblock %}

{% block content %}
<div class="main-wrapper session-layout">

    <div class="session-body-container">
        <!-- БЛОК 2: Список сессий (Слева) -->
        <div class="sidebar session-sidebar-list" id="block-2">
            <div class="sidebar-label">Список сессий</div>
            <div class="session-list" id="sessionList"></div>
        </div>

        <!-- БЛОК 3: Сообщения (Центр) -->
        <div class="session-detail-view" id="block-3">
            <div class="detail-header" id="activeSessionTitle">Выберите сессию из списка</div>
            <div id="messagesContainer">
                <div class="placeholder">Поток сообщений будет отображен здесь</div>
            </div>
        </div>

        <!-- БЛОК 4: Фильтры (Справа) -->
        <div class="session-right-filters" id="block-4">
            <div class="sidebar-label" style="padding-bottom: 10px; border-bottom: 1px solid #edf2f7; margin-bottom: 15px; font-weight: bold; color: #4a5568;">Фильтры</div>
            
            <div class="filter-vertical-item" style="margin-bottom: 20px;">
                <label for="agentFilter" style="display: block; font-size: 11px; font-weight: bold; color: #718096; text-transform: uppercase; margin-bottom: 8px;">Агент</label>
                <select id="agentFilter" class="form-control" style="width: 100%; box-sizing: border-box; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; font-size: 14px; outline: none;">
                    <option>Загрузка...</option>
                </select>
            </div>

            <div class="filter-vertical-item" style="margin-bottom: 20px;">
                <label for="companionFilter" style="display: block; font-size: 11px; font-weight: bold; color: #718096; text-transform: uppercase; margin-bottom: 8px;">Собеседник</label>
                <select id="companionFilter" class="form-control" style="width: 100%; box-sizing: border-box; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; font-size: 14px; outline: none;">
                    <option>Загрузка...</option>
                </select>
            </div>

            <div class="filter-vertical-item" style="margin-bottom: 20px;">
                <label for="kindTypeFilter" style="display: block; font-size: 11px; font-weight: bold; color: #718096; text-transform: uppercase; margin-bottom: 8px;">Тип сообщения (Kind Type)</label>
                <select id="kindTypeFilter" class="form-control" multiple size="5" style="width: 100%; box-sizing: border-box; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; font-size: 14px; outline: none; height: 120px;">
                    <option>Загрузка...</option>
                </select>
            </div>

            <button id="refreshSessions" class="action-btn" style="display: none !important;">Обновить</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}

<script type="module">
    import {postData} from '/static/js/api.js';

    const sessionList = document.getElementById('sessionList');
    const messagesContainer = document.getElementById('messagesContainer');
    const agentFilter = document.getElementById('agentFilter');
    const companionFilter = document.getElementById('companionFilter');
    const kindTypeFilter = document.getElementById('kindTypeFilter');

    let allSessions = [];
    let allAgents = {};
    let allCompanions = {};
    let currentSessionMessages = [];

    function populateFilters(changedBy = null) {
        if (changedBy === 'agent') {
            const selectedAgentId = parseInt(agentFilter.value);
            const associatedCompanions = {};
            
            allSessions.forEach(s => {
                if (s.agent_id === selectedAgentId && s.companion_id) {
                    associatedCompanions[s.companion_id] = (associatedCompanions[s.companion_id] || 0) + 1;
                }
            });

            companionFilter.innerHTML = '';
            Object.keys(associatedCompanions).forEach(compId => {
                const companion = allCompanions[compId];
                if (companion) {
                    const count = associatedCompanions[compId];
                    companionFilter.add(new Option(`${companion.title || companion.name} (${count})`, compId));
                }
            });

            if (companionFilter.options.length > 0) {
                companionFilter.selectedIndex = 0;
            }
        }

        if (changedBy === 'companion') {
            const selectedCompanionId = parseInt(companionFilter.value);
            const associatedAgents = {};

            allSessions.forEach(s => {
                if (s.companion_id === selectedCompanionId && s.agent_id) {
                    associatedAgents[s.agent_id] = (associatedAgents[s.agent_id] || 0) + 1;
                }
            });

            agentFilter.innerHTML = '';
            Object.keys(associatedAgents).forEach(agentId => {
                const agent = allAgents[agentId];
                if (agent) {
                    const count = associatedAgents[agentId];
                    agentFilter.add(new Option(`${agent.title || agent.name} (${count})`, agentId));
                }
            });

            if (agentFilter.options.length > 0) {
                agentFilter.selectedIndex = 0;
            }
        }
    }

    async function loadSessions() {
        sessionList.innerHTML = 'Загрузка...';
        const data = await postData('/session/list', {
            agent_id: agentFilter.value ? parseInt(agentFilter.value) : null,
            companion_id: companionFilter.value ? parseInt(companionFilter.value) : null
        });

        sessionList.innerHTML = '';
        data.result.forEach((s, index) => {
            const div = document.createElement('div');
            div.className = 'session-item';

            // Форматирование UUID (первые 6 символов)
            const shortUuid = s.session_uuid.substring(0, 12) + '...';

            div.innerHTML = `
            <div class="session-item-header">
                <span class="session-short-uuid">${shortUuid}</span>
                <span class="session-msg-count">💬 ${s.msg_count}</span>
            </div>
        `;

            div.onclick = () => loadSessionDetails(s.session_uuid, div);
            sessionList.appendChild(div);

            if (index === 0) {
                loadSessionDetails(s.session_uuid, div);
            }
        });
    }

    async function initFilters() {
        try {
            // 1. Загрузка агентов
            const agentData = await (await fetch('/agent/list')).json();
            if (agentData.result) {
                agentData.result.forEach(agent => {
                    allAgents[agent.id] = agent;
                });
            }

            // 2. Загрузка собеседников
            const compData = await (await fetch('/companion/list')).json();
            if (compData.result) {
                compData.result.forEach(comp => {
                    allCompanions[comp.id] = comp;
                });
            }

            // 3. Загрузка всех сессий
            const sessionData = await postData('/session/list', {});
            allSessions = sessionData.result || [];

            // Инициализация agentFilter (только агенты с сессиями)
            agentFilter.innerHTML = '';
            const agentsWithSessions = {};
            allSessions.forEach(s => {
                if (s.agent_id) {
                    agentsWithSessions[s.agent_id] = (agentsWithSessions[s.agent_id] || 0) + 1;
                }
            });
            Object.keys(agentsWithSessions).forEach(agentId => {
                const agent = allAgents[agentId];
                if (agent) {
                    const count = agentsWithSessions[agentId];
                    agentFilter.add(new Option(`${agent.title || agent.name} (${count})`, agentId));
                }
            });

            // Инициализация companionFilter (только собеседники с сессиями)
            companionFilter.innerHTML = '';
            const companionsWithSessions = {};
            allSessions.forEach(s => {
                if (s.companion_id) {
                    companionsWithSessions[s.companion_id] = (companionsWithSessions[s.companion_id] || 0) + 1;
                }
            });
            Object.keys(companionsWithSessions).forEach(compId => {
                const companion = allCompanions[compId];
                if (companion) {
                    const count = companionsWithSessions[compId];
                    companionFilter.add(new Option(`${companion.title || companion.name} (${count})`, compId));
                }
            });

            // СЛУШАТЕЛИ: синхронизация фильтров при смене опций
            agentFilter.onchange = async () => {
                sessionStorage.setItem('sessions_filter_agent_id', agentFilter.value);
                populateFilters('agent');
                sessionStorage.setItem('sessions_filter_companion_id', companionFilter.value);
                await loadSessions();
            };

            companionFilter.onchange = async () => {
                sessionStorage.setItem('sessions_filter_companion_id', companionFilter.value);
                await loadSessions();
            };

            // 4. Загрузка уникальных kind_type из базы
            const kindRes = await (await fetch('/session/kind_type/list')).json();
            if (kindRes.result) {
                kindTypeFilter.innerHTML = '';
                
                const savedKindTypesRaw = sessionStorage.getItem('sessions_filter_kind_types');
                let savedKindTypes = null;
                if (savedKindTypesRaw) {
                    try {
                        savedKindTypes = JSON.parse(savedKindTypesRaw);
                    } catch (e) {}
                }

                kindRes.result.forEach(kind => {
                    const option = new Option(kind, kind);
                    if (savedKindTypes) {
                        option.selected = savedKindTypes.includes(kind);
                    } else if (kind === 'user-prompt' || kind === 'response-final') {
                        option.selected = true;
                    }
                    kindTypeFilter.add(option);
                });
            }

            kindTypeFilter.onchange = () => {
                const selectedKinds = Array.from(kindTypeFilter.selectedOptions).map(opt => opt.value);
                sessionStorage.setItem('sessions_filter_kind_types', JSON.stringify(selectedKinds));
                renderMessages(currentSessionMessages);
            };

            // Применяем сохраненные фильтры или дефолтные
            const savedAgentId = sessionStorage.getItem('sessions_filter_agent_id');
            const savedCompanionId = sessionStorage.getItem('sessions_filter_companion_id');

            if (savedAgentId && Array.from(agentFilter.options).some(o => o.value === savedAgentId)) {
                agentFilter.value = savedAgentId;
                populateFilters('agent');
                if (savedCompanionId && Array.from(companionFilter.options).some(o => o.value === savedCompanionId)) {
                    companionFilter.value = savedCompanionId;
                }
            } else if (agentFilter.options.length > 0) {
                agentFilter.selectedIndex = 0;
                populateFilters('agent');
                sessionStorage.setItem('sessions_filter_agent_id', agentFilter.value);
                sessionStorage.setItem('sessions_filter_companion_id', companionFilter.value);
            }

            // Сразу загружаем список после инициализации фильтров
            await loadSessions();

        } catch (e) {
            console.error("Ошибка инициализации:", e);
        }
    }

    function renderMessages(messages) {
        messagesContainer.innerHTML = '';
        const selectedKinds = Array.from(kindTypeFilter.selectedOptions).map(opt => opt.value);
        const filtered = messages.filter(m => selectedKinds.includes(m.kind_type));

        if (filtered.length === 0) {
            messagesContainer.innerHTML = '<div class="placeholder">Нет сообщений с выбранными типами</div>';
            return;
        }

        filtered.forEach(m => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'admin-msg-box';

            const roleClass = `role-${m.role}`;
            const time = m.created_at ? new Date(m.created_at).toLocaleTimeString() : '';

            msgDiv.innerHTML = `
                <div class="chips-container">
                    <span class="chip ${roleClass}">${m.role}</span>
                    <span class="chip chip-kind">${m.kind_type}</span>
                    <span class="chip chip-llm">${m.llm_name}</span>
                    ${m.token ? `<span class="chip chip-token">Токены: ${m.token}</span>` : ''}
                    <span class="chip chip-request-id">${m.request_uuid}</span>
                    <span class="chip-date">${time}</span>
                </div>
                <div class="admin-msg-content">${m.content || ''}</div>
            `;
            messagesContainer.appendChild(msgDiv);
        });

        messagesContainer.scrollTop = 0;
    }

    async function loadSessionDetails(uuid, element) {
        document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');

        document.getElementById('activeSessionTitle').innerText = "Сессия: " + uuid;
        messagesContainer.innerHTML = 'Загрузка...';

        try {
            const data = await postData('/session/messages', {
                session_uuid: uuid
            });

            currentSessionMessages = data.result || [];
            renderMessages(currentSessionMessages);
        } catch (e) {
            console.error("Ошибка загрузки полной истории:", e);
            messagesContainer.innerHTML = '<div style="color:red">Ошибка загрузки данных</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('refreshSessions').onclick = loadSessions;
        initFilters();
    });
</script>

{% endblock %}
