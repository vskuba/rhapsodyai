{% extends "base.html" %}

{% block title %}Workflow{% endblock %}

{% block head %}
<style>
    /* Используем ваш CSS один в один */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    .agents-sidebar {
        width: 260px;
        background: #fafafa;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto;
    }

    .group-header {
        padding: 6px 10px 5px;
        font-size: 11px;
        color: #df983d;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Карусель нод в сайдбаре */
    .node-carousel {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
    }

    .node-carousel-name {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: bold;
        color: #df983d;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .node-carousel-arrow {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f4f6;
        color: #2c3e50;
        border: 1px solid #d6eaf8;
        border-radius: 5px;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        transition: all 0.2s;
        padding: 0;
    }

    .node-carousel-arrow:hover {
        background: #3498db;
        color: #fff;
    }

    /* Разделитель: сверху — workflow агентов, снизу — subflow */
    .workflow-divider {
        border-top: 1px solid #d6dbe0;
        margin: 8px 12px;
    }

    .workflow-list-empty {
        padding: 12px 10px;
        font-size: 12px;
        color: #999;
        text-align: center;
    }

    .agent-item {
        padding: 2px 10px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 12px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }

    .agent-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .agent-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
    }

    .editor-section {
        flex: 1;
        padding: 20px 20px;
        overflow-y: auto;
    }

    .form-header {
        margin-bottom: 10px;
        border-bottom: 2px solid #f4f4f9;
        padding-bottom: 15px;
        display: flex;
        justify-content: space-between; /* Раздвигает заголовок влево, а кнопку вправо */
        align-items: center; /* Выравнивает оба элемента строго по центру вертикали */
        width: 100%; /* Гарантирует, что контейнер занимает всю ширину */

    }

    .form-header h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 20px;
    }

    .form-layout-grid {
        display: flex;
        gap: 30px;
        align-items: stretch;
        min-height: 450px;
    }

    .settings-column {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .variables-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .steps-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .prompt-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    /* Стилизация контейнера шагов под стиль System Prompt */
    .steps-container-full {
        flex: 1;
        background: #fdfdfd;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        overflow-y: auto;
    }

    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-graph {
        background: #fff;
        color: #3498db;
        border: 1px solid #3498db;
        padding: 12px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
    }

    .btn-graph:hover {
        background: #eef6fc;
    }

    /* Режим графа переходов */
    .graph-container {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 15px;
        overflow: auto;
        max-height: calc(100vh - 220px);
        /* Центровка диаграммы: svg — inline-block, узкий граф встает по центру,
           широкий скроллится как раньше (flex-центровка обрезала бы левый край) */
        text-align: center;
    }

    .graph-container svg {
        max-width: none; /* Не сжимаем диаграмму — контейнер скроллится */
        display: inline-block;
    }

    .graph-container .node {
        cursor: pointer;
    }

    .graph-warnings {
        margin-bottom: 10px;
        font-size: 13px;
        color: #c0392b;
    }

    .graph-warnings div {
        background: #fdecea;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        padding: 6px 10px;
        margin-bottom: 4px;
    }

    .graph-warnings:empty {
        display: none;
    }

    .btn-create {
        background: #27ae60;
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-delete {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 11px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-right: auto;
    }

    .agent-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 12px; /* Чуть увеличим отступы для удобства */
        position: relative;
    }

    /* Иконка редактирования: всегда видна и яркая */
    .edit-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        background: #eef6fc; /* Нежно-голубой фон */
        color: #3498db; /* Яркий основной цвет */
        border-radius: 4px; /* Скругление как у инпутов */
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid #d6eaf8;
        opacity: 1 !important; /* Гарантируем видимость всегда */
    }

    /* Эффект при наведении на саму иконку */
    .edit-icon:hover {
        background: #3498db;
        color: #fff;
        transform: scale(1.1);
        box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
    }

    /* Чтобы текст задачи не налезал на яркую иконку */
    .workflow-name-link {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-right: 10px;
        cursor: pointer;
    }

    /* Иконка редактирования (скрыта по умолчанию) */
    .edit-icon {
        opacity: 0;
        cursor: pointer;
        color: #999;
        transition: all 0.2s;
        font-size: 14px;
        padding: 2px 5px;
    }

    .agent-item:hover .edit-icon {
        opacity: 1;
    }

    .edit-icon:hover {
        color: #3498db;
        transform: scale(1.2);
    }

    /* Скрытие секции шагов в режиме редактирования задачи */
    .hide-steps .prompt-column {
        display: none;
    }

    .steps-sortable-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
    }

    .step-item-block {
        display: flex;
        align-items: center;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        cursor: grab;
        transition: background 0.2s;
    }

    .step-item-block:active {
        cursor: grabbing;
    }

    .step-item-block:hover {
        border-color: #3498db;
        background: #fcfdfe;
    }

    .step-item-block.dragging {
        opacity: 0.5;
        background: #eef6fc;
    }

    .step-item-block {
        position: relative; /* Для позиционирования кнопки удаления */
        padding-right: 40px; /* Место под кнопку */
    }

    .btn-delete-step {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        color: #e74c3c;
        border: none;
        font-size: 18px;
        line-height: 0;
        cursor: pointer;
        transition: color 0.2s;
    }

    .btn-delete-step:hover {
        color: #e74c3c !important;
        font-weight: bolder !important;
    }

    .step-item-block.dragging {
        opacity: 0.5;
        background: #eef6fc;
        border: 1px dashed #3498db;
    }

    .step-number-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        background-color: #3498db;
        color: white;
        border-radius: 50%; /* Снова ровный круг */
        font-size: 12px;
        font-weight: bold;
        margin-right: 10px; /* Отступ до иконки */
        flex-shrink: 0;
    }

    .step-type-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
    }

    /* Настройка контейнера контента шага */
    .step-content {
        display: flex;
        align-items: center;
        width: 100%;
    }

    .step-title-text {
        font-weight: 500;
        color: #2c3e50;
        font-size: 14px;
    }

    .stepTitle {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        font-size: 14px;
    }

    .stepTitle label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    /* Стилизация инпута названия */
    #stepTitle {
        border: 1px solid #ddd;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
        background: #fdfdfd;
        color: #2c3e50;
        font-weight: 500;
    }

    #stepTitle:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    .system-prompt-full {
        height: 170px;
        margin-top: 10px;
    }

    .transition-row {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #f9fafb;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #edf2f7;
    }

    .transition-row input {
        flex: 2; /* Поле для условия */
        padding: 5px;
        font-size: 12px;
    }

    .transition-row select {
        flex: 1; /* Выбор целевого шага */
        padding: 5px;
        font-size: 12px;
    }

    .btn-add-widget-row {
        align-self: flex-start;
        margin-top: 4px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 500;
        background: #218838;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .widget-rows-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .widget-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        background: white;
        padding: 8px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
    }

    .widget-row select {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
    }

    .widget-row .btn-delete-widget-row {
        grid-column: 2;
        grid-row: 1;
        margin-top: 0; /* Обнуляем старый отступ, так как grid сам выровняет */
        align-self: center;
        font-size: 25px;
        padding: 0;
        background: transparent;
        color: #ff7098;
    }

    .widget-row textarea {
        grid-column: 1 / span 2;
        grid-row: 2;
        width: 100%;
        height: 60px;
    }

    .workflow-actions {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    /* Заголовок секции */
    .variables-section h3 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 14px;
        color: #333;
    }

    /* ИЗМЕНЕНО: Форма добавления теперь вмещает 2 инпута и кнопку */
    .variable-add-form {
        display: flex;
        flex-direction: column; /* Элементы формы встают друг под друга */
        gap: 8px;
        margin-bottom: 16px;
    }

    /* Контейнер для группировки двух инпута в одну строку */
    .variable-add-form .form-group-row {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .variable-add-form .form-control {
        flex-grow: 1;
        width: 50%; /* Инпуты делят пространство поровну */
    }

    /* Кнопка добавления (на всю ширину под инпутами для удобства) */
    .variables-editor-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
        overflow-y: auto;
    }

    /* Строка с парой Ключ-Значение */
    .variable-row {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .variable-row .form-control {
        padding: 6px 10px;
        font-size: 13px;
        font-family: 'Consolas', 'Monaco', monospace;
    }

    /* Кнопка удаления строки */
    .btn-del-var {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.2s;
    }

    .btn-del-var:hover {
        background: #c0392b;
    }

    .btn-add-var {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
        width: 100%;
        transition: background-color 0.15s ease;
    }

    .btn-add-var:hover {
        background-color: #218838;
    }

    /* Список переменных */
    .variables-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        padding-right: 4px;
        max-width: 350px;
    }

    /* Элемент списка */
    .variable-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 8px 6px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        box-sizing: border-box;
        width: 100%; /* Гарантируем, что строка занимает всю ширину */
        border-left: 3px solid #2974df;
    }

    .variable-item:hover {
        background-color: #edf4f9;
    }

    .variable-item-common {
        border-left: 2px solid limegreen;
    }

    .variable-item-common:hover {
        background-color: #dfffd9;
    }

    .variable-item-node {
        border-left: 2px solid #ffd73b;
    }

    .variable-item-node:hover {
        background-color: #fff2d9;
    }

    .variable-item-tool {
        border-left: 2px solid #f488d5;
    }

    .variable-item-tool:hover {
        background-color: #ffd9ea;
    }

    .variable-item-input {
        border-left: 2px solid #26c6da;
    }

    .variable-item-input:hover {
        background-color: #d9f7fb;
    }

    .variable-item.has-default:hover .variable-badge {
        background-color: #dfe3e6;
        color: #333;
    }

    .variable-item.unused-variable {
        border-left-color: #b0b0b0;
        background-color: #f5f5f5;
        opacity: 0.6;
    }

    /* Подсветка tool-переменных, относящихся к выбранному шагу-инструменту */
    .variable-item.tool-var-highlight {
        background-color: #ffe9f5;
        border-left-color: #e91e63;
        box-shadow: 0 0 0 1px #f488d5 inset;
    }

    .variable-item.tool-var-highlight .variable-name {
        font-weight: bold;
    }

    /* Подсветка workflow-переменных, в которые пишет выбранный шаг "Переменные" */
    .variable-item.workflow-var-highlight {
        background-color: #e3f0ff;
        border-left-color: #1565c0;
        box-shadow: 0 0 0 1px #90caf9 inset;
    }

    .variable-item.workflow-var-highlight .variable-name {
        font-weight: bold;
    }

    .variable-item.unused-variable .variable-name {
        color: #3a3535;
    }

    .variable-name {
        margin-right: auto;
        color: #1c4a73;
        cursor: pointer;
        transition: color 0.15s ease;
    }

    .variable-name:hover {
        color: #004494;
    }

    .variable-badge {
        background-color: #eaeaea;
        color: #555;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        margin: 0 4px;
        max-width: 150px; /* Защита от слишком длинных строк */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis; /* Троеточие, если текст не влезает */
        border: 1px solid #dcdcdc;
    }

    .btn-delete-var {
        background: none;
        border: none;
        color: #dc3545;
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
        padding: 0 4px;
        transition: color 0.15s ease;
    }

    .btn-delete-var:hover {
        color: #bd2130;
    }

    /* Аккордеон для переменных */
    .variables-accordion-section {
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        margin-bottom: 0px;
        overflow: hidden;
    }

    .variables-accordion-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f7f7f7;
        padding: 8px 12px;
        font-weight: bold;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        color: #444;
        transition: background-color 0.15s;
    }

    .variables-accordion-header:hover {
        background: #ededed;
    }

    .variables-accordion-header .arrow {
        font-size: 8px;
        transition: transform 0.2s;
    }

    .variables-accordion-section.active .variables-accordion-header .arrow {
        transform: rotate(90deg);
    }

    .variables-accordion-content {
        display: none;
        flex-direction: column;
        gap: 0;
        background: #fdfdfd;
        padding: 0;
        border-top: 1px solid #eee;
    }

    .variables-accordion-section.active .variables-accordion-content {
        display: flex;
    }

    .transitions-editor {
        margin-top: 20px;
        border-top: 1px solid #eee;
        font-size: 15pt;
    }

    .step-return-response {
        border-left: 2px solid #ff001e !important;
    }

    .step-transition-target {
        margin-top: 10px;
        border-top: 2px solid limegreen !important;
    }

</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список (Sidebar) -->
    <div class="agents-sidebar">
        <div class="sidebar-header">
            <button class="btn-create" id="createNewWorkflow">+ Создать workflow</button>

            <!-- Карусель нод: стрелки листают ноды по кругу -->
            <div class="node-carousel">
                <button type="button" class="node-carousel-arrow" id="nodeCarouselPrev" title="Предыдущая нода">‹</button>
                <div class="node-carousel-name" id="nodeCarouselName">—</div>
                <button type="button" class="node-carousel-arrow" id="nodeCarouselNext" title="Следующая нода">›</button>
            </div>
        </div>
        <div class="agent-list" id="workflowList">
            <!-- Заполняется JS -->
        </div>
    </div>

    <!-- Секция формы -->
    <div class="editor-section">
        <form id="workflowForm" novalidate>
            <div class="form-header">
                <h2 id="formTitle">Выберите workflow</h2>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-graph" id="graphBtn">Graph</button>
                    <button type="submit" class="btn-save">Сохранить workflow</button>
                </div>
            </div>

            <input type="hidden" id="workflowId">

            <!-- 1. Контейнер ПАРАМЕТРОВ (скрывается при клике на название) -->
            <div id="workflowSettingsView" class="form-layout-grid">
                <div class="settings-column">
                    <div class="form-group">
                        <label>Название workflow</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Технический ID (name)</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>Нода</label><select id="node_id"
                                                                           class="form-control"></select></div>
                        <div class="form-group"><label>Позиция</label><input type="number" id="position"
                                                                             class="form-control"></div>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="description" class="form-control"
                                  style="height: 80px; resize: none;"></textarea>
                    </div>
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
                        <input type="checkbox" id="subflow" style="width: 16px; height: 16px; cursor: pointer; margin: 0;">
                        <label for="subflow" style="cursor: pointer; margin: 0;text-transform: none;">🇼 sub-workflow (используется только шагом «Вызов workflow»)</label>
                    </div>
                </div>
                <div class="prompt-column">
                    <div class="form-group" id="inputVariablesGroup">
                        <label>Входящие переменные</label>
                        <div id="inputVariablesContainer" class="variables-editor-container">
                            <!-- Сюда динамически будут добавляться строки с входящими переменными -->
                        </div>
                        <button type="button" class="btn-add-var" id="addInputVariableBtn">+ Добавить
                            переменную
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. Контейнер ШАГОВ (Две колонки) -->
            <div id="stepsEditorView" class="form-layout-grid" style="display: none;">

                <div class="variables-column">
                    <div class="variables-section">
                        <div class="variables-header">
                            <h3>Переменные</h3>
                            <div class="variable-add-form">
                                <div class="form-group-row">
                                    <input type="text" id="newVariableName" class="form-control"
                                           placeholder="Имя переменной...">
                                    <input type="text" id="newVariableValue" class="form-control"
                                           placeholder="Значение по умолчанию...">
                                </div>
                                <button type="button" class="btn-add-var" id="addVariableBtn">+ Add</button>
                            </div>
                        </div>

                        <!-- Список добавленных переменных -->
                        <div class="variables-list" id="variablesContainer">
                            <!-- Пример элемента списка (будет генерироваться через JS) -->
                            <!--
                            <div class="variable-item">
                                <span class="variable-name">my_var_name</span>
                                <button type="button" class="btn-delete-var" data-name="my_var_name">&times;</button>
                            </div>
                            -->
                        </div>
                    </div>
                </div>

                <!-- Колонки управления шагами -->
                <div class="steps-column">

                    <!-- Блоки 1 и 2: Выбор и Кнопка Добавить -->
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <div style="flex: 1;">
                            <label style="font-size: 10px; color: #999;">Доступные шаги</label>
                            <select id="availableStepsSelect" class="form-control">
                                <option value="">Загрузка шагов...</option>
                            </select>
                        </div>
                        <div style="align-self: flex-end;">
                            <button type="button" class="btn-create" id="addStepToWorkflowBtn"
                                    style="padding: 10px 20px;">+ Add
                            </button>
                        </div>
                    </div>

                    <!-- Блок 3: Список шагов текущей задачи (Drag & Drop) -->
                    <label style="font-size: 10px; color: #999;">Шаги текущего workflow (перетащите для
                        сортировки)</label>
                    <div id="workflowStepsSortable" class="steps-sortable-list">
                        <!-- Сюда JS отрисует шаги -->
                    </div>
                </div>


                <!-- Вторая колонка: Детали (как и было) -->
                <div class="prompt-column" id="stepDetailsView">
                    <!-- Контейнер с контентом (скрыт по умолчанию) -->
                    <div id="stepDetailsContent" style="display: none;">

                        <div class="stepTitle">
                            <label>Описание шага</label>
                            <span id="stepDescriptionFull"></span>
                        </div>

                        <div class="transitions-editor">
                            <label style="font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase;">
                                Логика переходов (Before)
                            </label>

                            <div id="stepTransitionsListBefore"
                                 style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                                <!-- Сюда JS будет рендерить строки условий -->
                            </div>

                            <button type="button" class="btn-create" id="addConditionBtnBefore"
                                    style="margin-top: 10px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 5px 10px; font-size: 12px;">
                                + Добавить условие перехода
                            </button>
                        </div>

                        <!-- НОВЫЙ КОНТЕЙНЕР ДЛЯ КАСТОМНЫХ ПОЛЕЙ ТИПА ШАГА -->
                        <div id="dynamicStepFieldsContainer"
                             style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                            <!-- Сюда JS будет рендерить инпуты/текстареа в зависимости от типа шага -->
                        </div>

                        <!-- Старую textarea скрываем с помощью display: none, чтобы не ломать остальной код сбора данных -->
                        <textarea id="stepTextarea" class="form-control system-prompt-full"
                                  style="display: none;"></textarea>

                        <div class="transitions-editor">
                            <label style="font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase;">
                                Логика переходов (After)
                            </label>

                            <div id="stepTransitionsListAfter"
                                 style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                                <!-- Сюда JS будет рендерить строки условий -->
                            </div>

                            <button type="button" class="btn-create" id="addConditionBtnAfter"
                                    style="margin-top: 10px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 5px 10px; font-size: 12px;">
                                + Добавить условие перехода
                            </button>
                        </div>

                        <div class="stepTitle">
                            <label>Название шага</label>
                            <input type="text" id="stepTitle" required/>
                        </div>
                    </div>

                    <!-- Заглушка (видна, когда шаг не выбран) -->
                    <div id="noStepSelected" style="color: #999; text-align: center; margin-top: 50px;">
                        Выберите шаг из списка слева
                    </div>
                </div>


            </div>

            <!-- 3. Контейнер ГРАФА переходов -->
            <div id="stepsGraph" style="display: none;">
                <div id="stepsGraphWarnings" class="graph-warnings"></div>
                <div id="stepsGraphContainer" class="graph-container">
                    <!-- Сюда рендерится mermaid-диаграмма -->
                </div>
            </div>

            <div class="editor-footer">
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none;">Удалить</button>
                <button type="submit" class="btn-save">Сохранить workflow</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/vendor/mermaid.min.js"></script>
<script type="module" src="/static/js/workflow/main.js?v=4"></script>
{% endblock %}
