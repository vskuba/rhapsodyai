                            };

                            varSpanContainer.appendChild(varSpan);

                            // Скрытый инпут для сбора значения (varSel.value)
                            const varHidden = document.createElement('input');
                            varHidden.type = 'hidden';
                            varHidden.className = 'map-var-select';
                            varHidden.value = `${toolName}_result_${argName}`;

                            row.appendChild(argHidden);
                            row.appendChild(argText);
                            row.appendChild(arrow);
                            row.appendChild(varSpanContainer);
                            row.appendChild(varHidden);
                            mappingContainer.appendChild(row);
                        });
                    }
                };

                // Навешивание события смены инструмента
                selectElement.onchange = () => {
                    renderToolDetails(selectElement.value);
                    collectToolWidgetData();

                    const inputStepTitle = document.getElementById('stepTitle');
                    inputStepTitle.value = selectElement.value;
                    const stepTitleEl = document.querySelectorAll('.step-item-block.active .step-title-text')
                    stepTitleEl.forEach(el => el.textContent = selectElement.value);
                };

                // Первичный запуск при открытии ноды
                if (currentValue && currentValue.tool_name) {
                    renderToolDetails(currentValue.tool_name);
                }

                toolContainer.appendChild(selectElement);
                toolContainer.appendChild(descContainer);
                toolContainer.appendChild(mappingContainer);
                fieldWrapper.appendChild(toolContainer);

            } else {
                // --- СТАНДАРТНАЯ ОТРИСОВКА ОСТАЛЬНЫХ ТИПОВ ПОЛЕЙ ---
                if (field.type === 'textarea') {
                    inputElement = document.createElement('textarea');
                    inputElement.id = `field_${field.key}`;
                    inputElement.className = 'form-control';
                    inputElement.style = "height: 170px; resize: vertical; font-size: 13px; padding: 8px;";
                    inputElement.placeholder = field.placeholder || '';
                    inputElement.value = currentValue;
                } else if (field.type === 'select') {
                    inputElement = document.createElement('select');
                    inputElement.id = `field_${field.key}`;
                    inputElement.className = 'form-control';
                    inputElement.style = "padding: 6px; font-size: 13px;";

                    if (field.options && Array.isArray(field.options)) {
                        field.options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt;
                            option.textContent = opt;
                            if (String(opt) === String(currentValue)) option.selected = true;
                            inputElement.appendChild(option);
                        });
                    }
                } else if (field.type === 'checkbox') {
                    inputElement = document.createElement('input');
                    inputElement.type = 'checkbox';
                    inputElement.id = `field_${field.key}`;
                    inputElement.className = 'form-check-input';
                    inputElement.style = "cursor: pointer; width: 16px; height: 16px; margin: 0;";
                    inputElement.checked = currentValue === true || String(currentValue).toLowerCase() === 'true';
                } else {
                    inputElement = document.createElement('input');
                    inputElement.id = `field_${field.key}`;
                    inputElement.type = field.type;
                    inputElement.className = 'form-control';
                    inputElement.style = "padding: 6px; font-size: 13px;";
                    if (field.min !== undefined) inputElement.min = field.min;
                    if (field.max !== undefined) inputElement.max = field.max;
                    if (field.step !== undefined) inputElement.step = field.step;
                    inputElement.value = currentValue;
                }

                inputElement.oninput = () => saveChanges();
                inputElement.onchange = () => saveChanges();

                fieldWrapper.appendChild(inputElement);

                const latestMeta = parseMetadata(step.metadata);
                if (latestMeta[field.key] === undefined && currentValue !== '') {
                    saveChanges();
                }
            }

            container.appendChild(fieldWrapper);
        });
    }

    // Извлекает выходящие ключи инструмента по его названию (из allAvailableTools, структура args.output)
    function getToolOutputKeys(toolName) {
        const tool = allAvailableTools.find(t => String(t.name) === String(toolName));
        if (!tool) return [];

        const argsObj = parseMetadata(tool.args);
        if (!argsObj || !argsObj.output) return [];

        const output = argsObj.output;
        if (typeof output === 'object') {
            if (output.keys) return Object.keys(output.keys);
            if (output.type) return [output.type];
            return Object.keys(output);
        }
        if (typeof output === 'string') return [output];
        return [];
    }

    // Распределяет переменные по группам (общие / ноды / tool / workflow) — единая логика
    // для списка #variablesContainer и селектов переменных
    function groupWorkflowVariables(variables) {
        const variablesArray = Array.isArray(variables) ? variables : [];
        const commonGroup = [];
        const nodeGroup = [];
        const workflowGroup = [];
        const toolGroup = [];
        const inputGroup = [];

        variablesArray.forEach(variable => {
            if (variable.type === 'input') {
                inputGroup.push(variable);
            } else if (variable.type === 'global') {
                commonGroup.push(variable);
            } else if (variable.type === 'node') {
                nodeGroup.push(variable);
            } else {
                workflowGroup.push(variable);
            }
        });

        // Динамические переменные из инструментов:
        // имена формируются по шаблону '{tool_name}_result_{output_key}' на основе args.output самого инструмента
        const foundToolVariables = new Set();
        if (typeof allCurrentStepsData !== 'undefined' && Array.isArray(allCurrentStepsData)) {
            allCurrentStepsData.forEach(step => {
                let metadata = parseMetadata(step.metadata);
                if (metadata && metadata.tool_invoke && metadata.tool_invoke.tool_name) {
                    const tool_name = metadata.tool_invoke.tool_name;
                    getToolOutputKeys(tool_name).forEach(key => {
                        foundToolVariables.add(tool_name + '_result_' + key);
                    });
                }
            });
        }

        foundToolVariables.forEach(varName => {
            toolGroup.push({
                id: -2, // Отрицательный ID чтобы не появилась кнопка удаления
                name: varName,
                default: null,
            });
        });

        return {commonGroup, nodeGroup, workflowGroup, toolGroup, inputGroup};
    }

    // Порядок и названия групп — единые для списка #variablesContainer и селектов переменных
    function workflowVariableSections(groups) {
        return [
            ['📥 Входящие переменные', groups.inputGroup, 'input'],
            ['🇬 Глобальные переменные', groups.commonGroup, 'common'],
            ['🇳 Публичные переменные', groups.nodeGroup, 'node'],
            ['⚙️ Tool переменные', groups.toolGroup, 'tool'],
            ['🇼 Workflow переменные ', groups.workflowGroup, 'workflow'],
        ];
    }

    // Заполняет селект опциями переменных из window.allCurrentVariables,
    // сгруппированными через optgroup так же, как в списке #variablesContainer
    function fillVariablesSelectOptions(sel, selectedVal = '', placeholder = '-- Переменная --') {
        sel.innerHTML = '<option value="">' + placeholder + '</option>';

        const groups = groupWorkflowVariables(window.allCurrentVariables);
        workflowVariableSections(groups).forEach(([label, items]) => {
            if (items.length === 0) return;
            const optgroup = document.createElement('optgroup');
            optgroup.label = label;
            items.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = '%' + v.name + '%';
                if (v.name === selectedVal) opt.selected = true;
                optgroup.appendChild(opt);
            });
            sel.appendChild(optgroup);
        });
    }

    function renderWorkflowVariables(variables) {
        const container = document.getElementById('variablesContainer');
        if (!container) return;
        container.innerHTML = '';

        const variablesArray = Array.isArray(variables) ? variables : [];

        if (variablesArray.length === 0) {
            container.innerHTML = '<div class="empty-text">Нет переменных</div>';
            return;
        }

        // 1. Распределяем переменные по группам
        const {commonGroup, nodeGroup, workflowGroup, toolGroup, inputGroup} = groupWorkflowVariables(variablesArray);

        // 2. Функция создания DOM-элемента отдельной переменной
        function createVariableElement(variable) {
            const div = document.createElement('div');
            div.className = 'variable-item';
            if (variable.type === 'global') {
                div.className += ' variable-item-common';
            }
            if (variable.id === -2) {
                div.className += ' variable-item-tool';
            }
            if (variable.type === 'node') {
                div.className += ' variable-item-node';
            }
            if (variable.type === 'input') {
                div.className += ' variable-item-input';
            }
            div.setAttribute('data-name', variable.name);
            div.setAttribute('data-id', variable.id);

            // Имя переменной
            const nameSpan = document.createElement('span');
            nameSpan.className = 'variable-name';
            nameSpan.title = 'Нажмите, чтобы скопировать';
            const varText = `%${variable.name}%`;
            nameSpan.textContent = varText;
            nameSpan.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(varText);
                    showNotification(`Переменная ${varText} скопирована в буфер`, 'success');
                } catch (err) {
                    showNotification('Не удалось скопировать переменную', 'error');
                }
            };
            div.appendChild(nameSpan);

            // Проверяем наличие значения по умолчанию
            if (variable.default !== undefined && variable.default !== null && variable.default !== '') {
                div.classList.add('has-default');

                const badgeSpan = document.createElement('span');
                badgeSpan.className = 'variable-badge';
                badgeSpan.title = `${variable.default}`;
                badgeSpan.textContent = String(variable.default).slice(0, 10);

                div.appendChild(badgeSpan);
            }

            // Кнопка удаления переменной.
            // Публичные (node) и глобальные переменные живут в других таблицах —
            // из редактора workflow их удалять нельзя
            if (variable.id > 0 && variable.type !== 'node' && variable.type !== 'global') {
                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'btn-delete-var';
                deleteBtn.title = 'Удалить переменную';
                deleteBtn.innerHTML = '&times;';

                deleteBtn.onclick = async () => {
                    const workflowId = document.getElementById('workflowId')?.value;

                    const cleanLocalState = () => {
                        if (typeof allCurrentVariables !== 'undefined') {
                            allCurrentVariables = allCurrentVariables.filter(v => v !== variable);
                        }
                        window.allCurrentVariables = (window.allCurrentVariables || []).filter(v => v !== variable);
                        div.remove();
                        renderWorkflowVariables(typeof allCurrentVariables !== 'undefined' ? allCurrentVariables : window.allCurrentVariables);
                    };

                    if (!workflowId) {
                        cleanLocalState();
                        return;
                    }

                    if (!confirm(`Удалить переменную "${variable.name}"?`)) return;

                    try {
                        await deleteData(`/workflow/${workflowId}/variable/${variable.id}`);
                        cleanLocalState();
                        showNotification('Переменная успешно удалена', 'success');
                    } catch (e) {
                        console.error("Ошибка при удалении переменной:", e);
                        showNotification(`Ошибка удаления: ${e.message}`, 'error');
                    }
                };

                div.appendChild(deleteBtn);
            }

            return div;
        }

        // 3. Функция создания секции аккордеона (классическое поведение)
        function createAccordionSection(title, groupItems, storageKey) {
            const section = document.createElement('div');
            section.className = 'variables-accordion-section';
            section.dataset.key = storageKey;

            // По умолчанию открыта только группа "Переменные workflow"
            if (storageKey === 'workflow') {
                section.classList.add('active');
            }

            const header = document.createElement('div');
            header.className = 'variables-accordion-header';
            header.innerHTML = `<span>${title} (${groupItems.length})</span><span class="arrow">▶</span>`;

            const content = document.createElement('div');
            content.className = 'variables-accordion-content';

            if (groupItems.length === 0) {
                content.innerHTML = '<div class="empty-text" style="font-size: 11px; padding: 4px; color: #888;">Нет переменных</div>';
            } else {
                groupItems.forEach(item => {
                    content.appendChild(createVariableElement(item));
                });
            }

            header.onclick = () => {
                const isActive = section.classList.contains('active');

                // Схлопываем все группы
                const allSections = container.querySelectorAll('.variables-accordion-section');
                allSections.forEach(s => s.classList.remove('active'));

                // Раскрываем текущую, только если она была закрыта
                if (!isActive) {
                    section.classList.add('active');
                }
            };

            section.append(header, content);
            return section;
        }

        // 4. Добавляем секции аккордеона в контейнер
        workflowVariableSections({commonGroup, nodeGroup, workflowGroup, toolGroup, inputGroup}).forEach(([title, groupItems, storageKey]) => {
            container.appendChild(createAccordionSection(title, groupItems, storageKey));
        });

        // 5. Помечаем неиспользуемые переменные workflow (если шаги уже загружены)
        markUnusedWorkflowVariables();
    }

    async function addWorkflowVariable() {
        const workflowId = document.getElementById('workflowId').value;
        const newVariableNameInput = document.getElementById('newVariableName');
        const newVariableValueInput = document.getElementById('newVariableValue');

        if (!newVariableNameInput) return;

        const varName = newVariableNameInput.value.trim();
        const varValue = newVariableValueInput.value.trim();

        // 1. Клиентская валидация перед отправкой
        if (!varName) {
            showNotification('Имя переменной не может быть пустым', 'error');
            return;
        }

        if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(varName)) {
            showNotification('Недопустимый формат (разрешены буквы, цифры и _ начиная с буквы)', 'error');
            return;
        }

        // Если workflow еще не сохранен (нет ID), мы не можем отправить запрос на бэкенд
        if (!workflowId) {
            showNotification('Сначала сохраните workflow, чтобы добавлять переменные', 'warning');
            return;
        }

        // Проверяем дубликаты локально по свойству .name внутри объектов стейта
        const isDuplicate = allCurrentVariables.some(v => v.name === varName);
        if (isDuplicate) {
            showNotification('Такая переменная уже существует в этом workflow', 'error');
            return;
        }

        try {
            // 2. Отправка POST-запроса на бэкенд
            // Передаем payload (название поля 'name' подстройте под требования вашего API, если оно отличается)
            await postData(`/workflow/${workflowId}/variable`, {
                name: varName,
                "default": varValue === '' ? null : varValue
            });

            showNotification('Переменная успешно добавлена', 'success');

            // 3. Очищаем инпут ввода
            newVariableNameInput.value = '';
            newVariableValueInput.value = '';
            newVariableNameInput.focus();

            // 4. Перезагружаем список переменных с бэкенда для синхронизации UI
            await loadWorkflowVariables(workflowId);

        } catch (e) {
            console.error("Ошибка при добавлении переменной:", e);
            showNotification(`Ошибка добавления: ${e.message}`, 'error');
        }
    }

    function renderTransitions(step, allSteps, type) {
        const container = document.getElementById('stepTransitionsList' + type);
        if (!container) return;
        container.innerHTML = '';

        let metadata = parseMetadata(step.metadata);

        const transitionKey = 'transitions_' + type.toLowerCase();
        const transitions = metadata[transitionKey] || [];
        const stepsArray = Array.isArray(allSteps) ? allSteps : [];

        // Вспомогательный хелпер для генерации селекта операторов
        const createOperatorSelect = (selectedOp = '==') => {
            const sel = document.createElement('select');
            sel.className = 'form-control tr-operator';
            sel.style = "width: 65px; padding: 4px; font-size: 12px; height: 32px; text-align: center;";

            const ops = ['==', '!=', '>', '<', 'contains'];
            ops.forEach(op => {
                const opt = document.createElement('option');
                opt.value = op;
                opt.textContent = op;
                if (op === selectedOp) opt.selected = true;
                sel.appendChild(opt);
            });
            return sel;
        };

        // Вспомогательный хелпер для генерации селекта переменных воркфлоу с процентами %
        // (сгруппированы через optgroup как в #variablesContainer)
        const createTrVariablesSelect = (selectedVar = '') => {
            const sel = document.createElement('select');
            sel.className = 'form-control tr-variable';
            sel.style = "flex: 1.5; padding: 4px; font-size: 12px; height: 32px;";
            fillVariablesSelectOptions(sel, selectedVar);
            return sel;
        };

        transitions.forEach((tr) => {
            const row = document.createElement('div');
            row.className = 'transition-row transition-row-' + type.toLowerCase();
            row.style = "display: flex; gap: 6px; align-items: center; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #edf2f7; margin-bottom: 5px;";

            // 1. Селект переменной
            const varSelect = createTrVariablesSelect(tr.variable || '');

            // 2. Селект оператора сравнения
            const opSelect = createOperatorSelect(tr.operator || '==');

            // 3. Инпут текстового значения для сравнения (ВОЗВРАЩАЕМ ПОЛЕ)
            const valInput = document.createElement('input');
            valInput.type = 'text';
            valInput.className = 'form-control tr-value';
            valInput.placeholder = 'Значение';
            valInput.value = tr.value || '';
            valInput.style = "flex: 1.5; padding: 4px; font-size: 12px; height: 32px;";

            // Стрелочка к цели
            const arrow = document.createElement('span');
            arrow.innerHTML = '➔';
            arrow.style = "color: #a0aec0; font-size: 12px; margin: 0 2px;";

            // 4. Селект целевого шага
            const targetSelect = document.createElement('select');
            targetSelect.className = 'form-control tr-target';
            targetSelect.style = "flex: 2; padding: 4px; font-size: 12px; height: 32px;";
            targetSelect.innerHTML = stepsArray.map(s =>
                '<option value="' + s.id + '" ' + (s.id == tr.step_id ? 'selected' : '') + '>' + s.title + '</option>'
            ).join('');

            // 5. Кнопка удаления строки перехода
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'btn-delete-transition';
            delBtn.style = "background:none; border:none; color:#dc3545; font-size:16px; cursor:pointer; padding:0 4px;";
            delBtn.innerHTML = '&times bridge;';
            delBtn.innerHTML = '&times;';

            // Навешиваем живую синхронизацию изменений на все четыре элемента
            varSelect.onchange = () => syncTransitionsToStepState(step, type);
            opSelect.onchange = () => syncTransitionsToStepState(step, type);
            valInput.oninput = () => syncTransitionsToStepState(step, type);
            targetSelect.onchange = () => syncTransitionsToStepState(step, type);
            delBtn.onclick = () => {
                row.remove();
                syncTransitionsToStepState(step, type);
            };

            row.appendChild(varSelect);
            row.appendChild(opSelect);
            row.appendChild(valInput); // Вставляем инпут на UI
            row.appendChild(arrow);
            row.appendChild(targetSelect);
            row.appendChild(delBtn);
            container.appendChild(row);
        });
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.step-item-block:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return {offset: offset, element: child};
            else return closest;
        }, {offset: Number.NEGATIVE_INFINITY}).element;
    }

    async function deleteStep(stepId, stepTitle) {
        const workflowId = document.getElementById('workflowId').value;

        if (!confirm(`Удалить шаг "${stepTitle}" из задачи?`)) return;

        try {
            await deleteData(`/workflow/${workflowId}/step/${stepId}`);
            showNotification('Шаг удален', 'success');

            // Скрываем детали шага, если удалили тот, что редактировали
            document.getElementById('stepDetailsContent').style.display = 'none';
            document.getElementById('noStepSelected').style.display = 'block';

            // Перезагружаем список шагов
            await loadWorkflowSteps(workflowId);
        } catch (e) {
            console.error("Ошибка при удалении шага:", e);
            showNotification(`Ошибка: ${e.message}`, 'error');
        }
    }

    function collectTransitions(type) {
        const rows = document.querySelectorAll('.transition-row-' + type.toLowerCase());
        const transitions = [];

        rows.forEach(row => {
            const varEl = row.querySelector('.tr-variable');
            const opEl = row.querySelector('.tr-operator');
            const valEl = row.querySelector('.tr-value'); // Селектор инпута
            const targetEl = row.querySelector('.tr-target');

            if (targetEl && targetEl.value) {
                const varName = varEl ? varEl.value : '';
                const opName = opEl ? opEl.value : '==';
                const valueText = valEl ? valEl.value.trim() : ''; // Забираем текст

                transitions.push({
                    variable: varName,
                    operator: opName,
                    value: valueText, // Сохраняем значение
                    step_id: targetEl.value
                });
            }
        });

        return transitions;
    }

    async function deleteWorkflow() {
        const id = document.getElementById('workflowId')?.value;
        const title = document.getElementById('title')?.value;

        if (!id || !confirm(`Удалить задачу "${title}" со всеми её шагами?`)) {
            return;
        }

        try {
            await deleteData(`/workflow/${id}`);
            showNotification('Задача удалена', 'success');

            // После удаления перезагружаем всё, чтобы интерфейс обнулился
            await initWorkflowManager();
        } catch (e) {
            showNotification(`Ошибка удаления: ${e.message}`, 'error');
        }
    }

    function initVariablesHandlers() {
        const addVariableBtn = document.getElementById('addVariableBtn');
        const newVariableNameInput = document.getElementById('newVariableName');

        if (!addVariableBtn || !newVariableNameInput) return;

        // Клик по кнопке "+ Добавить"
        addVariableBtn.onclick = async () => {
            await addWorkflowVariable();
        };

        // Нажатие Enter внутри инпута ввода
        newVariableNameInput.onkeydown = async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // Запрещаем сабмит основной формы workflowForm
                await addWorkflowVariable();
            }
        };

        // Кнопка "+ Добавить переменную" в блоке входящих переменных (настройки workflow)
        const addInputVariableBtn = document.getElementById('addInputVariableBtn');
        if (addInputVariableBtn) {
            addInputVariableBtn.onclick = () => createInputVariableRow();
        }
    }

    function syncTransitionsToStepState(step, type) {
        let latestMeta = parseMetadata(step.metadata);

        const transitionKey = 'transitions_' + type.toLowerCase();
        // Вызываем обновленный collectTransitions(), который собирает только переменные, операторы и step_id
        latestMeta[transitionKey] = collectTransitions(type);

        // Записываем обновленный объект обратно в state текущего шага в виде строки JSON
        step.metadata = JSON.stringify(latestMeta);

        // Синхронизируем со скрытой текстовой областью для сабмита формы
        const stepTextarea = document.getElementById('stepTextarea');
        if (stepTextarea) {
            stepTextarea.value = step.metadata;
        }
    }

    ['Before', 'After'].forEach(type => {
        document.getElementById('addConditionBtn' + type).onclick = () => {
            const container = document.getElementById('stepTransitionsList' + type);
            if (!container) return;

            const activeStepBlock = document.querySelector('.step-item-block.active');
            if (!activeStepBlock) return;
            const currentStepData = allCurrentStepsData.find(s => String(s.id) === String(activeStepBlock.dataset.id));

            const optionsHtml = allCurrentStepsData.map(s =>
                '<option value="' + s.id + '">' + s.title + '</option>'
            ).join('');

            const row = document.createElement('div');
            row.className = 'transition-row transition-row-' + type.toLowerCase();
            row.style = "display: flex; gap: 6px; align-items: center; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #edf2f7; margin-bottom: 5px;";

            // Рендерим 4 элемента в ряд без бэктиков во избежание конфликтов со знаком доллара
            row.innerHTML =
                '<select class="form-control tr-variable" style="flex: 1.5; padding: 4px; font-size: 12px; height: 32px;"></select>' +
                '<select class="form-control tr-operator" style="width: 65px; padding: 4px; font-size: 12px; height: 32px; text-align: center;">' +
                '<option value="==">==</option>' +
                '<option value="!=">!=</option>' +
                '<option value=">">&gt;</option>' +
                '<option value="<">&lt;</option>' +
                '<option value="contains">contains</option>' +
                '</select>' +
                '<input type="text" class="form-control tr-value" placeholder="Значение" style="flex: 1.5; padding: 4px; font-size: 12px; height: 32px;">' +
                '<span style="color: #a0aec0; font-size: 12px; margin: 0 2px;">➔</span>' +
                '<select class="form-control tr-target" style="flex: 2; padding: 4px; font-size: 12px; height: 32px;">' + optionsHtml + '</select>' +
                '<button type="button" class="btn-delete-transition" style="background:none; border:none; color:#dc3545; font-size:16px; cursor:pointer; padding:0 4px;">&times;</button>';

            const varSelect = row.querySelector('.tr-variable');
            fillVariablesSelectOptions(varSelect);
            const opSelect = row.querySelector('.tr-operator');
            const valInput = row.querySelector('.tr-value'); // Находим новый инпут
            const targetSelect = row.querySelector('.tr-target');
            const delBtn = row.querySelector('.btn-delete-transition');

            if (currentStepData) {
                varSelect.onchange = () => syncTransitionsToStepState(currentStepData, type);
                opSelect.onchange = () => syncTransitionsToStepState(currentStepData, type);
                valInput.oninput = () => syncTransitionsToStepState(currentStepData, type);
                targetSelect.onchange = () => syncTransitionsToStepState(currentStepData, type);
                delBtn.onclick = () => {
                    row.remove();
                    syncTransitionsToStepState(currentStepData, type);
                };
            }

            container.appendChild(row);
            if (currentStepData) syncTransitionsToStepState(currentStepData, type);
        };
    });


    /**
     * Сохранение изменений задачи
     */
    workflowForm.onsubmit = async (e) => {
        e.preventDefault();

        const idEl = document.getElementById('workflowId');
        const id = idEl ? idEl.value : '';

        // 1. Безопасный сбор основного payload задачи
        const payload = {
            name: document.getElementById('name')?.value.trim() || '',
            title: document.getElementById('title')?.value || '',
            node_id: document.getElementById('node_id')?.value || null,
            description: document.getElementById('description')?.value || '',
            position: parseInt(document.getElementById('position')?.value) || 0,
        };

        try {
            if (id) {
                const activeStepBlock = document.querySelector('.step-item-block.active');

                if (activeStepBlock && allCurrentStepsData.length > 0) {
                    const stepId = activeStepBlock.dataset.id;
                    const currentStepData = allCurrentStepsData.find(s => String(s.id) === String(stepId));

                    if (currentStepData) {
                        // Извлекаем текущие живые метаданные (они уже обновлены функциями ввода/oninput)
                        let metadata = parseMetadata(currentStepData.metadata);

                        // Интегрируем свежие переходы из UI в метаданные шага
                        metadata.transitions_before = collectTransitions("Before");
                        metadata.transitions_after = collectTransitions("After");

                        try {
                            // Сохраняем данные конкретного шага
                            const stepTitleEl = document.getElementById('stepTitle');
                            await putData(`/workflow/${id}/step/${stepId}`, {
                                metadata: JSON.stringify(metadata),
                                title: stepTitleEl ? stepTitleEl.value : currentStepData.title
                            });
                        } catch (stepErr) {
                            console.error("Ошибка сохранения шага:", stepErr);
                            showNotification(`Ошибка сохранения шага: ${stepErr.message}`, 'error');
                            return; // Прерываем операцию, если шаг не сохранился
                        }
                    }
                }

                await putData(`/workflow/${id}`, payload);
                await saveInputVariables(id); // Создаем новые и обновляем измененные входящие переменные
                showNotification('Изменения успешно сохранены', 'success');
                await initWorkflowManager(); // Полностью обновляем списки в UI
            } else {
                const createRes = await postData('/workflow', payload);
                if (createRes && createRes.result && createRes.result.id) {
                    await saveInputVariables(createRes.result.id);
                }
                showNotification('Новый workflow успешно создан!', 'success');

                await initWorkflowManager();

                if (createRes && createRes.result && createRes.result.id) {
                    const newId = createRes.result.id;
                    setTimeout(() => {
                        const allLinks = document.querySelectorAll('.workflow-name-link');
                        // Ищем ссылку, текст которой совпадает с названием нашего нового воркфлоу, и кликаем
                        allLinks.forEach(link => {
                            if (link.textContent.trim() === payload.title.trim()) {
                                link.click();
                            }
                        });
                    }, 300);
                }
            }
        } catch (e) {
            console.error("Ошибка сохранения воркфлоу:", e);
            showNotification(e.message, 'error');
        }
    };

    /**
     * Логика кнопки "Создать задачу"
     */
    const createNewWorkflowBtn = document.getElementById('createNewWorkflow');
    if (createNewWorkflowBtn) {
        createNewWorkflowBtn.onclick = () => {
            document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));

            if (workflowForm) workflowForm.reset();

            const workflowIdEl = document.getElementById('workflowId');
            const nameEl = document.getElementById('name');
            const formTitleEl = document.getElementById('formTitle');

            if (workflowIdEl) workflowIdEl.value = '';
            if (nameEl) nameEl.value = '';
            if (formTitleEl) formTitleEl.textContent = 'Новый workflow';

            // Очищаем список входящих переменных предыдущего workflow
            const inputVarsContainer = document.getElementById('inputVariablesContainer');
            if (inputVarsContainer) inputVarsContainer.innerHTML = '';

            // Безопасно скрываем кнопки управления шагами для нового воркфлоу
            if (deleteBtn) deleteBtn.style.display = 'none';

            const addStepContainer = document.getElementById('addStepToWorkflowBtn') || addStepBtn;
            if (addStepContainer) addStepContainer.style.display = 'none';

            // Скрываем редактор шагов и показываем базовую форму
            const settingsView = document.getElementById('workflowSettingsView');
            const stepsView = document.getElementById('stepsEditorView');
            if (settingsView) settingsView.style.display = 'flex';
            if (stepsView) stepsView.style.display = 'none';
        };
    }

    const addStepToWorkflowBtn = document.getElementById('addStepToWorkflowBtn');
    if (addStepToWorkflowBtn) {
        addStepToWorkflowBtn.onclick = async () => {
            const workflowIdEl = document.getElementById('workflowId');
            const stepSelectEl = document.getElementById('availableStepsSelect');

            if (!workflowIdEl || !stepSelectEl) return;

            const workflowId = workflowIdEl.value;
            const typeId = stepSelectEl.value;

            if (!workflowId || !typeId) {
                showNotification('Не выбран workflow или тип шага', 'warning');
                return;
            }

            try {
                // Отправляем запрос на создание шага
                const response = await postData(`/workflow/${workflowId}/step`, {type_id: typeId});
                showNotification('Шаг успешно добавлен', 'success');

                // Перезагружаем список шагов
                await loadWorkflowSteps(workflowId);

                // UX-ФИКС: Автоматически прокручиваем контейнер вниз и активируем добавленный шаг
                setTimeout(() => {
                    const container = document.getElementById('workflowStepsSortable');
                    if (container) {
                        const steps = container.querySelectorAll('.step-item-block');
                        if (steps.length > 0) {
                            const lastStep = steps[steps.length - 1];
                            lastStep.scrollIntoView({behavior: 'smooth', block: 'nearest'});

                            // Если бэкенд возвращает созданный объект с ID, можно сразу сэмулировать клик
                            if (response && (response.id || response.result?.id)) {
                                const targetId = response.id || response.result.id;
                                const addedStepBlock = container.querySelector(`.step-item-block[data-id="${targetId}"]`);
                                if (addedStepBlock) addedStepBlock.click();
                            } else {
                                lastStep.click(); // Фолбек на последний элемент списка
                            }
                        }
                    }
                }, 100);

            } catch (e) {
                console.error("Ошибка добавления шага:", e);
                showNotification('Ошибка добавления шага', 'error');
            }
        };
    }

    initWorkflowManager().catch(err => console.error("Критический сбой инициализации модуля:", err));
</script>
{% endblock %}
