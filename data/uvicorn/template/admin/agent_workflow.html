{% extends "base.html" %}

{% block title %}Workflow{% endblock %}

{% block head %}
<style>
    /* Используем ваш CSS один в один */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    .agents-sidebar {
        width: 260px;
        min-width: 160px;
        background: #fafafa;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }

    /* Resizer */
    /* ⚠⚠ Входящая переменная — **два этажа**: поля сверху, описание снизу.
       В одну строку описание не влезает: два поля ввода забирают всю ширину
       колонки, и ячейка схлопывается в полоску в пару пикселей — проверено
       снимком страницы. А описание длиннее имени по существу: это фраза, а не
       слово. */
    /* ⚠ Селектор из двух классов — не для красоты. `.variable-row` объявлен
       ниже по файлу и при равной специфичности выигрывает: его
       `align-items: center` сжимал строку полей по содержимому и ставил её
       посередине блока, а описание оставалось во всю ширину.

       Поймано замером в браузере: поля начинались на 124 пикселя правее
       описания — ровно половина разницы ширин. */
    .variable-row.input-variable-row {
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        padding: 8px;
        border: 1px solid #eef2f7;
        border-radius: 6px;
        margin-bottom: 8px;
    }
    .variable-row.input-variable-row .var-line {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .variable-row.input-variable-row .var-line .form-control {
        flex: 1;
        min-width: 0;
    }

    /* ⚠⚠ Разделитель не работал, и вот почему. `.settings-column` объявлена
       `flex: 2`, то есть `flex-basis: 0%` — а помощник перетаскивания задаёт
       `style.width`. При нулевом `flex-basis` ширина игнорируется целиком:
       колонка слушалась только доли роста, и полоса ездила вхолостую.

       `flex: 0 1 auto` возвращает ширине силу: `auto` берёт её за основу.
       Умолчание задаётся тут же, иначе до первого перетаскивания колонка
       схлопнулась бы по содержимому. */
    #workflowSettingsView > .settings-column {
        flex: 0 1 auto;
        width: 55%;
    }

    .input-vars {
        display: flex;
        gap: 12px;
        align-items: stretch;
        min-height: 260px;
    }

    /* Левая колонка — меню имён. Узкая и с прокруткой: имён бывает под два
       десятка, а форма справа должна оставаться на виду. */
    /* ⚠ Ширина под самое длинное имя целиком (`datetime_current_get_zone`,
       186px) плюс отступы и кружок удаления: 242. Ужми до 210 — и единственное
       длинное имя поедет многоточием, хотя место рядом есть. */
    .input-vars-list {
        flex: 0 0 242px;
        max-height: 420px;
        overflow-y: auto;
        border: 1px solid #e8edf3;
        border-radius: 6px;
        padding: 4px;
        background: #fbfcfe;
    }

    /* ⚠ `box-sizing` обязателен: на странице он `content-box`, и заданная строке
       ширина не включала бы ни отступы, ни полосу слева. Строка вылезала за
       список на 19 пикселей — кружок удаления оказывался поверх рамки, а список
       заводил горизонтальную прокрутку. Замерено: 229 против 210. */
    .input-var-name {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        text-align: left;
        border: none;
        background: none;
        padding: 6px 6px 6px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12px;
        color: #334155;
        border-left: 3px solid transparent;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .input-var-name:hover { background: #eef4ff; }

    /* ⚠ Выбранная — цветом и полосой слева, а не только фоном: в длинном списке
       один оттенок фона теряется, особенно при наведении на соседнюю. */
    .input-var-name.active {
        background: #e0edff;
        color: #1d4ed8;
        font-weight: 600;
        border-left-color: #3b82f6;
    }

    /* ⚠ Новая, ещё не сохранённая: видно, что её нет в базе. */
    .input-var-name.fresh { color: #a16207; font-style: italic; }

    .input-var-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Кружок удаления: показывается по наведению на строку.
       ⚠ Место занимает всегда (`visibility`, а не `display`), иначе имя дёргалось
       бы при каждом наведении. */
    .input-var-kill {
        visibility: hidden;
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        line-height: 1;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: #e2e8f0;
        color: #64748b;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
    }
    .input-var-name:hover .input-var-kill,
    .input-var-name:focus-within .input-var-kill { visibility: visible; }

    .input-var-kill:hover { background: #ef4444; color: #fff; }

    .input-vars-form {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .input-vars-form .field-label {
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 3px;
    }

    .input-vars-form textarea {
        resize: vertical;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 13px;
        line-height: 1.4;
        /* ⚠ Высота по числу строк, а не по `rows`: у `rows` она считается от
           шрифта браузера, и при моноширинном 13px последняя строка обрезалась
           пополам — видно на снимке страницы. */
        min-height: 52px;
    }
    .input-vars-form .field-note { min-height: 84px; }

    /* Описание в форме: текст, а рядом карандаш. Поле ввода открывается только
       по щелчку — читают описание в разы чаще, чем правят, и постоянное
       текстовое поле выглядит как «здесь надо что-то заполнить». */
    .note-view {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
    }
    .note-text {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        line-height: 1.45;
        color: #475569;
        padding: 6px 8px;
        border: 1px solid transparent;
        border-radius: 5px;
        cursor: text;
        white-space: pre-wrap;
        word-break: break-word;
    }
    .note-text:hover { background: #f8fafc; border-color: #eef2f7; }
    .note-text.empty { color: #cbd5e1; font-style: italic; }

    /* Пусто — когда ничего не выбрано. */
    .input-vars-empty {
        color: #cbd5e1;
        font-size: 12px;
        font-style: italic;
        padding: 12px 4px;
    }

    .input-vars-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 2px;
    }

    /* Строка описания: текст и карандаш рядом. */
    .var-note-line {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
    }
    .var-note-line .var-note { flex: 1; }

    /* Описание входящей переменной: зачем она и что в неё кладут.
       ⚠ Показывается текстом, а не полем ввода: читают его в разы чаще, чем
       правят, а десяток полей подряд превращают список в анкету. */
    .var-note {
        min-width: 0;
        font-size: 11px;
        color: #64748b;
        line-height: 1.35;
        padding: 4px 6px;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: text;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .var-note:hover { background: #f8fafc; }
    .var-note.empty { color: #cbd5e1; font-style: italic; }

    /* В правке — то же место, тот же размер: строка не должна прыгать. */
    .var-note-edit {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        font-size: 11px;
        line-height: 1.35;
        padding: 4px 6px;
        border: 1px solid #3b82f6;
        border-radius: 4px;
        outline: none;
        font-family: inherit;
    }

    .btn-note-edit {
        flex-shrink: 0;
        align-self: flex-start;
        background: none;
        border: none;
        cursor: pointer;
        opacity: 0.35;
        font-size: 12px;
        padding: 2px 4px;
    }
    .btn-note-edit:hover { opacity: 1; }

    .var-note-saved {
        flex-shrink: 0;
        font-size: 10px;
        color: #16a34a;
    }

    .workflow-resizer {
        width: 2px;
        background: #e0e0e0;
        cursor: col-resize;
        flex-shrink: 0;
        transition: background 0.15s;
    }
    .workflow-resizer:hover,
    .workflow-resizer.dragging { background: #3498db; }

    .workflow-id {
        font-size: 14px;
        color: #30353a;
        white-space: nowrap;
        flex-shrink: 0;
        font-weight: bold;
    }

    .sidebar-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto;
    }

    .group-header {
        padding: 6px 10px 5px;
        font-size: 11px;
        color: #df983d;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .group-folder-header {
        padding: 3px 10px 3px 18px;
        font-size: 12px;
        color: #64748b;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        user-select: none;
        transition: color 0.15s;
    }
    .group-folder-header:hover { color: #3498db; }
    .group-folder-name { flex: 1; }
    .folder-icon { flex-shrink: 0; }

    /* Карусель нод в сайдбаре */
    .node-carousel {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
    }

    .node-carousel-name {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: bold;
        color: #df983d;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .node-carousel-arrow {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f4f6;
        color: #2c3e50;
        border: 1px solid #d6eaf8;
        border-radius: 5px;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        transition: all 0.2s;
        padding: 0;
    }

    .node-carousel-arrow:hover {
        background: #3498db;
        color: #fff;
    }

    .parent-workflow {
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        padding: 6px 12px;
        background: #f9fcff;
        border: 1px solid #bae6fd;
        border-radius: 6px;
        font-size: 12px;
        color: #0369a1;
    }
    .parent-workflow-label {
        font-weight: 600;
        color: #0c4a6e;
        flex-shrink: 0;
        white-space: nowrap;
    }
    .parent-workflow-list {
        display: contents;
    }
    .parent-workflow-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #fff;
        border: 1px solid #7dd3fc;
        border-radius: 10px;
        padding: 2px 10px;
        font-size: 11px;
        color: #0369a1;
        cursor: pointer;
        text-decoration: none;
    }
    .parent-workflow-chip:hover { background: #e0f2fe; }

    .parent-agent {
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        padding: 6px 12px;
        background: #fcfffd;
        border: 1px solid #86efac;
        border-radius: 6px;
        font-size: 12px;
        color: #15803d;
    }
    .parent-agent-label {
        font-weight: 600;
        color: #14532d;
        flex-shrink: 0;
        white-space: nowrap;
    }
    .parent-agent-list {
        display: contents;
    }
    .parent-agent-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #fff;
        border: 1px solid #4ade80;
        border-radius: 10px;
        padding: 2px 10px;
        font-size: 11px;
        color: #15803d;
        cursor: pointer;
        text-decoration: none;
    }
    .parent-agent-chip:hover { background: #dcfce7; }

    /* Разделитель: сверху — workflow агентов, снизу — subflow */
    .workflow-divider {
        border-top: 1px solid #d6dbe0;
        margin: 8px 12px;
    }

    .workflow-list-empty {
        padding: 12px 10px;
        font-size: 12px;
        color: #999;
        text-align: center;
    }

    .agent-item {
        padding: 2px 10px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 14px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }

    .agent-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .agent-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
    }

    .editor-section {
        flex: 1;
        padding: 10px 20px 20px;
        overflow-y: auto;
    }

    .form-header {
        margin-bottom: 10px;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .form-header-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 6px;
    }

    .form-header-bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .form-header .btn-save {
        margin-bottom: 8px;
    }

    .form-layout-grid {
        display: flex;
        gap: 30px;
        align-items: stretch;
        min-height: 450px;
    }

    .settings-column {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .variables-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .steps-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .prompt-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
    }

    /* Плавающие детали шага: при длинном списке шагов колонка липнет к верху
       видимой области (.editor-section скроллится), а не уезжает вместе со списком.
       align-self отменяет stretch — без него sticky не работает; своя прокрутка
       внутри, если детали выше окна */
    #stepDetailsView {
        position: sticky;
        top: 0;
        align-self: flex-start;
        max-height: calc(100vh - 140px);
        overflow-y: auto;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    /* Стилизация контейнера шагов под стиль System Prompt */
    .steps-container-full {
        flex: 1;
        background: #fdfdfd;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        overflow-y: auto;
    }

    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    /* Вкладки Шаги / Настройки / Graph */
    .workflow-tabs {
        display: flex;
        gap: 0;
    }

    .tab-btn {
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 600;
        color: #718096;
        cursor: pointer;
        border: none;
        background: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn.active {
        color: #2c3e50;
        border-bottom-color: #3498db;
    }

    .tab-btn:hover:not(.active) {
        color: #4a5568;
    }

    /* Режим графа переходов */
    .graph-container {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        overflow: hidden;
        height: calc(100vh - 220px);
        position: relative;
        cursor: default;
        user-select: none;
    }

    .graph-container svg {
        max-width: none;
        display: block;
    }

    .graph-container .node {
        cursor: pointer;
    }

    .graph-hint {
        position: absolute;
        bottom: 8px;
        right: 12px;
        font-size: 11px;
        color: #aaa;
        pointer-events: none;
        z-index: 10;
    }

    .graph-warnings {
        margin-bottom: 10px;
        font-size: 13px;
        color: #c0392b;
    }

    .graph-warnings div {
        background: #fdecea;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        padding: 6px 10px;
        margin-bottom: 4px;
    }

    .graph-warnings:empty {
        display: none;
    }

    .btn-create {
        background: #27ae60;
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }

    /* Три кнопки в ряд в шапке сайдбара: создать / экспорт / импорт.
     *
     * ⚠ Правила скоупим внутри `.sidebar-actions`: глобальным `.btn-create`
     * пользуются кнопки «добавить шаг» и «добавить условие» — их не трогаем.
     * Отступа снизу не добавляем: карусель уже несёт свой `margin-top: 12px`. */
    .sidebar-actions {
        display: flex;
        gap: 8px;
    }

    .sidebar-actions .btn-create {
        width: auto;
        flex: 1 1 auto;
        min-width: 0;
        padding: 10px 6px;
        /* Кегль как у соседей: со 16px «+ Создать» не влезала в общий ряд и
         * обрезалась; втроем кнопки обязаны выглядеть парой, а не пасынком. */
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .btn-sidebar-action {
        background: #fff;
        color: #30353a;
        border: 1px solid #cfd8dc;
        border-radius: 5px;
        padding: 10px 8px;
        font-weight: bold;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .btn-sidebar-action:hover {
        background: #eef2f4;
    }

    .btn-sidebar-action:disabled {
        opacity: .55;
        cursor: default;
    }

    /* Галочка «to next step» — вид кнопки рядом.
     *
     * ⚠ Высота и рамка повторяют `.btn-create` в той строке: `padding: 5px 10px`
     * и `1px` рамки дают ту же высоту, а `box-sizing` держит её при смене шрифта.
     * Разный вид читался бы как «подпись к кнопке», хотя это отдельный
     * выключатель, отвечающий на свой вопрос.
     *
     * ⚠ Снятая — заметна: серое поле вместо белого. Иначе тупик в потоке
     * выглядел бы так же, как обычный шаг. */
    .to-next-step {
        display: inline-flex;
        /* ⚠ Не сжимается и не растёт: остаток строки забирает кнопка слева, а
         * галочка держит ровно свою ширину — иначе «to next step» поехало бы
         * под кнопку при узком сайдбаре. */
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        box-sizing: border-box;
        padding: 5px 10px;
        border: 1px solid #d1d5db;
        border-radius: 5px;
        background: #fff;
        color: #374151;
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
    }

    .to-next-step:hover {
        border-color: #9ca3af;
    }

    /* ⚠ Классом, а не `:has(input:not(:checked))`: селектор молодой, а в
     * проекте он не встречается больше нигде. Класс ставит та же функция, что
     * показывает значение (`toNextStepShow`), — второго источника правды нет. */
    .to-next-step.off {
        background: #f3f4f6;
        color: #6b7280;
    }

    .to-next-step input {
        margin: 0;
        cursor: pointer;
    }

    .btn-delete {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 11px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-right: auto;
    }

    .workflow-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
    }

    /* Название workflow не налезает на иконки и обрезается многоточием */
    .workflow-name-link {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
    }

    /* ⚠⚠ Мигающая «!» в квадратике: в этом workflow шаги читают переменные, которых
       не заведёт ни один его шаг. Список слева ничего не считает сам — значок ставят
       строки `main.js` по кэшу `undefined-index.js`; нет данных — нет и значка.
       `step-end` — мигалка, а не плавный фейд: дёрганье заметнее плавного ухода. */
    .workflow-warn-mark {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #dc2626;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        cursor: help;
        animation: wf-blink 1s step-end infinite;
    }

    @media (prefers-reduced-motion: reduce) {
        /* Человек попросил тишину — мигалки гаснут, цвет остаётся. */
        .workflow-warn-mark, .variable-warn-mark, .wf-node-warn {
            animation: none;
        }
    }

    /* Строка с иконками действий под пунктом меню */
    .workflow-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
    }

    /* Иконки действий: видны при наведении на пункт меню */
    .edit-icon,
    .duplicate-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        color: #cccaca;
        border-radius: 4px; /* Скругление как у инпутов */
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid #dfdcdc;
        opacity: 1;
    }

    .agent-item:hover .edit-icon,
    .agent-item:hover .duplicate-icon,
    .agent-item.active .edit-icon,
    .agent-item.active .duplicate-icon {
        opacity: 1;
        color: #3498db;
        background: #eef6fc;
        border: 1px solid #d6eaf8;
    }

    /* Эффект при наведении на саму иконку */
    .edit-icon:hover,
    .duplicate-icon:hover {
        background: #3498db;
        color: #fff;
        transform: scale(1.1);
        box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
    }

    /* Скрытие секции шагов в режиме редактирования задачи */
    .hide-steps .prompt-column {
        display: none;
    }

    .steps-sortable-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
    }

    .step-item-block {
        display: flex;
        align-items: center;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        cursor: grab;
        transition: background 0.2s;
    }

    .step-item-block:active {
        cursor: grabbing;
    }

    .step-item-block:hover {
        border-color: #3498db;
        background: #fcfdfe;
    }

    .step-item-block.dragging {
        opacity: 0.5;
        background: #eef6fc;
    }

    .step-item-block {
        position: relative; /* Для позиционирования кнопки удаления */
        padding-right: 40px; /* Место под кнопку */
    }

    .btn-delete-step {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        color: #e74c3c;
        border: none;
        font-size: 18px;
        line-height: 0;
        cursor: pointer;
        transition: color 0.2s;
    }

    .btn-delete-step:hover {
        color: #e74c3c !important;
        font-weight: bolder !important;
    }

    .step-item-block.dragging {
        opacity: 0.5;
        background: #eef6fc;
        border: 1px dashed #3498db;
    }

    .step-number-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        background-color: #3498db;
        color: white;
        border-radius: 50%; /* Снова ровный круг */
        font-size: 12px;
        font-weight: bold;
        margin-right: 10px; /* Отступ до иконки */
        flex-shrink: 0;
    }

    .step-type-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
    }

    /* Настройка контейнера контента шага */
    .step-content {
        display: flex;
        align-items: center;
        width: 100%;
    }

    .step-title-text {
        font-weight: 500;
        color: #2c3e50;
        font-size: 14px;
    }

    .stepTitle {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        font-size: 14px;
    }

    .stepTitle label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    /* Стилизация инпута названия */
    #stepTitle {
        border: 1px solid #ddd;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
        background: #fdfdfd;
        color: #2c3e50;
        font-weight: 500;
    }

    #stepTitle:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    .system-prompt-full {
        height: 170px;
        margin-top: 10px;
    }

    .transition-row {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #f9fafb;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #edf2f7;
    }

    .transition-row input {
        flex: 2; /* Поле для условия */
        padding: 5px;
        font-size: 12px;
    }

    .transition-row select {
        flex: 1; /* Выбор целевого шага */
        padding: 5px;
        font-size: 12px;
    }

    .btn-add-widget-row {
        align-self: flex-start;
        margin-top: 4px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 500;
        background: #218838;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .widget-rows-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .widget-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        background: white;
        padding: 8px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
    }

    .widget-row select {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
    }

    .widget-row .btn-delete-widget-row {
        grid-column: 2;
        grid-row: 1;
        margin-top: 0; /* Обнуляем старый отступ, так как grid сам выровняет */
        align-self: center;
        font-size: 25px;
        padding: 0;
        background: transparent;
        color: #ff7098;
    }

    .widget-row textarea {
        grid-column: 1 / span 2;
        grid-row: 2;
        width: 100%;
        height: 60px;
    }

    .workflow-actions {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    /* Заголовок секции */
    .variables-section h3 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 14px;
        color: #333;
    }

    /* ИЗМЕНЕНО: Форма добавления теперь вмещает 2 инпута и кнопку */
    .variable-add-form {
        display: flex;
        flex-direction: column; /* Элементы формы встают друг под друга */
        gap: 8px;
        margin-bottom: 16px;
    }

    /* Контейнер для группировки двух инпута в одну строку */
    .variable-add-form .form-group-row {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .variable-add-form .form-control {
        flex-grow: 1;
        width: 50%; /* Инпуты делят пространство поровну */
    }

    /* Кнопка добавления (на всю ширину под инпутами для удобства) */
    .variables-editor-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
        overflow-y: auto;
    }

    /* Строка с парой Ключ-Значение */
    .variable-row {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .variable-row .form-control {
        padding: 6px 10px;
        font-size: 13px;
        font-family: 'Consolas', 'Monaco', monospace;
    }

    /* Кнопка удаления строки */
    .btn-del-var {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.2s;
    }

    .btn-del-var:hover {
        background: #c0392b;
    }

    .btn-add-var {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
        width: 100%;
        transition: background-color 0.15s ease;
    }

    .btn-add-var:hover {
        background-color: #218838;
    }

    /* Список переменных */
    .variables-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        padding-right: 4px;
        max-width: 350px;
    }

    /* Элемент списка */
    .variable-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 8px 6px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        box-sizing: border-box;
        width: 100%; /* Гарантируем, что строка занимает всю ширину */
        border-left: 3px solid #2974df;
    }

    .variable-item:hover {
        background-color: #edf4f9;
    }

    .variable-item-common {
        border-left: 2px solid limegreen;
    }

    .variable-item-common:hover {
        background-color: #dfffd9;
    }

    .variable-item-node {
        border-left: 2px solid #ffd73b;
    }

    .variable-item-node:hover {
        background-color: #fff2d9;
    }

    .variable-item-tool {
        border-left: 2px solid #f488d5;
    }

    .variable-item-tool:hover {
        background-color: #ffd9ea;
    }

    /* ⚠⚠ «Undefined переменные»: имя читают шаги, но не кладёт никто. Полоса
       красная и сплошная — в отличие от пунктира `dynamic`/`unknown`: это не
       «нет группы», а дырка: в прогоне на её месте пусто.
       ⚠ Мигалка `step-end`: плавный фейд глаз читает как «померцало», рваный
       такт — как «тревога». Под `prefers-reduced-motion` мигалка гаснет
       (медиазапрос с `.workflow-warn-mark`), цвет остаётся. */
    .variable-item-undefined {
        border-left: 2px solid #dc2626;
        background: #fef2f2;
    }

    .variable-item-undefined:hover {
        background-color: #fee2e2;
    }

    .variable-warn-mark {
        color: #dc2626;
        flex: none;
        animation: wf-blink 1.1s step-end infinite;
    }

    /* Счётчик читающих: «читают 2 шаг(а)» — без подсказки не видно, сколько
       шагов уйдёт в пустоту, если переменную не завести. */
    .variable-readers {
        flex: none;
        color: #b4231d;
        font-size: 10px;
    }

    /* Динамические: их никто не заводил, они появляются в прогоне сами.
       ⚠ Полоса пунктиром, а не цветом — цвета у соседей уже разобраны, а пунктир
       говорит то же, что и надпись на вкладке: записи в реестре нет. */
    /* ── Граф: панель переменных рядом с диаграммой ──────────────────────── */

    .graph-layout {
        display: flex;
        gap: 10px;
        align-items: stretch;
    }

    /* ⚠⚠ Диаграмме нужно **явно** сказать «займи остальное».
       Её содержимое позиционировано абсолютно (перемещение и масштаб), то есть
       собственной ширины у контейнера нет вовсе. Как flex-ребёнок без `flex` он
       схлопывался до двух пикселей — ровно до своих рамок, — и граф пропадал с
       экрана целиком. Ошибки при этом не было: SVG жил в DOM с тремя узлами и
       размером 0×0.
       ⚠ `min-width: 0` обязателен рядом: без него flex не даёт ребёнку стать уже
       содержимого, и широкий граф растянул бы раскладку, выдавив панель. */
    .graph-layout .graph-container {
        flex: 1 1 auto;
        min-width: 0;
    }

    /* ⚠ Узкая и с своей прокруткой: диаграмме нужно всё остальное место, а имён
       переменных бывает под сотню. */
    .graph-vars {
        flex: 0 0 240px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
    }

    .graph-vars-list {
        overflow-y: auto;
        max-height: 40vh;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 3px;
        background: #fff;
    }

    .graph-var {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 3px 6px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
        font-family: monospace;
        color: #334155;
    }

    .graph-var:hover {
        background: #f1f5f9;
    }

    .graph-var.active {
        background: #dbeafe;
        color: #1e40af;
        font-weight: 600;
    }

    /* ⚠⚠ Цвета — те же, что у групп на панели шагов, и это не украшение: человек
       узнаёт вид переменной по полосе, не читая подписи. Разойдись они — полоса
       стала бы врать. */
    .graph-var-input    { border-left: 3px solid #26c6da; }
    .graph-var-common   { border-left: 3px solid limegreen; }
    .graph-var-node     { border-left: 3px solid #ffd73b; }
    .graph-var-tool     { border-left: 3px solid #f488d5; }
    .graph-var-workflow { border-left: 3px solid #2974df; }
    /* ⚠ Пунктир — тот же признак, что на вкладке «Dynamic»: записи в реестре нет. */
    .graph-var-dynamic  { border-left: 3px dashed #9575cd; }
    /* Группы нет вовсе (`VAR_GROUP_UNKNOWN`): пунктир — записи в реестре нет, серый —
       своего цвета у неё и не должно быть. Тот же вид, что у чипа `∅` на трассе. */
    .graph-var-unknown  { border-left: 3px dashed #cbd5e1; }

    /* ⚠⚠ «Undefined переменные»: переменная читается шагами, но не объявлена нигде.
       Сплошная красная полоса — это не «нет группы» (пунктир `unknown`), а «дырка»:
       в прогоне на её месте пусто. Тот же цвет, что предупреждений на шагах. */
    .graph-var-undefined { border-left: 3px solid #dc2626; }
    .graph-var-undefined {
        background: #fef2f2;
    }
    .graph-var-undefined:hover {
        background-color: #fee2e2;
    }

    /* Мигалка «неопределённая» и на строке трассы, и на узле диаграммы. */
    .graph-var-undefined .graph-var-icon {
        color: #dc2626;
    }

    /* ⚠⚠ Мигалка: туг же, где у «Undefined переменных» на вкладке «Шаги» и в
       левом списке. `steps()` — рваный такт, глаз цепляет смену, а не плавку. */
    @keyframes wf-blink {
        50% { opacity: .12; }
    }

    /* Треугольник-предупреждение внутрь узла: mermaid рисует узел как `g.node` с
       `path`, маркер — последним, значит поверх фигурки. Координаты — из
       `getBBox()` в `graph.js`, отсютда правый верхний угол и край. */
    .wf-node-warn {
        animation: wf-blink 1.1s step-end infinite;
        pointer-events: none; /* мышь не должна снимать подсказку узла */
    }
    .wf-node-warn-tri { fill: #dc2626; stroke: none; }
    .wf-node-warn-bang {
        fill: #fff;
        font: 700 8px/1 system-ui, sans-serif;
        pointer-events: none;
    }

    /* ⚠⚠ Значок и имя — одним блоком. `justify-content: space-between` у строки
       разводит детей по краям, и третий ребёнок (значок) отъезжал от имени на
       67 пикселей у коротких имён: читался не приставкой к имени, а сам по себе.
       Обёртка держит их вместе, а счётчику остаётся правый край.
       `min-width: 0` обязателен — без него многоточие в имени не срабатывает. */
    .graph-var-head {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
    }

    /* Значок группы перед именем — тот же, что чип на трассе прогона. Жёсткий:
       имя с многоточием не должно съедать его в узкой колонке.
       ⚠ Ширина задана: знаки разной ширины (∅ уже эмодзи) сдвигали бы начало имён
       на пяток пикселей, и колонка имён в моноширинном списке шла бы волной. */
    .graph-var-icon {
        flex: 0 0 auto;
        width: 1.2em;
        text-align: center;
    }

    /* ⚠ Длинное имя обрезаем видом, а не текстом: полное живёт в подсказке. */
    .graph-var-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Название группы над именем в трассе. */
    .graph-vars-trace .trace-group {
        font-size: 10px;
        color: #64748b;
        border-left: 3px solid #cbd5e1;
        padding-left: 6px;
        margin-bottom: 4px;
    }

    .trace-group-input    { border-left-color: #26c6da; }
    .trace-group-common   { border-left-color: limegreen; }
    .trace-group-node     { border-left-color: #ffd73b; }
    .trace-group-tool     { border-left-color: #f488d5; }
    .trace-group-workflow { border-left-color: #2974df; }
    .trace-group-dynamic  { border-left-color: #9575cd; }
    .trace-group-unknown  { border-left-color: #cbd5e1; }
    /* ⚠ Тот же красный, что у строки `undefined` в списке: чип трассы и строка
       списка — один и тот же факт, и цвет у них один. */
    .trace-group-undefined { border-left-color: #dc2626; }

    /* Сколько шагов кладёт и читает — видно до щелчка. */
    .graph-var-count {
        font-size: 10px;
        color: #94a3b8;
        white-space: nowrap;
    }

    .graph-vars-trace {
        font-size: 11px;
        line-height: 1.5;
        color: #475569;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 6px 8px;
        background: #fff;
        overflow-y: auto;
        max-height: 34vh;
    }

    .graph-vars-trace .trace-head {
        font-family: monospace;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 4px;
        word-break: break-all;
    }

    .graph-vars-trace .trace-role {
        margin-top: 6px;
        font-size: 10px;
        letter-spacing: .04em;
        color: #94a3b8;
    }

    .graph-vars-trace .trace-step {
        cursor: pointer;
        padding: 1px 0;
    }

    .graph-vars-trace .trace-step:hover {
        color: #1d4ed8;
        text-decoration: underline;
    }

    .graph-vars-trace .trace-none {
        color: #b45309;
    }

    .variable-item-dynamic {
        border-left: 2px dashed #9575cd;
    }

    .variable-item-dynamic:hover {
        background-color: #ece6f8;
    }

    .variable-item-input {
        border-left: 2px solid #26c6da;
    }

    .variable-item-input:hover {
        background-color: #d9f7fb;
    }

    .variable-item.has-default:hover .variable-badge {
        background-color: #dfe3e6;
        color: #333;
    }

    .variable-item.unused-variable {
        border-left-color: #b0b0b0;
        background-color: #f5f5f5;
        opacity: 0.6;
    }

    /* Подсветка tool-переменных, относящихся к выбранному шагу-инструменту */
    .variable-item.tool-var-highlight {
        background-color: #ffe9f5;
        border-left-color: #e91e63;
        box-shadow: 0 0 0 1px #f488d5 inset;
    }

    .variable-item.tool-var-highlight .variable-name {
        font-weight: bold;
    }

    /* Подсветка workflow-переменных, в которые пишет выбранный шаг "Переменные" */
    .variable-item.workflow-var-highlight {
        background-color: #e3f0ff;
        border-left-color: #1565c0;
        box-shadow: 0 0 0 1px #90caf9 inset;
    }

    .variable-item.workflow-var-highlight .variable-name {
        font-weight: bold;
    }

    .variable-item.unused-variable .variable-name {
        color: #3a3535;
    }

    .variable-name {
        margin-right: auto;
        color: #1c4a73;
        cursor: pointer;
        transition: color 0.15s ease;
    }

    .variable-name:hover {
        color: #004494;
    }

    .variable-badge {
        background-color: #eaeaea;
        color: #555;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        margin: 0 4px;
        max-width: 150px; /* Защита от слишком длинных строк */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis; /* Троеточие, если текст не влезает */
        border: 1px solid #dcdcdc;
    }

    .btn-delete-var {
        background: none;
        border: none;
        color: #dc3545;
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
        padding: 0 4px;
        transition: color 0.15s ease;
    }

    .btn-delete-var:hover {
        color: #bd2130;
    }

    /* Аккордеон для переменных */
    .variables-accordion-section {
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        margin-bottom: 0px;
        overflow: hidden;
    }

    .variables-accordion-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f7f7f7;
        padding: 8px 12px;
        font-weight: bold;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        color: #444;
        transition: background-color 0.15s;
    }

    .variables-accordion-header:hover {
        background: #ededed;
    }

    .variables-accordion-header .arrow {
        font-size: 8px;
        transition: transform 0.2s;
    }

    .variables-accordion-section.active .variables-accordion-header .arrow {
        transform: rotate(90deg);
    }

    .variables-accordion-content {
        display: none;
        flex-direction: column;
        gap: 0;
        background: #fdfdfd;
        padding: 0;
        border-top: 1px solid #eee;
    }

    .variables-accordion-section.active .variables-accordion-content {
        display: flex;
    }

    .transitions-editor {
        margin-top: 20px;
        border-top: 1px solid #eee;
        font-size: 15pt;
    }

    .step-return-response {
        border-left: 2px solid #ff001e !important;
    }

    .step-transition-target {
        margin-top: 10px;
        border-top: 2px solid limegreen !important;
    }

</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список (Sidebar) -->
    <div class="agents-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-actions">
                <button class="btn-create" id="createNewWorkflow" title="Создать новый workflow">+ Создать</button>
                <button type="button" class="btn-sidebar-action" id="exportWorkflowsBtn"
                        title="Скачать все workflow этой ноды одним файлом">Экспорт</button>
                <button type="button" class="btn-sidebar-action" id="importWorkflowsBtn"
                        title="Заменить workflow этой ноды содержимым файла">Импорт</button>
            </div>
            <!-- Файл выбирается только этим полем; после чтения оно очищается,
                 чтобы повторный выбор того же файла снова считался onchange. -->
            <input type="file" id="importWorkflowsFile" accept=".json,application/json" hidden>

            <!-- Карусель нод: стрелки листают ноды по кругу -->
            <div class="node-carousel">
                <button type="button" class="node-carousel-arrow" id="nodeCarouselPrev" title="Предыдущая нода">‹</button>
                <div class="node-carousel-name" id="nodeCarouselName">—</div>
                <button type="button" class="node-carousel-arrow" id="nodeCarouselNext" title="Следующая нода">›</button>
            </div>
        </div>
        <div class="agent-list" id="workflowList">
            <!-- Заполняется JS -->
        </div>
    </div>

    <!-- Resizer -->
    <div class="workflow-resizer" id="workflowResizer"></div>

    <!-- Секция формы -->
    <div class="editor-section">
        <form id="workflowForm" novalidate>
            <div class="form-header">
                <div class="form-header-top">
                    <span id="formTitle" style="display:none;"></span>
                    <div class="workflow-id">Workflow: #</div>
                </div>
                <div class="form-header-bottom">
                    <div class="workflow-tabs" id="workflowTabs">
                        <button type="button" class="tab-btn active" id="tabSteps">Шаги</button>
                        <button type="button" class="tab-btn" id="tabSettings">Настройки</button>
                        <button type="button" class="tab-btn" id="tabGraph">Graph</button>
                    </div>
                    <button type="submit" class="btn-save">Сохранить workflow</button>
                </div>
            </div>

            <input type="hidden" id="workflowId">

            <!-- 1. Контейнер ПАРАМЕТРОВ (скрывается при клике на название) -->
            <!-- ⚠ «Кем используется» стоит НАД колонками, а не под ними.
                 Прежде оба блока лежали между двумя сетками — «Настройки» и
                 «Шаги», — и на вкладке настроек уезжали под низ страницы: сетка
                 растянута `min-height: 450px`, и подпись про агента оказывалась
                 ниже сгиба, отдельно от того, к чему относится.

                 Это ответ на вопрос «что сейчас открыто», и читают его первым. -->
            <div class="parent-workflow"></div>
            <div class="parent-agent"></div>

            <div id="workflowSettingsView" class="form-layout-grid">
                <div class="settings-column">
                    <div class="form-group">
                        <label>Название workflow</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Технический ID (name)</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group"><label>Нода</label><select id="node_id"
                                                                       class="form-control"></select></div>
                    <div class="form-group">
                        <label>Группа</label>
                        <input type="text" id="group_name" class="form-control" maxlength="50" placeholder="Необязательно">
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="description" class="form-control"
                                  style="height: 80px; resize: none;"></textarea>
                    </div>
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
                        <input type="checkbox" id="subflow" style="width: 16px; height: 16px; cursor: pointer; margin: 0;">
                        <label for="subflow" style="cursor: pointer; margin: 0;text-transform: none;">🇼 sub-workflow (используется только шагом «Вызов workflow»)</label>
                    </div>
                </div>

                <!-- ⚠ Тот же разделитель, что делит список workflow и форму
                     (`workflowResizer`), и тот же помощник `initSidebarResizer`.
                     Своя реализация разошлась бы с ним в мелочах: ширина хвата,
                     курсор, запрет выделения при перетаскивании. -->
                <div class="workflow-resizer" id="settingsResizer"
                     title="Потяните, чтобы изменить ширину"></div>

                <div class="prompt-column">
                    <div class="form-group" id="inputVariablesGroup">
                        <label>Входящие переменные</label>

                        <!-- ⚠⚠ Две колонки: слева имена списком, справа форма
                             выбранной. Прежде каждая переменная была строкой из
                             двух полей и описания — при дюжине переменных это
                             тридцать полей ввода подряд, и найти нужную можно
                             было только чтением всех.

                             Список отвечает на «какие вообще есть», форма — на
                             «что эта делает». Вопроса два, и показывать их надо
                             порознь. -->
                        <div class="input-vars">
                            <div class="input-vars-list" id="inputVariablesList">
                                <!-- Имена: заполняет JS -->
                            </div>

                            <div class="input-vars-form" id="inputVariablesForm">
                                <!-- Форма выбранной: заполняет JS -->
                            </div>
                        </div>

                        <!-- ⚠ Скрытый контейнер прежних строк: на нём держится
                             сохранение вместе с workflow (`saveInputVariables`
                             читает именно его). Переписывать сохранение заодно
                             с видом значило бы менять две вещи разом и не знать,
                             которая сломалась. -->
                        <div id="inputVariablesContainer" class="variables-editor-container"
                             style="display: none;"></div>

                        <button type="button" class="btn-add-var" id="addInputVariableBtn">+ Добавить
                            переменную
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. Контейнер ШАГОВ (Две колонки) -->
            <div id="stepsEditorView" class="form-layout-grid" style="display: none;">
                <div class="variables-column">
                    <div class="variables-section">
                        <div class="variables-header">
                            <label style="font-size: 10px; color: #999;">Переменные</label>
                            <div class="variable-add-form">
                                <div class="form-group-row">
                                    <input type="text" id="newVariableName" class="form-control"
                                           placeholder="Имя переменной...">
                                    <input type="text" id="newVariableValue" class="form-control"
                                           placeholder="Значение по умолчанию...">
                                </div>
                                <button type="button" class="btn-add-var" id="addVariableBtn">+ Add</button>
                            </div>
                        </div>

                        <!-- Список добавленных переменных -->
                        <div class="variables-list" id="variablesContainer">
                            <!-- Пример элемента списка (будет генерироваться через JS) -->
                            <!--
                            <div class="variable-item">
                                <span class="variable-name">my_var_name</span>
                                <button type="button" class="btn-delete-var" data-name="my_var_name">&times;</button>
                            </div>
                            -->
                        </div>
                    </div>
                </div>

                <!-- Колонки управления шагами -->
                <div class="steps-column">

                    <!-- Блоки 1 и 2: Выбор и Кнопка Добавить -->
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <div style="flex: 1;">
                            <label style="font-size: 10px; color: #999;">Доступные шаги</label>
                            <select id="availableStepsSelect" class="form-control">
                                <option value="">Загрузка шагов...</option>
                            </select>
                        </div>
                        <div style="align-self: flex-end;">
                            <button type="button" class="btn-create" id="addStepToWorkflowBtn"
                                    style="padding: 10px 20px;">+ Add
                            </button>
                        </div>
                    </div>

                    <!-- Блок 3: Список шагов текущей задачи (Drag & Drop) -->
                    <label style="font-size: 10px; color: #999;">Шаги текущего workflow (перетащите для
                        сортировки)</label>
                    <div id="workflowStepsSortable" class="steps-sortable-list">
                        <!-- Сюда JS отрисует шаги -->
                    </div>
                </div>


                <!-- Вторая колонка: Детали (как и было) -->
                <div class="prompt-column" id="stepDetailsView">
                    <!-- Контейнер с контентом (скрыт по умолчанию) -->
                    <div id="stepDetailsContent" style="display: none;">

                        <div class="stepTitle">
                            <label style="font-size: 10px; color: #999;">Описание шага</label>
                            <span id="stepDescriptionFull"></span>
                        </div>

                        <div class="transitions-editor">
                            <label style="font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase;">
                                Логика переходов (Before)
                            </label>

                            <div id="stepTransitionsListBefore"
                                 style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                                <!-- Сюда JS будет рендерить строки условий -->
                            </div>

                            <button type="button" class="btn-create" id="addConditionBtnBefore"
                                    style="margin-top: 10px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 5px 10px; font-size: 12px;">
                                + Добавить условие перехода
                            </button>
                        </div>

                        <!-- НОВЫЙ КОНТЕЙНЕР ДЛЯ КАСТОМНЫХ ПОЛЕЙ ТИПА ШАГА -->
                        <div id="dynamicStepFieldsContainer"
                             style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                            <!-- Сюда JS будет рендерить инпуты/текстареа в зависимости от типа шага -->
                        </div>

                        <!-- Старую textarea скрываем с помощью display: none, чтобы не ломать остальной код сбора данных -->
                        <textarea id="stepTextarea" class="form-control system-prompt-full"
                                  style="display: none;"></textarea>

                        <div class="transitions-editor">
                            <label style="font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase;">
                                Логика переходов (After)
                            </label>

                            <div id="stepTransitionsListAfter"
                                 style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                                <!-- Сюда JS будет рендерить строки условий -->
                            </div>

                            <!-- ⚠ Кнопка и галочка в одной строке намеренно: они
                                 отвечают на один вопрос — «куда пойдёт поток после
                                 этого шага». Условия говорят «куда прыгнуть», галочка
                                 — «а если ни одно не сработало». -->
                            <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px;">
                                <!-- ⚠ Кнопка забирает остаток строки (`flex: 1 1 auto`),
                                     галочка справа держит свою ширину и не сжимается.
                                     Голое `width: 100%` из `.btn-create` тут не годится:
                                     оно считается от всей строки, а не от остатка, и
                                     выдавливало галочку к краю. -->
                                <button type="button" class="btn-create" id="addConditionBtnAfter"
                                        style="width: auto; flex: 1 1 auto; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 5px 10px; font-size: 12px; white-space: nowrap;">
                                    + Добавить условие перехода
                                </button>
                                <!-- ⚠ Рамка и отступы те же, что у кнопки слева:
                                     обе решают одно — куда пойдёт поток, — и
                                     разный вид делал бы галочку подписью к кнопке,
                                     а не самостоятельным выключателем.
                                     ⚠ `nowrap`: «to next step» в три слова, и в
                                     узком сайдбаре оно ломалось на строки. -->
                                <label class="to-next-step" id="stepToNextStepBox"
                                       title="Снята — поток дальше по номеру не идёт: не сработал ни один переход, и шаг отвечает «no more step available». Нужна развилке, где следующий по номеру шаг это чужая ветка.">
                                    <input type="checkbox" id="stepToNextStep" checked>
                                    to next step
                                </label>
                            </div>
                        </div>

                        <div class="stepTitle">
                            <label>Название шага</label>
                            <input type="text" id="stepTitle" required/>
                        </div>
                    </div>

                    <!-- Заглушка (видна, когда шаг не выбран) -->
                    <div id="noStepSelected" style="color: #999; text-align: center; margin-top: 50px;">
                        Выберите шаг из списка слева
                    </div>
                </div>


            </div>

            <!-- 3. Контейнер ГРАФА переходов -->
            <div id="stepsGraph" style="display: none;">
                <div id="stepsGraphWarnings" class="graph-warnings"></div>
                <!-- ⚠⚠ Своя панель переменных, а не та, что в редакторе шагов:
                     редактор при показе графа скрывается целиком, и вместе с ним
                     уходит `#variablesContainer`. Две панели об одном — плата за
                     то, что виды взаимоисключающие. -->
                <div class="graph-layout">
                    <div class="graph-vars">
                        <input type="text" id="graphVarFilter" class="form-control"
                               placeholder="Поиск переменной…" autocomplete="off">
                        <div id="graphVarList" class="graph-vars-list"></div>
                        <div id="graphVarTrace" class="graph-vars-trace"></div>
                    </div>
                    <div id="stepsGraphContainer" class="graph-container">
                        <!-- Сюда рендерится mermaid-диаграмма -->
                    </div>
                </div>
            </div>

            <div class="editor-footer">
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none;">Удалить</button>
                <button type="submit" class="btn-save">Сохранить workflow</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/vendor/mermaid.min.js"></script>
<script src="/static/js/sidebar_resizer.js"></script>
<script>
    initSidebarResizer('workflowResizer', 'workflow_sidebar_width', document.querySelector('.agents-sidebar'));

    // ⚠ Колонки настроек — на `flex`, поэтому ширину задаём левой, а правая
    // забирает остаток сама. Предел справа шире обычного: во входящих
    // переменных теперь три поля в строке, и им нужно место.
    initSidebarResizer('settingsResizer', 'workflow_settings_width',
        document.querySelector('#workflowSettingsView .settings-column'), 240, 900);
</script>
<script type="module" src="/static/js/workflow/main.js?v=12"></script>
{% endblock %}
