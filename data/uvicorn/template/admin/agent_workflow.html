{% extends "base.html" %}

{% block title %}Workflow{% endblock %}

{% block head %}
<style>
    /* Используем ваш CSS один в один */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    .agents-sidebar {
        width: 260px;
        background: #fafafa;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto;
    }

    .group-header {
        padding: 6px 10px 5px;
        font-size: 11px;
        color: #df983d;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .agent-item {
        padding: 2px 10px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 14px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }

    .agent-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .agent-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
    }

    .editor-section {
        flex: 1;
        padding: 20px 20px;
        overflow-y: auto;
    }

    .form-header {
        margin-bottom: 10px;
        border-bottom: 2px solid #f4f4f9;
        padding-bottom: 15px;
        display: flex;
        justify-content: space-between; /* Раздвигает заголовок влево, а кнопку вправо */
        align-items: center; /* Выравнивает оба элемента строго по центру вертикали */
        width: 100%; /* Гарантирует, что контейнер занимает всю ширину */

    }

    .form-header h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 20px;
    }

    .form-layout-grid {
        display: flex;
        gap: 30px;
        align-items: stretch;
        min-height: 450px;
    }

    .settings-column {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .variables-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .steps-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .prompt-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    /* Стилизация контейнера шагов под стиль System Prompt */
    .steps-container-full {
        flex: 1;
        background: #fdfdfd;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        overflow-y: auto;
    }

    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-create {
        background: #27ae60;
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-delete {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 11px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-right: auto;
    }

    .agent-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 12px; /* Чуть увеличим отступы для удобства */
        position: relative;
    }

    /* Иконка редактирования: всегда видна и яркая */
    .edit-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        background: #eef6fc; /* Нежно-голубой фон */
        color: #3498db; /* Яркий основной цвет */
        border-radius: 4px; /* Скругление как у инпутов */
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid #d6eaf8;
        opacity: 1 !important; /* Гарантируем видимость всегда */
    }

    /* Эффект при наведении на саму иконку */
    .edit-icon:hover {
        background: #3498db;
        color: #fff;
        transform: scale(1.1);
        box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
    }

    /* Чтобы текст задачи не налезал на яркую иконку */
    .workflow-name-link {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-right: 10px;
        cursor: pointer;
    }

    /* Иконка редактирования (скрыта по умолчанию) */
    .edit-icon {
        opacity: 0;
        cursor: pointer;
        color: #999;
        transition: all 0.2s;
        font-size: 14px;
        padding: 2px 5px;
    }

    .agent-item:hover .edit-icon {
        opacity: 1;
    }

    .edit-icon:hover {
        color: #3498db;
        transform: scale(1.2);
    }

    /* Скрытие секции шагов в режиме редактирования задачи */
    .hide-steps .prompt-column {
        display: none;
    }

    .steps-sortable-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
    }

    .step-item-block {
        display: flex;
        align-items: center;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        cursor: grab;
        transition: background 0.2s;
    }

    .step-item-block:active {
        cursor: grabbing;
    }

    .step-item-block:hover {
        border-color: #3498db;
        background: #fcfdfe;
    }

    .step-item-block.dragging {
        opacity: 0.5;
        background: #eef6fc;
    }

    .step-item-block {
        position: relative; /* Для позиционирования кнопки удаления */
        padding-right: 40px; /* Место под кнопку */
    }

    .btn-delete-step {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        color: #e74c3c;
        border: none;
        font-size: 18px;
        line-height: 0;
        cursor: pointer;
        transition: color 0.2s;
    }

    .btn-delete-step:hover {
        color: #e74c3c !important;
        font-weight: bolder !important;
    }

    .step-item-block.dragging {
        opacity: 0.5;
        background: #eef6fc;
        border: 1px dashed #3498db;
    }

    .step-number-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        background-color: #3498db;
        color: white;
        border-radius: 50%; /* Снова ровный круг */
        font-size: 12px;
        font-weight: bold;
        margin-right: 10px; /* Отступ до иконки */
        flex-shrink: 0;
    }

    .step-type-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
    }

    /* Настройка контейнера контента шага */
    .step-content {
        display: flex;
        align-items: center;
        width: 100%;
    }

    .step-title-text {
        font-weight: 500;
        color: #2c3e50;
        font-size: 14px;
    }

    .stepTitle {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        font-size: 14px;
    }

    .stepTitle label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    /* Стилизация инпута названия */
    #stepTitle {
        border: 1px solid #ddd;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
        background: #fdfdfd;
        color: #2c3e50;
        font-weight: 500;
    }

    #stepTitle:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    .system-prompt-full {
        height: 170px;
        margin-top: 10px;
    }

    .transition-row {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #f9fafb;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #edf2f7;
    }

    .transition-row input {
        flex: 2; /* Поле для условия */
        padding: 5px;
        font-size: 12px;
    }

    .transition-row select {
        flex: 1; /* Выбор целевого шага */
        padding: 5px;
        font-size: 12px;
    }

    .btn-add-widget-row {
        align-self: flex-start;
        margin-top: 4px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 500;
        background: #218838;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .widget-rows-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .widget-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        background: white;
        padding: 8px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
    }

    .widget-row select {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
    }

    .widget-row .btn-delete-widget-row {
        grid-column: 2;
        grid-row: 1;
        margin-top: 0; /* Обнуляем старый отступ, так как grid сам выровняет */
        align-self: center;
        font-size: 25px;
        padding: 0;
        background: transparent;
        color: #ff7098;
    }

    .widget-row textarea {
        grid-column: 1 / span 2;
        grid-row: 2;
        width: 100%;
        height: 60px;
    }

    .workflow-actions {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    /* Заголовок секции */
    .variables-section h3 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 14px;
        color: #333;
    }

    /* ИЗМЕНЕНО: Форма добавления теперь вмещает 2 инпута и кнопку */
    .variable-add-form {
        display: flex;
        flex-direction: column; /* Элементы формы встают друг под друга */
        gap: 8px;
        margin-bottom: 16px;
    }

    /* Контейнер для группировки двух инпута в одну строку */
    .variable-add-form .form-group-row {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .variable-add-form .form-control {
        flex-grow: 1;
        width: 50%; /* Инпуты делят пространство поровну */
    }

    /* Кнопка добавления (на всю ширину под инпутами для удобства) */
    .variables-editor-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
        max-height: 200px;
        overflow-y: auto;
    }

    /* Строка с парой Ключ-Значение */
    .variable-row {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .variable-row .form-control {
        padding: 6px 10px;
        font-size: 13px;
        font-family: 'Consolas', 'Monaco', monospace;
    }

    /* Кнопка удаления строки */
    .btn-del-var {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.2s;
    }

    .btn-del-var:hover {
        background: #c0392b;
    }

    .btn-add-var {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
        width: 100%;
        transition: background-color 0.15s ease;
    }

    .btn-add-var:hover {
        background-color: #218838;
    }

    /* Список переменных */
    .variables-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        padding-right: 4px;
        max-width: 350px;
    }

    /* Элемент списка */
    .variable-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 8px 6px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        box-sizing: border-box;
        width: 100%; /* Гарантируем, что строка занимает всю ширину */
        border-left: 3px solid #2974df;
    }

    .variable-item:hover {
        background-color: #edf4f9;
    }

    .variable-item-common {
        border-left: 2px solid limegreen;
    }

    .variable-item-common:hover {
        background-color: #dfffd9;
    }

    .variable-item-node {
        border-left: 2px solid #ffd73b;
    }

    .variable-item-node:hover {
        background-color: #fff2d9;
    }

    .variable-item-tool {
        border-left: 2px solid #f488d5;
    }

    .variable-item-tool:hover {
        background-color: #ffd9ea;
    }

    .variable-item-input {
        border-left: 2px solid #26c6da;
    }

    .variable-item-input:hover {
        background-color: #d9f7fb;
    }

    .variable-item.has-default:hover .variable-badge {
        background-color: #dfe3e6;
        color: #333;
    }

    .variable-item.unused-variable {
        border-left-color: #b0b0b0;
        background-color: #f5f5f5;
        opacity: 0.6;
    }

    .variable-item.unused-variable .variable-name {
        color: #3a3535;
    }

    .variable-name {
        margin-right: auto;
        color: #1c4a73;
        cursor: pointer;
        transition: color 0.15s ease;
    }

    .variable-name:hover {
        color: #004494;
    }

    .variable-badge {
        background-color: #eaeaea;
        color: #555;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        margin: 0 4px;
        max-width: 150px; /* Защита от слишком длинных строк */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis; /* Троеточие, если текст не влезает */
        border: 1px solid #dcdcdc;
    }

    .btn-delete-var {
        background: none;
        border: none;
        color: #dc3545;
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
        padding: 0 4px;
        transition: color 0.15s ease;
    }

    .btn-delete-var:hover {
        color: #bd2130;
    }

    /* Аккордеон для переменных */
    .variables-accordion-section {
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        margin-bottom: 0px;
        overflow: hidden;
    }

    .variables-accordion-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f7f7f7;
        padding: 8px 12px;
        font-weight: bold;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        color: #444;
        transition: background-color 0.15s;
    }

    .variables-accordion-header:hover {
        background: #ededed;
    }

    .variables-accordion-header .arrow {
        font-size: 8px;
        transition: transform 0.2s;
    }

    .variables-accordion-section.active .variables-accordion-header .arrow {
        transform: rotate(90deg);
    }

    .variables-accordion-content {
        display: none;
        flex-direction: column;
        gap: 0;
        background: #fdfdfd;
        padding: 0;
        border-top: 1px solid #eee;
    }

    .variables-accordion-section.active .variables-accordion-content {
        display: flex;
    }

    .transitions-editor {
        margin-top: 20px;
        border-top: 1px solid #eee;
        font-size: 15pt;
    }

    .step-return-response {
        border-left: 2px solid #ff001e !important;
    }

    .step-transition-target {
        margin-top: 10px;
        border-top: 2px solid limegreen !important;
    }

</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список (Sidebar) -->
    <div class="agents-sidebar">
        <div class="sidebar-header">
            <button class="btn-create" id="createNewWorkflow">+ Создать workflow</button>
        </div>
        <div class="agent-list" id="workflowList">
            <!-- Заполняется JS -->
        </div>
    </div>

    <!-- Секция формы -->
    <div class="editor-section">
        <form id="workflowForm" novalidate>
            <div class="form-header">
                <h2 id="formTitle">Выберите workflow</h2>
                <button type="submit" class="btn-save">Сохранить workflow</button>
            </div>

            <input type="hidden" id="workflowId">

            <!-- 1. Контейнер ПАРАМЕТРОВ (скрывается при клике на название) -->
            <div id="workflowSettingsView" class="form-layout-grid">
                <div class="settings-column">
                    <div class="form-group">
                        <label>Название workflow</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Технический ID (name)</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>Нода</label><select id="node_id"
                                                                           class="form-control"></select></div>
                        <div class="form-group"><label>Позиция</label><input type="number" id="position"
                                                                             class="form-control"></div>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="description" class="form-control"
                                  style="height: 80px; resize: none;"></textarea>
                    </div>
                </div>
                <div class="prompt-column">
                    <div class="form-group" id="inputVariablesGroup">
                        <label>Входящие переменные</label>
                        <div id="inputVariablesContainer" class="variables-editor-container">
                            <!-- Сюда динамически будут добавляться строки с входящими переменными -->
                        </div>
                        <button type="button" class="btn-add-var" id="addInputVariableBtn">+ Добавить
                            переменную
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. Контейнер ШАГОВ (Две колонки) -->
            <div id="stepsEditorView" class="form-layout-grid" style="display: none;">

                <div class="variables-column">
                    <div class="variables-section">
                        <div class="variables-header">
                            <h3>Переменные</h3>
                            <div class="variable-add-form">
                                <div class="form-group-row">
                                    <input type="text" id="newVariableName" class="form-control"
                                           placeholder="Имя переменной...">
                                    <input type="text" id="newVariableValue" class="form-control"
                                           placeholder="Значение по умолчанию...">
                                </div>
                                <button type="button" class="btn-add-var" id="addVariableBtn">+ Add</button>
                            </div>
                        </div>

                        <!-- Список добавленных переменных -->
                        <div class="variables-list" id="variablesContainer">
                            <!-- Пример элемента списка (будет генерироваться через JS) -->
                            <!--
                            <div class="variable-item">
                                <span class="variable-name">my_var_name</span>
                                <button type="button" class="btn-delete-var" data-name="my_var_name">&times;</button>
                            </div>
                            -->
                        </div>
                    </div>
                </div>

                <!-- Колонки управления шагами -->
                <div class="steps-column">

                    <!-- Блоки 1 и 2: Выбор и Кнопка Добавить -->
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <div style="flex: 1;">
                            <label style="font-size: 10px; color: #999;">Доступные шаги</label>
                            <select id="availableStepsSelect" class="form-control">
                                <option value="">Загрузка шагов...</option>
                            </select>
                        </div>
                        <div style="align-self: flex-end;">
                            <button type="button" class="btn-create" id="addStepToWorkflowBtn"
                                    style="padding: 10px 20px;">+ Add
                            </button>
                        </div>
                    </div>

                    <!-- Блок 3: Список шагов текущей задачи (Drag & Drop) -->
                    <label style="font-size: 10px; color: #999;">Шаги текущего workflow (перетащите для
                        сортировки)</label>
                    <div id="workflowStepsSortable" class="steps-sortable-list">
                        <!-- Сюда JS отрисует шаги -->
                    </div>
                </div>


                <!-- Вторая колонка: Детали (как и было) -->
                <div class="prompt-column" id="stepDetailsView">
                    <!-- Контейнер с контентом (скрыт по умолчанию) -->
                    <div id="stepDetailsContent" style="display: none;">

                        <div class="stepTitle">
                            <label>Описание шага</label>
                            <span id="stepDescriptionFull"></span>
                        </div>

                        <div class="transitions-editor">
                            <label style="font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase;">
                                Логика переходов (Before)
                            </label>

                            <div id="stepTransitionsListBefore"
                                 style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                                <!-- Сюда JS будет рендерить строки условий -->
                            </div>

                            <button type="button" class="btn-create" id="addConditionBtnBefore"
                                    style="margin-top: 10px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 5px 10px; font-size: 12px;">
                                + Добавить условие перехода
                            </button>
                        </div>

                        <!-- НОВЫЙ КОНТЕЙНЕР ДЛЯ КАСТОМНЫХ ПОЛЕЙ ТИПА ШАГА -->
                        <div id="dynamicStepFieldsContainer"
                             style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                            <!-- Сюда JS будет рендерить инпуты/текстареа в зависимости от типа шага -->
                        </div>

                        <!-- Старую textarea скрываем с помощью display: none, чтобы не ломать остальной код сбора данных -->
                        <textarea id="stepTextarea" class="form-control system-prompt-full"
                                  style="display: none;"></textarea>

                        <div class="transitions-editor">
                            <label style="font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase;">
                                Логика переходов (After)
                            </label>

                            <div id="stepTransitionsListAfter"
                                 style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                                <!-- Сюда JS будет рендерить строки условий -->
                            </div>

                            <button type="button" class="btn-create" id="addConditionBtnAfter"
                                    style="margin-top: 10px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 5px 10px; font-size: 12px;">
                                + Добавить условие перехода
                            </button>
                        </div>

                        <div class="stepTitle">
                            <label>Название шага</label>
                            <input type="text" id="stepTitle" required/>
                        </div>
                    </div>

                    <!-- Заглушка (видна, когда шаг не выбран) -->
                    <div id="noStepSelected" style="color: #999; text-align: center; margin-top: 50px;">
                        Выберите шаг из списка слева
                    </div>
                </div>


            </div>

            <div class="editor-footer">
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none;">Удалить</button>
                <button type="submit" class="btn-save">Сохранить workflow</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, putData, postData, deleteData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';

    const workflowListContainer = document.getElementById('workflowList');
    const workflowForm = document.getElementById('workflowForm');
    const deleteBtn = document.getElementById('deleteBtn');
    const addStepBtn = document.getElementById('addStepToWorkflowBtn');

    const WORKFLOW_STEP_CONFIG = {
        'llm_to_json': [ // ID типа "Инструменты"
            {
                key: 'llm_to_json_variable',
                type: 'widget_json_variable',
            },
            {
                key: 'prompt_user',
                label: 'User prompt',
                type: 'textarea',
                placeholder: '',
                value: '%prompt_user%'
            }
        ],
        'tool_invoke': [ // ID типа "Инструменты"
            {
                key: 'tool_invoke',
                type: 'widget_tool_invoke',
            },
        ],
        'return_response_llm': [ // ID типа "Вернуть ответ"
            {
                key: 'prompt_user',
                label: 'User prompt',
                type: 'textarea',
                placeholder: ''
            }
        ],
        'return_response_text': [ // ID типа "Вернуть ответ"
            {
                key: 'prompt_user',
                label: 'User prompt',
                type: 'textarea',
                placeholder: ''
            },
            {
                key: 'continue_workflow',
                label: 'Продолжить workflow',
                type: 'checkbox',
                placeholder: ''
            }
        ],
        'variable_conversion': [ // ID типа "Вернуть ответ"
            {
                key: 'variable_conversion',
                type: 'widget_variable_conversion',
            }
        ]
    };

    let allCurrentStepsData = [];
    let allTargetSteps = [];
    let allWorkflowStepsType = {};
    let allCurrentVariables = {};
    let allAvailableTools = [];
    let allUsedVariables = [];

    /**
     * Инициализация страницы: загрузка задач и нод для селекта
     */
    async function initWorkflowManager() {
        try {
            const [workflowsRes, nodesRes, toolsRes] = await Promise.all([
                getData('/workflow/list'),
                getData('/node/list'),
                getData('/tool/list')
            ]);

            allAvailableTools = toolsRes.result || toolsRes || [];

            // Также загружаем типы шагов для селекта
            await loadAvailableStepTypes();

            const workflows = workflowsRes.result;
            const nodes = nodesRes.result.sort((a, b) => a.position - b.position);

            const nodeSelect = document.getElementById('node_id');
            if (nodeSelect) {
                nodeSelect.innerHTML = '<option value="">Без ноды</option>';
                nodes.forEach(n => {
                    nodeSelect.innerHTML += `<option value="${n.id}">${n.name}</option>`;
                });
            }

            const activeWorkflowLink = workflowListContainer.querySelector('.agent-item.active .workflow-name-link');
            const activeWorkflowLinkId = activeWorkflowLink ? activeWorkflowLink.id : null;

            // Запоминаем текущий режим: если открыта форма настроек workflow,
            // после перерисовки списка нужно остаться на ней, а не переключаться на шаги
            const settingsViewEl = document.getElementById('workflowSettingsView');
            const isSettingsViewOpen = !!activeWorkflowLinkId && settingsViewEl && settingsViewEl.style.display !== 'none';

            renderWorkflowList(workflows, nodes);
            initVariablesHandlers();

            if (activeWorkflowLinkId) {
                const activeWorkflowLink = workflowListContainer.querySelector('#' + activeWorkflowLinkId);
                if (isSettingsViewOpen) {
                    // Остаемся в форме редактирования: кликаем по иконке параметров
                    const editIcon = activeWorkflowLink.closest('.agent-item')?.querySelector('.edit-icon');
                    if (editIcon) {
                        editIcon.click();
                    } else {
                        activeWorkflowLink.click();
                    }
                } else {
                    activeWorkflowLink.click();
                }
            } else {
                const firstWorkflowLink = workflowListContainer.querySelector('.agent-item .workflow-name-link');
                firstWorkflowLink.click();
            }

            if (deleteBtn) {
                deleteBtn.onclick = deleteWorkflow;
            }

        } catch (e) {
            console.error("Ошибка инициализации:", e);
        }
    }

    function renderWorkflowList(workflows, nodes) {
        workflowListContainer.innerHTML = '';

        const workflowsByNode = workflows.reduce((acc, t) => {
            const nid = t.node_id || 'none';
            if (!acc[nid]) acc[nid] = [];
            acc[nid].push(t);
            return acc;
        }, {});

        const renderSection = (nid, name) => {
            const nodeWorkflows = workflowsByNode[nid];
            if (!nodeWorkflows) return;

            const header = document.createElement('div');
            header.className = 'group-header';
            header.textContent = name;
            workflowListContainer.appendChild(header);

            nodeWorkflows.sort((a, b) => a.position - b.position).forEach(workflow => {
                const div = document.createElement('div');
                div.className = 'agent-item';

                div.innerHTML = `
            <span class="workflow-name-link" id="workflow_link_${workflow.id}" style="flex:1;">${workflow.title}</span>
            <div class="workflow-actions">
                <span class="edit-icon" title="Параметры задачи">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </span>
            </div>
        `;

                // Клик по названию — ШАГИ
                div.querySelector('.workflow-name-link').onclick = () => openWorkflowSteps(workflow, div);

                // Клик по иконке — ПАРАМЕТРЫ
                div.querySelector('.edit-icon').onclick = () => openWorkflowSettings(workflow, div);

                workflowListContainer.appendChild(div);
            });
        };
        nodes.forEach(n => renderSection(n.id, n.name));
        renderSection('none', 'Вне нод');
    }

    function renderWorkflowSteps(steps) {
        const container = document.getElementById('workflowStepsSortable');
        if (!container) return;
        container.innerHTML = '';

        const stepsArray = Array.isArray(steps) ? steps : (steps?.result || []);

        stepsArray.sort((a, b) => (a.position || 0) - (b.position || 0)).forEach((step, index) => {
            const div = document.createElement('div');
            div.className = 'step-item-block';
            if (
                allWorkflowStepsType[step.type_id].name === 'return_response_text'
                || allWorkflowStepsType[step.type_id].name === 'return_response_llm'
            ) {
                div.className += ' step-return-response';
            }
            if (allTargetSteps.includes(String(step.id))) {
                div.className += ' step-transition-target';
            }
            div.draggable = true;
            div.dataset.id = step.id;

            // Получаем строку с условиями переходов
            const transitionHtmlBefore = getWorkflowStepConditionsHtml(stepsArray, step, 'Before');
            const transitionHtmlAfter = getWorkflowStepConditionsHtml(stepsArray, step, 'After');

            // Формируем финальный HTML одним блоком
            div.innerHTML = `
            <div class="step-content" style="flex-wrap: wrap;">
                <div style="display: flex; align-items: center; width: 100%;">
                    <span style="color: #ccc; margin-right: 12px; cursor: grab;">☰</span>
                    <span class="step-number-badge">${index + 1}</span>
                    <span class="step-type-icon" style="font-size: 16px; margin-right: 10px;">${step.icon || ''}</span>
                    <span class="step-title-text" style="flex:1;">${step.title}</span>
                    <button type="button" class="btn-delete-step" title="Удалить">&times;</button>
                </div>
                <div class="step-flow-info" style="margin-left: 62px; width: 100%;">
                    ${transitionHtmlBefore}
                    ${transitionHtmlAfter}
                </div>
            </div>
        `;

            const deleteBtn = div.querySelector('.btn-delete-step');
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteStep(step.id, step.title);
            };

            div.addEventListener('dragstart', () => div.classList.add('dragging'));
            div.addEventListener('dragend', () => {
                div.classList.remove('dragging');
                updateStepsPosition();
            });
            div.onclick = () => selectStep(step, div);

            container.appendChild(div);
        });
    }

    function getWorkflowStepConditionsHtml(allSteps, currentStep, type) {
        let transitionInfo = '';
        try {

            let metadata = parseMetadata(currentStep.metadata);

            const transitionKey = 'transitions_' + type.toLowerCase();
            if (metadata[transitionKey] && metadata[transitionKey].length > 0) {
                transitionInfo = metadata[transitionKey].map(tr => {
                    // Ищем целевой шаг по новому ключу step_id
                    const target = allSteps.find(s => String(s.id) === String(tr.step_id));

                    // Формируем красивое название цели
                    const targetName = target ? target.title : '???';

                    // Собираем читаемое условие: если есть переменная, пишем "%var% == value"
                    let conditionText = '';
                    if (tr.variable) {
                        conditionText = '%' + tr.variable + '% ' + (tr.operator || '==') + ' ' + (tr.value || '');
                    } else {
                        // Фолбек на случай, если поле переменной не выбрано
                        conditionText = tr.value || 'Условие';
                    }

                    return '<div style="font-size: 10px; color: #3498db; margin-top: 2px;">' +
                        'if <b>"' + conditionText + '"</b> → ' + targetName +
                        '</div>';
                }).join('');
            }
        } catch (e) {
            console.error("Ошибка парсинга метаданных для превью условий:", e);
        }
        return transitionInfo;
    }

    function parseMetadata(metadataFieldValue) {
        if (!metadataFieldValue) return {};
        if (typeof metadataFieldValue !== 'string') return metadataFieldValue;

        try {
            // Пробуем распарсить напрямую
            return JSON.parse(metadataFieldValue);
        } catch (e) {
            try {
                // Если упало, лечим неэкранированные управляющие символы (переносы строк, табы)
                let fixedStr = metadataFieldValue
                    .replace(/[\n\u000a]/g, '\\n')
                    .replace(/[\r\u000d]/g, '\\r')
                    .replace(/[\t\u0009]/g, '\\t');

                return JSON.parse(fixedStr);
            } catch (innerErr) {
                console.warn("Критический сбой JSON. parse не справился, применен фоллбек {}:", innerErr);
                return {}; // Полный фоллбек, гарантирующий, что интерфейс не упадет
            }
        }
    }

    async function openWorkflowSteps(workflow, element) {
        setActiveItem(element);

        // 1. ПЕРЕКЛЮЧАЕМ ВИДИМОСТЬ (Явно скрываем настройки и показываем шаги)
        document.getElementById('workflowSettingsView').style.display = 'none';
        document.getElementById('stepsEditorView').style.display = 'flex';
        document.getElementById('addStepToWorkflowBtn').style.display = 'block';

        // 2. ЗАПОЛНЯЕМ ДАННЫЕ
        await fillWorkflowForm(workflow);
        await loadWorkflowSteps(workflow.id);

        // 3. ОБНОВЛЯЕМ ЗАГОЛОВОК
        document.getElementById('formTitle').textContent = `Шаги workflow: ${workflow.title}`;
    }

    /**
     * Режим 2: Редактирование параметров задачи (без шагов)
     */
    function openWorkflowSettings(workflow, element) {
        setActiveItem(element);

        // Переключаем видимость блоков
        document.getElementById('workflowSettingsView').style.display = 'flex';
        document.getElementById('stepsEditorView').style.display = 'none';
        document.getElementById('formTitle').textContent = `Редактирование задачи: ${workflow.title}`;

        fillWorkflowForm(workflow);
    }

    // Вспомогательные функции
    function setActiveItem(el) {
        document.querySelectorAll('.agent-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    async function fillWorkflowForm(workflow) {
        document.getElementById('workflowId').value = workflow.id;
        document.getElementById('name').value = workflow.name || '';
        document.getElementById('title').value = workflow.title || '';
        document.getElementById('node_id').value = workflow.node_id || '';
        document.getElementById('position').value = workflow.position || 0;
        document.getElementById('description').value = workflow.description || '';

        if (workflow.id) {
            await loadWorkflowVariables(workflow.id);
        }

        deleteBtn.style.display = 'block';
    }

    /**
     * Загрузка списка шагов (Step) для выбранной задачи
     */
    async function loadWorkflowSteps(workflowId) {
        const container = document.getElementById('workflowStepsSortable');
        if (!container) return;

        try {
            const data = await getData(`/workflow/${workflowId}/steps`);

            // 2. Сохраняем полученные шаги в глобальную переменную
            // Это позволит функции добавления условий видеть актуальный список шагов
            allCurrentStepsData = data.result || [];

            let activeStepId = null;
            let currentStepData = null;
            let currentStepBlock = null;

            const activeStepBlock = document.querySelector('.step-item-block.active');
            if (activeStepBlock) {
                activeStepId = activeStepBlock.dataset.id;
            }

            collectWorkflowTargetSteps()
            extractVariablesFromSteps(allCurrentStepsData);
            renderWorkflowSteps(allCurrentStepsData);

            if (activeStepId) {
                currentStepData = allCurrentStepsData.find(s => String(s.id) === String(activeStepId));
                currentStepBlock = container.querySelector(`.step-item-block[data-id="${activeStepId}"]`);
            }

            const firstStepBlock = container.querySelector('.step-item-block');

            if (currentStepData) {
                selectStep(currentStepData, currentStepBlock);
            } else if (firstStepBlock) {
                const firstStepData = allCurrentStepsData[0];
                selectStep(firstStepData, firstStepBlock);
            } else {
                document.getElementById('stepDetailsContent').style.display = 'none';
                document.getElementById('noStepSelected').style.display = 'block';
            }

            // --- Drag-and-drop блок ---
            container.addEventListener('dragover', e => {
                e.preventDefault();
                const dragging = document.querySelector('.dragging');
                if (!dragging) return;

                const afterElement = getDragAfterElement(container, e.clientY);
                if (afterElement == null) {
                    container.appendChild(dragging);
                } else {
                    container.insertBefore(dragging, afterElement);
                }
            });
        } catch (e) {
            console.error("Ошибка загрузки шагов:", e);
            allCurrentStepsData = [];
        }
    }

    /**
     * Собирает имена всех переменных, используемых в шагах workflow,
     * и сохраняет их в allUsedVariables.
     */
    function extractVariablesFromSteps(steps) {
        const usedVariables = new Set();
        const stepsArray = Array.isArray(steps) ? steps : [];

        // Вхождения по паттерну %varname% в произвольном тексте
        const collectFromText = (text) => {
            if (typeof text !== 'string') return;
            for (const match of text.matchAll(/%([a-zA-Z_][a-zA-Z0-9_]*)%/g)) {
                usedVariables.add(match[1]);
            }
        };

        stepsArray.forEach(step => {
            const metadata = parseMetadata(step.metadata);
            const typeName = allWorkflowStepsType[step.type_id]?.name;

            // return_response_llm / return_response_text / llm_to_json: %varname% в prompt_user
            if (['return_response_llm', 'return_response_text', 'llm_to_json'].includes(typeName)) {
                collectFromText(metadata.prompt_user);
            }

            // llm_to_json: массив объектов с ключом "variable"
            if (typeName === 'llm_to_json' && Array.isArray(metadata.llm_to_json_variable)) {
                metadata.llm_to_json_variable.forEach(item => {
                    if (item?.variable) usedVariables.add(item.variable);
                });
            }

            // tool_invoke: значения inputs_map — имена переменных
            if (typeName === 'tool_invoke') {
                const inputsMap = metadata.inputs_map || metadata.tool_invoke?.inputs_map;
                if (inputsMap && typeof inputsMap === 'object') {
                    Object.values(inputsMap).forEach(value => {
                        if (typeof value === 'string' && value) usedVariables.add(value);
                    });
                }
            }

            // variable_conversion: %varname% в поле "text" каждого объекта
            if (typeName === 'variable_conversion' && Array.isArray(metadata.variable_conversion)) {
                metadata.variable_conversion.forEach(item => collectFromText(item?.text));
            }

            // Переходы (у всех типов шагов): ключ "variable" в условиях
            ['transitions_before', 'transitions_after'].forEach(key => {
                if (Array.isArray(metadata[key])) {
                    metadata[key].forEach(transition => {
                        if (transition?.variable) usedVariables.add(transition.variable);
                    });
                }
            });
        });

        allUsedVariables = Array.from(usedVariables);
        markUnusedWorkflowVariables();
    }

    /**
     * Помечает переменные группы "Переменные workflow", не используемые ни в одном шаге.
     */
    function markUnusedWorkflowVariables() {
        document.querySelectorAll('.variables-accordion-section[data-key="workflow"] .variable-item')
            .forEach(item => {
                item.classList.toggle('unused-variable', !allUsedVariables.includes(item.dataset.name));
            });
    }

    function collectWorkflowTargetSteps() {
        const targetStepsSet = new Set();
        allCurrentStepsData.forEach(step => {
            let metadata = parseMetadata(step.metadata);
            ['transitions_before', 'transitions_after'].forEach(key => {
                if (metadata[key] && Array.isArray(metadata[key])) {
                    metadata[key].forEach(transition => {

                        if (transition.step_id) {
                            targetStepsSet.add(String(transition.step_id));
                        }
                    });
                }
            });
        });

        allTargetSteps = Array.from(targetStepsSet);
    }

    async function loadWorkflowVariables(workflowId) {
        const container = document.getElementById('variablesContainer');
        if (!container) return;

        try {
            // 1. Делаем асинхронный запрос к выделенному эндпоинту переменных
            const data = await getData(`/workflow/${workflowId}/variables`);

            // 2. Сохраняем полученные переменные в глобальные стейты модуля.
            // Это позволит функциям генерации полей и автодополнения видеть актуальный список.
            allCurrentVariables = data.result || data || [];
            window.allCurrentVariables = allCurrentVariables; // Дублируем для генератора динамических полей

            // 3. Отрисовываем переменные в интерфейсе
            renderWorkflowVariables(allCurrentVariables);

            // 4. Отрисовываем входящие переменные в форме настроек workflow
            renderInputVariables();

        } catch (e) {
            console.error("Ошибка загрузки переменных:", e);
            allCurrentVariables = [];
            window.allCurrentVariables = [];
            container.innerHTML = ''; // Очищаем контейнер при ошибке
            renderInputVariables();
        }
    }

    // ===== Входящие переменные (type === 'input') в форме "Редактирование задачи" =====

    function renderInputVariables() {
        const container = document.getElementById('inputVariablesContainer');
        if (!container) return;
        container.innerHTML = '';

        const variablesArray = Array.isArray(allCurrentVariables) ? allCurrentVariables : [];
        variablesArray.filter(v => v.type === 'input').forEach(variable => {
            createInputVariableRow(variable);
        });
    }

    function createInputVariableRow(variable = null) {
        const container = document.getElementById('inputVariablesContainer');
        if (!container) return;

        const row = document.createElement('div');
        row.className = 'variable-row input-variable-row';
        if (variable) {
            row.dataset.id = variable.id;
            // Исходные значения — чтобы при сохранении отправлять PUT только для измененных строк
            row.dataset.originalName = variable.name;
            row.dataset.originalDefault = variable.default ?? '';
        }

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'form-control var-key';
        nameInput.placeholder = 'Имя переменной';
        nameInput.value = variable ? variable.name : '';

        const valInput = document.createElement('input');
        valInput.type = 'text';
        valInput.className = 'form-control var-value';
        valInput.placeholder = 'Значение по умолчанию';
        valInput.value = variable ? (variable.default ?? '') : '';

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-del-var';
        delBtn.title = 'Удалить переменную';
        delBtn.innerHTML = '&times;';
        delBtn.onclick = async () => {
            // Новая (еще не сохраненная) строка — просто убираем из DOM
            if (!variable) {
                row.remove();
                return;
            }

            const workflowId = document.getElementById('workflowId')?.value;
            if (!confirm(`Удалить переменную "${variable.name}"?`)) return;

            try {
                await deleteData(`/workflow/${workflowId}/variable/${variable.id}`);
                showNotification('Переменная успешно удалена', 'success');
                await loadWorkflowVariables(workflowId);
            } catch (err) {
                console.error("Ошибка удаления переменной:", err);
                showNotification(`Ошибка удаления: ${err.message}`, 'error');
            }
        };

        row.append(nameInput, valInput, delBtn);
        container.appendChild(row);
    }

    /**
     * Сохраняет входящие переменные: новые строки (без data-id) создаются через POST
     * с type='input', измененные существующие обновляются через PUT.
     */
    async function saveInputVariables(workflowId) {
        const rows = document.querySelectorAll('#inputVariablesContainer .input-variable-row');

        for (const row of rows) {
            const name = row.querySelector('.var-key').value.trim();
            const value = row.querySelector('.var-value').value.trim();
            const variableId = row.dataset.id;

            if (!name) continue;

            if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(name)) {
                showNotification(`Недопустимое имя переменной: "${name}"`, 'error');
                continue;
            }

            if (variableId) {
                // Существующая переменная: обновляем только если имя или значение изменились
                const isChanged = name !== row.dataset.originalName
                    || value !== (row.dataset.originalDefault || '');

                if (isChanged) {
                    await putData(`/agent_workflow_variable/${variableId}`, {
                        name: name,
                        "default": value === '' ? null : value
                    });
                }
            } else {
                await postData(`/workflow/${workflowId}/variable`, {
                    name: name,
                    "default": value === '' ? null : value,
                    type: 'input'
                });
            }
        }
    }

    async function loadAvailableStepTypes() {
        const select = document.getElementById('availableStepsSelect');
        try {
            const data = await getData('/workflow_step/list');
            select.innerHTML = '';
            data.result.forEach(stepType => {
                const opt = document.createElement('option');
                opt.value = stepType.id;
                opt.textContent = stepType.icon + ' ' + stepType.description;
                select.appendChild(opt);

                allWorkflowStepsType[stepType.id] = stepType
            });
        } catch (e) {
            select.innerHTML = '<option>Ошибка загрузки</option>';
        }
    }

    async function updateStepsPosition() {
        const workflowId = document.getElementById('workflowId').value;
        const items = [...document.querySelectorAll('.step-item-block')];

        const newPositions = items.map((el, index) => ({
            id: el.dataset.id,
            position: index
        }));

        try {
            await putData(`/workflow/${workflowId}/steps/reorder`, {positions: newPositions});

            // Обновляем визуальные номера шагов
            items.forEach((el, idx) => {
                const titleSpan = el.querySelector('span:nth-child(2)');

                // Очищаем старый номер и ставим новый
                const currentText = titleSpan.textContent.includes('. ')
                    ? titleSpan.textContent.split('. ').slice(1).join('. ')
                    : titleSpan.textContent;
                titleSpan.textContent = `${idx}. ${currentText}`;

                const badge = el.querySelector('.step-number-badge');
                if (badge) badge.textContent = idx;
            });
            showNotification('Порядок сохранен', 'success');

        } catch (e) {
            showNotification('Ошибка сохранения порядка', 'error');
        }
    }

    function selectStep(step, element) {
        // 1. Подсветка и активация класса
        document.querySelectorAll('.step-item-block').forEach(el => {
            el.classList.remove('active');
            el.style.background = '#f8f9fa';
            el.style.borderColor = '#ddd';
        });
        element.classList.add('active');
        element.style.background = '#eef6fc';
        element.style.borderColor = '#3498db';

        const detailsContent = document.getElementById('stepDetailsContent');
        const noStepSelected = document.getElementById('noStepSelected');
        if (detailsContent && noStepSelected) {
            noStepSelected.style.display = 'none';
            detailsContent.style.display = 'block';
        }

        let metadata = parseMetadata(step.metadata);

        const stepTitle = document.getElementById('stepTitle');
        if (stepTitle) {
            stepTitle.value = step.title || allWorkflowStepsType[step.type_id].description || '';
        }

        const stepDescriptionFull = document.getElementById('stepDescriptionFull');
        if (stepDescriptionFull) {
            stepDescriptionFull.innerHTML = allWorkflowStepsType[step.type_id].description_full || '';
        }

        // 4. Заполнение Метаданных (сырой текст в textarea)
        const metadataField = document.getElementById('stepTextarea');
        if (metadataField) {
            // Записываем весь объект metadata в виде строки, чтобы не терять кастомные поля
            metadataField.value = typeof step.metadata === 'string' ? step.metadata : JSON.stringify(metadata);
        }

        renderCustomStepFields(step, metadata);

        // 5. Отрисовка переходов
        ['Before', 'After'].forEach(type => {
            renderTransitions(step, allCurrentStepsData, type);
        });

        const stepTransitionsViews = document.querySelectorAll('.transitions-editor');
        if (allWorkflowStepsType[step.type_id].name === 'return_response_llm') {
            stepTransitionsViews.forEach(view => {
                view.style.display = 'none';
            });
        } else {
            stepTransitionsViews.forEach(view => {
                view.style.display = '';
            });
        }
    }

    function renderCustomStepFields(step, metadata) {
        const container = document.getElementById('dynamicStepFieldsContainer');
        if (!container) return;
        container.innerHTML = '';

        let stepType = allWorkflowStepsType[step.type_id];

        // Получаем схему полей для данного типа шага
        const fieldsSchema = WORKFLOW_STEP_CONFIG[stepType.name] || WORKFLOW_STEP_CONFIG['default'];

        fieldsSchema.forEach(field => {
            const fieldWrapper = document.createElement('div');
            fieldWrapper.className = 'form-group';
            fieldWrapper.style = "display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px;";

            if (field.type === 'checkbox') {
                fieldWrapper.style = "display: flex; flex-direction: row;";
            }

            const label = document.createElement('label');
            label.style = "font-size: 12px; font-weight: 600; color: #4a5568;";
            label.textContent = field.label;
            fieldWrapper.appendChild(label);

            // Извлекаем текущее сохраненное значение или берем дефолтное
            const currentValue = metadata[field.key] !== undefined ? metadata[field.key] : (field.default || '');

            let inputElement;

            const saveChanges = (customValue) => {
                let latestMeta = parseMetadata(step.metadata)

                // Записываем значение (для обычных полей берем из инпута, для виджета передаем кастомный JSON)
                const metaKey = field.key;
                if (!metaKey) {
                    return;
                }

                if (customValue !== undefined) {
                    latestMeta[metaKey] = customValue;
                } else if (inputElement) {
                    let value = inputElement.value;
                    if (field.type === 'number') {
                        value = parseFloat(value) || 0;
                    }
                    if (field.type === 'checkbox') {
                        value = inputElement.checked;
                    }
                    if (typeof value === 'string') {
                        value = value.replace(/"/g, '\"');
                    }

                    latestMeta[metaKey] = value;
                }

                // Сохраняем обратно в state шага в виде строки JSON
                step.metadata = JSON.stringify(latestMeta);

                // Дублируем в скрытую текстареа
                const stepTextarea = document.getElementById('stepTextarea');
                if (stepTextarea) {
                    stepTextarea.value = step.metadata;
                }
            };

            // --- НОВЫЙ ТИП: widget_json_variable ---
            if (field.type === 'widget_json_variable' || field.type === 'widget_variable_conversion') {
                const widgetContainer = document.createElement('div');
                widgetContainer.id = `field_${field.key}`;
                widgetContainer.style = "display: flex; flex-direction: column; gap: 8px; background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;";

                const rowsContainer = document.createElement('div');
                rowsContainer.className = 'widget-rows-list';
                widgetContainer.appendChild(rowsContainer);

                // Собираем актуальный массив данных из сохраненного JSON (ожидаем массив объектов)
                let savedRows = [];
                if (currentValue) {
                    try {
                        savedRows = typeof currentValue === 'string' ? JSON.parse(currentValue) : currentValue;
                    } catch (e) {
                        savedRows = [];
                    }
                }
                if (!Array.isArray(savedRows)) savedRows = [];

                // Функция сбора данных со всех строк виджета и записи их в metadata
                const collectWidgetData = () => {
                    const rows = rowsContainer.querySelectorAll('.widget-row');
                    const data = [];
                    rows.forEach(row => {
                        const selectEl = row.querySelector('.widget-select');
                        const txtEl = row.querySelector('.widget-textarea');

                        // Безопасное извлечение значения селекта
                        const variableName = selectEl ? selectEl.value : '';
                        const textValue = txtEl ? txtEl.value : '';

                        // Добавляем в массив только если выбрана переменная
                        data.push({
                            variable: variableName,
                            text: textValue
                        });
                    });
                    saveChanges(data); // Сохраняем массив в metadata
                };

                // Функция создания ОДНОЙ интерактивной строки виджета
                const createWidgetRow = (initialVariable = '', initialText = '') => {
                    const row = document.createElement('div');
                    row.className = 'widget-row';

                    // 1. Создаем селект с переменными, сгруппированными как в #variablesContainer
                    const select = document.createElement('select');
                    select.className = 'form-control widget-select';
                    select.style = "flex: 1; padding: 5px; font-size: 12px;";
                    fillVariablesSelectOptions(select, initialVariable, 'Выбрать...');

                    // 2. Создаем текстовое поле textarea
                    const txt = document.createElement('textarea');
                    txt.className = 'form-control widget-textarea';
                    txt.placeholder = 'Введите текст...';
                    txt.style = "flex: 2; resize: vertical; padding: 5px; font-size: 12px;";
                    txt.value = initialText;

                    // 3. Кнопка удаления конкретной строки
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete-widget-row';
                    deleteBtn.type = 'button';
                    deleteBtn.innerHTML = '&times;';

                    deleteBtn.onclick = () => {
                        row.remove();
                        collectWidgetData();
                    };

                    // Навешиваем живое автосохранение на изменение полей
                    select.onchange = collectWidgetData;
                    txt.oninput = collectWidgetData;

                    row.appendChild(select);
                    row.appendChild(deleteBtn);
                    row.appendChild(txt);

                    rowsContainer.appendChild(row);
                };

                // Отрисовываем ранее сохраненные строки (если они есть)
                if (savedRows.length > 0) {
                    savedRows.forEach(rowData => {
                        createWidgetRow(rowData.variable, rowData.text);
                    });
                } else {
                    createWidgetRow(); // Если данных нет, создаем одну пустую строку для удобства
                }

                const actionsContainer = document.createElement('div');
                actionsContainer.className = 'widget-actions-row';
                actionsContainer.style = "display: flex; gap: 8px; align-items: center; margin-top: 8px;";

                // 4. Кнопка "+ Add" для добавления новой чистой строки внизу виджета
                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'btn-add-widget-row';
                addBtn.textContent = '+ Add';

                addBtn.onclick = () => {
                    createWidgetRow(); // Создает пустую строку
                    collectWidgetData(); // Обновляет JSON-структуру в метаданных
                };

                actionsContainer.appendChild(addBtn);

                if (field.type === 'widget_json_variable') {
                    const refreshPromptBtn = document.createElement('button');
                    refreshPromptBtn.type = 'button';
                    refreshPromptBtn.className = 'btn-refresh-prompt';
                    refreshPromptBtn.textContent = '+ Обновить Prompt';
                    refreshPromptBtn.style = "align-self: flex-start; margin-top: 4px; margin-left: 8px; padding: 4px 12px; font-size: 12px; font-weight: 500; background: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer;";

                    refreshPromptBtn.onclick = () => {
                        const targetTextarea = document.getElementById('field_prompt_user') || document.querySelector('[id$="prompt"]');
                        if (!targetTextarea) {
                            showNotification('Целевое поле промпта не найдено на форме', 'error');
                            return;
                        }

                        const rows = rowsContainer.querySelectorAll('.widget-row');
                        let descriptionJsonSchema = "";
                        let exampleJsonSchema = {};

                        rows.forEach(row => {
                            const selectEl = row.querySelector('.widget-select');
                            const txtEl = row.querySelector('.widget-textarea');

                            if (selectEl && selectEl.value) {
                                // Читаем значение напрямую, убирая возможные случайные пробелы
                                let variableName = selectEl.value.trim();
                                let textValue = txtEl ? txtEl.value.trim() : '';

                                if (variableName) {
                                    descriptionJsonSchema += `- "${variableName}": ${textValue || 'Without description'}\n`;
                                    exampleJsonSchema[variableName] = textValue || "value";
                                }
                            }
                        });

                        if (!descriptionJsonSchema) {
                            showNotification('Нет заполненных переменных для генерации промпта', 'warning');
                            return;
                        }

                        // 3. Формируем новый текст инструкции
                        const systemInstructions = "Please return your response in JSON format. " +
                            "The JSON response must contain follow keys: \n" + descriptionJsonSchema + "\n" +
                            "Example of JSON response:\n" + JSON.stringify(exampleJsonSchema, null, 2);

                        // Маркер-разделитель для безопасного удаления старой схемы
                        const delimiter = "\n\n=== Important information about final response ===";
                        let currentPrompt = targetTextarea.value;

                        // 4. ПРОВЕРКА И ОЧИСТКА:
                        // Если в поле уже есть маркер ИЛИ старый текст инструкции — отсекаем его
                        if (currentPrompt.includes(delimiter)) {
                            // Разделяем строку по маркеру и берем только первую часть (текст пользователя)
                            currentPrompt = currentPrompt.split(delimiter)[0].trim();
                        } else if (currentPrompt.includes("Please return your response in JSON format.")) {
                            // Альтернативный фоллбек: если маркера еще нет, но есть старый текст, отрезаем всё, что идет до него
                            currentPrompt = currentPrompt.split("Please return your response in JSON format.")[0].trim();
                        }

                        // 5. ВСТАВКА ОБНОВЛЕННОГО ТЕКСТА
                        // Если у пользователя был свой текст, добавляем отступ, если поле было пустым — вставляем сразу
                        const separator = currentPrompt ? "\n\n" : "";
                        targetTextarea.value = currentPrompt + separator + "=== Important information about final response ===\n" + systemInstructions;

                        // 6. Триггерим событие сохранения для обновления metadata в стейте шага
                        targetTextarea.dispatchEvent(new Event('input'));

                        showNotification('Промпт успешно обновлен', 'success');
                    };

                    actionsContainer.appendChild(refreshPromptBtn);
                }

                widgetContainer.appendChild(actionsContainer);

                fieldWrapper.appendChild(widgetContainer);

            } else if (field.type === 'widget_tool_invoke') {
                const toolContainer = document.createElement('div');
                toolContainer.id = `field_${field.key}`;
                toolContainer.style = "display: flex; flex-direction: column; gap: 12px; background: #f8fafc; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px;";

                // 1. Селект выбора самого инструмента
                const selectElement = document.createElement('select');
                selectElement.className = 'form-control tool-select';
                selectElement.style = "width: 100%; padding: 6px; font-size: 13px; height: 36px; font-weight: 500;";
                selectElement.innerHTML = '<option value="">-- Выберите инструмент --</option>';

                // 2. Блок описания
                const descContainer = document.createElement('div');
                descContainer.className = 'tool-desc-text';
                descContainer.style = "font-size: 11px; color: #64748b; font-style: italic; display: none; background: #fff; padding: 6px 10px; border: 1px dashed #cbd5e0; border-radius: 4px;";

                // 3. Блок интерактивного маппинга аргументов
                const mappingContainer = document.createElement('div');
                mappingContainer.className = 'tool-mapping-block';
                mappingContainer.style = "display: flex; flex-direction: column; gap: 10px; margin-top: 5px;";

                // Группировка инструментов по optgroup
                const groups = {};
                allAvailableTools.forEach(t => {
                    const groupName = t.group_name || t.group_id || 'Без группы';
                    if (!groups[groupName]) groups[groupName] = [];
                    groups[groupName].push(t);
                });

                Object.keys(groups).forEach(groupName => {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = groupName;
                    groups[groupName].forEach(t => {
                        const option = document.createElement('option');

                        // ВАЖНО: Записываем имя инструмента в качестве value
                        option.value = t.name;
                        option.textContent = t.name;

                        if (currentValue && currentValue.tool_name === t.name) {
                            option.selected = true;
                        }
                        optgroup.appendChild(option);
                    });
                    selectElement.appendChild(optgroup);
                });

                // Функция сборки и сохранения всего стейта виджета
                const collectToolWidgetData = () => {
                    const selectedName = selectElement.value; // Теперь тут лежит имя инструмента
                    const inputsMap = {};

                    // Собираем Inputs
                    mappingContainer.querySelectorAll('.input-map-row').forEach(row => {
                        const varSel = row.querySelector('.map-var-select');
                        const argSel = row.querySelector('.map-arg-select');
                        if (argSel && argSel.value && varSel && varSel.value) {
                            inputsMap[argSel.value] = varSel.value;
                        }
                    });

                    // Сохраняем структуру с tool_name
                    saveChanges({
                        tool_name: selectedName || null,
                        inputs_map: inputsMap,
                        outputs_map: {}
                    });
                };

                // Вспомогательный хелпер генерации селекта со списком глобальных переменных {{var}}
                // Переменные сгруппированы через optgroup так же, как в списке #variablesContainer
                const createVariablesSelect = (selectedVal = '') => {
                    const sel = document.createElement('select');
                    sel.className = 'form-control map-var-select';
                    sel.style = "flex: 1; padding: 4px; font-size: 12px; height: 32px;";
                    fillVariablesSelectOptions(sel, selectedVal);
                    sel.onchange = collectToolWidgetData;
                    return sel;
                };

                // Функция рендеринга интерактивных связей аргументов
                const renderToolDetails = (toolName) => {
                    mappingContainer.innerHTML = '';
                    descContainer.innerHTML = '';
                    descContainer.style.display = 'none';
                    if (!toolName) return;

                    // ВАЖНО: Ищем инструмент в массиве по его названию (name)
                    const selectedTool = allAvailableTools.find(t => String(t.name) === String(toolName));
                    if (!selectedTool) return;

                    // Отрисовка описания
                    if (selectedTool.description) {
                        descContainer.textContent = 'Описание: ' + selectedTool.description;
                        descContainer.style.display = 'block';
                    }

                    // Парсинг аргументов из базы
                    let argsObj = parseMetadata(selectedTool.args);

                    if (!argsObj) return;

                    // 1. Извлекаем входящие параметры строго по вашей структуре: args.input
                    const inputs = argsObj.input || {};
                    const inputKeys = Object.keys(inputs);

                    // 2. Извлекаем выходящие параметры инструмента
                    const outputKeys = getToolOutputKeys(toolName);

                    // --- РЕНДЕРИНГ ВХОДЯЩИХ (Input) ---
                    if (inputKeys.length > 0) {
                        const title = document.createElement('div');
                        title.style = "font-size: 11px; font-weight: bold; color: #4a5568; margin-top: 5px;";
                        title.textContent = "Входящие параметры (Input Mapping):";
                        mappingContainer.appendChild(title);

                        inputKeys.forEach(argName => {
                            const row = document.createElement('div');
                            row.className = 'input-map-row';
                            row.style = "display: flex; align-items: center; gap: 8px; background: #fff; padding: 6px; border: 1px solid #e2e8f0; border-radius: 4px;";

                            // Левый селект: переменные
                            const savedVar = (currentValue && currentValue.inputs_map) ? currentValue.inputs_map[argName] : '';
                            const varSelect = createVariablesSelect(savedVar);

                            // Стрелочка разделитель
                            const arrow = document.createElement('span');
                            arrow.innerHTML = '➔';
                            arrow.style = "color: #a0aec0; font-size: 12px;";

                            // Правый селект: фиксированный аргумент (чистая конкатенация строк во избежание конфликта с Jinja2)
                            const argSelect = document.createElement('select');
                            argSelect.className = 'form-control map-arg-select';
                            argSelect.style = "flex: 1; padding: 4px; font-size: 12px; height: 32px; background: #edf2f7; pointer-events: none;";
                            argSelect.innerHTML = '<option value="' + argName + '" selected>' + argName + '</option>';

                            row.appendChild(varSelect);
                            row.appendChild(arrow);
                            row.appendChild(argSelect);
                            mappingContainer.appendChild(row);
                        });
                    }

                    // --- ДЕЛИМИТЕР (Разделительная линия) ---
                    if (inputKeys.length > 0 && outputKeys.length > 0) {
                        const hr = document.createElement('div');
                        hr.style = "border-top: 1px solid #e2e8f0; margin: 8px 0;";
                        mappingContainer.appendChild(hr);
                    }

                    // --- РЕНДЕРИНГ ВЫХОДЯЩИХ (Output) ---
                    if (outputKeys.length > 0) {
                        const title = document.createElement('div');
                        title.style = "font-size: 11px; font-weight: bold; color: #4a5568;";
                        title.textContent = "Выходящие параметры (Output Mapping):";
                        mappingContainer.appendChild(title);

                        outputKeys.forEach(argName => {
                            const row = document.createElement('div');
                            row.className = 'output-map-row';
                            row.style = "display: flex; align-items: center; gap: 8px; background: #fff; padding: 6px; border: 1px solid #e2e8f0; border-radius: 4px;";

                            // Левая часть: текстовое название выходного ключа инструмента
                            const argText = document.createElement('span');
                            argText.style = "flex: 1; padding: 4px; font-size: 12px; color: #ea3d3d; font-weight: bold;";
                            argText.textContent = argName;

                            // Скрытый инпут для сбора ключа (argSel.value)
                            const argHidden = document.createElement('input');
                            argHidden.type = 'hidden';
                            argHidden.className = 'map-arg-select';
                            argHidden.value = argName;

                            // Стрелочка разделитель
                            const arrow = document.createElement('span');
                            arrow.innerHTML = '➔';
                            arrow.style = "color: #a0aec0; font-size: 12px;";

                            // Правая часть: переменная, куда записывается результат (в стиле variable-name с копированием)
                            const varSpanContainer = document.createElement('div');
                            varSpanContainer.style = "flex: 1; display: flex; align-items: center; padding: 4px;font-size: 11px;";

                            const varSpan = document.createElement('span');
                            varSpan.className = 'variable-name';
                            varSpan.style.marginRight = '0';
                            varSpan.title = 'Нажмите, чтобы скопировать';
                            const varText = `%${toolName}_result_${argName}%`;
                            varSpan.textContent = varText;

                            varSpan.onclick = async () => {
                                try {
                                    await navigator.clipboard.writeText(varText);
                                    showNotification(`Переменная ${varText} скопирована в буфер`, 'success');
                                } catch (err) {
                                    showNotification('Не удалось скопировать переменную', 'error');
                                }
