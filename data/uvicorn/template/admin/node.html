{% extends "base.html" %}

{% block title %}Ноды{% endblock %}

{% block head %}
<style>
    /* 1. Базовая компоновка (Идентично Агентам) */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    /* 2. Сайдбар Нод */
    .nodes-sidebar {
        width: 260px;
        background: #fafafa;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    .node-list {
        flex: 1;
        overflow-y: auto;
        min-width: 300px;
    }

    /* Элементы списка нод */
    .node-item {
        padding: 10px 15px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 14px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .node-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .node-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
        font-weight: 600;
    }

    .node-item.dragging {
        opacity: 0.4;
    }

    /* Ручка перетаскивания для drag-and-drop сортировки */
    .node-item .drag-handle {
        color: #c0c8ce;
        cursor: grab;
        font-size: 12px;
        flex-shrink: 0;
        user-select: none;
        margin-right: 8px;
    }

    .node-item:hover .drag-handle {
        color: #7f8c8d;
    }

    /* 3. Основная секция формы */
    .editor-section {
        flex: 1;
        padding: 20px 40px;
        overflow-y: auto;
    }

    .form-header {
        margin-bottom: 10px;
        border-bottom: 2px solid #f4f4f9;
        padding-bottom: 15px;
    }

    .form-header h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 20px;
    }

    /* 4. Двухколоночный макет (Сохраняем структуру для единообразия) */
    .form-layout-grid {
        display: flex;
        gap: 30px;
        align-items: stretch;
        min-height: 450px;
    }

    .settings-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* Правую колонку оставляем для симметрии или доп. инфо */
    .info-column {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        background: #fcfcfc;
        border-radius: 8px;
        padding: 20px;
        border: 1px dashed #e0e0e0;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    .form-group-name {
        min-width: 250px;
    }

    .form-group-info {
        font-size: 13px;
        color: #353831;
    }

    /* 5. Элементы управления */
    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
    }

    /* 6. Кнопки и Футер */
    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-save:hover {
        background: #2980b9;
    }

    .btn-create {
        background: #27ae60;
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-delete {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 11px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
        margin-right: auto; /* Прижмет кнопку к левому краю футера */
    }

    .btn-delete:hover {
        background: #e74c3c;
        color: white;
    }

    #statusLabel {
        font-size: 13px;
        color: #27ae60;
    }

    #llm_list_sortable {
        min-height: 198px;
        height: 350px;
        overflow-y: auto;
        padding: 5px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        background: #fff;
        box-sizing: border-box;
    }
</style>

{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список Нод (Левая колонка) -->
    <div class="agents-sidebar">
        <div class="sidebar-header">
            <button class="btn-create" id="createNewNode">+ Создать ноду</button>
        </div>
        <div class="node-list" id="nodeList">
            <!-- Сюда JS будет рендерить список нод -->
        </div>
    </div>

    <!-- Форма Ноды (Правая колонка) -->
    <div class="editor-section">
        <div class="form-header">
            <h2 id="formTitle">Выберите ноду</h2>
        </div>

        <form id="nodeForm">
            <input type="hidden" id="nodeId">

            <div class="form-layout-grid">
                <!-- Основные настройки -->
                <div class="settings-column">
                    <div class="form-group form-group-name">
                        <label>Название ноды</label>
                        <input type="text" id="name" class="form-control" required
                               placeholder="Напр: Workflow Engine">
                    </div>
                    <div class="form-group form-group-name">
                        <label>Файл миграции (для экспорта подпроекта)</label>
                        <input type="text" id="migrationFile" class="form-control"
                               placeholder="Напр: migrations/0004.sql">
                    </div>
                </div>

                <!-- Модели LLM этой ноды -->
                <div class="prompt-column" style="flex: 1;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Модели LLM (отметьте и перетащите для сортировки)</label>
                        <div id="llm_list_sortable">
                            <!-- Items will be dynamically generated here -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="editor-footer">
                <span id="statusLabel"></span>
                <!-- Кнопка удаления -->
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none;">
                    Удалить ноду
                </button>
                <button type="submit" class="btn-save" id="saveBtn">Сохранить ноду</button>
            </div>
        </form>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, putData, postData, deleteData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';

    const nodeListContainer = document.getElementById('nodeList');
    const saveBtn = document.getElementById('saveBtn');
    const nodeForm = document.getElementById('nodeForm');
    const createNewNodeBtn = document.getElementById('createNewNode');
    const deleteBtn = document.getElementById('deleteBtn');

    function makeLlmListDraggable(container) {
        let dragSrcEl = null;

        container.addEventListener('dragstart', function (e) {
            const item = e.target.closest('.llm-sortable-item');
            if (!item) return;
            dragSrcEl = item;
            e.dataTransfer.effectAllowed = 'move';
            item.style.opacity = '0.4';
        });

        container.addEventListener('dragover', function (e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        });

        container.addEventListener('dragenter', function (e) {
            const item = e.target.closest('.llm-sortable-item');
            if (item && item !== dragSrcEl) {
                item.style.border = '1px dashed #4299e1';
            }
        });

        container.addEventListener('dragleave', function (e) {
            const item = e.target.closest('.llm-sortable-item');
            if (item) {
                item.style.border = '1px solid #e2e8f0';
            }
        });

        container.addEventListener('drop', function (e) {
            e.stopPropagation();
            e.preventDefault();
            const targetItem = e.target.closest('.llm-sortable-item');
            if (targetItem && dragSrcEl && dragSrcEl !== targetItem) {
                const rect = targetItem.getBoundingClientRect();
                const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                container.insertBefore(dragSrcEl, next ? targetItem.nextSibling : targetItem);
            }
            return false;
        });

        container.addEventListener('dragend', function (e) {
            const item = e.target.closest('.llm-sortable-item');
            if (item) {
                item.style.opacity = '1';
            }
            container.querySelectorAll('.llm-sortable-item').forEach(el => {
                el.style.border = '1px solid #e2e8f0';
            });
        });
    }

    /**
     * Инициализация менеджера: загрузка списка нод
     */
    async function initNodesManager() {
        if (!nodeListContainer) return;

        try {
            const [nodesRes, llmRes] = await Promise.all([
                getData('/node/list'),
                getData('/llm/list'),
            ]);
            const nodes = nodesRes.result;

            // Сортируем ноды по полю position
            nodes.sort((a, b) => (a.position || 0) - (b.position || 0));

            const sortableContainer = document.getElementById('llm_list_sortable');
            sortableContainer.innerHTML = '';
            llmRes.result.forEach(g => {
                const div = document.createElement('div');
                div.className = 'llm-sortable-item';
                div.setAttribute('draggable', 'true');
                div.setAttribute('data-id', g.id);
                div.style.cssText = "display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; margin-bottom: 4px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 4px; cursor: move; user-select: none;";

                div.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" class="llm-checkbox" style="cursor: pointer;">
                        <span style="font-size: 13px; color: #2d3748;">${g.name}</span>
                    </div>
                    <span style="font-size: 14px; color: #a0aec0; cursor: grab;">☰</span>
                `;
                sortableContainer.appendChild(div);
            });
            makeLlmListDraggable(sortableContainer);

            renderNodeList(nodes);
        } catch (e) {
            console.error("Ошибка инициализации нод:", e);
        }
    }

    /**
     * Отрисовка списка в левой колонке
     */
    function renderNodeList(nodes) {
        nodeListContainer.innerHTML = '';

        if (nodes.length === 0) {
            nodeListContainer.innerHTML = '<div style="padding:20px; color:#999; font-size:13px;">Нет созданных нод</div>';
            return;
        }

        nodes.forEach(node => {
            const div = document.createElement('div');
            div.className = 'node-item';
            div.draggable = true;
            div.dataset.id = node.id;

            div.innerHTML = `
                <span class="drag-handle" title="Перетащите для изменения порядка">⠿</span>
                <span style="flex: 1;">${node.name}</span>
            `;

            div.onclick = () => selectNodeForEdit(node.id, div);
            div.addEventListener('dragstart', onDragStart);
            div.addEventListener('dragover', onDragOver);
            div.addEventListener('dragend', onDragEnd);
            nodeListContainer.appendChild(div);
        });

        // Восстанавливаем ранее выбранную ноду из sessionStorage (переживает обновление
        // страницы), иначе - первый пункт списка
        const savedNodeId = sessionStorage.getItem('node_page_selected_id');
        const savedElement = savedNodeId
            ? Array.from(nodeListContainer.querySelectorAll('.node-item')).find(el => el.dataset.id === savedNodeId)
            : null;

        if (savedNodeId && savedElement) {
            selectNodeForEdit(savedNodeId, savedElement);
            return;
        }

        const firstNode = nodes[0];
        const firstElement = nodeListContainer.querySelector('.node-item');
        if (firstNode && firstElement) {
            selectNodeForEdit(firstNode.id, firstElement);
        }
    }

    // Drag-and-drop: перестановка нод, порядок сохраняется в position
    let draggedItem = null;

    function onDragStart(e) {
        draggedItem = e.currentTarget;
        draggedItem.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    }

    function onDragOver(e) {
        const target = e.currentTarget;
        if (!draggedItem || draggedItem === target) return;
        e.preventDefault();
        const rect = target.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        nodeListContainer.insertBefore(draggedItem, after ? target.nextSibling : target);
    }

    async function onDragEnd() {
        if (!draggedItem) return;
        draggedItem.classList.remove('dragging');
        draggedItem = null;

        // Новый порядок по DOM -> сохраняем индексы в position
        const items = Array.from(nodeListContainer.querySelectorAll('.node-item'));
        try {
            await Promise.all(items.map((el, index) =>
                putData(`/node/${el.dataset.id}`, {position: index})
            ));
            showNotification('Порядок нод сохранён', 'success');
        } catch (e) {
            console.error("Ошибка сохранения порядка:", e);
            showNotification(`Ошибка сохранения порядка: ${e.message}`, 'error');
        }
    }

    /**
     * Загрузка данных конкретной ноды в форму
     */
    async function selectNodeForEdit(nodeId, element) {
        // Подсветка активного элемента
        document.querySelectorAll('.node-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        // Запоминаем выбор, чтобы пережить обновление страницы
        sessionStorage.setItem('node_page_selected_id', String(nodeId));

        try {
            const data = await getData(`/node/${nodeId}`);
            const node = data.result;

            if (!node) return;

            // Заполнение полей формы
            document.getElementById('nodeId').value = node.id;
            document.getElementById('name').value = node.name;
            document.getElementById('migrationFile').value = node.migration_file || '';

            // Отметить/переставить LLM ноды в сохранённом порядке
            const nodeLlmIds = node.llm_ids || [];
            const sortableContainer = document.getElementById('llm_list_sortable');
            if (sortableContainer) {
                const items = Array.from(sortableContainer.querySelectorAll('.llm-sortable-item'));

                items.forEach(item => {
                    const chk = item.querySelector('.llm-checkbox');
                    const lid = parseInt(item.getAttribute('data-id'), 10);
                    if (chk) chk.checked = nodeLlmIds.includes(lid);
                });

                const selectedItemsMap = {};
                const unselectedItems = [];
                items.forEach(item => {
                    const lid = parseInt(item.getAttribute('data-id'), 10);
                    if (nodeLlmIds.includes(lid)) {
                        selectedItemsMap[lid] = item;
                    } else {
                        unselectedItems.push(item);
                    }
                });

                sortableContainer.innerHTML = '';
                nodeLlmIds.forEach(lid => {
                    if (selectedItemsMap[lid]) sortableContainer.appendChild(selectedItemsMap[lid]);
                });
                unselectedItems.forEach(item => sortableContainer.appendChild(item));
            }

            document.getElementById('formTitle').textContent = `Редактирование ноды: ${node.name}`;
            if (saveBtn) saveBtn.disabled = false;

            if (deleteBtn) deleteBtn.style.display = 'block';
        } catch (e) {
            console.error("Ошибка при получении данных ноды:", e);
            showNotification('Не удалось загрузить данные ноды', 'error');
        }
    }

    /**
     * Очистка формы для создания новой ноды
     */
    function resetFormForCreate() {
        document.querySelectorAll('.node-item').forEach(el => el.classList.remove('active'));
        nodeForm.reset();
        document.getElementById('nodeId').value = '';
        document.getElementById('formTitle').textContent = 'Создание новой ноды';

        const sortableContainer = document.getElementById('llm_list_sortable');
        if (sortableContainer) {
            sortableContainer.querySelectorAll('.llm-checkbox').forEach(chk => { chk.checked = false; });
        }

        if (saveBtn) saveBtn.disabled = false;
        if (deleteBtn) deleteBtn.style.display = 'none';
        sessionStorage.removeItem('node_page_selected_id');
    }

    /**
     * Сохранение (Создание или Обновление)
     */
    async function saveNodeConfig(e) {
        if (e) e.preventDefault();

        const selectedLlmIds = [];
        const sortableContainer = document.getElementById('llm_list_sortable');
        if (sortableContainer) {
            sortableContainer.querySelectorAll('.llm-sortable-item').forEach(item => {
                const chk = item.querySelector('.llm-checkbox');
                if (chk && chk.checked) {
                    selectedLlmIds.push(parseInt(item.getAttribute('data-id'), 10));
                }
            });
        }

        const id = document.getElementById('nodeId').value;
        const payload = {
            name: document.getElementById('name').value,
            migration_file: document.getElementById('migrationFile').value.trim() || null,
            llm_ids: selectedLlmIds
        };

        // Новая нода добавляется в конец списка
        if (!id) {
            payload.position = nodeListContainer.querySelectorAll('.node-item').length;
        }

        if (saveBtn) saveBtn.disabled = true;

        try {
            if (id) {
                await putData(`/node/${id}`, payload);
                showNotification(`Нода "${payload.name}" обновлена`, 'success');
            } else {
                await postData('/node', payload);
                showNotification(`Нода "${payload.name}" создана`, 'success');
            }

            // Перезагружаем список
            await initNodesManager();

            // Если создавали новую — форма очистится, если редактировали — данные останутся
            if (!id) resetFormForCreate();

        } catch (e) {
            console.error("Ошибка сохранения ноды:", e);
            showNotification(`Ошибка: ${e.message}`, 'error');
        } finally {
            if (saveBtn) saveBtn.disabled = false;
        }
    }

    async function deleteNode() {
        const id = document.getElementById('nodeId').value;
        const name = document.getElementById('name').value;

        if (!id) return;

        if (confirm(`Вы уверены, что хотите удалить ноду "${name}"? Все агенты этой ноды останутся без привязки.`)) {
            try {
                await deleteData(`/node/${id}`);
                showNotification(`Нода "${name}" удалена`, 'success');

                resetFormForCreate();
                await initNodesManager();
            } catch (e) {
                console.error("Ошибка удаления:", e);
                showNotification(`Ошибка при удалении: ${e.message}`, 'error');
            }
        }
    }

    // Слушатели событий
    document.addEventListener('DOMContentLoaded', () => {
        // Инициализация списка
        initNodesManager();

        // Обработка отправки формы
        if (nodeForm) {
            nodeForm.addEventListener('submit', saveNodeConfig);
        }

        // Кнопка "Создать ноду"
        if (createNewNodeBtn) {
            createNewNodeBtn.addEventListener('click', resetFormForCreate);
        }

        if (deleteBtn) {
            deleteBtn.addEventListener('click', deleteNode);
        }
    });
</script>
{% endblock %}
