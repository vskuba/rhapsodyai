{% extends "base.html" %}

{% block title %}Переменные Workflow{% endblock %}

{% block head %}
<style>
    /* Базовая компоновка */
    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    /* Сайдбар */
    .agents-sidebar {
        width: 260px;
        background: #fafafa;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto;
    }

    .group-header {
        padding: 6px 10px 5px;
        font-size: 11px;
        color: #df983d;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .agent-item {
        padding: 6px 10px;
        margin: 2px 10px;
        cursor: pointer;
        font-size: 14px;
        color: #2c3e50;
        border-radius: 6px;
        transition: all 0.2s;
        border-left: 3px solid transparent;
    }

    .agent-item:hover {
        background: #f1f4f6;
        color: #3498db;
    }

    .agent-item.active {
        background: #eef6fc;
        color: #3498db;
        border-left-color: #3498db;
    }

    /* Форма */
    .editor-section {
        flex: 1;
        padding: 20px 40px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .form-header {
        margin-bottom: 15px;
        border-bottom: 2px solid #f4f4f9;
        padding-bottom: 15px;
    }

    #dataForm {
        flex: 1;
        display: none;
        flex-direction: column;
    }

    /* Дефолтный текст (виден, пока переменная не выбрана) */
    .default-text {
        flex: 1;
        padding: 10px 0;
        font-size: 15px;
        line-height: 1.6;
        color: #2c3e50;
    }

    .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 15px;
    }

    .form-group label {
        font-size: 12px;
        color: #7f8c8d;
        font-weight: bold;
        text-transform: uppercase;
    }

    /* Список переменных-подсказок под textarea */
    .hint-list {
        font-size: 13px;
        line-height: 1.6;
        color: #7f8c8d;
    }

    .hint-list span{
        color: #1a202c;
    }

    .hint-list:empty {
        display: none;
    }

    .form-control {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        width: 100%;
        box-sizing: border-box;
    }

    /* Кнопки и Футер */
    .editor-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
    }

    .btn-save {
        background: #3498db;
        color: white;
        border: none;
        padding: 12px 40px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="editor-container">

    <!-- Список -->
    <div class="agents-sidebar">
        <div class="agent-list" id="itemList"></div>
    </div>

    <!-- Форма -->
    <div class="editor-section">
        <div class="form-header" style="display: flex; align-items: center; justify-content: space-between; gap: 15px;">
            <h2 id="formTitle">Выберите переменную</h2>
            <div id="langSwitcherContainer"></div>
        </div>

        <!-- Дефолтный текст: показывается, пока не выбрана переменная -->
        <div class="default-text" id="defaultText">
            Выберите переменную слева в меню, чтобы отредактировать ее.
        </div>

        <form id="dataForm">
            <input type="hidden" id="id">

            <div class="form-group">
                <label>Значение</label>
                <textarea id="default" class="form-control" style="flex: 1;"></textarea>
                <!-- Переменные-подсказки: proxy-переменные той же ноды -->
                <div class="hint-list" id="hintList"></div>
            </div>

            <div class="editor-footer">
                <button type="submit" class="btn-save" id="saveBtn">Сохранить переменную</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, putData} from '/static/js/api.js';
    import {showNotification} from '/static/js/notification.js';
    import {langSwitcherCreate, nodeLanguagesGet} from '/static/js/lang_switcher.js';

    const itemList = document.getElementById('itemList');
    const dataForm = document.getElementById('dataForm');

    // Переключатель языков: переводимое поле — «Значение»; значение может быть
    // строкой или словарем переводов {"ru": "...", "en": "..."}
    const langSwitcher = langSwitcherCreate(document.getElementById('langSwitcherContainer'));
    langSwitcher.fieldBind(document.getElementById('default'));

    // Под textarea выводим переменные-подсказки, которые возвращает сервер
    async function renderHints(variableId) {
        const hintList = document.getElementById('hintList');
        hintList.innerHTML = '';
        if (!variableId) return;
        const res = await getData(`/workflow_variable/public/${variableId}/hints`);
        res.result.forEach(v => {
            const line = document.createElement('div');
            line.innerHTML = `🟠 <span>%${v.name}%</span> - ${v.description || ''}`;
            hintList.appendChild(line);
        });
    }

    async function loadList(activeId = null) {
        const [res, nodesRes] = await Promise.all([
            getData('/workflow_variable/public/list'),
            getData('/node/list')
        ]);

        const variables = res.result;
        const nodes = nodesRes.result.sort((a, b) => (a.position || 0) - (b.position || 0));

        itemList.innerHTML = '';
        nodes.forEach(node => {
            const nodeVars = variables.filter(v => v.node_id === node.id);
            if (nodeVars.length === 0) return;

            const header = document.createElement('div');
            header.className = 'group-header';
            header.textContent = node.name;
            itemList.appendChild(header);

            nodeVars.forEach(item => {
                const div = document.createElement('div');
                div.className = 'agent-item';
                div.textContent = item.title || item.name;
                if (activeId !== null && item.id === activeId) div.classList.add('active');
                div.onclick = () => selectItem(item, div);
                itemList.appendChild(div);
            });
        });
    }

    function selectItem(item, element) {
        document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        document.getElementById('defaultText').style.display = 'none';
        dataForm.style.display = 'flex';

        document.getElementById('id').value = item.id;
        document.getElementById('formTitle').textContent = `Редактирование: ${item.title || item.name}`;

        // Языки — по ноде переменной, затем загружаем значение в переводимое поле
        nodeLanguagesGet(item.node_id).then(langs => {
            langSwitcher.setLanguages(langs);
            langSwitcher.fieldLoad(document.getElementById('default'), item.default || '');
        });

        renderHints(item.id);
    }

    dataForm.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('id').value;
        if (!id) return;

        await putData(`/workflow_variable/public/${id}`, {
            default: langSwitcher.fieldSerialize(document.getElementById('default'))
        });
        showNotification('Обновлено', 'success');
        await loadList(parseInt(id));
    };

    loadList();
</script>
{% endblock %}
