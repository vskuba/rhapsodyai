<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhapsody Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/notification.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: var(--tg-theme-bg-color, #f5f6f8);
            color: var(--tg-theme-text-color, #2c3e50);
            overflow: hidden;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .app-shell {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .icon-sidebar {
            width: 60px;
            flex-shrink: 0;
            background: #ffffff;
            border-right: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 6px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 12px;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn.active {
            background: #007bff;
            box-shadow: 0 2px 6px rgba(0, 123, 255, 0.4);
        }

        /* Группы иконок сайдбара: дефолтная (события/чат/планы) и режим
           открытого плана (назад/удалить) - переключаются целиком, без
           перестройки DOM, чтобы избежать мигания при входе в план */
        .icon-sidebar-group {
            display: none;
        }

        .icon-sidebar-group.active-group {
            display: contents;
        }

        .icon-btn.icon-btn-danger {
            color: #e74c3c;
        }

        @keyframes home-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.85; }
        }

        @keyframes home-ripple {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
        }

        #homeIconBtn {
            position: relative;
            overflow: visible;
        }

        #homeIconBtn.pulsing {
            animation: home-pulse 2s ease-in-out infinite;
            will-change: transform;
        }

        #homeIconBtn.pulsing::before,
        #homeIconBtn.pulsing::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 123, 255, 0.25);
            animation: home-ripple 2s ease-out infinite;
            will-change: transform, opacity;
            pointer-events: none;
        }

        #homeIconBtn.pulsing::after {
            animation-delay: 1s;
        }

        .chat-link {
            color: inherit;
            text-decoration: underline;
            word-break: break-all;
        }

        .user-msg-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .user-msg-row .chat-bubble.user {
            margin-bottom: 0;
        }

        .del-msg-btn {
            display: none;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 2px;
            flex-shrink: 0;
            line-height: 1;
        }

        .del-msg-btn.visible {
            display: block;
        }

        #claudeStatusIconBtn {
            margin-top: auto;
            color: black;
        }

        .content-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Заголовок текущей "страницы" (виден, когда сайдбар в режиме
           "назад", а не меню из 4 иконок) */
        .page-header {
            display: none;
            flex-shrink: 0;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #edf2f7;
            background: #e3e3e3;
        }

        #pageHeaderTitle {
            color: #15161c;
        }
        
        /* Небольшая коррекция позиции иконки "назад", чтобы визуально
           совпадать по высоте с заголовком страницы напротив */
        #sidebarPageIcons {
            margin-top: -6px;
        }

        .page-header.visible {
            display: block;
        }

        .tab-views {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .tab-view {
            display: none;
            height: 100%;
            box-sizing: border-box;
        }

        .tab-view.active {
            display: flex;
            flex-direction: column;
        }

        /* --- Events tab --- */
        #tab-events {
            padding: 16px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8e9091;
        }

        .panel-title:not(:first-child) {
            margin-top: 20px;
        }

        .panel-card {
            background: #ffffff;
            color: #2c3e50;
            border: 1px solid #edf2f7;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
        }

        .event-row {
            font-size: 13px;
            border-bottom: 1px solid #edf2f7;
            padding: 8px 0;
        }

        .event-row:last-child {
            border-bottom: none;
        }

        .event-type {
            font-weight: bold;
            color: #007bff;
        }

        .event-summary {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
            word-break: break-all;
        }

        .event-time {
            float: right;
            color: #94a3b8;
            font-size: 11px;
        }

        .agent-row {
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .agent-row:last-child {
            border-bottom: none;
        }

        .empty-state, .denied-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 16px;
            font-size: 14px;
        }

        /* --- Chat tab --- */
        #tab-chat {
            padding: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chat-bubble.user {
            background: #007bff;
            color: #ffffff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.user.sending {
            border: 2px dashed rgba(255, 255, 255, 0.65);
            opacity: 0.82;
        }

        .send-countdown {
            font-size: 11px;
            color: #64748b;
            text-align: right;
            padding-right: 2px;
            margin-top: 3px;
        }

        .chat-bubble.assistant {
            background: #ffffff;
            color: #2c3e50;
            border: 1px solid #edf2f7;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .chat-bubble.pending {
            color: #94a3b8;
            font-style: italic;
        }

        /* --- Claude tab: тот же чат-UI, что и обычный чат, но с акцентным
           оранжевым цветом, чтобы визуально не путать с telegram_assistant --- */
        #tab-claude .chat-bubble.user {
            background: #D97757;
        }

        .claude-icon {
            width: 26px;
            height: 26px;
            display: block;
        }

        /* Индикатор "Claude думает": замена текстового "..." на пульсирующие
           точки - исчезает сам, как только приходит настоящий ответ */
        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #D97757;
            animation: typing-bounce 1.2s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: scale(0.6); opacity: 0.4; }
            30% { transform: scale(1); opacity: 1; }
        }

        #chatSendBtnClaude, #claudeSendBtn {
            background: #D97757;
        }

        /* Прогресс-бар и input-бар вынесены за пределы .content-panel: общий
           ряд на всю ширину экрана (под обеими колонками), не только под чатом */
        .chat-progress {
            height: 3px;
            background: #edf2f7;
            overflow: hidden;
            flex-shrink: 0;
            visibility: hidden;
        }

        .chat-progress, .chat-input-bar {
            display: none;
        }

        .chat-progress.chat-visible, .chat-input-bar.chat-visible {
            display: block;
        }

        .chat-input-bar.chat-visible {
            display: flex;
        }

        .chat-progress.active {
            visibility: visible;
        }

        .chat-progress-fill {
            height: 100%;
            width: 30%;
            background: #007bff;
            animation: chat-progress-slide 1s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes chat-progress-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(333%); }
        }

        .chat-input-bar {
            flex-shrink: 0;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid #edf2f7;
            background: #ffffff;
        }

        .chat-text-input {
            flex: 1;
            border: 1px solid #cbd5e0;
            border-radius: 18px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
        }

        .chat-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #007bff;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .plan-text-input {
            resize: none;
            font-family: inherit;
            line-height: 1.4;
            border-radius: 14px;
        }

        .mic-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .mic-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            color: #333;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
            user-select: none;
            touch-action: none;
        }

        .mic-btn.recording {
            background: #ff4d4d;
            color: #ffffff;
            animation: mic-pulse 1s ease-in-out infinite;
        }

        @keyframes mic-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 0 12px rgba(255, 77, 77, 0); transform: scale(1.12); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); transform: scale(1); }
        }

        /* Крестик отмены записи: виден все время, пока идет запись (тап по
           нему в любой момент = отмена без отправки) */
        .mic-cancel {
            position: absolute;
            bottom: 64px;
            left: 50%;
            transform: translateX(-50%) scale(0.7);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #ff4d4d;
            color: #ffffff;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
        }

        .mic-cancel.visible {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* --- Plans tab --- */
        #tab-plans {
            padding: 0;
        }

        .plans-list-view, .plans-detail-view {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .plan-list-item {
            font-size: 14px;
            padding: 12px 14px;
            cursor: pointer;
        }

        .plan-list-item:last-child {
            border-bottom: none;
        }

        /* --- Claude session list (вкладка Cloud) --- */
        .claude-session-item {
            font-size: 14px;
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #edf2f7;
        }

        .claude-session-item:last-child {
            border-bottom: none;
        }

        .claude-session-item .session-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .claude-session-item .session-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            flex-shrink: 0;
        }

        .claude-session-item .session-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .plan-back-btn {
            border: none;
            background: transparent;
            color: #007bff;
            font-size: 14px;
            cursor: pointer;
            padding: 0 0 10px;
        }

        .plan-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .plan-content {
            font-size: 14px;
            line-height: 1.5;
        }

        .plan-heading {
            font-weight: bold;
            font-size: 15px;
            margin: 10px 0 4px;
        }

        .plan-line {
            padding: 2px 0;
        }

        .plan-line-empty {
            height: 8px;
        }

        .plan-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-checkbox input {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Панель "создать план": только микрофон по центру, показывается на
           списке планов (пока не открыт конкретный план) */
        .mic-only-bar {
            display: none;
            justify-content: center;
            flex-shrink: 0;
            padding: 12px;
            border-top: 1px solid #edf2f7;
            background: #ffffff;
        }

        .mic-only-bar.chat-visible {
            display: flex;
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="app-shell">
        <div class="icon-sidebar">
            <button class="icon-btn" id="homeIconBtn" title="На главную">🏠</button>
            <div class="icon-sidebar-group active-group" id="sidebarDefaultIcons">
                <button class="icon-btn active" id="tabBtnEvents" data-tab="events" title="События">🔔</button>
                <button class="icon-btn" id="tabBtnClaude" data-tab="claude" title="Claude">
                    <svg class="claude-icon" viewBox="0 0 24 24">
                        <g fill="#D97757">
                            <path d="M12 1 L13.4 9.4 L12 12 L10.6 9.4 Z"/>
                            <path d="M12 23 L13.4 14.6 L12 12 L10.6 14.6 Z"/>
                            <path d="M1 12 L9.4 10.6 L12 12 L9.4 13.4 Z"/>
                            <path d="M23 12 L14.6 10.6 L12 12 L14.6 13.4 Z"/>
                            <path d="M4.2 4.2 L11.3 10.2 L12 12 L9.8 11.3 Z"/>
                            <path d="M19.8 19.8 L12.7 13.8 L12 12 L14.2 12.7 Z"/>
                            <path d="M19.8 4.2 L12.7 10.2 L12 12 L14.2 11.3 Z"/>
                            <path d="M4.2 19.8 L11.3 13.8 L12 12 L9.8 12.7 Z"/>
                        </g>
                        <circle cx="12" cy="12" r="2.4" fill="#D97757"/>
                    </svg>
                </button>
                <button class="icon-btn" id="tabBtnChat" data-tab="chat" title="Чат">💬</button>
                <button class="icon-btn" id="tabBtnPlans" data-tab="plans" title="Планы">📋</button>
                <button class="icon-btn" id="siteLoginIconBtn" title="Открыть сайт">🌐</button>
            </div>
            <div class="icon-sidebar-group" id="sidebarPageIcons">
                <button class="icon-btn" id="pageBackIconBtn" title="Назад к меню">🔙</button>
            </div>
            <div class="icon-sidebar-group" id="sidebarPlanIcons">
                <button class="icon-btn" id="planBackIconBtn" title="Назад к списку планов">🔙</button>
                <button class="icon-btn icon-btn-danger" id="planDeleteIconBtn" title="Удалить план">🗑</button>
            </div>
            <div class="icon-sidebar-group" id="sidebarClaudeIcons">
                <button class="icon-btn" id="claudeBackToListIconBtn" title="К списку сессий">🔙</button>
                <button class="icon-btn" id="claudeStatusIconBtn" title="Статус процессов">⟳</button>
                <button class="icon-btn" id="claudeClearMessagesIconBtn" title="Очистить сообщения">🧹</button>
                <button class="icon-btn icon-btn-danger" id="claudeDeleteSessionIconBtn" title="Удалить сессию">🗑</button>
            </div>
        </div>

        <div class="content-panel">
            <div class="page-header" id="pageHeader"><span id="pageHeaderTitle"></span></div>
            <div class="tab-views" id="tabViews">
            <div class="tab-view active" id="tab-events">
                <div class="empty-state">Загрузка...</div>
            </div>

            <div class="tab-view" id="tab-claude">
                <div class="plans-list-view" id="claudeSessionListView"></div>
                <div class="chat-messages" id="claudeMessages" style="display:none;"></div>
            </div>

            <div class="tab-view" id="tab-chat">
                <div class="chat-messages" id="chatMessages"></div>
            </div>

            <div class="tab-view" id="tab-plans">
                <div class="plans-list-view" id="plansListView"></div>
                <div class="plans-detail-view" id="plansDetailView" style="display:none;">
                    <div class="plan-title" id="planDetailTitle"></div>
                    <div class="plan-content" id="planDetailContent"></div>
                </div>
            </div>
            </div>
        </div>
    </div>

    <div class="chat-progress" id="claudeProgress"><div class="chat-progress-fill"></div></div>
    <div class="chat-input-bar" id="claudeInputBar">
        <div class="mic-wrap">
            <button class="mic-cancel" id="claudeMicCancel">✕</button>
            <button class="mic-btn" id="claudeMicBtn">🎤</button>
        </div>
        <textarea class="chat-text-input plan-text-input" id="claudeTextInput" rows="4" placeholder="Сообщение для Claude Code..."></textarea>
        <button class="chat-send-btn" id="claudeSendBtn">➤</button>
    </div>

    <div class="chat-progress" id="chatProgress"><div class="chat-progress-fill"></div></div>
    <div class="chat-input-bar" id="chatInputBar">
        <div class="mic-wrap">
            <button class="mic-cancel" id="micCancel">✕</button>
            <button class="mic-btn" id="chatMicBtn">🎤</button>
        </div>
        <textarea class="chat-text-input plan-text-input" id="chatTextInput" rows="4" placeholder="Сообщение..."></textarea>
        <button class="chat-send-btn" id="chatSendBtn">➤</button>
    </div>

    <div class="chat-progress" id="planProgress"><div class="chat-progress-fill"></div></div>
    <div class="chat-input-bar" id="planInputBar">
        <div class="mic-wrap">
            <button class="mic-cancel" id="planMicCancel">✕</button>
            <button class="mic-btn" id="planMicBtn">🎤</button>
        </div>
        <textarea class="chat-text-input plan-text-input" id="planTextInput" rows="4" placeholder="Инструкция по правке..."></textarea>
        <button class="chat-send-btn" id="planSendBtn">➤</button>
    </div>

    <div class="chat-progress" id="planCreateProgress"><div class="chat-progress-fill"></div></div>
    <div class="mic-only-bar" id="planCreateBar">
        <div class="mic-wrap">
            <button class="mic-cancel" id="planCreateMicCancel">✕</button>
            <button class="mic-btn" id="planCreateMicBtn">🎤</button>
        </div>
    </div>
</div>

<script type="module">
    import {getData, postData, deleteData} from '/static/js/api.js';

    const tg = window.Telegram?.WebApp;
    const eventsTab = document.getElementById('tab-events');
    const chatMessagesEl = document.getElementById('chatMessages');
    const chatTextInput = document.getElementById('chatTextInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const chatMicBtn = document.getElementById('chatMicBtn');
    const micCancel = document.getElementById('micCancel');
    const chatProgress = document.getElementById('chatProgress');
    const chatInputBar = document.getElementById('chatInputBar');

    const claudeMessagesEl = document.getElementById('claudeMessages');
    const claudeSessionListView = document.getElementById('claudeSessionListView');
    const claudeTextInput = document.getElementById('claudeTextInput');
    const claudeSendBtn = document.getElementById('claudeSendBtn');
    const claudeMicBtn = document.getElementById('claudeMicBtn');
    const claudeMicCancel = document.getElementById('claudeMicCancel');
    const claudeProgress = document.getElementById('claudeProgress');
    const claudeInputBar = document.getElementById('claudeInputBar');

    const plansListView = document.getElementById('plansListView');
    const plansDetailView = document.getElementById('plansDetailView');
    const planDetailTitle = document.getElementById('planDetailTitle');
    const planDetailContent = document.getElementById('planDetailContent');
    const planTextInput = document.getElementById('planTextInput');
    const planSendBtn = document.getElementById('planSendBtn');
    const planMicBtn = document.getElementById('planMicBtn');
    const planMicCancel = document.getElementById('planMicCancel');
    const planProgress = document.getElementById('planProgress');
    const planInputBar = document.getElementById('planInputBar');

    const planCreateBar = document.getElementById('planCreateBar');
    const planCreateProgress = document.getElementById('planCreateProgress');
    const planCreateMicBtn = document.getElementById('planCreateMicBtn');
    const planCreateMicCancel = document.getElementById('planCreateMicCancel');

    const homeIconBtn = document.getElementById('homeIconBtn');
    const sidebarDefaultIcons = document.getElementById('sidebarDefaultIcons');
    const sidebarPageIcons = document.getElementById('sidebarPageIcons');
    const pageBackIconBtn = document.getElementById('pageBackIconBtn');
    const pageHeader = document.getElementById('pageHeader');
    const pageHeaderTitle = document.getElementById('pageHeaderTitle');
    const sidebarPlanIcons = document.getElementById('sidebarPlanIcons');
    const planBackIconBtn = document.getElementById('planBackIconBtn');
    const planDeleteIconBtn = document.getElementById('planDeleteIconBtn');
    const sidebarClaudeIcons = document.getElementById('sidebarClaudeIcons');
    const claudeBackToListIconBtn = document.getElementById('claudeBackToListIconBtn');
    const claudeStatusIconBtn = document.getElementById('claudeStatusIconBtn');
    const claudeClearMessagesIconBtn = document.getElementById('claudeClearMessagesIconBtn');
    const claudeDeleteSessionIconBtn = document.getElementById('claudeDeleteSessionIconBtn');
    const siteLoginIconBtn = document.getElementById('siteLoginIconBtn');
    const SITE_LOGIN_URL = 'https://92.5.17.195.sslip.io/login';
    // Заголовки страниц для сайдбара 2 уровня (меню -> страница)
    const PAGE_TITLES = {events: 'События', claude: 'Claude', chat: 'Чат', plans: 'Планы'};

    let chatSessionUuid = null;
    // session_uuid выбранной сессии Claude Code - не персистится в
    // localStorage: источник правды теперь реестр ai_claude_session_registry
    // на сервере (см. .claude/docs/claude_session_registry.md), при каждом
    // открытии вкладки заново показывается список зарегистрированных сессий
    let claudeSessionUuid = null;
    // Роль + метка проекта выбранной сессии - для заголовка страницы
    let claudeSessionLabel = '';
    // Пропала ли открытая сессия из /claude/sessions/active (терминал
    // реально закрыт, см. .claude/docs/claude_session_registry.md §4) -
    // единственное, что нас интересует про её состояние: сессия либо
    // достижима (терминал открыт и слушает), либо нет
    let claudeSessionUnreachable = false;
    let claudePollTimer = null;
    // Отдельный, более редкий опрос статуса (пауза/активна/недоступна) -
    // работает и на списке сессий, и внутри открытого чата, пока открыта
    // вкладка Claude, чтобы не показывать устаревшую картину при долго
    // бездействующем окне Mini App
    let claudeStatusPollTimer = null;
    let claudeRenderedUserIds = new Set();
    let claudeRenderedResponseIds = new Set();
    let claudePendingUserCount = 0;
    let claudeTypingBubble = null;
    let currentTab = 'events';
    let currentPlanId = null;

    async function init() {
        tg?.ready();
        tg?.expand();

        const initData = tg?.initData || '';
        // Доступ вне Telegram (обычный браузер, для тестирования) - через
        // ?access_token= в URL вместо initData
        const accessToken = new URLSearchParams(window.location.search).get('access_token') || '';

        try {
            await postData('/telegram-app/auth', {init_data: initData, access_token: accessToken});
        } catch (err) {
            eventsTab.innerHTML = '<div class="denied-state">⛔ Доступ запрещён</div>';
            return;
        }

        initTabs();
        initChat();
        initClaude();
        initPlans();
        initHomePing();
        await loadEvents();
    }

    let pingFailCount = 0;

    function initHomePing() {
        homeIconBtn.addEventListener('click', goHome);
        pingServer();
        setInterval(pingServer, 5000);
    }

    async function pingServer() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1000);
        try {
            await fetch('/telegram-app/ping', {signal: controller.signal});
            pingFailCount = 0;
            homeIconBtn.classList.add('pulsing');
        } catch {
            pingFailCount++;
            if (pingFailCount >= 2) homeIconBtn.classList.remove('pulsing');
        } finally {
            clearTimeout(timeout);
        }
    }

    function goHome() {
        if (currentPlanId !== null) {
            currentPlanId = null;
            plansDetailView.style.display = 'none';
            plansListView.style.display = 'block';
        }
        if (claudeSessionUuid !== null) {
            claudeSessionUuid = null;
            claudeSessionLabel = '';
            claudeSessionUnreachable = false;
            if (claudePollTimer) { clearInterval(claudePollTimer); claudePollTimer = null; }
            claudeMessagesEl.style.display = 'none';
            claudeSessionListView.style.display = 'block';
        }
        document.querySelectorAll('.icon-btn[data-tab]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
        document.getElementById('tabBtnEvents').classList.add('active');
        document.getElementById('tab-events').classList.add('active');
        currentTab = 'events';
        setSidebarPageMode(false);
        updateInputBarsVisibility();
        updateClaudePolling();
        updateClaudeStatusPolling();
    }

    function initTabs() {
        // [data-tab] отсекает иконки "назад"/"удалить" сайдбара плана - у них
        // своя логика (закрыть план / удалить), они не переключают вкладки.
        // Клик по любой иконке меню "проваливает" на страницу: сайдбар
        // схлопывается до одной иконки "назад", наверху появляется заголовок
        document.querySelectorAll('.icon-btn[data-tab]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.icon-btn[data-tab]').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');

                currentTab = btn.dataset.tab;
                if (currentTab === 'plans') loadPlans();
                // Если сессия уже открыта (просто переключились на другую
                // вкладку и вернулись) - не сбрасываем на список заново
                if (currentTab === 'claude' && !claudeSessionUuid) loadClaudeSessionList();
                setSidebarPageMode(true);
                updateInputBarsVisibility();
                updateClaudePolling();
                updateClaudeStatusPolling();
            });
        });

        pageBackIconBtn.addEventListener('click', () => setSidebarPageMode(false));
        claudeBackToListIconBtn.addEventListener('click', closeClaudeSessionView);
        claudeStatusIconBtn.addEventListener('click', restartClaudeProcesses);
        claudeClearMessagesIconBtn.addEventListener('click', clearCurrentClaudeMessages);
        claudeDeleteSessionIconBtn.addEventListener('click', deleteCurrentClaudeSession);
        // Не переключает вкладку (нет data-tab) - просто уводит на страницу
        // логина основного сайта, вне Mini App. tg.openLink корректно
        // открывает внешние ссылки из Telegram WebView; window.open - фолбэк
        // для тестирования в обычном браузере (см. init(), ?access_token=)
        siteLoginIconBtn.addEventListener('click', () => {
            if (tg?.openLink) tg.openLink(SITE_LOGIN_URL);
            else window.open(SITE_LOGIN_URL, '_blank');
        });
    }

    // Уровень 1 сайдбара: меню из 4 иконок <-> одна иконка "назад" + заголовок
    // текущей страницы. Возврат в меню НЕ меняет содержимое (как и у планов) -
    // просто снова показывает меню поверх последней открытой страницы.
    // Полностью реактивна от claudeSessionUuid - переключает все 3 группы
    // иконок явно на каждый вызов, поэтому переключение вкладок не может
    // оставить "залипшей" не ту группу (она не завязана на предыдущий вызов)
    function setSidebarPageMode(isInPage) {
        const isClaudeSessionOpen = currentTab === 'claude' && claudeSessionUuid !== null;
        sidebarDefaultIcons.classList.toggle('active-group', !isInPage);
        sidebarPageIcons.classList.toggle('active-group', isInPage && !isClaudeSessionOpen);
        sidebarClaudeIcons.classList.toggle('active-group', isInPage && isClaudeSessionOpen);
        pageHeader.classList.toggle('visible', isInPage);
        pageHeaderTitle.textContent = isClaudeSessionOpen ? claudeSessionLabel : (PAGE_TITLES[currentTab] || '');
    }

    // Показывает свой input-бар под текущую вкладку: чат - всегда на вкладке
    // "chat"; планы - только когда открыт конкретный план (не на списке)
    function updateInputBarsVisibility() {
        const isChatTab = currentTab === 'chat';
        chatInputBar.classList.toggle('chat-visible', isChatTab);
        chatProgress.classList.toggle('chat-visible', isChatTab);

        // Input-бар Claude - только когда открыта конкретная сессия, не на списке
        const isClaudeSessionOpen = currentTab === 'claude' && claudeSessionUuid !== null;
        claudeInputBar.classList.toggle('chat-visible', isClaudeSessionOpen);
        claudeProgress.classList.toggle('chat-visible', isClaudeSessionOpen);

        const isPlanDetailOpen = currentTab === 'plans' && currentPlanId !== null;
        planInputBar.classList.toggle('chat-visible', isPlanDetailOpen);
        planProgress.classList.toggle('chat-visible', isPlanDetailOpen);

        // Микрофон создания плана - только на списке планов, пока ни один не открыт
        const isPlansListOpen = currentTab === 'plans' && currentPlanId === null;
        planCreateBar.classList.toggle('chat-visible', isPlansListOpen);
        planCreateProgress.classList.toggle('chat-visible', isPlansListOpen);
    }

    // Список зарегистрированных сессий Claude Code для этого проекта
    // (ai_claude_session_registry) - открывается сразу при входе на вкладку
    // Cloud, если ни одна сессия ещё не выбрана. См.
    // .claude/docs/claude_session_registry.md §6
    async function loadClaudeSessionList() {
        claudeSessionListView.innerHTML = '<div class="empty-state">Загрузка...</div>';
        try {
            const res = await getData('/telegram-app/claude/sessions/active');
            renderClaudeSessionList(res.result || []);
        } catch (err) {
            claudeSessionListView.innerHTML = '<div class="denied-state">⚠️ Не удалось загрузить сессии</div>';
        }
    }

    // Подзаголовок карточки сессии - живое превью последнего сообщения
    // переписки (не summary: тот пишется вручную только при finalize и
    // почти всегда устарел, см. claude_session_registry.md §5), с фолбэком
    // на summary, если сообщений ещё не было вовсе
    function claudeSessionPreviewText(s) {
        const text = (s.last_message || s.summary || '').trim();
        if (!text) return 'Нет сообщений';
        return text.length > 80 ? text.slice(0, 80) + '…' : text;
    }

    function renderClaudeSessionList(sessions) {
        claudeSessionListView.innerHTML = sessions.length
            ? sessions.map(s => `
                <div class="claude-session-item" data-uuid="${escapeHtml(s.session_uuid)}"
                     data-role="${escapeHtml(s.role)}" data-project="${escapeHtml(s.project_label)}">
                    <div class="session-title">
                        <span class="session-status-dot"></span>
                        ${escapeHtml(s.role)} — ${escapeHtml(s.project_label)}
                    </div>
                    <div class="session-subtitle">${escapeHtml(claudeSessionPreviewText(s))}</div>
                </div>
            `).join('')
            : '<div class="empty-state">Активных сессий нет. Запустите терминал в проекте, чтобы зарегистрировать сессию</div>';

        claudeSessionListView.querySelectorAll('.claude-session-item').forEach(el =>
            el.addEventListener('click', () => openClaudeSession(
                el.dataset.uuid, el.dataset.role, el.dataset.project
            )));
    }

    // Открывает чат конкретной сессии - подтягивает историю целиком (как при
    // восстановлении после перезагрузки), запускает опрос новых сообщений
    async function openClaudeSession(sessionUuid, role, projectLabel) {
        claudeSessionUuid = sessionUuid;
        claudeSessionLabel = `${role} — ${projectLabel}`;
        claudeSessionUnreachable = false;
        claudeRenderedUserIds = new Set();
        claudeRenderedResponseIds = new Set();
        claudePendingUserCount = 0;
        claudeTypingBubble = null;
        claudeMessagesEl.innerHTML = '';

        claudeSessionListView.style.display = 'none';
        claudeMessagesEl.style.display = 'block';
        setSidebarPageMode(true);
        updateInputBarsVisibility();

        await loadClaudeMessages(true);
        updateClaudePolling();
        updateClaudeStatusPolling();
    }

    // Возврат со страницы конкретной сессии на список сессий (уровень 2 -> 1
    // внутри вкладки Cloud) - не выходит из вкладки целиком
    function closeClaudeSessionView() {
        claudeSessionUuid = null;
        claudeSessionLabel = '';
        claudeSessionUnreachable = false;
        if (claudePollTimer) {
            clearInterval(claudePollTimer);
            claudePollTimer = null;
        }

        claudeMessagesEl.style.display = 'none';
        claudeSessionListView.style.display = 'block';
        setSidebarPageMode(true);
        updateInputBarsVisibility();

        loadClaudeSessionList();
        updateClaudeStatusPolling();
    }

    async function restartClaudeProcesses() {
        if (!claudeSessionUuid) return;

        claudeStatusIconBtn.disabled = true;

        const statusBubble = document.createElement('div');
        statusBubble.className = 'chat-bubble assistant';
        statusBubble.textContent = '⟳ Отправляю команду перезапуска…';
        claudeMessagesEl.appendChild(statusBubble);
        claudeMessagesEl.scrollTop = claudeMessagesEl.scrollHeight;

        let initialStatus;
        try {
            const data = await postData('/telegram-app/claude/session/restart-processes', {session_uuid: claudeSessionUuid});
            initialStatus = data.result;
        } catch (err) {
            statusBubble.textContent = '⚠️ Не удалось отправить команду перезапуска';
            claudeStatusIconBtn.disabled = false;
            return;
        }

        statusBubble.textContent = '⟳ Команда перезапуска отправлена. Проверяю статус через 5с…';

        await new Promise(r => setTimeout(r, 5000));

        let freshStatus = null;
        try {
            const data = await getData(`/telegram-app/claude/session/process-status?session_uuid=${encodeURIComponent(claudeSessionUuid)}`);
            freshStatus = data.result;
        } catch (err) { /* игнорируем, используем initialStatus */ }

        const s = freshStatus || initialStatus;
        const watchIcon = s.watch_alive ? '🍏' : '🔴';
        const secsAgo = s.seconds_ago !== null && s.seconds_ago !== undefined ? `${s.seconds_ago}с назад` : 'нет данных';

        const lines = [
            `📊 Статус процессов сессии`,
            `${watchIcon} watch  (heartbeat: ${secsAgo})`,
            `🍏 server`,
            `📁 ${s.project_label || ''} / ${s.role || ''}`,
        ];
        if (!s.watch_alive) {
            lines.push('⚠️ watch не отвечает — откройте терминал или нажмите ещё раз');
        }
        statusBubble.textContent = lines.join('\n');

        claudeStatusIconBtn.disabled = false;
    }

    async function clearCurrentClaudeMessages() {
        if (!claudeSessionUuid) return;

        const confirmed = await confirmDialog('Очистить все сообщения текущей сессии?');
        if (!confirmed) return;

        try {
            await postData('/telegram-app/claude/session/clear-messages', {session_uuid: claudeSessionUuid});
        } catch (err) {
            appendBubble('assistant', '⚠️ Не удалось очистить сообщения', false, claudeMessagesEl);
            return;
        }

        claudeMessagesEl.innerHTML = '';
        claudeRenderedUserIds = new Set();
        claudeRenderedResponseIds = new Set();
        claudePendingUserCount = 0;
        claudeTypingBubble?.remove();
        claudeTypingBubble = null;
    }

    // Кнопка "Удалить" - безвозвратно (не мягкий стоп): удаляет запись из
    // ai_claude_session_registry и просит терминал самоочиститься (маркер
    // в очереди ai_claude_session, который watch распознаёт без LLM - см.
    // .claude/hooks/session_client.py и claude_session_registry.md). Новый
    // терминал в этом же проекте зарегистрируется с нуля.
    async function deleteCurrentClaudeSession() {
        if (!claudeSessionUuid) return;

        const confirmed = await confirmDialog(`Удалить сессию "${claudeSessionLabel}"? Терминал начнёт с чистого листа при следующем запуске.`);
        if (!confirmed) return;

        try {
            await postData('/telegram-app/claude/session/delete-request', {session_uuid: claudeSessionUuid});
        } catch (err) {
            // Тихо пропускаем - запись всё равно скорее всего удалена на сервере
        }
        closeClaudeSessionView();
    }

    // Более редкий (не при каждом сообщении) опрос достижимости сессии -
    // решает две вещи разом: 1) обновляет список сессий, пока он открыт,
    // 2) если открыт конкретный чат - замечает, что терминал реально закрылся
    // (пропал из /claude/sessions/active по staleness, см.
    // .claude/docs/claude_session_registry.md §4), и один раз предупреждает
    // об этом в чате вместо того, чтобы молча "залипать" на устаревшей картине
    async function refreshClaudeSessionStatus() {
        let sessions;
        try {
            const res = await getData('/telegram-app/claude/sessions/active');
            sessions = res.result || [];
        } catch (err) {
            return; // тихо пропускаем, следующий тик попробует снова
        }

        if (!claudeSessionUuid) {
            renderClaudeSessionList(sessions);
            return;
        }

        const stillReachable = sessions.some(s => s.session_uuid === claudeSessionUuid);
        if (!stillReachable && !claudeSessionUnreachable) {
            claudeSessionUnreachable = true;
            appendBubble('assistant', '⚠️ Терминал недоступен (сессия закрыта)', false, claudeMessagesEl);
        } else if (stillReachable) {
            claudeSessionUnreachable = false;
        }
    }

    // Опрос статуса идёт, пока открыта вкладка Claude - и на списке, и
    // внутри конкретного чата, отдельно от 4-секундного опроса сообщений
    function updateClaudeStatusPolling() {
        if (claudeStatusPollTimer) {
            clearInterval(claudeStatusPollTimer);
            claudeStatusPollTimer = null;
        }
        if (currentTab === 'claude') {
            claudeStatusPollTimer = setInterval(refreshClaudeSessionStatus, 5000);
        }
    }

    async function loadEvents() {
        const res = await getData('/events');
        renderEvents(res.result || []);
    }

    function formatEventSummary(type, payloadRaw) {
        let p = {};
        try { p = JSON.parse(payloadRaw || '{}'); } catch { return ''; }

        if (type === 'github') {
            const ev = p.event || '';
            const branch = p.branch ? `#${p.branch}` : '';
            const commit = p.commit ? p.commit.slice(0, 7) : '';
            const actor = p.actor ? `@${p.actor}` : '';
            if (ev === 'deploy.started') return `🚀 deploy.started ${branch} ${commit} ${actor}`.trim();
            if (ev === 'deploy.finished') {
                const icon = p.status === 'success' ? '✅' : '❌';
                return `${icon} deploy.finished · ${p.status || ''} ${branch} ${commit}`.trim();
            }
            return ev;
        }

        if (type === 'system' || (!type && p.username)) {
            const ev = p.event_type || 'event';
            const who = p.username ? `${p.username} (${p.role || '?'})` : (p.role || '');
            return `👤 ${ev} · ${who}`.trim();
        }

        if (type === 'claude_session') {
            const parts = [p.event_type, p.project_label, p.role].filter(Boolean);
            return `🖥 ${parts.join(' · ')}`;
        }

        if (type === 'agent') {
            const parts = [p.event_type, p.agent_name].filter(Boolean);
            return `🤖 ${parts.join(' · ')}`;
        }

        if (type === 'llm') {
            const tokens = (p.tokens_input || p.tokens_output)
                ? `↑${p.tokens_input || 0} ↓${p.tokens_output || 0}`
                : '';
            const parts = [p.event_type, p.model, tokens].filter(Boolean);
            return `💬 ${parts.join(' · ')}`;
        }

        return '';
    }

    function renderEvents(events) {
        const eventsHtml = events.length
            ? events.map(e => {
                const summary = formatEventSummary(e.type, e.payload);
                return `
                <div class="event-row">
                    <span class="event-time">${escapeHtml(e.created_at || '')}</span>
                    <span class="event-type">${escapeHtml(e.type || 'system')}</span>
                    ${summary ? `<div class="event-summary">${escapeHtml(summary)}</div>` : ''}
                </div>`;
            }).join('')
            : '<div class="empty-state">Событий пока нет</div>';

        eventsTab.innerHTML = `
            <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;">
                <span>Последние события</span>
                <button id="clearEventsBtn" style="background:none;border:none;font-size:18px;cursor:pointer;padding:0 2px;color:#e74c3c;" title="Очистить события">🗑</button>
            </div>
            <div class="panel-card">${eventsHtml}</div>
        `;

        document.getElementById('clearEventsBtn').addEventListener('click', async () => {
            const confirmed = await confirmDialog('Удалить все события?');
            if (!confirmed) return;
            try {
                await deleteData('/events');
                renderEvents([]);
            } catch (err) {
                eventsTab.insertAdjacentHTML('beforeend', '<div class="denied-state">⚠️ Не удалось очистить события</div>');
            }
        });
    }

    // Общая фабрика записи голоса: тап-старт/тап-стоп (первый клик по
    // микрофону запускает запись - кнопка пульсирует, крестик отмены
    // появляется; второй клик - останавливает и передает распознанный текст
    // в onTranscript). Клик по крестику в любой момент записи - отмена без
    // отправки. Микрофон запрашивается один раз за сессию на каждый рекордер
    // и переиспользуется - иначе телефон повторно спрашивает разрешение
    function createVoiceRecorder({micBtn, cancelBtn, progressEl, onError, onTranscript}) {
        const MIN_RECORD_MS = 1000;
        let mediaRecorder = null;
        let audioChunks = [];
        let micStream = null;
        let recordCancelled = false;
        let recordStartedAt = 0;

        async function startRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') return;

            if (!micStream) {
                micStream = await navigator.mediaDevices.getUserMedia({audio: true});
            }

            mediaRecorder = new MediaRecorder(micStream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = onRecordingStop;

            mediaRecorder.start();
            recordStartedAt = performance.now();
            micBtn.classList.add('recording');
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            micBtn.classList.remove('recording');
            cancelBtn.classList.remove('visible');
        }

        async function onRecordingStop() {
            const audioBlob = new Blob(audioChunks, {type: 'audio/wav'});
            audioChunks = [];

            const tooShort = performance.now() - recordStartedAt < MIN_RECORD_MS;
            if (audioBlob.size === 0 || recordCancelled || tooShort) return;

            const formData = new FormData();
            formData.append('file', audioBlob, 'voice.wav');

            progressEl.classList.add('active');
            try {
                const data = await postData('/telegram-app/chat/voice', formData);
                if (data.result) await onTranscript(data.result);
            } catch (err) {
                onError?.(err);
            } finally {
                progressEl.classList.remove('active');
            }
        }

        async function onMicClick() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
                return;
            }

            recordCancelled = false;
            cancelBtn.classList.add('visible');
            await startRecording();
        }

        function onCancelClick() {
            recordCancelled = true;
            stopRecording();
        }

        if (!navigator.mediaDevices?.getUserMedia) {
            micBtn.disabled = true;
            micBtn.title = 'Микрофон недоступен в этом клиенте';
            return;
        }

        micBtn.addEventListener('click', onMicClick);
        cancelBtn.addEventListener('click', onCancelClick);
    }

    function initChat() {
        chatSendBtn.addEventListener('click', sendChatMessage);
        // Textarea в 4 строки: Enter отправляет, Shift+Enter - перенос строки
        chatTextInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        createVoiceRecorder({
            micBtn: chatMicBtn,
            cancelBtn: micCancel,
            progressEl: chatProgress,
            onError: () => appendBubble('assistant', '⚠️ Не удалось распознать голос'),
            onTranscript: async (text) => {
                chatTextInput.value = text;
                await sendChatMessage();
            },
        });
    }

    async function sendChatMessage() {
        const message = chatTextInput.value.trim();
        if (!message) return;

        chatTextInput.value = '';
        appendBubble('user', message);
        const pending = appendBubble('assistant', '...', true);

        chatProgress.classList.add('active');
        try {
            const data = await postData('/telegram-app/chat/ask', {
                message,
                session_uuid: chatSessionUuid
            });
            chatSessionUuid = data.session_uuid || chatSessionUuid;
            pending.innerHTML = linkify(data.result);
            pending.classList.remove('pending');
        } catch (err) {
            pending.textContent = '⚠️ ' + (err.message || 'Ошибка');
            pending.classList.remove('pending');
        } finally {
            chatProgress.classList.remove('active');
        }
    }

    function appendBubble(role, text, pending = false, container = chatMessagesEl, msgId = null) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${role}${pending ? ' pending' : ''}`;
        if (pending) {
            bubble.textContent = text;
        } else {
            bubble.innerHTML = linkify(text);
            bubble.querySelectorAll('a.chat-link').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const url = a.getAttribute('href');
                    if (tg?.openLink) tg.openLink(url);
                    else window.open(url, '_blank');
                });
            });
        }

        if (role === 'user' && container === claudeMessagesEl) {
            const row = document.createElement('div');
            row.className = 'user-msg-row';
            row.appendChild(bubble);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
            return bubble;
        }

        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
        return bubble;
    }


    function escapeHtml(t) {
        return String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function linkify(text) {
        return escapeHtml(text).replace(/(https?:\/\/[^\s<>"]+)/g, url =>
            `<a href="${url}" class="chat-link">${url}</a>`
        );
    }

    // Пузырь "Claude думает": пульсирующие точки вместо текста "...".
    // Убирается сам, как только приходит настоящий ответ (см. loadClaudeMessages)
    function appendTypingIndicator(container) {
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble assistant';
        bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
        return bubble;
    }

    // Отдельный чат с Claude Code: свой агент/workflow/история (не смешивается
    // с telegram_assistant). Ответ на /claude/ask всегда "..." мгновенно -
    // настоящий ответ Claude Code пишет позже отдельным процессом прямо в
    // agent_session, поэтому вкладку нужно периодически опрашивать
    function initClaude() {
        claudeSendBtn.addEventListener('click', sendClaudeMessage);
        claudeTextInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendClaudeMessage();
            }
        });

        createVoiceRecorder({
            micBtn: claudeMicBtn,
            cancelBtn: claudeMicCancel,
            progressEl: claudeProgress,
            onError: () => appendBubble('assistant', '⚠️ Не удалось распознать голос', false, claudeMessagesEl),
            onTranscript: async (text) => {
                claudeTextInput.value = text;
                await sendClaudeMessage();
            },
        });
    }

    async function sendClaudeMessage() {
        const message = claudeTextInput.value.trim();
        // Сообщение может уйти только внутри уже выбранной зарегистрированной
        // сессии (session_uuid из реестра) - без неё input-бар и не показан
        // (см. updateInputBarsVisibility), это подстраховка
        if (!message || !claudeSessionUuid) return;

        claudeTextInput.value = '';

        // Показываем сообщение в состоянии ожидания (5 с) — пользователь может нажать ✕ и отменить
        const row = document.createElement('div');
        row.className = 'user-msg-row';

        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble user sending';
        bubble.innerHTML = linkify(message);

        const countdown = document.createElement('span');
        countdown.className = 'send-countdown';
        countdown.textContent = 'отправка через 5с';

        const bubbleWrap = document.createElement('div');
        bubbleWrap.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end;';
        bubbleWrap.appendChild(bubble);
        bubbleWrap.appendChild(countdown);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-msg-btn visible';
        delBtn.textContent = '✕';

        row.appendChild(delBtn);
        row.appendChild(bubbleWrap);
        claudeMessagesEl.appendChild(row);
        claudeMessagesEl.scrollTop = claudeMessagesEl.scrollHeight;

        let secondsLeft = 4;
        const countdownInterval = setInterval(() => {
            countdown.textContent = secondsLeft > 0 ? `отправка через ${secondsLeft}с` : 'отправка…';
            secondsLeft--;
        }, 1000);

        const sendTimer = setTimeout(async () => {
            clearInterval(countdownInterval);
            bubble.classList.remove('sending');
            bubbleWrap.removeChild(countdown);
            delBtn.remove();

            claudePendingUserCount++;
            claudeTypingBubble?.remove();
            claudeTypingBubble = appendTypingIndicator(claudeMessagesEl);

            claudeProgress.classList.add('active');
            try {
                await postData('/telegram-app/claude/ask', {
                    message,
                    session_uuid: claudeSessionUuid
                });
                updateClaudePolling();
            } catch (err) {
                claudeTypingBubble?.remove();
                claudeTypingBubble = null;
                appendBubble('assistant', '⚠️ ' + (err.message || 'Ошибка'), false, claudeMessagesEl);
            } finally {
                claudeProgress.classList.remove('active');
            }
        }, 5000);

        delBtn.addEventListener('click', () => {
            clearTimeout(sendTimer);
            clearInterval(countdownInterval);
            row.remove();
        });
    }

    // Раз в несколько секунд подтягивает историю из ai_claude_session и дорисовывает
    // только новые элементы. Каждая строка таблицы = 1 пара: сообщение пользователя
    // (content) + ответ Claude Code (response, null если ещё обрабатывается).
    // Отслеживание через Set-ы по id строки: claudeRenderedUserIds / claudeRenderedResponseIds.
    // isInitialLoad=true - восстановление истории; на обычном опросе сообщения
    // пользователя уже нарисованы локально при отправке, пропускаем их.
    async function loadClaudeMessages(isInitialLoad = false) {
        if (!claudeSessionUuid) return;
        try {
            const res = await getData(`/telegram-app/claude/messages?session_uuid=${encodeURIComponent(claudeSessionUuid)}`);
            const rows = res.result || [];
            for (const row of rows) {
                if (row.content && !claudeRenderedUserIds.has(row.id)) {
                    claudeRenderedUserIds.add(row.id);
                    if (isInitialLoad) {
                        appendBubble('user', row.content, false, claudeMessagesEl);
                    } else if (claudePendingUserCount > 0) {
                        claudePendingUserCount--;
                    }
                }
                if (row.response && !claudeRenderedResponseIds.has(row.id)) {
                    claudeRenderedResponseIds.add(row.id);
                    claudeTypingBubble?.remove();
                    claudeTypingBubble = null;
                    appendBubble('assistant', row.response, false, claudeMessagesEl);
                }
            }
            if (isInitialLoad) {
                const lastRow = rows[rows.length - 1];
                if (lastRow && !lastRow.response) {
                    claudeTypingBubble = appendTypingIndicator(claudeMessagesEl);
                }
            }
        } catch (err) {
            // Тихо пропускаем - следующий опрос попробует снова
        }
    }

    // Опрос идет только пока открыта вкладка Claude - не тратим запросы впустую
    function updateClaudePolling() {
        if (claudePollTimer) {
            clearInterval(claudePollTimer);
            claudePollTimer = null;
        }
        if (currentTab === 'claude' && claudeSessionUuid) {
            claudePollTimer = setInterval(loadClaudeMessages, 4000);
        }
    }

    function initPlans() {
        planBackIconBtn.addEventListener('click', closePlanDetail);
        planDeleteIconBtn.addEventListener('click', deleteCurrentPlan);
        planSendBtn.addEventListener('click', sendPlanEdit);
        // Textarea в 4 строки: Enter отправляет, Shift+Enter - перенос строки
        planTextInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPlanEdit();
            }
        });

        createVoiceRecorder({
            micBtn: planMicBtn,
            cancelBtn: planMicCancel,
            progressEl: planProgress,
            onError: () => showPlanError('Не удалось распознать голос'),
            onTranscript: async (text) => {
                planTextInput.value = text;
                await sendPlanEdit();
            },
        });

        // Микрофон на списке планов - только создание нового плана с нуля;
        // микрофон внутри открытого плана (выше) - только правка уже созданного
        createVoiceRecorder({
            micBtn: planCreateMicBtn,
            cancelBtn: planCreateMicCancel,
            progressEl: planCreateProgress,
            onError: () => showPlansListError('Не удалось распознать голос'),
            onTranscript: createPlanFromInstruction,
        });
    }

    async function loadPlans() {
        plansListView.innerHTML = '<div class="empty-state">Загрузка...</div>';
        try {
            const res = await getData('/telegram-app/plans');
            renderPlansList(res.result || []);
        } catch (err) {
            plansListView.innerHTML = '<div class="denied-state">⚠️ Не удалось загрузить планы</div>';
        }
    }

    function renderPlansList(plans) {
        plansListView.innerHTML = plans.length
            ? plans.map(p => `<div class="plan-list-item" data-id="${p.id}">${escapeHtml(p.title)}</div>`).join('')
            : '<div class="empty-state">Планов пока нет. Надиктуйте новый план в микрофон внизу</div>';

        plansListView.querySelectorAll('.plan-list-item').forEach(el =>
            el.addEventListener('click', () => openPlanDetail(Number(el.dataset.id))));
    }

    async function createPlanFromInstruction(instruction) {
        planCreateProgress.classList.add('active');
        try {
            const data = await postData('/telegram-app/plans', {instruction});
            await loadPlans();
            await openPlanDetail(data.result.id);
        } catch (err) {
            showPlansListError(err.message || 'Не удалось создать план');
        } finally {
            planCreateProgress.classList.remove('active');
        }
    }

    function showPlansListError(message) {
        const banner = document.createElement('div');
        banner.className = 'denied-state';
        banner.style.color = '#e74c3c';
        banner.textContent = '⚠️ ' + message;
        plansListView.prepend(banner);
    }

    async function openPlanDetail(planId) {
        const res = await getData(`/telegram-app/plans/${planId}`);
        currentPlanId = planId;
        planDetailTitle.textContent = res.result.title;
        renderPlanContent(res.result.content);
        plansListView.style.display = 'none';
        plansDetailView.style.display = 'block';
        setSidebarPlanMode(true);
        updateInputBarsVisibility();
    }

    function closePlanDetail() {
        currentPlanId = null;
        plansDetailView.style.display = 'none';
        plansListView.style.display = 'block';
        setSidebarPlanMode(false);
        updateInputBarsVisibility();
    }

    // Переключает сайдбар целиком между дефолтными вкладками
    // (события/чат/планы) и режимом открытого плана (назад/удалить) -
    // без пересборки DOM, просто скрывает/показывает готовые группы
    function setSidebarPlanMode(isPlanOpen) {
        // Уровень 2 (план): назад из плана возвращает на уровень 1 (страница
        // "Планы"), а не сразу в меню - планы уже были "открыты" как страница
        sidebarPageIcons.classList.toggle('active-group', !isPlanOpen);
        sidebarPlanIcons.classList.toggle('active-group', isPlanOpen);
    }

    async function deleteCurrentPlan() {
        if (!currentPlanId) return;

        const confirmed = await confirmDialog('Удалить этот план?');
        if (!confirmed) return;

        try {
            await deleteData(`/telegram-app/plans/${currentPlanId}`);
            closePlanDetail();
            await loadPlans();
        } catch (err) {
            showPlanError(err.message || 'Не удалось удалить план');
        }
    }

    // Диалог подтверждения через нативный Telegram UI, если доступен
    // (в WebView браузера showConfirm отсутствует - тогда обычный confirm())
    function confirmDialog(message) {
        return new Promise(resolve => {
            if (tg?.showConfirm) {
                tg.showConfirm(message, resolve);
            } else {
                resolve(window.confirm(message));
            }
        });
    }

    async function sendPlanEdit() {
        const instruction = planTextInput.value.trim();
        if (!instruction || !currentPlanId) return;

        planTextInput.value = '';
        planProgress.classList.add('active');
        try {
            const data = await postData(`/telegram-app/plans/${currentPlanId}/edit`, {instruction});
            renderPlanContent(data.result.content);
        } catch (err) {
            showPlanError(err.message || 'Ошибка правки плана');
        } finally {
            planProgress.classList.remove('active');
        }
    }

    function showPlanError(message) {
        const banner = document.createElement('div');
        banner.className = 'denied-state';
        banner.style.color = '#e74c3c';
        banner.textContent = '⚠️ ' + message;
        planDetailContent.prepend(banner);
    }

    // Небольшой чекбокс-осознанный рендерер Markdown - не полноценный CommonMark,
    // но чекбоксы "- [ ]"/"- [x]" (единственный механизм шагов плана) рендерятся
    // как настоящие disabled-чекбоксы, остальное - заголовки/списки/жирный текст
    // или экранированный текст построчно как безопасный фолбэк
    function renderPlanContent(markdown) {
        const lines = String(markdown || '').split('\n');
        const html = lines.map(line => {
            const escaped = escapeHtml(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

            const checkbox = line.match(/^\s*-\s\[([ xX])]\s(.*)$/);
            if (checkbox) {
                const checked = checkbox[1].toLowerCase() === 'x';
                const label = escapeHtml(checkbox[2]).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
                return `<div class="plan-line plan-checkbox"><input type="checkbox" disabled ${checked ? 'checked' : ''}><span>${label}</span></div>`;
            }
            if (/^#{1,3}\s/.test(line)) {
                return `<div class="plan-heading">${escaped.replace(/^#{1,3}\s/, '')}</div>`;
            }
            if (/^\s*-\s/.test(line)) {
                return `<div class="plan-line">• ${escaped.replace(/^\s*-\s/, '')}</div>`;
            }
            if (!line.trim()) {
                return '<div class="plan-line-empty"></div>';
            }
            return `<div class="plan-line">${escaped}</div>`;
        }).join('');

        planDetailContent.innerHTML = html;
    }

    init();
</script>
</body>
