<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhapsody Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/notification.css">
    <link rel="stylesheet" href="/static/css/telegram_app.css">
</head>
<body>
<div class="app-wrapper">
    <div class="app-shell">
        <div class="icon-sidebar">
            <button class="icon-btn" id="homeIconBtn" title="На главную">🏠</button>

            <div class="icon-sidebar-group active-group" id="sidebarDefaultIcons">
                <button class="icon-btn active" id="tabBtnEvents" data-tab="events" title="События">🔔</button>
                <button class="icon-btn" id="tabBtnClaude" data-tab="claude" title="Claude">
                    <svg class="claude-icon" viewBox="0 0 24 24">
                        <g fill="#D97757">
                            <path d="M12 1 L13.4 9.4 L12 12 L10.6 9.4 Z"/>
                            <path d="M12 23 L13.4 14.6 L12 12 L10.6 14.6 Z"/>
                            <path d="M1 12 L9.4 10.6 L12 12 L9.4 13.4 Z"/>
                            <path d="M23 12 L14.6 10.6 L12 12 L14.6 13.4 Z"/>
                            <path d="M4.2 4.2 L11.3 10.2 L12 12 L9.8 11.3 Z"/>
                            <path d="M19.8 19.8 L12.7 13.8 L12 12 L14.2 12.7 Z"/>
                            <path d="M19.8 4.2 L12.7 10.2 L12 12 L14.2 11.3 Z"/>
                            <path d="M4.2 19.8 L11.3 13.8 L12 12 L9.8 12.7 Z"/>
                        </g>
                        <circle cx="12" cy="12" r="2.4" fill="#D97757"/>
                    </svg>
                </button>
                <button class="icon-btn" id="tabBtnChat" data-tab="chat" title="Чат">💬</button>
                <button class="icon-btn" id="tabBtnPlans" data-tab="plans" title="Планы">📋</button>
                <button class="icon-btn" id="dasboardRemote" title="Открыть сайт">🌐</button>
                <button class="icon-btn" id="dasboardLocal" title="Открыть сайт">💻</button>
            </div>

            <div class="icon-sidebar-group" id="sidebarPageIcons">
                <button class="icon-btn" id="pageBackIconBtn" title="Назад к меню">🔙</button>
            </div>

            <div class="icon-sidebar-group" id="sidebarPlanIcons">
                <button class="icon-btn" id="planBackIconBtn" title="Назад к списку планов">🔙</button>
                <button class="icon-btn icon-btn-danger" id="planDeleteIconBtn" title="Удалить план">🗑</button>
            </div>

            <div class="icon-sidebar-group" id="sidebarClaudeIcons">
                <button class="icon-btn" id="claudeBackToListIconBtn" title="К списку сессий">🔙</button>
                <button class="icon-btn quota-chip-btn" id="claudeQuotaChipBtn" title="Квота Claude (нажмите для обновления)">—%</button>
                <button class="icon-btn" id="claudeStatusIconBtn" title="Статус процессов">⟳</button>
                <button class="icon-btn" id="claudeClearMessagesIconBtn" title="Очистить сообщения">🧹</button>
                <button class="icon-btn icon-btn-danger" id="claudeDeleteSessionIconBtn" title="Удалить сессию">🗑</button>
            </div>
        </div>

        <div class="content-panel">
            <div class="page-header" id="pageHeader"><span id="pageHeaderTitle"></span></div>
            <div class="tab-views" id="tabViews">

                <div class="tab-view active" id="tab-events">
                    <div class="empty-state">Загрузка...</div>
                </div>

                <div class="tab-view" id="tab-claude">
                    <div class="plans-list-view" id="claudeSessionListView"></div>
                    <div class="chat-messages" id="claudeMessages" style="display:none;"></div>
                </div>

                <div class="tab-view" id="tab-chat">
                    <div class="chat-messages" id="chatMessages"></div>
                </div>

                <div class="tab-view" id="tab-plans">
                    <div class="plans-list-view" id="plansListView"></div>
                    <div class="plans-detail-view" id="plansDetailView" style="display:none;">
                        <div class="plan-title" id="planDetailTitle"></div>
                        <div class="plan-content" id="planDetailContent"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="quick-cmd-popup" id="claudeQuickCmdPopup">
        <div class="quick-cmd-item" data-text="ping">Продолжаем</div>
        <div class="quick-cmd-item" data-text="ping">Подскажи результаты предыдущей задачи</div>
        <div class="quick-cmd-item" data-text="ping">🏓 Ping</div>
        <div class="quick-cmd-item" data-text="Закомить и запусти деплой">📦 Закомить и запусти деплой</div>
        <div class="quick-cmd-item" data-text="Закомить и пришли мне merge request">🔀 Закомить и пришли MR</div>
        <div class="quick-cmd-item" data-text="Запусти pytest и верни отчёт">🧪 Запусти pytest и верни отчёт</div>
    </div>

    <!-- input bars создаются программно в app.js -->
</div>

<script type="module" src="/static/js/telegram_app/app.js"></script>
</body>
</html>
