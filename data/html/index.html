<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Убираем фиксированную высоту здесь, если хотим отступы */
            height: 100vh;
            margin: 0;
            padding: 20px; /* Чтобы чат не прилипал к краям экрана */
            box-sizing: border-box;
        }

        .main-wrapper {
            display: flex;
            width: 100%;       /* Растягиваем по ширине */
            max-width: 1000px; /* Но ограничиваем разумным пределом */
            height: 100%;      /* Занимает всю высоту body (за вычетом padding) */
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Левая часть: Чат */
        .chat-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #eee; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; border-bottom: 1px solid #eee; display: flex; flex-direction: column; }

        /* Правая часть: Настройки/Агенты */
        .sidebar { width: 180px; padding: 15px; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-label { font-size: 12px; color: #666; font-weight: bold; text-transform: uppercase; }

        /* Стили элементов управления */
        .message { margin-bottom: 15px; padding: 10px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; }
        .ai-msg { background: #e9e9eb; color: #333; align-self: flex-start; }

        .chat-input-area { display: flex; padding: 15px; }
        input, select { border: 1px solid #ddd; padding: 10px; border-radius: 5px; outline: none; }
        select { width: 100%; cursor: pointer; background: white; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }

        /* Настройка textarea */
        textarea {
            flex: 1;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            outline: none;
            resize: none; /* Запрещаем ручное изменение размера */
            height: 60px; /* Фиксированная начальная высота */
            font-family: inherit;
        }

        /* Стилизация открытого списка агентов */
        #agentSelect {
            width: 100%;
            height: 100%; /* Заполнит sidebar */
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            outline: none;
            overflow-y: auto;
        }

        #agentSelect option {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        #agentSelect option:checked {
            background-color: #007bff !important;
            color: white;
        }

        .mic-button {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            margin-left: 0;
            margin-right: 10px;
            width: 45px;
            font-size: 20px;
            transition: all 0.2s;
        }

        /* Эффект при записи */
        .mic-button.recording {
            background: #ff4d4d;
            color: white;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            transform: scale(1.1);
        }

        /* Контейнер с подложкой */
        .progress-bar-container {
            width: 100%;
            height: 4px; /* Чуть толще */
            background: #e0e0e0;
            z-index: 10;
            display: none;
            position: relative;
            overflow: hidden;
        }

        /* Энергичная начинка */
        .progress-bar-fill {
            width: 100%;
            height: 100%;
            /* Более контрастный градиент: глубокий синий -> ярко-голубой -> глубокий синий */
            background: linear-gradient(90deg,
                #004cff 0%,
                #00d4ff 25%,
                #ffffff 50%,
                #00d4ff 75%,
                #004cff 100%
            );
            background-size: 200% 100%;
            /* Ускоряем до 0.6s и меняем тип движения на волновой */
            animation: fast-shimmer 0.6s infinite linear;
            /* Добавляем свечение */
            box-shadow: 0 0 8px #00d4ff;
        }

        @keyframes fast-shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .progress-active {
            display: block;
        }

    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Основная зона чата -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-msg">Привет! Выберите агента и начнем.</div>
        </div>

        <div id="topProgressBar" class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="chat-input-area">
            <button id="micBtn" class="mic-button">🎤</button>
            <textarea id="userInput"></textarea>
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <!-- Правая колонка -->
    <div class="sidebar">
        <div class="sidebar-label">Активный агент</div>
        <select id="agentSelect" size="10">
            <option value="loading">Загрузка...</option>
        </select>
    </div>
</div>

<script>
    async function loadAgents() {
        showLoading(true);
        try {
            const response = await fetch('/agent/list', { method: 'POST' });
            const data = await response.json();
            const select = document.getElementById('agentSelect');
            select.innerHTML = '';
            data.result.forEach(agent => {
                const option = document.createElement('option');
                option.value = agent;
                option.textContent = agent;
                select.appendChild(option);
            });
            if (data.result.length > 0) select.selectedIndex = 0;
        } catch (e) {
            console.error("Ошибка загрузки агентов:", e);
        } finally {
            showLoading(false);
        }
    }

    // Отправка сообщения
    async function sendMessage() {
        showLoading(true);
        const textarea = document.getElementById('userInput');
        const agentSelect = document.getElementById('agentSelect');
        const container = document.getElementById('chatMessages');
        const text = textarea.value.trim();

        if (!text) return;

        const userDiv = document.createElement('div');
        userDiv.className = 'message user-msg';
        userDiv.textContent = text;
        container.appendChild(userDiv);
        textarea.value = '';
        container.scrollTop = container.scrollHeight;

        try {
            const response = await fetch('/chat/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text, agent: agentSelect.value })
            });
            const data = await response.json();
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            aiDiv.textContent = data.result;
            container.appendChild(aiDiv);
        } catch (e) {
            console.error("Ошибка:", e);
        } finally {
            showLoading(false);
        }
        container.scrollTop = container.scrollHeight;
    }

    // Обработка Enter
    document.getElementById('userInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Голосовой ввод
    async function initVoice() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                audioChunks = []; // Очищаем для следующей записи

                // --- БЛОК ДЛЯ ПРОСЛУШИВАНИЯ ---
<!--                const audioUrl = URL.createObjectURL(audioBlob);-->
<!--                const audio = new Audio(audioUrl);-->
<!--                audio.play(); // Звук воспроизведется сразу после того, как вы отпустите микрофон-->
                // ------------------------------

                // Отправляем файл на ваш Faster Whisper эндпоинт
                const formData = new FormData();
                formData.append("file", audioBlob, "voice.wav");

                showLoading(true);
                try {
                    const response = await fetch('/chat/voice', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    // Вставляем текст в textarea и отправляем сообщение
                    if (data.result) {
                        document.getElementById('userInput').value = data.result;
                        sendMessage();
                    }
                } catch (err) {
                    console.error("Ошибка отправки аудио:", err);
                } finally {
                    showLoading(false);
                }
            };
        } catch (err) {
            console.error("Нет доступа к микрофону:", err);
            micBtn.style.opacity = '0.5';
        }
    }

    let mediaRecorder;
    let audioChunks = [];

    const micBtn = document.getElementById('micBtn');

    // Управление записью (удержание)
    micBtn.addEventListener('mousedown', () => {
        if (!mediaRecorder) return;
        audioChunks = [];
        mediaRecorder.start();
        micBtn.classList.add('recording');
    });

    micBtn.addEventListener('mouseup', () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            micBtn.classList.remove('recording');
        }
    });

    const progressBar = document.getElementById('topProgressBar');

    function showLoading(show) {
        if (show) {
            progressBar.classList.add('progress-active');
        } else {
            progressBar.classList.remove('progress-active');
        }
    }

    initVoice();
    loadAgents();
</script>

</body>
</html>
