title: "Json menu to collection 'soko_menu'"
type: "json_to_chroma_db"

source:
  - file_name: "data/output/soko_full_menu.json"
    # Указываем ключ, по которому лежат объекты для индексации
    iterator_key: "items"
    # Указываем поля родителя, которые нужно "пробросить" в каждый объект (контекст)
    context_fields: ["category_name"]
    schema: json_input_schema

destination:
  - collection_name: "soko_menu"
    vector_settings:
      embedding_model: "all-MiniLM-L6-v2"
    # Инструкция для сборки вектора (из полей объекта + контекста)
    document_content: "category_name + ' ' + title + ' ' + description"
    # Список полей, которые пойдут в метаданные Chroma
    metadata: [ "category_name", "price", "image_url" ]

schemas:
  json_input_schema:
    type: "array"
    items:
      type: "object"
      properties:
        category_name: { type: "string" }
        items:
          type: "array"
          items:
            type: "object"
            properties:
              title: { type: "string" }
              price: { type: "string" }
              description: { type: "string" }
              image_url: { type: "string" }