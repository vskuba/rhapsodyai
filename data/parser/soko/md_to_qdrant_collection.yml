title: "Soko Logic ETL"
type: "md_to_qdrant"

source:
  - file_path: "data/md/soko.md"
    header_levels: [1, 2, 3]

destination:
  - collection_name: "soko_logic"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    document_template: "### {Header_1} > {Header_2}\n{content}"
    metadata_fields: ["Header_1", "Header_2", "source_file"]