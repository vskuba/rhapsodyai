title: "Soko Logic ETL"
type: "md_to_qdrant"

source:
  - files_path: "data/md/soko"
    languages:
      - ru

destination:
  - collection_name: "soko_logic"
    embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    document_template: "### {Header_1} > {Header_2}\n{content_body}"
    metadata_fields:
      - "group_id"
      - "category"
      - "language"
      - "tags"
      - "source_file"