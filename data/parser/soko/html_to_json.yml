title: "Site menu to json"
type: "html_to_json"
source:
  - type: "crawl4ai"
    targets:
      - { url: "https://soko.ps.me/category/roli"}
      - { url: "https://soko.ps.me/category/seti"}
      - { url: "https://soko.ps.me/category/bouli"}
      - { url: "https://soko.ps.me/category/maki"}
      - { url: "https://soko.ps.me/category/gunkani"}
      - { url: "https://soko.ps.me/category/nigiri"}
    schema: soko_menu_schema

destination:
  - file_name: "data/output/soko_full_menu.json"
    schema: soko_menu_destination_schema

schemas:
  soko_menu_schema:
    fields:
      - name: "category_name"
        selector: "section.scroll-spy h1"
        type: "text"
        mandatory: true
      - name: "items"
        selector: "div[data-testid='product_block']"
        type: "nested_list"
        fields:
          - name: "title"
            selector: "p[data-testid='product_name']"
            type: "text"
          - name: "price"
            selector: "span[data-testid='product_price']"
            type: "text"
          - name: "description"
            selector: "div[itemprop='description']"
            type: "text"
          - name: "image_url"
            selector: "img"
            type: "attribute"
            attribute: "src"

  soko_menu_destination_schema:
    type: "object"
    required: [ "category_name", "items" ]
    properties:
      category_name:
        type: "string"
      items:
        type: "array"
        items:
          type: "object"
          required: [ "title", "price" ]
          properties:
            title: { type: "string" }
            description: { type: "string" }
            price: { type: "string" }
            image_url: { type: "string" }