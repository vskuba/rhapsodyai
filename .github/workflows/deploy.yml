name: Deploy to Oracle Cloud

on:
  push:
    branches: [ master ] # или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем только бота, остальные образы возьмем готовые
      - name: Build and push Bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/telegram_soko/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vskuba/marina-ai:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Проверяем наличие git и папки, клонируем или обновляем
            if [ ! -d "~/marina_ai/.git" ]; then
              echo "Клонируем репозиторий..."
              git clone https://github.com ~/marina_ai
            fi
            
            cd ~/marina_ai
            echo "Обновляем код из репозитория..."
            git fetch origin master
            git reset --hard origin/master
            
            # 2. Создаем .env из секретов GitHub
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # 3. Авторизация в реестре GitHub (GHCR)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. Запуск контейнеров
            echo "Подтягиваем новые образы и перезапускаем..."
            docker compose pull
            docker compose up -d --remove-orphans
            
            # 5. Исправление прав (Sincedb)
            mkdir -p ./data/log/sincedb
            sudo chown -R 1000:1000 ./data/log/sincedb
            
            # Очистка старых образов
            docker image prune -f