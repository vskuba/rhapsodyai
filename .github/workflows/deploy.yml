name: Deploy to Oracle Cloud

on:
  push:
    branches: [ master ] # или master

# Only one deploy at a time — prevents .deploy_slot race conditions in Blue-Green
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # py_modules — git-сабмодуль: без него образ соберется без половины кода
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем только бота, остальные образы возьмем готовые
      #
      # Одна архитектура, а не две: образ забирает единственный сервис `telegram`
      # (docker-compose.yml), он помечен профилем `on_prod_only` и живёт только на
      # проде, а прод — Oracle A1, то есть aarch64. Вариант `linux/amd64` не забирал
      # никто: собирался, пушился в GHCR и лежал мёртвым грузом.
      #
      # QEMU выше по-прежнему нужен: раннер `ubuntu-latest` — amd64, и arm64-образ
      # на нём собирается эмуляцией.
      - name: Build and push Bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/telegram/dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/vskuba/marina-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Первая сборка uvicorn-образа на ARM (torch, модели) занимает далеко
          # больше дефолтных 10 минут
          command_timeout: 60m
          script: |
            set -e

            REPO_DIR="$HOME/rhapsodyai"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "Подготовка репозитория..."

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Клонируем репозиторий..."
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            git remote set-url origin "$REPO_URL"

            echo "Получаем последние изменения с GitHub..."
            # ⚠⚠ `--no-recurse-submodules` обязателен, и не ради скорости.
            #
            # По умолчанию git тянет подмодуль `on-demand`: увидев, что указатель
            # `py_modules` менялся, он пытается достать **каждый** указатель из всех
            # новых коммитов. А в истории есть два потерянных коммита слоя
            # (`0558e87`, `42632d5`) — их нет ни на origin, ни в одном клоне, — и
            # fetch падает `upload-pack: not our ref`, роняя всю выкладку.
            #
            # ⚠ Серверу нужен указатель **только текущего** master: ниже стоит
            # `reset --hard origin/master` и `submodule update`, который достаёт
            # ровно тот коммит слоя, что записан в HEAD. Историю подмодуля здесь не
            # читает никто, и тянуть её незачем.
            git fetch origin master --prune --no-recurse-submodules

            echo "Сбрасываем рабочую директорию на состояние master..."
            git reset --hard origin/master
            git clean -fd

            echo "Обновляем сабмодуль py_modules..."
            git submodule sync --recursive
            git submodule update --init --recursive --force

            echo "Создаём .env файл..."
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "Логинимся в GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # --- Обновляем сервисы без uvicorn (они не требуют zero-downtime) ---
            echo "Обновляем образы из GHCR..."
            docker compose --profile on_prod_only pull --ignore-buildable

            echo "Перезапускаем Telegram-бота (новый образ из GHCR)..."
            docker compose --profile on_prod_only up -d --force-recreate telegram

            echo "Обеспечиваем работу базовых сервисов (qdrant, redis, mysql, caddy)..."
            docker compose --profile on_prod_only up -d qdrant redis mysql caddy

            # --- Blue-Green деплой uvicorn (zero-downtime) ---
            echo "Запускаем Blue-Green деплой uvicorn..."
            chmod +x ./bluegreen.sh
            ./bluegreen.sh

            # --- Обновляем воркеры с новым образом (downtime допустим — очередь) ---
            # --no-deps: не запускать зависимости (uvicorn/qdrant), bluegreen.sh уже
            # управляет active slot; без флага compose поднял бы uvicorn, сломав Blue-Green
            echo "Перезапускаем worker и worker_planning с новым образом..."
            docker compose up -d --build --force-recreate --no-deps worker_task worker_planning

            # --- Контейнер-браузер ---
            # Отдельной строкой, а не зависимостью: он живёт неделями со своим пулом
            # вкладок, и перезапускать его на каждом деплое незачем — но образ должен
            # быть свежим, иначе правки сценариев доедут до кода и не доедут до браузера.
            # `--no-deps` по той же причине, что и у воркеров: не тянуть за собой uvicorn
            # и не ломать Blue-Green.
            echo "Обновляем контейнер-браузер..."
            docker compose up -d --build --force-recreate --no-deps browser

            # --- Очистка ---
            echo "Очистка..."
            mkdir -p ./data/log/sincedb
            sudo chown -R 1000:1000 ./data/log/sincedb
            docker image prune -f

            # Кэш сборки: `image prune` его не трогает, а на хосте собираются
            # воркеры и браузер (`up --build`), и слои копятся с каждым деплоем.
            # Живьём за два месяца он дорос до 85 ГБ при 45 ГБ свободного места —
            # больше, чем весили все образы вместе взятые.
            #
            # `until=168h` оставляет кэш последней недели: свежие слои переживают
            # соседние деплои, и сборка не идёт с нуля каждый раз. `-a` обязателен —
            # без него удаляются только «висячие» записи, а основной объём (те самые
            # 73 ГБ) не «висячий» и остался бы на месте.
            #
            # `|| true`: уборка не повод ронять уже состоявшийся деплой.
            echo "Чистим кэш сборки старше недели..."
            docker builder prune -af --filter until=168h || true
            docker system df

            echo "Деплой завершён успешно! Текущий коммит:"
            git log -1 --oneline