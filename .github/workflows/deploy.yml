name: Deploy to Oracle Cloud

on:
  push:
    branches: [ master ] # или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем только бота, остальные образы возьмем готовые
      - name: Build and push Bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/telegram/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vskuba/marina-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e  # Останавливаем скрипт при любой ошибке

            REPO_DIR="$HOME/marina_ai"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "🔄 Подготовка репозитория..."

            # Если папки нет или это не git-репозиторий — клонируем заново
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "📥 Клонируем репозиторий..."
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            # Обновляем URL remote (на случай смены токена)
            git remote set-url origin "$REPO_URL"

            echo "⬇️ Получаем последние изменения с GitHub..."
            git fetch origin master --prune

            echo "🔄 Жёстко сбрасываем рабочую директорию на состояние master..."
            git reset --hard origin/master

            # Дополнительно очищаем untracked файлы и папки (очень важно!)
            git clean -fd

            echo "📝 Создаём .env файл..."
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "🔑 Логинимся в GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🚀 Обновляем и перезапускаем контейнеры..."
            docker compose pull
            docker compose --profile on_prod_only up -d --remove-orphans --force-recreate

            echo "🧹 Очистка..."
            mkdir -p ./data/log/sincedb
            sudo chown -R 1000:1000 ./data/log/sincedb
            docker image prune -f

            echo "✅ Деплой завершён успешно! Текущий коммит:"
            git log -1 --oneline