name: Deploy to Oracle Cloud

on:
  push:
    branches: [ master ] # или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем только бота, остальные образы возьмем готовые
      - name: Build and push Bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/telegram_soko/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vskuba/marina-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git"
            
            # Проверяем наличие папки, если нет — клонируем с токеном
            if [ ! -d "$HOME/marina_ai/.git" ]; then
              echo "Клонируем приватный репозиторий..."
              git clone $REPO_URL $HOME/marina_ai
            fi
            
            cd $HOME/marina_ai
            
            # Обновляем URL (на случай если токен в этом запуске новый)
            git remote set-url origin $REPO_URL
            
            echo "Обновляем код..."
            git fetch origin master
            git reset --hard origin/master
            
            # 2. Создаем .env и дальше по списку...
            cat <<EOF > .env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # 3. Авторизация в GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. Перезапуск
            echo "Обновляем контейнеры..."
            docker compose pull
            docker compose up -d --remove-orphans
            
            # 5. Права и чистка
            mkdir -p ./data/log/sincedb
            sudo chown -R 1000:1000 ./data/log/sincedb
            docker image prune -f