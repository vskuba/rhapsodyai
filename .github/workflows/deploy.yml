name: Deploy to Oracle Cloud

on:
  push:
    branches: [ master ] # или master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # py_modules — git-сабмодуль: без него образ соберется без половины кода
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем только бота, остальные образы возьмем готовые
      - name: Build and push Bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/telegram/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vskuba/marina-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log deploy start
        run: |
          curl -s -o /dev/null -X POST "http://${{ secrets.HOST }}:8011/event-log" \
            -H "Content-Type: application/json" \
            -H "X-Claude-Secret: ${{ secrets.TELEGRAM_TOKEN_RHAPSODY }}" \
            -d '{
              "type": "github",
              "payload": {
                "event": "deploy.started",
                "branch": "${{ github.ref_name }}",
                "commit": "${{ github.sha }}",
                "actor": "${{ github.actor }}",
                "run_id": "${{ github.run_id }}",
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }' || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Первая сборка uvicorn-образа на ARM (torch, модели) занимает далеко
          # больше дефолтных 10 минут
          command_timeout: 60m
          script: |
            set -e  # Останавливаем скрипт при любой ошибке

            REPO_DIR="$HOME/rhapsodyai"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "🔄 Подготовка репозитория..."

            # Если папки нет или это не git-репозиторий — клонируем заново
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "📥 Клонируем репозиторий..."
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            # Обновляем URL remote (на случай смены токена)
            git remote set-url origin "$REPO_URL"

            echo "⬇️ Получаем последние изменения с GitHub..."
            git fetch origin master --prune

            echo "🔄 Жёстко сбрасываем рабочую директорию на состояние master..."
            git reset --hard origin/master

            # Дополнительно очищаем untracked файлы и папки (очень важно!)
            git clean -fd

            echo "📦 Обновляем сабмодуль py_modules до зафиксированного коммита..."
            git submodule sync --recursive
            git submodule update --init --recursive --force

            echo "📝 Создаём .env файл..."
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "🔑 Логинимся в GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🚀 Обновляем и перезапускаем контейнеры..."
            # --profile обязателен и для pull: без него образы профильных сервисов
            # (telegram из GHCR) не обновляются
            docker compose --profile on_prod_only pull --ignore-buildable
            # --build: пересборка локальных образов (uvicorn/worker) при изменении
            # requirements/dockerfile — иначе контейнеры пересоздаются из старого образа
            docker compose --profile on_prod_only up -d --build --remove-orphans --force-recreate

            echo "🧹 Очистка..."
            mkdir -p ./data/log/sincedb
            sudo chown -R 1000:1000 ./data/log/sincedb
            docker image prune -f

            echo "✅ Деплой завершён успешно! Текущий коммит:"
            git log -1 --oneline

      - name: Log deploy result
        if: always()
        run: |
          curl -s -o /dev/null -X POST "http://${{ secrets.HOST }}:8011/event-log" \
            -H "Content-Type: application/json" \
            -H "X-Claude-Secret: ${{ secrets.TELEGRAM_TOKEN_RHAPSODY }}" \
            -d "{
              \"type\": \"github\",
              \"payload\": {
                \"event\": \"deploy.finished\",
                \"status\": \"${{ job.status }}\",
                \"branch\": \"${{ github.ref_name }}\",
                \"commit\": \"${{ github.sha }}\",
                \"actor\": \"${{ github.actor }}\",
                \"run_id\": \"${{ github.run_id }}\",
                \"run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }
            }" || true