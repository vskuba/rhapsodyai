name: On Deploy Status

# Срабатывает когда workflow "Deploy to Oracle Cloud" завершается
# (успешно или с ошибкой). Отдельный файл — деплой не знает про логирование.
on:
  workflow_run:
    workflows: ["Deploy to Oracle Cloud"]
    types: [completed]

jobs:
  log_success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Log deploy.finished (success) via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            curl -s -o /dev/null -X POST http://localhost:8011/event-log \
              -H "Content-Type: application/json" \
              -H "X-Claude-Secret: ${{ secrets.TELEGRAM_TOKEN_RHAPSODY }}" \
              -d "{\"type\":\"github\",\"payload\":{\"event\":\"deploy.finished\",\"status\":\"success\",\"branch\":\"${{ github.event.workflow_run.head_branch }}\",\"commit\":\"${{ github.event.workflow_run.head_sha }}\",\"actor\":\"${{ github.event.workflow_run.triggering_actor.login }}\",\"run_url\":\"${{ github.event.workflow_run.html_url }}\"}}" || true

  log_failure:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out'
    steps:
      - name: Log deploy.finished (failure) via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            curl -s -o /dev/null -X POST http://localhost:8011/event-log \
              -H "Content-Type: application/json" \
              -H "X-Claude-Secret: ${{ secrets.TELEGRAM_TOKEN_RHAPSODY }}" \
              -d "{\"type\":\"github\",\"payload\":{\"event\":\"deploy.finished\",\"status\":\"${{ github.event.workflow_run.conclusion }}\",\"branch\":\"${{ github.event.workflow_run.head_branch }}\",\"commit\":\"${{ github.event.workflow_run.head_sha }}\",\"actor\":\"${{ github.event.workflow_run.triggering_actor.login }}\",\"run_url\":\"${{ github.event.workflow_run.html_url }}\"}}" || true
