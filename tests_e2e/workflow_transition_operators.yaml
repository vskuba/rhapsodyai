name: Переходы — список операторов и поле «Значение»
description: >-
  Строка перехода в редакторе workflow. Стережёт три числа: оператор
  not_empty есть в списке, список собран из общей константы (ни одного
  потерянного оператора), и поле «Значение» прячется ровно у тех трёх,
  которым оно не нужно.
# ⚠⚠ Workflow назван НОМЕРОМ, и это отступление от «без привязки» сделано по
# факту, а не из удобства. Страница показывает workflow ТЕКУЩЕЙ НОДЫ, и на
# проде в её списке шесть штук, у каждой ровно один завершающий шаг
# (`translator`, `telegram_chat`, `plan_editor`, `plan_creator` и соседи).
# Шага, у которого переходы бывают, там нет вовсе — перебор всей ноды это
# подтвердил: шесть проб, ни одной годной. «Какой откроется» и «у которого
# есть переходы» — разные вещи, и случай должен просить второе.
#
# 67 — `dating_mail_write`, 26 шагов, первый `llm_to_json`. Номера у установок
# совпадают (сверено по обеим базам), и этим же номером ходит соседний случай
# жребия — то есть `?workflow_id=` страница умеет давно.
page: /admin/workflow?workflow_id=67
widths: [1440]

steps:
  # ⚠⚠ Берём первый шаг, У КОТОРОГО ПЕРЕХОДЫ БЫВАЮТ, а не первый какой есть.
  # Прежде здесь стоял клик по первому шагу, и обещание «так строка перехода
  # появляется всегда» оказалось неверным: у шага типа `return_response_llm`
  # редактор переходов скрывается целиком (`workflow/steps.js`, ветка про
  # `.transitions-editor`) — у завершающего шага переходов нет. Строка при этом
  # создаётся и в DOM лежит, поэтому проверки содержимого сходились, а области
  # мерили 0×0 px: случай краснел на верной вёрстке.
  #
  # Перебор оставлен, хотя workflow теперь назван номером: тип первого шага —
  # не договор, его правят, и случай не должен ломаться от перестановки шагов.
  #
  # ⚠ Признак «редактор показан» — ВЫСОТА, а не `display`. Пока шаг не выбран,
  # его прячет предок (`#stepDetailsContent`), и `display` самого редактора при
  # этом честно отвечает «block»: проверка по стилю считала бы спрятанное
  # показанным.
  - wait_for: 'return document.querySelectorAll("#workflowStepsSortable [data-id]").length > 0'
    timeout: 20000
  - wait_for: |
      const nap = ms => new Promise(r => setTimeout(r, ms));
      for (const step of document.querySelectorAll('#workflowStepsSortable [data-id]')) {
        step.click();
        await nap(400);
        const open = [...document.querySelectorAll('.transitions-editor')]
            .some(el => el.getBoundingClientRect().height > 0);
        if (open) return true;
      }
      return false;
    timeout: 30000
  - click: '#addConditionBtnAfter'
  - wait_for: 'return !!document.querySelector(".tr-operator")'
  # ⚠ Строка перехода лежит ниже сгиба: без прокрутки её меряют числами, но на
  # кадре её нет — а кадр и есть то, на что смотрит человек.
  - wait_for: |
      document.querySelector('.transition-row')
          .scrollIntoView({block: 'center'});
      return true;
  - wait: 400

areas:
  - name: Строка перехода
    selector: '.transition-row'
    rules: [visible, inside]
  - name: Список операторов
    selector: '.tr-operator'
    rules: [visible, inside]

checks:
  # ⚠⚠ Главный сторож правки. Оператор добавляли ради отсутствующей
  # переменной: `!= ''` на ней отвечает «не знаю» и переход молча
  # пропускается, а not_empty отвечает «нет» честно.
  - name: нет оператора not_empty в списке
    expect: 0
    js: |
      const sel = document.querySelector('.tr-operator');
      return [...sel.options].some(o => o.value === 'not_empty') ? 0 : 1;

  # Список собирается из одной константы (`state.js`) в трёх местах редактора.
  # Разойдись копии — оператор появился бы в одном месте и пропал в другом, а
  # заметно это стало бы уже здесь. Число — на сколько разошлись.
  - name: расхождение списка с ожидаемым набором операторов
    expect: 0
    js: |
      const owed = ['==', '!=', '>', '<', '>=', '<=', 'contains',
                    'not_contains', 'regex', 'exists', 'empty', 'not_empty'];
      const got = [...document.querySelector('.tr-operator').options]
          .map(o => o.value);
      const missing = owed.filter(one => !got.includes(one)).length;
      const extra = got.filter(one => !owed.includes(one)).length;
      return missing + extra;

  # ⚠ Поле «Значение» этим трём не нужно: они спрашивают про саму переменную.
  # Прежде признак был записан двумя сравнениями подряд, и третий оператор в
  # него не попал бы вовсе — поле осталось бы висеть пустым.
  - name: операторов без значения, у которых поле не спряталось
    expect: 0
    js: |
      const sel = document.querySelector('.tr-operator');
      const value = sel.closest('.transition-row').querySelector('.tr-value');
      let bad = 0;

      for (const op of ['exists', 'empty', 'not_empty']) {
        sel.value = op;
        sel.dispatchEvent(new Event('change', {bubbles: true}));
        await new Promise(r => setTimeout(r, 200));
        if (getComputedStyle(value).visibility !== 'hidden') bad += 1;
      }

      // И обратно: обычному сравнению поле обязано вернуться.
      sel.value = '==';
      sel.dispatchEvent(new Event('change', {bubbles: true}));
      await new Promise(r => setTimeout(r, 200));
      if (getComputedStyle(value).visibility !== 'visible') bad += 1;

      // Оставляем not_empty выбранным — чтобы он попал в кадр.
      sel.value = 'not_empty';
      sel.dispatchEvent(new Event('change', {bubbles: true}));
      await new Promise(r => setTimeout(r, 200));

      return bad;
