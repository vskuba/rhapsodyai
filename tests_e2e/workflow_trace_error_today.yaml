name: Трассы — нет ошибок за сегодня
description: >
  Вкладка «Error» страницы трасс (/admin/workflow_trace). Стережёт главное:
  за текущую дату не записано ни одной ошибки workflow. Хотя бы одна запись
  сегодняшним числом — тест не пройден, и смотреть надо сразу в неё.
  ⚠ Число в вердикте упирается в 30 — столько карточек на странице; «30»
  означает «тридцать и, возможно, больше».

page: /admin/workflow_trace
widths: [1440]

# Страница открывается на запомненной вкладке (обычно «Running»); без нажатия
# мерили бы не ту ленту.
steps:
  # ⚠ Сперва дожидаемся самой вкладки: она часть разметки, но клик по ещё не
  # отрисованному узлу зонд отметит промахом, а мерить продолжит — по той
  # ленте, которая была.
  - wait_for: |
      return !!document.querySelector('.status-tab[data-status="error"]');
    timeout: 15000

  - click: '.status-tab[data-status="error"]'

  # ⚠⚠ Ждём, что отбор РЕАЛЬНО ПРИМЕНИЛСЯ, а не что исчезло слово «Загрузка».
  #
  # Прежний признак отпускал мгновенно: после клика лента ещё несколько секунд
  # показывает ПРЕЖНЕЕ содержимое — карточки другого отбора, — и слова
  # «Загрузка» в ней нет. Замер попадал в эту щель и считал чужие карточки
  # своими. На проде это дало «ошибок за сегодня: 30» при ленте, где все
  # записи были вчерашние: тест кричал о беде, которой нет.
  #
  # Честный признак — в ленте не осталось карточек с ЧУЖИМ статусом: вкладка
  # активна, и всё показанное помечено `status-error`.
  #
  # ⚠ Пустая лента этому условию удовлетворяет тоже, и это правильно: «ошибок
  # нет» — законный ответ. От «ещё не пришло» её отличает шаг `wait` ниже: он
  # даёт запросу время долететь, и только после него мы верим пустоте.
  - wait_for: |
      const list = document.querySelector('#runsList');
      if (!list || list.textContent.includes('Загрузка')) return false;
      const cards = [...list.querySelectorAll('.run-card')];
      return cards.every(card => card.querySelector('.status-badge.status-error'));
    timeout: 20000

  # ⚠⚠ Единственное место, где `wait` оправдан: у «лента пуста, потому что
  # ошибок нет» и «лента пуста, потому что ответ не долетел» наблюдаемый
  # признак ОДИН и тот же. Отличить их нечем — остаётся дать времени.
  # Три секунды: живьём отбор применяется за 1–4 с.
  - wait: 3000

  # После паузы проверяем условие ещё раз — на случай, если данные пришли
  # во время неё и принесли карточки чужого отбора.
  - wait_for: |
      const list = document.querySelector('#runsList');
      if (!list || list.textContent.includes('Загрузка')) return false;
      const cards = [...list.querySelectorAll('.run-card')];
      return cards.every(card => card.querySelector('.status-badge.status-error'));
    timeout: 15000

areas:
  - name: Вкладка Error
    selector: '.status-tab[data-status="error"]'
    rules: [visible, inside]
  - name: Лента запусков
    selector: '#runsList'
    rules: [visible, inside]

checks:
  # ⚠⚠ Имя говорит «на первой странице», и это не оговорка, а честность числа.
  # Лента отдаёт по 30 карточек на страницу, и счёт упирается в этот потолок:
  # живьём на проде проверка показала «30», когда ошибок за сутки было 352.
  # Вердикт при этом верен — ноль это или не ноль, — но число обязано читаться
  # как то, что оно есть, иначе в три часа ночи по нему сделают неверный вывод.
  - name: ошибок за сегодня на первой странице
    expect: 0
    # ⚠ `loadTz()` зовётся здесь намеренно. Дата в карточке считается поясом из
    # настройки `timezone`, а `fmtTz` берёт его из `window.APP_TZ_OFFSET` —
    # страница трасс держит своё собственное смещение и эту глобаль не трогает.
    # Без вызова «сегодня» считалось бы по UTC, и около полуночи вердикт
    # расходился бы с тем, что человек видит на экране.
    js: |
      await window.loadTz();
      const today = window.fmtTz(new Date().toISOString()).slice(0, 10);
      return [...document.querySelectorAll('.run-card .run-meta')]
        .filter(meta => (meta.textContent || '').trim().startsWith(today)).length;

  # ⚠⚠ Сторож самого замера: мерили ли мы ТУ ленту. Проверка выше считает
  # карточки, не спрашивая, чьи они, — и однажды посчитала чужие, потому что
  # отбор ещё не применился. Здесь это названо числом: карточка без метки
  # `status-error` в ленте означает, что вердикт выше про другую вкладку.
  - name: карточек чужого отбора в ленте
    expect: 0
    js: |
      const cards = [...document.querySelectorAll('#runsList .run-card')];
      return cards.filter(c => !c.querySelector('.status-badge.status-error')).length;

  # ⚠ И вкладка: отбор мог не примениться вовсе — тогда лента чужая целиком,
  # а предыдущая проверка этого не увидит, если у всех карточек статус совпал
  # случайно. 1 — вкладка «Error» не активна.
  - name: вкладка «Error» не выбрана (1 — не выбрана)
    expect: 0
    js: |
      const tab = document.querySelector('.status-tab[data-status="error"]');
      return tab && tab.classList.contains('active') ? 0 : 1;
