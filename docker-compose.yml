#version: '3.8'   # ← remove or comment if using modern Compose v2

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch
    environment:
      - cluster.name=dev-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      # ⚠ Куча урезана вдвое, и потолок контейнера задан явно. Прежде было
      # `-Xmx512m` и никакого `mem_limit`: JVM брала 512 МБ кучи плюс своё сверху и
      # занимала 713 МБ — при двух гигабайтах общей нехватки, из-за которой машина
      # держала 2.4 ГБ в свопе. Индекс здесь один и маленький (журналы приложений),
      # на 256 МБ кучи он живёт.
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    # ⚠ Потолок **втрое от кучи**, и это измерено, а не выведено. Сперва стояло
    # 512 МБ — вдвое, — и контейнер сел на 96% сразу после старта: у OpenSearch
    # вне кучи живёт немало (метаданные 70 индексов, буферы, стеки), и при 256 МБ
    # кучи процесс занимает около 500 МБ. Потолок здесь страховка от разрастания,
    # а не рабочий размер: прежде его не было вовсе, и JVM брала 713 МБ.
    mem_limit: 768m
    ulimits:
      memlock: -1
      nofile: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - os-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      OPENSEARCH_SECURITY_MULTITENANCY_ENABLED: "false"
      uiSettings.overrides.defaultRoute: "/app/discover"
      uiSettings.overrides.dateFormat:tz: "UTC"
    depends_on:
      - opensearch
    networks:
      - os-net

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: logstash
    volumes:
      - ./docker/logstash/read-app-logs${APP_ENV}.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./data/log:/logs:ro
      - ./data/log/sincedb:/var/lib/logstash/sincedb:rw
    environment:
      # ⚠ Куча урезана вдвое: конвейер здесь один и читает файлы журналов, а не
      # держит очередь. Было `-Xmx1g` при занятых 614 МБ.
      - LS_JAVA_OPTS=-Xms256m -Xmx512m
      - pipeline.ecs_compatibility=disabled
      # ⚠ Один рабочий вместо числа ядер (их два): каждый держит свой буфер
      # событий, а поток журналов здесь такой, что и одного много.
      - pipeline.workers=1
    mem_limit: 768m
    depends_on:
      - opensearch
    networks:
      - os-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # API и Web UI (Dashboard) :6333/dashboard
      - "6334:6334" # gRPC (для высокоскоростной передачи)
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:rw
    networks:
      - os-net
    restart: always

  uvicorn:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: uvicorn
    ports:
      - "8011:8000"
    volumes:
      - ./:/app
      # Тот же репозиторий вторым монтированием — по хостовому пути. Нужно для
      # рабочих каталогов задач (`task_worktree`): git пишет в служебные файлы
      # worktree абсолютные пути, и созданный из контейнера каталог с путями
      # `/app/...` на хосте не открывается — а живёт в нём Claude Code хоста.
      # Совпадение путей внутри и снаружи снимает вопрос целиком.
      #
      # Значение по умолчанию — не удобство: без переменной строка сворачивается
      # в `:` , и compose перестаёт разбирать файл целиком. Тогда на установке,
      # которая про конвейер задач ничего не знает (прод), падает не один сервис,
      # а любая команда compose — включая Blue-Green деплой. `$PWD` — каталог,
      # из которого compose запущен, то есть сам репозиторий: ровно то, чем
      # `PROJECT_HOST_DIR` и является для установки с одним проектом.
      - ${PROJECT_HOST_DIR:-$PWD}:${PROJECT_HOST_DIR:-$PWD}
      # Репозиторий оболочки, только на чтение: оттуда страница команды берёт список
      # моделей (`src/litellm/llm_models.yaml`) — тот же каталог, по которому оболочка
      # умеет поднять прокси. Второго списка нет намеренно: справочник `llm` шире, и
      # селект обещал бы модели, которых оболочка не знает.
      #
      # Умолчание — сам репозиторий, как и у монтирования выше, и по той же причине:
      # без переменной строка свернулась бы в `:` и сломала разбор файла целиком. На
      # установке без оболочки (прод) каталог просто не найдётся, и селект останется
      # с одной моделью — страница от этого не падает.
      - ${CLAUDE_SHELL_HOST_DIR:-$PWD}:/opt/claude-shell:ro
    env_file:
      - .env
    environment:
      # Модели предзагружены в образ (dockerfile) — в рантайме HF не нужен,
      # иначе каждый старт блокируется HEAD-проверками свежести на huggingface.co
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HOME=/root/.cache/huggingface
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
    depends_on:
      - qdrant
    networks:
      - os-net
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Green slot for Blue-Green deployment — managed by bluegreen.sh, not started by default.
  # Profile 'green' prevents it from starting on regular `docker compose up`.
  uvicorn_green:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: uvicorn_green
    profiles: ["green"]
    ports:
      - "8012:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HOME=/root/.cache/huggingface
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
    depends_on:
      - qdrant
    networks:
      - os-net
    # unless-stopped: restarts on crash (when active), but NOT after explicit
    # `docker stop` (when inactive slot is being stopped by bluegreen.sh)
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Сервер задачи: тот же образ, но кодом служит рабочий каталог подзадачи, а не
  # общий чекаут. Нужен QA — проверять ветку на живом сервере, не трогая :8011,
  # на котором в это время работает человек и соседние задачи.
  #
  # База, redis и qdrant общие с основным сервером: разводить ещё и данные значит
  # проверять задачу на пустой базе, где нет ни проектов, ни настроек. Цена — QA
  # пишет в ту же БД, что и все; для задач конвейера это принято сознательно.
  #
  # Профиль `task` держит сервис выключенным при обычном `docker compose up`.
  # Поднимают его на время проверки: `./task_server.sh up <id>` (см. скрипт).
  uvicorn_task:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    # Тот же образ, что у основного сервера: сборка одна и та же, а без общего
    # имени compose собирал бы её второй раз — это минуты ожидания на каждой
    # первой проверке и лишний образ в гигабайт.
    image: rhapsodyai-uvicorn:latest
    container_name: uvicorn_task
    profiles: ["task"]
    # Проверка каталога перед стартом. Каталог подзадачи временный: его снимает
    # `./task_server.sh clean` или кнопка `rm_worktree`, и сервер может пережить
    # свой каталог. Docker при следующем старте заводит точку монтирования заново
    # — пустым root-овым каталогом, — и uvicorn падает на `Could not import module
    # "main_uvicorn"`, что про исчезнувший worktree не говорит ничего.
    command: >
      sh -c 'test -f /app/main_uvicorn.py || {
               echo "[uvicorn_task] каталога подзадачи нет: смонтирован пустой /app." >&2;
               echo "[uvicorn_task] поднимать так: ./task_server.sh up <id>" >&2;
               exit 1;
             };
             exec uvicorn main_uvicorn:app --host 0.0.0.0 --port 8000'
    ports:
      - "8013:8000"
    volumes:
      # Каталог подзадачи вместо репозитория. Без переменной поднимется обычный
      # чекаут — то же, что :8011, и это заметно сразу.
      - ${PROJECT_TASK_WORKTREE_DIR:-./}:/app
      # Ссылки внутри каталога подзадачи (`.env`, `.venv`, рабочие папки `data`)
      # указывают на хостовые пути — без этого монтирования они оборваны.
      # Значение по умолчанию — см. пояснение у `uvicorn`: без переменной compose
      # не разбирает файл целиком.
      - ${PROJECT_HOST_DIR:-$PWD}:${PROJECT_HOST_DIR:-$PWD}
    env_file:
      - .env
    environment:
      # Каталог задачи временный, и снимать его будет человек с хоста. Контейнер
      # работает root-ом: оставленные им `__pycache__` root-овые, и `git worktree
      # remove` спотыкается о них с «Permission denied». Байткод здесь не нужен.
      - PYTHONDONTWRITEBYTECODE=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HOME=/root/.cache/huggingface
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
    depends_on:
      - qdrant
    networks:
      - os-net
    # on-failure с лимитом, а не unless-stopped: остановленный после проверки сервер
    # не должен подниматься сам при перезапуске docker, а сервер над исчезнувшим
    # каталогом не должен крутиться вечно. Три попытки покрывают разовый сбой на
    # старте; каталога нет — контейнер встаёт и ждёт человека, а не шумит в логах
    # сутками (так и вышло с #588).
    restart: on-failure:3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cronicle:
    image: soulteary/cronicle:latest
    container_name: cronicle
    restart: always
    ports:
      - "3012:3012"
    env_file:
      - .env
    environment:
      - CRONICLE_foreground=1
      - CRONICLE_echo=1
      # История прогонов в data/jobs: держим трое суток вместо стандартных 180.
      # Чистит её сам Cronicle в ночное обслуживание (`maintenance: "04:00"`).
      # На проде при умолчании накопился гигабайт. Архивы суточной ротации
      # логов (logs/archives) этой настройке не подчиняются — их сносит
      # `src/cronjob/cronicle_log_cleanup.py`.
      - CRONICLE_job_data_expire_days=3
    volumes:
      - ./:/app
      - ./data/cronicle/data:/opt/cronicle/data
      - ./data/cronicle/logs:/opt/cronicle/logs
    networks:
      - os-net
    depends_on:
      - uvicorn

  # Подменная LLM: отвечает то, что задал тест. Держится поднятой постоянно.
  #
  # ⚠⚠ **Профиль, и это не осторожность.** Без него бесплатная модель, отвечающая
  # заготовками, появилась бы в сети прода. Выкладка поднимает сервисы **по
  # именам** (`deploy.yml`), так что сама она его не тронет, — но профиль говорит
  # о намерении вслух, а не полагается на то, что список сервисов не расширят.
  #
  # Поднять один раз, дальше `restart: always` вернёт её и после перезагрузки:
  #
  #     docker compose --profile fake up -d llm_fake
  #
  # ⚠ Образ **лёгкий**, а не общий с приложением (15.4 ГБ): сервис написан на
  # стандартной библиотеке — `http.server`, ни одной зависимости. Тот же довод,
  # что у `rq-dashboard` ниже.
  #
  # ⚠ Порт наружу нужен **обеим сторонам**: `pytest` идёт с хоста на
  # `localhost:8099`, а движок из контейнера `uvicorn` — на
  # `host.docker.internal:8099` (`LLM_FAKE_API_URL` в `.env.local`). Один
  # опубликованный порт закрывает оба пути, и внутреннего адреса заводить не надо.
  llm_fake:
    image: python:3.12-slim
    container_name: llm_fake
    profiles: ["fake"]
    # ⚠ Только `py_modules`, и только на чтение: сервису нужен один файл, а к
    # базе и секретам проекта он отношения не имеет.
    volumes:
      - ./py_modules:/app/py_modules:ro
    environment:
      - PYTHONPATH=/app/py_modules
      # ⚠ Без буферизации: иначе «слушает 0.0.0.0:8099» и записи о вызовах
      # оседают в буфере, и `docker logs` молчит, пока сервис жив.
      - PYTHONUNBUFFERED=1
    command: python -m ai.ai_llm_fake --port 8099
    ports:
      - "8099:8099"
    networks:
      - os-net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - os-net
    restart: always

  rq-dashboard:
    # Свой лёгкий образ (151 МБ), а не общий с приложением (15.4 ГБ): дашборд читает
    # ключи очередей из Redis и рисует их страницей — ни кода проекта, ни Playwright,
    # ни моделей ему не нужно. Контекст сборки — только его каталог, поэтому пересборка
    # не зависит от изменений в репозитории.
    build:
      context: docker/rq_dashboard
      dockerfile: dockerfile
    container_name: rq_dashboard
    # Команды здесь больше нет: пакет стоит в образе, адрес Redis — в CMD Dockerfile.
    # Раньше строка вида `pip install rq-dashboard && rq-dashboard ...` ходила в сеть
    # на каждом перезапуске контейнера.
    ports:
      - "9181:9181"
    depends_on:
      - redis
    networks:
      - os-net
    restart: always

  worker_task:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: worker_task
    # Пул, а не одиночный `rq worker`: шаг конвейера ждёт живой Claude Code до часа,
    # и на одном процессе очередь стоит всё это время — Manager одной задачи держит
    # Developer'а другой. Три процесса = три роли конвейера одновременно.
    command: rq worker-pool --url redis://redis:6379 -n 3 default
    volumes:
      - ./:/app
      # Хостовой путь репозитория — см. пояснение у `uvicorn`. Рабочие каталоги
      # задач заводит именно этот контейнер: `task_worktree_ensure` зовётся из
      # шага конвейера.
      #
      # Здесь смонтирован только проект самой установки. Карточки заводят и на
      # другие проекты машины — у каждого свой репозиторий по своему пути
      # (`project.work_dir`), и каталог задачи конвейер режет в нём же. Чтобы
      # такой проект был виден, добавьте его в `docker-compose.override.yml` тем
      # же правилом «путь внутри = путь снаружи»:
      #
      #   services:
      #     worker_task:
      #       volumes:
      #         - /home/user/projects/shop:/home/user/projects/shop
      #
      # Невидимый каталог конвейер не молчит: `_subtask_dir` пишет в лог, что
      # проверить, и работает без изоляции, в общем каталоге проекта.
      # Значение по умолчанию — см. пояснение у `uvicorn`: без переменной compose
      # не разбирает файл целиком.
      - ${PROJECT_HOST_DIR:-$PWD}:${PROJECT_HOST_DIR:-$PWD}
      # Каталог моделей оболочки — тот же, что у `uvicorn`, и по той же причине, но
      # для другого чтения: пинг моделей пула (`_run_llm_ping`) идёт здесь и берёт из
      # каталога адрес провайдера с именем ключа. Без монтирования пинг объявляет
      # мёртвыми все модели разом — «модели нет в каталоге оболочки», — и по этим
      # данным конвейер перестал бы выдавать роли хоть что-нибудь.
      - ${CLAUDE_SHELL_HOST_DIR:-$PWD}:/opt/claude-shell:ro
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HOME=/root/.cache/huggingface
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
    depends_on:
      - redis
      - uvicorn
    networks:
      - os-net
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Отдельный контейнер, а не ещё пара процессов в `worker_task`: у планирования другой
  # профиль нагрузки — цепочка фаз идёт до 13 часов против часа у шага конвейера.
  # В общей очереди один запланированный проект занял бы исполнителя на весь день,
  # и конвейер задач встал бы вместе с ним.
  worker_planning:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: worker_planning
    command: rq worker-pool --url redis://redis:6379 -n 2 planning
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HOME=/root/.cache/huggingface
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
    depends_on:
      - redis
      - uvicorn
    networks:
      - os-net
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Держатель чата знакомств. Один процесс, а не пул: смена держит сокеты всех
  # учёток сразу, и второй исполнитель означал бы второе соединение на ту же
  # анкету — сайт вышибает оба. От дублей защищает и single-flight, но лишний
  # процесс тут просто нечем занять.

  # Контейнер-браузер: один Chromium, много изолированных сессий, каждая — своя
  # страница. Отдельный сервис, потому что ритмы жизни несовместимы: :8011 рестартует
  # на каждой правке `.py`, а здесь страницы должны висеть неделями (открытый чат,
  # ждущий сообщения, чужой рестарт не переживёт).
  browser:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    # Тот же образ, что у основного сервера: Chromium в нём уже стоит (см. dockerfile,
    # `playwright install chromium-headless-shell`). Общее имя избавляет от второй
    # сборки того же самого — это минуты ожидания и лишний гигабайт.
    image: rhapsodyai-uvicorn:latest
    container_name: browser
    command: uvicorn main_browser:app --host 0.0.0.0 --port 8000
    ports:
      # Только на петлю: сервис для внутренней сети, наружу его публиковать нечего.
      # Порт открыт, чтобы можно было руками посмотреть список сессий и память.
      - "127.0.0.1:8014:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    # 64 МБ /dev/shm по умолчанию Chromium не хватает — тяжёлая страница роняет
    # вкладку с «Target crashed». Лечится размером shm, а не флагом
    # `--disable-dev-shm-usage`: тот уводит браузер на диск и замедляет отрисовку.
    shm_size: 1gb
    # Chromium плодит процессы на каждую вкладку. Без reaper-а PID 1 зомби копятся
    # неделями — а контейнер тут именно неделями и живёт.
    init: true
    # Предел не для экономии, а чтобы утечка страниц убивала один контейнер, а не
    # машину вместе с базой. Реальную цену страницы показывает `GET /browser/session`.
    mem_limit: 4g
    networks:
      - os-net
    restart: always
    healthcheck:
      # Питоном, а не curl-ом: наличие curl в образе никто не обещал.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/browser/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    platform: linux/x86_64
    image: mysql:8.0
    command: mysqld --sql-mode="NO_ENGINE_SUBSTITUTION"
    ports:
      - "3302:3306"
    networks:
      - os-net
    volumes:
      # Данные — в именованном томе. Образ mysql объявляет `VOLUME /var/lib/mysql`,
      # и без этой строки Docker заводит анонимный том со случайным именем: он
      # переживает `restart`, но теряется из виду при пересоздании сервиса и
      # удаляется вместе с `down -v`. Именованный том виден в `docker volume ls`,
      # переживает пересоздание и удаляется только по явной команде.
      - mysql-data:/var/lib/mysql
      - ./backups/:/backups/
      - ./docker/mysql/:/docker-entrypoint-initdb.d/
    environment:
      - MYSQL_DATABASE=project
      - MYSQL_USER=developer
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_PASSWORD=password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-p$$MYSQL_ROOT_PASSWORD","--protocol","tcp" ]

  telegram:
    image: ghcr.io/vskuba/marina-ai:latest
    container_name: telegram
    profiles: ["on_prod_only"]
    restart: always
    env_file:
      - .env
    volumes:
      - ./:/app
    networks:
      - os-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - qdrant
      - opensearch-dashboards
      - mysql

  # Отключён: сервис описан и собирается, но сам не поднимается. Профиль
  # `disabled` не входит ни в один вызов compose (ни в деплое, ни в bluegreen.sh),
  # поэтому `docker compose up -d` его пропускает. Запуск вручную:
  # `docker compose --profile disabled up -d gatus`.
  # Уведомления в Telegram выключены отдельно — в docker/gatus/config.yaml.
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    profiles: ["disabled"]
    restart: "no"
    ports:
      - "8090:8080"
    env_file:
      - .env
    volumes:
      - ./docker/gatus/config.yaml:/config/config.yaml:ro
      - gatus-data:/data
    networks:
      - os-net

  phpmyadmin:
    # официальный образ (library/phpmyadmin): в отличие от phpmyadmin/phpmyadmin
    # имеет arm64-вариант для Oracle A1; платформу не фиксируем
    image: phpmyadmin:latest
    networks:
      - os-net
    links:
      - mysql:mysql
    ports:
      - 9634:80
    depends_on:
      - mysql
    environment:
      MYSQL_USERNAME: developer
      MYSQL_ROOT_PASSWORD: password
      PMA_HOST: mysql

  caddy:
    image: caddy:2
    container_name: caddy
    profiles: ["on_prod_only"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps:/srv/apps:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - os-net
    # No depends_on uvicorn: Blue-Green manages which uvicorn slot is active.
    # Caddy handles upstream unavailability gracefully via lb_try_duration.

  # HTTPS на машине разработчика: Telegram принимает Web App URL только по HTTPS.
  # Отдельный сервис, а не профиль у caddy — Caddyfile и порты разные,
  # а на проде этот контейнер занял бы 80-й порт у боевого caddy.
  caddy_local:
    image: caddy:2
    container_name: caddy_local
    profiles: ["on_local_only"]
    restart: always
    ports:
      # 80 нужен только для ACME-челленджа (внешний 443 не проброшен).
      # Наружу Mini App отдается на 44152, но локальный 44152 занят системным
      # Apache, поэтому на хосте берем 44153: роутер пробрасывает
      # внешний 44152 -> 44153, внутри контейнера Caddy слушает 44152,
      # чтобы адрес сайта совпадал с портом в URL.
      - "80:80"
      - "44153:44152"
    volumes:
      - ./docker/caddy/Caddyfile_local:/etc/caddy/Caddyfile:ro
      - ./apps:/srv/apps:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - os-net

volumes:
  mysql-data:
  opensearch-data:
  cronicle-data:
  cronicle-logs:
  caddy-data:
  caddy-config:
  gatus-data:

networks:
  os-net:
    driver: bridge